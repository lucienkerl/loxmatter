# Testumgebung fuer Phase 1 - NICHT der Produktions-Stack aus Spec 4.1.
#
# Laeuft auf einem Raspberry Pi (siehe README.md fuer den Umzug von der Test-VM,
# die kein Bluetooth-Adapter hatte, und alle Abweichungen vom urspruenglichen
# Entwurf):
#   - openthread/otbr:latest       -> Digest sha256:ebebd9f6..., Entrypoint
#     /app/etc/docker/test/docker_entrypoint.sh (die "test"-Variante des
#     Images, nicht die neuere s6-overlay/"border-router"-Variante). Diese
#     Variante liest RADIO_URL als Umgebungsvariable und akzeptiert
#     --backbone-interface als Kommandozeilenargument, genau wie unten
#     konfiguriert.
#   - ghcr.io/home-assistant-libs/python-matter-server:stable -> mit
#     --bluetooth-adapter ${BLUETOOTH_ADAPTER} fuer BLE-Commissioning ueber hci0
#     (siehe README).
#   - loxmatter (Phase 4, Review-Fix I5, 2026-09-02) -> aus diesem Repository
#     selbst gebaut (siehe ../../Dockerfile, dort auch der Hinweis, dass das
#     Image noch ungeprueft ist - kein Docker/Netz in der Umgebung, die
#     diesen Dienst hinzugefuegt hat). Braucht MINISERVER_IP in .env.
services:
  otbr:
    image: openthread/otbr:latest
    container_name: otbr
    network_mode: host
    privileged: true
    restart: unless-stopped
    devices:
      - ${RADIO_DEVICE}:${RADIO_DEVICE}
    environment:
      RADIO_URL: spinel+hdlc+uart://${RADIO_DEVICE}?uart-baudrate=${RADIO_BAUDRATE}
      # Weder auf der urspruenglichen Test-VM noch auf diesem Pi sind die legacy
      # iptables-Tabellen (mangle/nat/filter) geladen, und das Image hat kein
      # modprobe, um sie nachzuladen - NAT64/NAT44 und die legacy-Firewall-Regeln
      # (fuer beide ist iptables noetig) wuerden deshalb fehlschlagen und den
      # Container abstuerzen lassen (siehe README, Abweichung 2 in der VM-Historie).
      # Fuer die Testumgebung unkritisch (siehe README): kein globales IPv6,
      # kein Bedarf, aus dem Thread-Netz heraus IPv4-Hosts zu erreichen.
      NAT64: "0"
      FIREWALL: "0"
    command: --backbone-interface ${BACKBONE_IF}
    volumes:
      # Der Thread-Zustand ueberlebt sonst KEINEN Neubau des Containers
      # (2026-09-03). Das Image sieht dafuer kein Volume vor, und OTBR legt
      # seine Netzdaten - Netzwerkschluessel, PAN-ID, Kanal - unter
      # /var/lib/thread in der Schreibschicht ab. Ein `docker compose down`,
      # ein Image-Update oder ein Umzug des Projektverzeichnisses bildet
      # damit ein NEUES Thread-Netz, und jedes bereits eingelernte Geraet
      # muesste zurueckgesetzt und neu gepaart werden - bei einem
      # Sensor hinter einer Schranktuer keine Kleinigkeit.
      #
      # Wer einen laufenden Stack ohne dieses Volume nachruestet, muss den
      # Zustand zuerst herausholen und in das leere Volume legen, sonst
      # startet OTBR mit leerem Zustand und das Netz ist trotzdem weg:
      #
      #   docker cp otbr:/var/lib/thread /tmp/thread-state
      #   docker volume create <projekt>_otbr-state
      #   docker run --rm -v <projekt>_otbr-state:/d -v /tmp/thread-state:/s:ro \
      #       alpine sh -c 'cp -a /s/. /d/'
      #
      # Rueckfallweg, falls doch etwas schiefgeht: der aktive Datensatz als
      # Hex (`docker exec otbr ot-ctl dataset active -x`) laesst sich mit
      # `ot-ctl dataset set active <hex>` in einen frischen Container
      # zuruecksetzen. Diese Zeichenkette ist ein Credential und gehoert
      # weder ins Repository noch in ein Log.
      - otbr-state:/var/lib/thread

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./data:/data
      - /run/dbus:/run/dbus:ro
    # command ueberschreibt das Image-Default-CMD vollstaendig - die ersten
    # vier Argumente sind aus dem Default uebernommen (storage-path,
    # paa-root-cert-dir), --bluetooth-adapter ist neu und aktiviert
    # BLE-Commissioning ueber den in BLUETOOTH_ADAPTER benannten Adapter
    # (siehe README, "BLE aktivieren").
    command:
      - --storage-path
      - /data
      - --paa-root-cert-dir
      - /data/credentials
      - --bluetooth-adapter
      - "${BLUETOOTH_ADAPTER:-0}"
    depends_on:
      - otbr

  loxmatter:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: loxmatter
    restart: unless-stopped
    # Wie otbr/matter-server: network_mode host statt einer expliziten
    # `ports:`-Liste, aus zwei Gruenden, nicht nur Konsistenz. Erstens
    # erreicht `--url` (Default ws://localhost:5580/ws) matter-server nur
    # ueber 127.0.0.1 - matter-server laeuft selbst mit network_mode: host
    # und ist deshalb im Compose-eigenen Bridge-Netz kein aufloesbarer
    # Servicename. Zweitens macht das den HTTP-Port fuer die Loxone-
    # Ausgangsbefehle (--listen, Default 8080) ohne weitere Portfreigabe vom
    # Miniserver aus erreichbar - das ist der hier geforderte
    # "veroeffentlichte" HTTP-Port.
    #
    # Seit Phase 5 traegt genau dieser Port zusaetzlich die Bedienoberflaeche
    # (`/api/*`, `/`) - derselbe FastAPI-Dienst, dasselbe `--listen`. Wer
    # `http://<Host>:8080/` im Browser oeffnet, sieht beim allerersten Mal
    # eine Ersteinrichtung (Passwort vergeben) und danach eine Anmeldung -
    # seit dem WebUI-Login (Task 9/10, Phase 6) ist `/api/*` durch diese
    # Anmeldung geschuetzt, nicht mehr durch `LOXMATTER_API_TOKEN` unten.
    # Das Token bleibt als zusaetzlicher Weg fuer Skripte und `curl`
    # bestehen (siehe dort). `/cmd` und `/resync` fuer den Miniserver
    # bleiben bewusst offen (siehe dort).
    network_mode: host
    volumes:
      - loxmatter-store:/data
      # Aktiv seit Task 8 (Phase 5): der Read-only-Einblick in matter-
      # server's eigenes Datenverzeichnis - Grundlage fuer `GET
      # /api/diagnostics/fabric-backup` (Spec 4.1, Task 6, Phase 5) - war
      # bis hierher BEWUSST AUSKOMMENTIERT (Review-Fix Critical,
      # 2026-09-02), weil dieser Dienst mit `network_mode: host` laeuft
      # (siehe oben, Begruendung) und das Netz ihn deshalb genauso erreicht
      # wie den Miniserver: ohne Absicherung waere `/api/diagnostics/fabric-
      # backup` vollkommen ungeschuetzt gewesen, mit dieser Zeile eingehaengt
      # also der Download der kompletten, unersetzlichen Fabric-Credentials
      # (Spec 4.1) fuer jeden im selben Netz erreichbar, nicht nur
      # theoretisch moeglich.
      #
      # Diese Begruendung galt zunaechst dem Token: Task 8 lieferte
      # `build_api_guard` (siehe `src/loxmatter/loxone/server.py`) UND
      # setzte unten `LOXMATTER_API_TOKEN` voraus - beides zusammen machte
      # die Einhaengung vertretbar, und ein vergessenes Token liess
      # `/api/diagnostics/fabric-backup` folgerichtig mit 403 gar nichts
      # mehr ausliefern (Nachbesserung vom 2026-09-03).
      #
      # Seit dem WebUI-Login (Task 9/10, Phase 6, selbes Datum) traegt diese
      # Rolle stattdessen das Passwort: ohne gueltige Sitzung oder gueltiges
      # Token liefert JEDE `/api`-Route 401, die Fabric-Sicherung
      # eingeschlossen - der eigene 403-Zweig dafuer ist ersatzlos
      # entfallen, weil es die Regel, von der er eine Ausnahme war ("/api
      # bleibt ohne Token offen"), selbst nicht mehr gibt. `LOXMATTER_API_TOKEN`
      # unten ist dadurch fuer die Absicherung dieser Einhaengung nicht mehr
      # Voraussetzung, sondern optional (siehe dort): wer es leer laesst,
      # verliert nur den Skript-Zugang, nicht den Schutz der Fabric-Daten -
      # denn ohne ein am Host vergebenes Passwort antwortet keine
      # `/api`-Route, unabhaengig vom Token.
      - ./data:/matter-data:ro
    environment:
      # Eigener, fester Ort statt des Nutzer-Home-Defaults (siehe
      # `_resolve_store_path` in src/loxmatter/cli.py) - das eingehaengte
      # Volume ueberlebt ein `docker compose down`/`up`, ein Nutzer-Home im
      # Container tut das nicht.
      LOXMATTER_STORE: /data/loxmatter.sqlite
      # Zusaetzlicher Zugang zu saemtlichen `/api`-Routen (Einlernen,
      # Entfernen, Fabric-Sicherung) ueber `Authorization: Bearer <Token>` -
      # siehe `build_api_guard` in src/loxmatter/loxone/server.py und
      # README.md. `/cmd`/`/resync` bleiben davon unberuehrt, der
      # Miniserver braucht kein Token (siehe dort).
      #
      # OPTIONAL seit dem WebUI-Login (Task 9/10, Phase 6): der Zugang zur
      # Oberflaeche selbst laeuft ueber ein Passwort, das beim ersten
      # Aufruf von `http://<Host>:8080/` vergeben wird, nicht mehr ueber
      # dieses Token. Dieses Token bleibt trotzdem sinnvoll gesetzt fuer
      # Skripte und `curl`, die sich nicht per Browser anmelden koennen -
      # setzen Sie `LOXMATTER_API_TOKEN` in `.env` dafuer auf einen
      # zufaelligen, langen Wert (z. B. `openssl rand -hex 32`). Fehlt die
      # Variable in `.env`, interpoliert Docker Compose hier einen leeren
      # String - `typer`s `envvar`-Aufloesung behandelt eine leere
      # Umgebungsvariable wie eine fehlende (verifiziert: `api_token` wird
      # dann `None`, nicht `""`), `loxmatter run` startet also unveraendert
      # ohne den Token-Weg. Anders als vor dem WebUI-Login bedeutet das
      # KEINE Luecke: ohne gesetztes Passwort antwortet ohnehin keine
      # `/api`-Route (401, siehe README) - die Fabric-Sicherung eingeschlossen,
      # deren fruehere eigene 403-Sperre bei fehlendem Token deshalb entfallen
      # ist. Die Startwarnung gilt seither dem fehlenden Passwort
      # (`cli._warn_if_no_password`), nicht mehr dem fehlenden Token.
      LOXMATTER_API_TOKEN: ${LOXMATTER_API_TOKEN}
    command:
      - run
      - --url
      - ws://127.0.0.1:5580/ws
      - --miniserver
      - ${MINISERVER_IP}
      - --listen
      - "8080"
      # Aktiv seit Task 8 - siehe Kommentar bei der Volume-Zeile oben:
      # beide gehoeren zusammen. Ohne die Volume-Zeile bliebe dieses
      # Argument wirkungslos (die Route saehe kein Verzeichnis und
      # antwortete mit 503), ohne dieses Argument bliebe die
      # Volume-Zeile ungenutzt (matter_data_dir waere weiterhin `None`).
      - --matter-data-dir
      - /matter-data
    depends_on:
      - matter-server

volumes:
  # Der Thread-Zustand von OTBR (siehe dort, ausfuehrliche Begruendung).
  otbr-state:
  # Named Volume statt Bind-Mount (anders als matter-server oben): die
  # Signalschluessel-Datenbank gehoert nicht in den Projekt-Checkout auf dem
  # Host, sondern lebt unabhaengig davon (siehe LOXMATTER_STORE oben).
  loxmatter-store:
