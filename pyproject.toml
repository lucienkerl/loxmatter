[project]
name = "loxmatter"
version = "0.2.0"
description = "Connects Matter devices (Thread, Wi-Fi or Ethernet) to a Loxone Miniserver"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/loxmatter/web/vendor/LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "python-matter-server>=8.1.2",
    # Task 11, Phase 6: FastAPI's `File`/`UploadFile` (api/project_sync.py,
    # `POST /api/export/project-sync`) need "python-multipart" to parse
    # `multipart/form-data` bodies at all - without this package the
    # endpoint already raises a `RuntimeError` at `build_app` startup
    # ("Form data requires python-multipart to be installed"), not only on
    # the first request.
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    # Task 7, Phase 5: `uvicorn` alone (without the "standard" extra) does
    # not bring a WebSocket implementation - `GET /api/live` (Spec 8.3,
    # api/live.py) answers with 404 "Unsupported upgrade request" without
    # this package, verified against a real `uvicorn.run` of this service,
    # not just assumed: the test suite so far ran exclusively over the
    # in-process ASGI path (tests/api/conftest.py, `_InProcessWebSocket`)
    # and therefore never through uvicorn's own HTTP/WebSocket switch.
    # Without this line, the WebUI's live updates do not work in any
    # installation that installs exactly this dependency list.
    "websockets>=12",
]

[project.scripts]
loxmatter = "loxmatter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Task 7, Review-Fix Important #1: starts a real `uvicorn` process
    # (see tests/api/test_live_smoke.py) - not excluded by default, the
    # marker only serves targeted selection/deselection (`-m slow` /
    # `-m "not slow"`), not forgetting this test.
    "slow: starts a real server process instead of the in-process test path",
]

[tool.ruff]
line-length = 100
# The designs and plans under docs/ are prose, not source code. Their
# Python blocks are quotations and excerpts - often from the middle of a
# function, with exactly the indentation that shows where the excerpt
# belongs. `ruff format` still reads such blocks as standalone module
# files and pulls them to column 0: an excerpt from a route then becomes
# module-level code, and the document says something other than what it
# means. A formatter that rewrites documentation has no business deciding
# that here - `mypy` sees only `src` and `scripts` for the same reason.
extend-exclude = ["docs"]

[tool.ruff.lint.flake8-bugbear]
# `File(...)` as the default value of an `UploadFile` parameter (Task 11,
# api/project_sync.py) is the pattern FastAPI itself documents - unlike
# `Query(...)`/`Path(...)`, B008 doesn't automatically recognize it as
# immutable, because `UploadFile` itself is not an immutable type (see the
# B008 explanation: "Parameters with immutable type annotations will be
# ignored by this rule" - `str`/`int` apply for Query/Path, `UploadFile`
# for File does not).
extend-immutable-calls = ["fastapi.File"]

[tool.mypy]
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
# chip (part of the CHIP SDK, which python-matter-server uses for cluster
# commands) ships no py.typed marker/stubs - see
# BridgeMatterClient.send_command in matter/client.py.
module = "chip.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# playwright is deliberately NOT a project dependency: it's only needed to
# regenerate the README screenshots, and so runs ad hoc via
# `uv run --with playwright ... scripts/capture_screenshots.py`. It is
# consequently not installed in CI, but `files = ["src", "scripts"]` picks
# the script up anyway - without this exception mypy would fail there on an
# import it isn't even supposed to be able to resolve.
module = "playwright.*"
ignore_missing_imports = true
