name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh is run via `curl | sh` on other people's machines - a
      # quoting mistake in it is more expensive than in any other script here.
      - run: shellcheck -s sh install.sh
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The project is English-only. Without this step the rule holds only
      # until the next feature branch - see
      # docs/superpowers/specs/2026-09-07-english-only-translation-design.md
      - run: uv run python scripts/check_language.py
      - run: uv run pytest -v

  # Baut und veroeffentlicht das Image (Entwurf "Updates ueber die
  # Oberflaeche einspielen", 2026-09-08, Abschnitt 5). `needs: test` ist
  # nicht Kosmetik: ein Image, das die Testsuite nicht bestanden hat, darf
  # gar nicht erst unter einem Tag stehen, den jemand einspielen kann.
  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -eu
          # Die Schema-Version hat genau eine Quelle: store.py. Schlaegt der
          # grep fehl, bricht der Bau ab, statt ein Image mit leerem
          # LOXMATTER_SCHEMA_VERSION zu veroeffentlichen - der Updater aus
          # Stufe 2 koennte damit seine Vorabpruefung nicht machen und
          # muesste raten. tests/test_build_arguments.py prueft dasselbe
          # Muster, damit ein Umbau in store.py hier nicht erst in der CI
          # auffaellt.
          schema="$(sed -n -E 's/^_SCHEMA_VERSION = ([0-9]+)$/\1/p' src/loxmatter/model/store.py)"
          [ -n "$schema" ] || { echo "Keine _SCHEMA_VERSION in store.py gefunden"; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            *)            version="dev" ;;
          esac
          {
            echo "schema=$schema"
            echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - id: tags
        # version stammt aus einem Git-Tag (refs/tags/v...), und
        # `git check-ref-format` erlaubt darin Backticks, $(...) und
        # Anfuehrungszeichen. Stuende der Wert per ${{ }} direkt im
        # run-Skript, wuerde ein Tag wie "v1.0.0$(...)" als Shell-Code
        # ausgefuehrt - in einem Job mit packages: write. Ueber env:
        # kommt er nur als Variableninhalt an, nie als Quelltext.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -eu
          image="ghcr.io/lucienkerl/loxmatter"
          if [ "$VERSION" = "dev" ]; then
            echo "list=$image:dev,$image:sha-$COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "list=$image:$VERSION,$image:stable" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            LOXMATTER_VERSION=${{ steps.meta.outputs.version }}
            LOXMATTER_COMMIT=${{ steps.meta.outputs.commit }}
            LOXMATTER_BUILT_AT=${{ steps.meta.outputs.built_at }}
            LOXMATTER_SCHEMA_VERSION=${{ steps.meta.outputs.schema }}
