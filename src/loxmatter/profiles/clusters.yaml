# Enrichment for known clusters. The unknown is not discarded, but gets a
# generic name (Spec 3.5).
#
# The target unit is the one the Loxone block expects, not the SI unit
# (spec 7.3). The conversion itself is done by the UDP sender in phase 4.
#
# `rank` orders the clusters AGAINST EACH OTHER when the UI and the export
# sort the signals of a device (design 2026-09-07, section 4).
# Smaller rank first: what a device DOES in the house sits at 10-40; what
# it states about itself sits at 90+. A cluster without `rank` gets 50 and
# thereby lands in the middle - behind what demonstrably counts, but ahead
# of battery and device information. This default is deliberate: a device
# type that no one has entered yet should never lead with its battery
# level (rank 90), but its actual main feature should also not disappear
# behind everything known.
#
# WITHIN a rank the previous order stays (endpoint, cluster,
# element, kind) - it orders two signals of the same cluster, and it
# mostly does that well. There are TWO rank levels: `rank` per cluster
# (above) AND `rank` per element, settable individually on each entry
# under `attributes:`/`events:` (see cluster 59 below). The element level
# was ADDED LATER (2026-09-08), because a concrete device
# required it: the IKEA button carries `NumberOfPositions` on the same
# cluster as the button press, and the smaller element ID sorted the
# position figure - a constant that never changes - ahead of every
# button press; the tile thereby led with a primary signal without
# meaning. An element WITHOUT `rank` continues to fall back to the
# default and stays ordered by element ID - the Matter specification
# already assigns those roughly by importance, and that is enough for
# every cluster that has (so far) no device demanding otherwise. A new
# element rank needs, as here, a device that actually requires it,
# not just a guess.
clusters:
  6:
    name: onoff
    rank: 10
    attributes:
      0: {slug: onoff, unit: ""}
    commands:
      # "off"/"on" must be in quotes: otherwise YAML 1.1 reads them
      # as booleans, not as strings (PyYAML trap).
      0: {slug: "off", takes_value: false, control: none}
      1: {slug: "on", takes_value: false, control: none}
      2: {slug: toggle, takes_value: false, control: none}
  8:
    name: level
    rank: 20
    attributes:
      # 0-254 to 0-100 %: 100/254
      0: {slug: level, unit: "%", scale: 0.3937007874015748}
    commands:
      0: {slug: level, takes_value: true, control: percent}
      4: {slug: level_onoff, takes_value: true, control: percent}
  47:
    name: powersource
    rank: 90
    attributes:
      # BatPercentRemaining, attribute ID confirmed against
      # chip.clusters.Objects.PowerSource.Attributes.
      #
      # The factor 0.5 is NOT confirmed against a primary source (review
      # fix Important, 2026-09-03): the Matter Application Cluster
      # Specification is generally known to state the value in half
      # percent (0-200), but neither the installed chip SDK nor
      # matter_server carry units, and the specification document itself
      # was not available here. What is actually confirmed: the checked-in
      # snapshot tests/fixtures/nodes/ikea_bilresa_button.json reports the
      # value 200 under 0/47/12 for a button whose battery is full - which
      # fits half percent and not whole percent. Circumstantial evidence,
      # not proof. Whoever has the specification at hand, please replace
      # this.
      #
      # Only this one of 37 attributes is named, and that is the
      # fine-grained selection from the design (4.3): PowerSource also
      # carries charge states, battery chemistry, ANSI designations and
      # fault lists. Whoever needs one of those enables it in the expert
      # block.
      12: {slug: battery, unit: "%", scale: 0.5}
  768:
    name: colorcontrol
    rank: 30
    attributes:
      # Attribute IDs confirmed against the installed SDK (chip.clusters.
      # Objects.ColorControl.Attributes): CurrentHue=0, CurrentSaturation=1,
      # ColorTemperatureMireds=7, ColorMode=8.
      #
      # Was missing entirely until the Phase 6 follow-up fix: the cluster
      # was only in the table with `commands:` below (Phase 4, for
      # MoveToColorTemperature). Layer 3 of `is_functional`
      # (profiles/relevance.py) therefore asked `knows_cluster(768)` (true)
      # and then `names_element`, which was ALWAYS false without this
      # section - every attribute of ColorControl thereby counted as not
      # functional, while the output command for the color temperature
      # (below, `commands:`) had long been exported: Loxone could set the
      # color but never get it reported back. `known_attribute_section` in
      # `profiles/table.py` now structurally closes this trap for every
      # future commands-only cluster, not just for this one.
      #
      # Hue (0): Matter counts 0-254 for 0-360°. Scaled to degrees instead
      # of left raw - unlike the color temperature below, 360/254 is a
      # linear factor that the existing `scale` mechanism can express
      # correctly, and degrees is the unit customary in color pickers. No
      # entry in `_UNIT_DECIMALS`: without a real Loxone template that
      # confirms a decimal-place count for degrees, the Loxone format
      # string stays empty rather than prescribing a made-up precision -
      # the WebUI shows "°" regardless (`signal.unit`, straight from this
      # table, independent of `unit_format`).
      0: {slug: hue, unit: "°", scale: 1.4173228346456692}
      # Saturation (CurrentSaturation, 1): 0-254 like `level` (cluster 8) -
      # the same numeric value as there, not recomputed.
      1: {slug: saturation, unit: "%", scale: 0.3937007874015748}
      # Color temperature (ColorTemperatureMireds, 7): Matter returns
      # mired, Loxone wants Kelvin - but Kelvin = 1e6 / mired is a
      # reciprocal, not a factor, and the `scale` mechanism can only
      # multiply. The value therefore stays in mired, with a slug that
      # makes that clear, instead of inventing a wrong Kelvin number. Open
      # point (missing reciprocal conversion):
      # docs/superpowers/specs/2026-09-03-signal-selection-design.md section 10.
      7: {slug: colortemp_mireds, unit: mired}
      # Color mode (ColorMode, 8): an enumeration, not a physical
      # quantity - no unit.
      8: {slug: colormode, unit: ""}
      # ColorTempPhysicalMinMireds (16395) and ColorTempPhysicalMaxMireds
      # (16396): what color temperature the light can do at all. IDs
      # checked against the installed SDK (chip.clusters.Objects.
      # ColorControl.Attributes), values checked against both checked-in
      # lights.
      #
      # `functional: false`, because they are immutable device constants:
      # the UI needs them to limit the Kelvin slider
      # (design 2026-09-07, section 6.2), but as a virtual
      # Loxone input they would be two numbers that never change. In
      # the expert block they remain manually selectable.
      #
      # Like 7 above, they stay in mired - Kelvin = 1e6 / mired is
      # a reciprocal that `scale` cannot express. The API converts
      # them for the UI (see api/control.py).
      16395: {slug: colortemp_phys_min_mireds, unit: mired, functional: false}
      16396: {slug: colortemp_phys_max_mireds, unit: mired, functional: false}
    commands:
      # MoveToColorTemperature - one of two ColorControl commands that
      # commands/translate.py supports (see its `_PAYLOAD_BUILDERS`; the
      # second is hue/saturation, command 6, further below).
      # Review fix C2, 2026-09-02: this entry was missing, even though
      # `_PAYLOAD_BUILDERS` already supported the pair (768, 10) - in the
      # raw export (`raw`) that exported the command as a generic, digital
      # `c768_cmd10` (takes_value=False per `command_takes_value`),
      # and a button press sent the literal text "1" into
      # `_payload_color_temperature`, which built 1,000,000 mireds from it -
      # a made-up color temperature sent to a real device. `takes_value: true`
      # turns it into an analog output AND exports the command
      # immediately in normal (non-raw) mode too, which is correct anyway
      # for a supported command.
      10: {slug: colortemp, takes_value: true, control: kelvin}
      # MoveToHueAndSaturation - unlocked on September 7, 2026
      # (design 2026-09-07). The earlier block was based on a
      # mix-up: `translate.py` justified it with "Loxone RGB not
      # backed", while `commands/color.py` backs RGB with an official
      # source and leaves only Lumitech open. The value is the
      # packed Loxone color number; backed against the checked-in
      # RGBW light (tests/fixtures/nodes/ikea_kajplats_cws_lamp.json, 1/768/65529
      # contains 6).
      6: {slug: color, takes_value: true, control: hue_sat}
  1026:
    name: temperature
    rank: 10
    attributes:
      0: {slug: temp, unit: "°C", scale: 0.01}
  1029:
    name: humidity
    rank: 10
    attributes:
      0: {slug: humidity, unit: "%", scale: 0.01}
  144:
    name: power
    rank: 40
    attributes:
      4: {slug: voltage, unit: "V", scale: 0.001}
      5: {slug: current, unit: "A", scale: 0.001}
      8: {slug: power, unit: "kW", scale: 0.000001}
  145:
    name: energy
    rank: 40
    attributes:
      # CumulativeEnergyImported/-Exported. Matter returns both as an
      # EnergyMeasurementStruct - value plus timestamp -, not as a number.
      # `field: 0` is EnergyMeasurementStruct.energy, confirmed against
      # chip.clusters.Objects; the TIMESTAMPS are deliberately left out,
      # they have no use in Loxone.
      #
      # Matter counts in mWh (Matter Application Cluster Specification),
      # Loxone wants kWh (main document 7.3): 1 kWh = 1e6 mWh.
      1: {slug: energy_imported, field: 0, unit: "kWh", scale: 0.000001}
      2: {slug: energy_exported, field: 0, unit: "kWh", scale: 0.000001}
  59:
    name: switch
    rank: 10
    attributes:
      # `rank` per element orders WITHIN this cluster (added
      # 2026-09-08). Cluster 59 is so far the only one that needs it,
      # and the reason is NumberOfPositions: the figure for how many
      # positions this button has never changes. It stood, with
      # element ID 0, ahead of every button press and thereby became the
      # tile's primary signal - a constant as a button's most prominent
      # feature.
      0: {slug: positions, unit: "", rank: 90}
      1: {slug: position, unit: ""}
    events:
      # The button press is what you commission a button for.
      1: {slug: press, rank: 10}
      2: {slug: longpress}
      3: {slug: shortrelease}
      4: {slug: longrelease}
      5: {slug: multipress_ongoing}
      6: {slug: multipress}
  40:
    name: basicinformation
    # No `attributes:` section: this cluster stands here SOLELY because
    # of its rank. An empty `attributes:` section would have a second,
    # unwanted effect - `relevance.is_functional` reads it via
    # `known_attribute_section` and would then discard EVERY attribute of
    # this cluster as not wanted (see its docstring,
    # layer 3). The rank alone only changes the order.
    rank: 95
