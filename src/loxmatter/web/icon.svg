<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="loxmatter">
  <!--
    loxmatter - connects Matter devices to a Loxone Miniserver.
    Copyright (C) 2026 Lucien Kerl - GNU General Public License v3 or
    later, see LICENSE.

    The mark: a node with six neighbours - loxmatter as the point where
    the Thread mesh converges. Colours from style.css, applied in reverse:
    the accent colour `accent` (#a15a2c) as a fill instead of a stroke, so
    the icon does not look like just another card of the interface.

    No two consecutive hyphens in these comments: XML forbids them, and an
    SVG that fails to parse is not shown by the browser at all - silently,
    as a broken image.

    This version is the large one: for the README, repository images and
    anything from about 32 px up. Below that, favicon.svg takes over with
    heavier strokes - this version's six outer points merge into each
    other at 16 px.
  -->
  <rect width="512" height="512" rx="112" fill="#a15a2c"/>
  <g stroke="#f6ece3" stroke-width="22" stroke-linecap="round">
    <path d="M256 256 L406 256"/>
    <path d="M256 256 L331 386"/>
    <path d="M256 256 L181 386"/>
    <path d="M256 256 L106 256"/>
    <path d="M256 256 L181 126"/>
    <path d="M256 256 L331 126"/>
  </g>
  <g fill="#f6ece3">
    <circle cx="256" cy="256" r="46"/>
    <circle cx="406" cy="256" r="25"/>
    <circle cx="331" cy="386" r="25"/>
    <circle cx="181" cy="386" r="25"/>
    <circle cx="106" cy="256" r="25"/>
    <circle cx="181" cy="126" r="25"/>
    <circle cx="331" cy="126" r="25"/>
  </g>
</svg>
