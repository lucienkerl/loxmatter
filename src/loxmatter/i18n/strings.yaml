# The reasons `zigbee/source.py` puts into `api.errors.device_unreachable`.
# Each is its own string, so the reason is in the language of the sentence
# around it.
api.errors.zigbee_device_not_in_network:
  en: "unknown Zigbee device {address}"
  de: "unbekanntes Zigbee-Gerät {address}"
api.errors.zigbee_no_such_command:
  en: "endpoint {endpoint} of {address} has no command {command_id} on cluster {cluster_id}"
  de: "Endpunkt {endpoint} von {address} hat keinen Befehl {command_id} im Cluster {cluster_id}"
api.errors.zigbee_command_refused:
  en: "the device answered command {command_id} with status {status}"
  de: "das Gerät hat Befehl {command_id} mit Status {status} beantwortet"
api.errors.source_not_configured:
  # A stored device belongs to a technology no running source serves -
  # possible once a second source exists and its radio is removed from
  # the configuration (design 2026-09-11, section 6.3). 503, not 502:
  # nothing was asked of the device.
  en: "{technology} is not set up in this installation"
  de: "{technology} ist in dieser Installation nicht eingerichtet"
api.errors.group_partially_unreachable:
  en: "reached {reached} of {total} members; no answer from: {devices}"
  de: "{reached} von {total} Mitgliedern erreicht, keine Antwort von: {devices}"
api.errors.device_timed_out:
  # The bound of `bounded_source_call` or `bounded_source_removal`
  # (boundary design open point 11) - a source was asked and stayed silent
  # past `SOURCE_CALL_TIMEOUT_SECONDS` or `SOURCE_REMOVAL_TIMEOUT_SECONDS`.
  # `:g` because those bounds are floats: "within 10 s", not "within 10.0 s".
  en: "the device did not answer within {seconds:g} s"
  de: "das Gerät hat innerhalb von {seconds:g} s nicht geantwortet"
# The all-unconfigured case of a group fan-out (boundary design open point
# 12): EVERY member was never asked, because the technology's source is not
# running right now - 503, not 502, the same distinction
# `api.errors.source_not_configured` makes for one device. A group with even
# one member switched is a partial success and uses
# `api.errors.group_partially_unreachable` instead.
# Two keys rather than one with a plural rule: i18n.t knows no plural forms,
# and a group of one is the common case (same pattern as
# `web.devices.code_detect_remaining_*`).
api.errors.group_source_not_configured_one:
  en: "{technology} is not set up in this installation, so 1 member was not reached"
  de: "{technology} ist in dieser Installation nicht eingerichtet, daher wurde 1 Mitglied nicht erreicht"
api.errors.group_source_not_configured_many:
  en: "{technology} is not set up in this installation, so {total} members were not reached"
  de: "{technology} ist in dieser Installation nicht eingerichtet, daher wurden {total} Mitglieder nicht erreicht"
api.errors.command_belongs_to_removed_device:
  en: "command {command_key!r} belongs to device {device_id}, which was removed"
  de: "Kommando {command_key!r} gehoert zu Geraet {device_id}, das entfernt wurde"
api.errors.unknown_signal_key:
  en: "unknown signal key {signal_key!r}"
  de: "unbekannter Signal-Schluessel {signal_key!r}"
api.errors.signal_belongs_to_removed_device:
  en: "signal {signal_key!r} belongs to device {device_id}, which was removed"
  de: "Signal {signal_key!r} gehoert zu Geraet {device_id}, das entfernt wurde"

# The ways a Zigbee radio can fail to come up (design 2026-09-12, section
# 4.6). Each one names the NEXT THING TO DO, because each sends the user
# somewhere different - to the radios card, to the Compose stack, to their
# second loxmatter instance, or to the firmware on the stick. One generic
# "connection failed" would send them nowhere, which is why these are five
# keys and not one, and why `test_the_four_startup_messages_are_four_
# different_sentences` checks that they stay five different sentences in
# both languages.
#
# `ZigbeeSource` translates these at two different moments. Inside
# `ZigbeeUnavailableError` they are text at once - the supervisor logs it
# right then. Inside `progress().error` they stay an `i18n.Message` and are
# translated when `GET /api/zigbee/radio` answers, because the radios card
# keeps showing that one for as long as the supervisor retries, and a
# language switch has to reach it.
api.errors.zigbee_stick_missing:
  en: "The Zigbee stick is no longer there. Check under Settings which stick is selected, and pick it again."
  de: "Der Zigbee-Stick ist nicht mehr da. Prüfen Sie in den Einstellungen, welcher Stick ausgewählt ist, und wählen Sie ihn erneut."
api.errors.zigbee_no_device_permission:
  en: "The container is not allowed to open this USB device. Refreshing the Compose stack from the update card grants it the access it needs."
  de: "Der Container darf dieses USB-Gerät nicht öffnen. Ein Auffrischen des Compose-Stacks über die Update-Karte gibt ihm den nötigen Zugriff."
api.errors.zigbee_stick_busy:
  en: "Another program is already using this stick — a second loxmatter instance on this host is the usual reason. Stop it, or pick a different stick."
  de: "Ein anderes Programm benutzt diesen Stick bereits – meist eine zweite loxmatter-Instanz auf diesem Host. Beenden Sie sie, oder wählen Sie einen anderen Stick."
api.errors.zigbee_not_a_coordinator:
  en: "This stick does not answer as a Zigbee coordinator. It may be running Thread or bootloader firmware instead."
  de: "Dieser Stick antwortet nicht als Zigbee-Koordinator. Möglicherweise läuft auf ihm Thread- oder Bootloader-Firmware."
api.errors.zigbee_network_mismatch:
  # The bridge STOPS here and does not overwrite. Restoring the network
  # this bridge knows is destructive and needs the write-once-EUI64
  # confirmation, which is not built yet (design 4.8) - so the text offers
  # the option that exists and does not promise the one that does not.
  en: "This stick already carries a different Zigbee network. loxmatter will not overwrite it. Use a stick without a network, or reset this one in the tool it was set up with."
  de: "Auf diesem Stick liegt bereits ein anderes Zigbee-Netz. loxmatter überschreibt es nicht. Verwenden Sie einen Stick ohne Netz, oder setzen Sie diesen mit dem Werkzeug zurück, mit dem er eingerichtet wurde."
api.errors.zigbee_radio_failed:
  # The fall-through of the five above. It exists because a cause nobody
  # anticipated must still produce a sentence with the reason in it - an
  # empty message is the one outcome that helps nobody.
  en: "The Zigbee radio could not be started: {exc}"
  de: "Das Zigbee-Funkmodul konnte nicht gestartet werden: {exc}"
api.errors.zigbee_not_connected:
  # A radio IS configured, so this is 502 and not the 503 of
  # `api.errors.source_not_configured`: there is a source, its stick simply
  # is not answering right now. The supervisor is already retrying.
  en: "The Zigbee radio is configured, but the link to the stick is down. The bridge keeps trying to reconnect."
  de: "Das Zigbee-Funkmodul ist eingerichtet, aber die Verbindung zum Stick ist unterbrochen. Die Brücke versucht weiter, sie aufzubauen."

# The two refusals of `PUT /api/zigbee/radio`. The first one's wording IS
# the user-facing behaviour of the Thread exclusion: it has to say WHAT is
# wrong, WHY, and WHAT TO DO about it. "Invalid device" would leave the
# user with a stick they can see in the Thread row two rows above and no
# idea why they may not have it here.
api.errors.zigbee_is_thread_stick:
  # The same advice as the card's own hint under the Zigbee select
  # (`web.radios.zigbee_thread_stick_hint`), so a stale tab that posts
  # anyway reads the sentence the current page already shows. "Sie", like
  # every other sentence on the radios card.
  en: "This stick is in use for Thread. Turn Thread off, or move Thread to another stick, in the Thread row - then this stick can be used for Zigbee."
  de: "Dieser Stick wird für Thread verwendet. Schalten Sie Thread in der Thread-Zeile ab oder wählen Sie dort einen anderen Stick – dann lässt sich dieser Stick für Zigbee verwenden."
api.errors.zigbee_thread_unknown:
  # Why no stick may be chosen: the updater sidecar has not reported the
  # Thread configuration recently (radios/thread_lockout.py). Shown on the
  # card under the Zigbee select, and as the PUT's refusal. Names the service
  # the way `docker compose ps` shows it, because that is where the user
  # will look.
  en: "The bridge cannot currently tell which stick Thread is using, because the updater service (loxmatter-updater) has not reported recently. Until it does, no stick can be chosen for Zigbee. Make sure that service is running, and try again in a moment."
  de: "Die Brücke kann gerade nicht erkennen, welchen Stick Thread verwendet, weil der Update-Dienst (loxmatter-updater) sich seit einer Weile nicht gemeldet hat. Bis er das tut, lässt sich kein Stick für Zigbee wählen. Stellen Sie sicher, dass dieser Dienst läuft, und versuchen Sie es gleich noch einmal."
api.errors.zigbee_thread_changing:
  # A Thread or Bluetooth change is running or waiting in the sidecar, so
  # the reported Thread stick may be about to change.
  en: "A Thread or Bluetooth change is still being carried out. Wait until it has finished, then choose the Zigbee stick."
  de: "Eine Änderung an Thread oder Bluetooth wird gerade ausgeführt. Warten Sie, bis sie abgeschlossen ist, und wählen Sie dann den Zigbee-Stick."
api.errors.zigbee_open_thread_unknown:
  # The STORED stick is not opened: there is no sidecar report at all, so
  # nothing says it is not the Thread stick. The supervisor keeps retrying,
  # and this line stays on the card until the sidecar reports.
  en: "The Zigbee stick has not been opened, because the bridge has no report yet of which stick Thread is using. The updater service (loxmatter-updater) provides that report - once it is running, the bridge opens the stick by itself."
  de: "Der Zigbee-Stick wurde nicht geöffnet, weil der Brücke noch keine Meldung vorliegt, welchen Stick Thread verwendet. Diese Meldung liefert der Update-Dienst (loxmatter-updater) – sobald er läuft, öffnet die Brücke den Stick von selbst."
api.errors.zigbee_open_is_thread_stick:
  # The STORED Zigbee stick is the one Thread is now running on - moved
  # there by hand, since the Thread row refuses it. Opening it would garble
  # the Thread network, so it stays closed.
  en: "The Zigbee stick has not been opened, because Thread is running on it. Choose another stick for Zigbee, or move Thread to a different stick."
  de: "Der Zigbee-Stick wurde nicht geöffnet, weil Thread auf ihm läuft. Wählen Sie einen anderen Stick für Zigbee, oder verlegen Sie Thread auf einen anderen Stick."
api.errors.zigbee_unknown_device:
  # The same rule `POST /api/radios` already applies to the Thread device:
  # the bridge validates what it can see. Without it a typo becomes a zigpy
  # startup failure minutes later, with a message about a serial port.
  en: "This USB device is not among the sticks the bridge can see. Rescan, and pick one from the list."
  de: "Dieses USB-Gerät ist keiner der Sticks, die die Brücke sehen kann. Lesen Sie neu ein und wählen Sie einen aus der Liste."
api.errors.zigbee_not_configured:
  en: "No Zigbee stick is set up in this installation. Pick one under Settings first."
  de: "In dieser Installation ist kein Zigbee-Stick eingerichtet. Wählen Sie zuerst unter Einstellungen einen aus."

# The errors of the pairing routes (design 3.4). Each one says what the
# user's next move is, because each sends them somewhere different: to the
# radios card, back to the list, or simply to wait a moment.
api.zigbee.permit_failed:
  # The radio was asked to open the network and did not answer. {exc}
  # carries the source's own sentence, which is the only thing that
  # separates a busy stick from an absent one in a bug report - and it goes
  # LAST, with nothing after it: some of those sentences end in a full stop
  # and some do not, and the lost-link one already says the bridge is
  # reconnecting. Text after {exc} doubled both.
  en: "The network could not be opened for new devices. Reason: {exc}"
  de: "Das Netz konnte nicht für neue Geräte geöffnet werden. Grund: {exc}"
api.zigbee.close_failed:
  # The same refusal for a Stop: a window still recorded as open that the
  # radio did not acknowledge closing. Its own sentence, because "could not
  # be opened" is false for a request that asked to close - and this is
  # the one worth reading, since the coordinator may still be letting
  # devices in. {exc} goes last, for `permit_failed`'s reason above. It names
  # the Zigbee network: shown on leaving, it can appear in Settings, where
  # "the network" could as well be the bridge's own.
  en: "The Zigbee network could not be closed for new devices, so it may still be open. Reason: {exc}"
  de: "Das Zigbee-Netz konnte nicht für neue Geräte geschlossen werden und ist womöglich noch offen. Grund: {exc}"
api.zigbee.radio_changing:
  # The 503 of the pairing routes while a radio change is in flight - the
  # old source released, the new one not built yet. NOT the "no stick is set
  # up" sentence: the user has just picked a stick, and the pairing tab is
  # only on screen because one is set up. No "reload the page": the tab
  # shows every 503 of these routes in the list's own banner and keeps
  # asking, and the first answer after the swap clears it.
  en: "The Zigbee radio is being changed. Wait a moment - this list updates by itself."
  de: "Das Zigbee-Funkmodul wird gerade gewechselt. Warten Sie einen Moment – diese Liste aktualisiert sich von selbst."
api.zigbee.unknown_device:
  # A row that is no longer there: the device was removed from another tab,
  # or the radio was swapped and took every row with it. Shown on that row,
  # which the tab's next poll takes off the list together with this
  # message - so waiting is the whole fix, and saying so beats a bare "not
  # found".
  en: "This device is no longer in the pairing list. Wait a moment - this list updates by itself."
  de: "Dieses Gerät steht nicht mehr in der Kopplungsliste. Warten Sie einen Moment – diese Liste aktualisiert sich von selbst."
api.zigbee.not_ready_yet:
  # A save arriving for a row that has since gone back to interviewing.
  # Registering it then would store whatever half an interview produced -
  # a device tile with no signals and no hint why.
  en: "This device is not ready yet — the bridge is still reading its details. Give it a moment, then set the name again."
  de: "Dieses Gerät ist noch nicht bereit – die Brücke liest noch seine Angaben. Warten Sie einen Moment und vergeben Sie den Namen dann erneut."

# The five messages of `ThreadDatasetUnavailableError` (matter/otbr.py).
# NONE of them may contain the dataset itself - it carries the network key
# of the Thread network and belongs neither in a response nor in a log
# (see deploy/testhost/README.md). Only the origin ({url}), HTTP status
# and length are named; that holds for BOTH languages and is, when
# translating, the reason no {dataset} shows up anywhere here.
#
# {url} is not necessarily an address: `validated_dataset` also checks the
# manually entered dataset and then names its origin via
# `api.devices.manual_dataset_origin`.
api.errors.thread_dataset_empty:
  en: "{url} returned an empty Thread dataset — has the Border Router formed a network at all? (`ot-ctl state` should say `leader` or `router`.)"
  de: "{url} hat einen leeren Thread-Datensatz geliefert – hat der Border Router überhaupt ein Netz gebildet? (`ot-ctl state` sollte `leader` oder `router` sagen.)"
api.errors.thread_dataset_not_hex:
  en: "{url} did not return a Thread dataset, but {length} characters that are not hexadecimal — is a Border Router really answering there?"
  de: "{url} hat keinen Thread-Datensatz geliefert, sondern {length} Zeichen, die kein Hex sind – antwortet dort wirklich ein Border Router?"
api.errors.thread_dataset_odd_length:
  en: "{url} returned {length} hex characters — a Thread dataset always has an even number of them, because it consists of bytes. One character is missing, or one too many; copying from a terminal tends to clip the last one."
  de: "{url} hat {length} Hex-Zeichen geliefert – ein Thread-Datensatz hat immer eine gerade Anzahl, weil er aus Bytes besteht. Es fehlt ein Zeichen oder eines ist zu viel; beim Kopieren aus dem Terminal wird gern das letzte abgeschnitten."
api.errors.thread_dataset_unreachable:
  en: "{url} is unreachable ({exc}) — is the Border Router running on this host, and is its REST interface switched on?"
  de: "{url} ist nicht erreichbar ({exc}) – läuft der Border Router auf diesem Host, und ist seine REST-Schnittstelle aktiv?"
api.errors.thread_dataset_http_status:
  en: "{url} answered with HTTP {status} instead of a Thread dataset — that is what OTBR replies for as long as no active network exists."
  de: "{url} hat mit HTTP {status} geantwortet statt mit einem Thread-Datensatz – OTBR antwortet so, solange kein aktives Netz existiert."
api.control.fail_not_writable:
  en: "The writability of attribute {signal_key!r} cannot be confirmed, so it is not on the allow-list of writable attributes. If it really is writable, it can be added there."
  de: "Die Beschreibbarkeit von Attribut {signal_key!r} laesst sich nicht bestaetigen, es steht deshalb nicht auf der Erlaubnisliste beschreibbarer Attribute. Ist es tatsaechlich beschreibbar, kann es dort ergaenzt werden."
api.control.fail_not_wired:
  en: "Attribute {signal_key!r} is writable, but raw writing is not yet connected to matter-server."
  de: "Attribut {signal_key!r} ist beschreibbar, aber das rohe Schreiben ist noch nicht an matter-server angebunden."
api.devices.fail_no_matter_client:
  en: "No matter-server client configured — the bridge is running without a Matter connection"
  de: "Matter-Client nicht verfuegbar - die Bruecke laeuft ohne Verbindung zu matter-server"
# `DELETE /api/devices/{id}?forget_only=true` for a device whose technology
# HAS a configured source: that source is how the device is removed. Shown
# when a stick was set up again while the forget-only offer was on screen.
api.devices.forget_only_refused:
  en: "{technology} is set up in this installation, so the device is removed through it. Remove it again."
  de: "{technology} ist in dieser Installation eingerichtet, daher wird das Gerät darüber entfernt. Entfernen Sie es erneut."
api.devices.manual_dataset_origin:
  # Appears as {url} in `otbr.validated_dataset`'s messages when the
  # dataset did not come from the Border Router but from the form. Ends up
  # exclusively in the log - the response to the browser is phrased by
  # `api.devices.fail_manual_thread_dataset` below on its own.
  en: "The input field"
  de: "Das Eingabefeld"
api.devices.fail_manual_thread_dataset:
  # Deliberately does NOT name the rejected value: it contains the network
  # key of the Thread network. Applies to both languages.
  en: "What was entered is not a Thread dataset. Expected is the hex TLV of the active dataset — a single line of 0-9 and a-f with an even number of characters, exactly as `ot-ctl dataset active -x` prints it; if a character is missing at the end, the line was clipped while copying. A JSON structure, quotation marks, or prose do not belong in here. The value itself is deliberately left out of this message: it contains the network key of the Thread network."
  de: "Der eingetragene Thread-Datensatz ist keiner. Erwartet wird das Hex-TLV des aktiven Datensatzes – eine einzige Zeile aus 0-9 und a-f in gerader Anzahl, so wie `ot-ctl dataset active -x` sie ausgibt; fehlt am Ende ein Zeichen, ist die Zeile beim Kopieren abgeschnitten worden. Eine JSON-Struktur, Anführungszeichen oder Text darin gehören nicht hinein. Der Wert selbst steht bewusst nicht in dieser Meldung: er enthält den Netzwerkschlüssel des Thread-Netzes."
api.devices.commissioning_thread_cause:
  # {detail} is matter-server's own message, {reason} the reason the
  # dataset could not be obtained (one of the api.errors.thread_dataset_*
  # lines above).
  en: "{detail} Likely cause: matter-server holds no Thread credentials, and this bridge could not obtain any either ({reason}). A Thread device cannot be commissioned without them — a Wi-Fi device can, in which case the cause lies elsewhere. Remedy: make the Border Router reachable, or enter the Thread dataset by hand in the field below."
  de: "{detail} Mögliche Ursache: matter-server hat keine Thread-Zugangsdaten, und diese Brücke konnte auch keine holen ({reason}). Ein Thread-Gerät lässt sich ohne sie nicht einlernen – ein WiFi-Gerät dagegen schon, dann liegt es woanders. Abhilfe: den Border Router erreichbar machen, oder den Thread-Datensatz von Hand in das Feld darunter eintragen."
api.devices.room_name_required:
  en: "A room name is required."
  de: "Ein Raumname ist erforderlich."
api.devices.unknown_room:
  en: "No device is assigned to the room “{room}”."
  de: "Dem Raum „{room}“ ist kein Gerät zugeordnet."
api.devices.unexportable_text:
  en: "text - a virtual UDP input only knows numbers and digital values"
  de: "Text - ein virtueller UDP-Eingang kennt nur Zahlen und digitale Werte"
api.devices.unexportable_none:
  en: "no mappable value - list, struct, or currently without a value (null)"
  de: "kein abbildbarer Wert - Liste, Struktur, oder derzeit ohne Wert (null)"
api.auth.fail_password_too_short:
  en: "The password must be at least {min_length} characters long."
  de: "Das Passwort muss mindestens {min_length} Zeichen haben."
api.auth.fail_too_many_attempts:
  en: "Too many failed attempts – try again in {wait} seconds."
  de: "Zu viele Fehlversuche – in {wait} Sekunden wieder möglich."
api.auth.fail_already_set_up:
  en: "A password has already been set for this service – initial setup is therefore permanently complete. Forgot the password? In the reference deployment, `docker compose exec loxmatter loxmatter set-password` resets it; for a source install, `uv run loxmatter set-password`."
  de: "Für diesen Dienst ist bereits ein Passwort vergeben – die Ersteinrichtung ist damit dauerhaft abgeschlossen. Passwort vergessen? Im Referenz-Deployment setzt `docker compose exec loxmatter loxmatter set-password` es neu; bei einer Installation aus dem Quellcode `uv run loxmatter set-password`."
api.auth.fail_no_password_set:
  en: "No password has been set for this service yet – please complete initial setup first."
  de: "Für diesen Dienst ist noch kein Passwort vergeben – bitte zuerst die Ersteinrichtung abschließen."
api.auth.fail_wrong_password:
  en: "Wrong password."
  de: "Falsches Passwort."

# api.diagnostics — system-check lines (api/diagnostics.py) and the two
# 503 errors of the fabric backup.
api.diagnostics.check_failed:
  en: "This check itself failed ({exc}) — that is a bug in the check, not necessarily in the checked system. The full traceback is in the server log."
  de: "Diese Pruefung selbst ist fehlgeschlagen ({exc}) - das ist ein Fehler in der Pruefung, nicht zwangslaeufig im gepruerften System. Der volle Traceback steht im Server-Log."
api.diagnostics.matter_server_not_configured:
  en: "No matter-server client configured — the bridge is running without a Matter connection. This is always set for `loxmatter run`; if it's missing here, this service was started with an incomplete setup."
  de: "Kein matter-server-Client konfiguriert - die Bruecke laeuft ohne Matter-Anbindung. Das ist bei `loxmatter run` immer gesetzt; fehlt es hier, wurde dieser Dienst mit einem unvollstaendigen Aufbau gestartet."
api.diagnostics.matter_server_not_connected:
  en: "No active connection to matter-server. Is the service running (e.g. `docker compose ps matter-server`)? Is the --url address from `loxmatter run` still reachable?"
  de: "Keine aktive Verbindung zu matter-server. Laeuft der Dienst (z. B. `docker compose ps matter-server`)? Ist die --url-Adresse aus `loxmatter run` noch erreichbar?"
api.diagnostics.connected:
  en: "Connected."
  de: "Verbunden."
# The `thread-credentials` item - a status line, not an alarm (the
# rationale is at `_check_thread_credentials` in api/diagnostics.py). The
# reference to the neighbouring item names its fixed identifier `thread`,
# which stays the same in both languages.
api.diagnostics.thread_credentials_not_determinable:
  en: "Not determinable without a connection to matter-server — see the matter-server check."
  de: "Nicht feststellbar ohne Verbindung zu matter-server – siehe den Punkt matter-server."
api.diagnostics.thread_credentials_not_set:
  en: "Not set yet — matter-server keeps them in memory only and forgets them on every restart of the service. That is not a fault: the next commissioning fetches them from the Border Router on this host automatically. If none is running there, the thread check next to this one says so — the dataset is then entered by hand while commissioning."
  de: "Noch nicht gesetzt – matter-server hält sie nur im Arbeitsspeicher und vergisst sie bei jedem Neustart des Dienstes. Das ist kein Fehler: das nächste Einlernen holt sie automatisch vom Border Router auf diesem Host. Läuft dort keiner, sagt das der Punkt thread daneben – dann trägt man den Datensatz beim Einlernen von Hand ein."
api.diagnostics.thread_credentials_set:
  en: "Set — a Thread device can be commissioned."
  de: "Gesetzt – ein Thread-Gerät kann eingelernt werden."
api.diagnostics.store_not_writable:
  en: "The signal-key database is not writable ({exc}). Check the disk space and file permissions of the mounted data volume — without write access, no new device can be commissioned and no export can be recorded."
  de: "Die Signalschluessel-Datenbank ist nicht beschreibbar ({exc}). Pruefen Sie Speicherplatz und Dateirechte des eingehaengten Datenvolumes - ohne Schreibzugriff kann kein neues Geraet eingelernt und kein Export vermerkt werden."
api.diagnostics.writable:
  en: "Writable."
  de: "Beschreibbar."
api.diagnostics.no_ipv6_support:
  en: "This Python installation was built without IPv6 support."
  de: "Diese Python-Installation wurde ohne IPv6-Unterstuetzung gebaut."
api.diagnostics.ipv6_not_determinable:
  en: "Not determinable: /proc/net/if_inet6 does not exist on this system (not Linux). In the container, the bridge runs under Linux, where this check applies."
  de: "Nicht feststellbar: /proc/net/if_inet6 gibt es auf diesem System nicht (kein Linux). Im Container laeuft die Bruecke unter Linux, dort greift die Pruefung."
api.diagnostics.no_routed_ipv6:
  en: "No routed IPv6 address found — only link-local or loopback. Matter/Thread devices are therefore unreachable. Is the Thread Border Router running, and is it announcing its prefix?"
  de: "Keine geroutete IPv6-Adresse gefunden - nur link-lokale oder Loopback. Matter/Thread-Geraete sind damit nicht erreichbar. Laeuft der Thread-Border-Router, und kuendigt er sein Praefix an?"
api.diagnostics.ipv6_address_on_interface:
  en: "{address} on {interface}"
  de: "{address} auf {interface}"
api.diagnostics.ipv6_more_addresses:
  en: " (and {count} more)"
  de: " (und {count} weitere)"
api.diagnostics.routed_ipv6_found:
  en: "Routed IPv6 addresses present: {shown}{more}."
  de: "Geroutete IPv6-Adressen vorhanden: {shown}{more}."
api.diagnostics.thread_not_determinable:
  en: "Not determinable: /proc/net/if_inet6 does not exist on this system (not Linux)."
  de: "Nicht feststellbar: /proc/net/if_inet6 gibt es auf diesem System nicht (kein Linux)."
api.diagnostics.no_thread_interface:
  en: "No Thread interface ({prefix}*) with a mesh address found. Is the OTBR agent running? It aborts on an RCP timeout — when the radio module stops responding — without the container ending, and is then not restarted by anyone. `docker compose restart otbr` brings it back."
  de: "Keine Thread-Schnittstelle ({prefix}*) mit einer Mesh-Adresse gefunden. Laeuft der OTBR-Agent? Er bricht bei einem RCP-Timeout ab - wenn das Funkmodul nicht mehr antwortet -, ohne dass der Container endet, und wird dann von niemandem neu gestartet. `docker compose restart otbr` holt ihn zurueck."
api.diagnostics.thread_found:
  en: "Thread interface {interface} has {count} mesh address(es), e.g. {example}."
  de: "Thread-Schnittstelle {interface} hat {count} Mesh-Adresse(n), z. B. {example}."
api.diagnostics.no_udp_sender:
  en: "No UDP sender configured — the bridge is not sending values to the Miniserver. This is always set for `loxmatter run`; if it's missing here, this service was started with an incomplete setup."
  de: "Kein UDP-Sender konfiguriert - die Bruecke sendet keine Werte an den Miniserver. Das ist bei `loxmatter run` immer gesetzt; fehlt es hier, wurde dieser Dienst mit einem unvollstaendigen Aufbau gestartet."
api.diagnostics.no_network_path:
  en: "No network path to {host}:{port} found ({exc}). Is the Miniserver switched on and reachable on the same network? Do the IP and port match `loxmatter run --miniserver`/`--port`?"
  de: "Kein Netzwerkpfad zu {host}:{port} gefunden ({exc}). Ist der Miniserver eingeschaltet und im selben Netz erreichbar? Stimmen IP und Port aus `loxmatter run --miniserver`/`--port`?"
api.diagnostics.network_path_exists:
  en: "A network path to {host}:{port} exists. This only confirms routing, not actual delivery — the Miniserver does not evaluate UDP responses."
  de: "Ein Netzwerkpfad zu {host}:{port} existiert. Das bestaetigt nur Routing, keine tatsaechliche Zustellung - der Miniserver wertet UDP-Antworten nicht aus."
api.diagnostics.fabric_backup_not_mounted:
  en: "The matter-server data directory is not mounted for this service — a backup therefore cannot be created. See the deployment (docker-compose.yml, --matter-data-dir)."
  de: "Das matter-server-Datenverzeichnis ist fuer diesen Dienst nicht eingehaengt - eine Sicherung kann deshalb nicht erstellt werden. Siehe die Bereitstellung (docker-compose.yml, --matter-data-dir)."
api.diagnostics.fabric_backup_dir_missing:
  en: "The configured matter-server data directory does not exist or is not a directory. Check the mount."
  de: "Das konfigurierte matter-server-Datenverzeichnis existiert nicht oder ist kein Verzeichnis. Pruefen Sie die Einhaengung."
