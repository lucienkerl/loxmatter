# Testumgebung fuer Phase 1 - NICHT der Produktions-Stack aus Spec 4.1.
#
# Laeuft auf einem Raspberry Pi (siehe README.md fuer den Umzug von der Test-VM,
# die kein Bluetooth-Adapter hatte, und alle Abweichungen vom urspruenglichen
# Entwurf):
#   - openthread/otbr:latest       -> Digest sha256:ebebd9f6..., Entrypoint
#     /app/etc/docker/test/docker_entrypoint.sh (die "test"-Variante des
#     Images, nicht die neuere s6-overlay/"border-router"-Variante). Diese
#     Variante liest RADIO_URL als Umgebungsvariable und akzeptiert
#     --backbone-interface als Kommandozeilenargument, genau wie unten
#     konfiguriert.
#   - ghcr.io/matter-js/matterjs-server:stable (8. September 2026, UNGEPRUEFT -
#     siehe README, Abschnitt "Umzug auf matterjs-server (UNGEPRUEFT)"; der
#     README schreibt den Zusatz mit Umlaut, hier steht er umlautfrei wie jeder
#     Kommentar in dieser Datei) -> --bluetooth-adapter
#     ${BLUETOOTH_ADAPTER} gilt weiterhin fuer BLE-Commissioning ueber hci0,
#     zusaetzlich NOBLE_BINDINGS=dbus, weil der Container unprivilegiert laeuft
#     (siehe README).
#   - loxmatter (Phase 4, Review-Fix I5, 2026-09-02) -> aus diesem Repository
#     selbst gebaut (siehe ../../Dockerfile, dort auch der Hinweis, dass das
#     Image noch ungeprueft ist - kein Docker/Netz in der Umgebung, die
#     diesen Dienst hinzugefuegt hat). Braucht MINISERVER_IP in .env.
# Der Projektname steht HIER und nicht in der .env (2026-09-03).
#
# Compose leitet ihn sonst aus dem Verzeichnisnamen ab, und daraus entstehen
# die Namen der benannten Volumes: `<projekt>_loxmatter-store` haelt die
# Signalschluessel, `<projekt>_otbr-state` den Thread-Netzwerkschluessel.
# Beides ist unersetzlich - die Schluessel sind die Verdrahtung in der
# Loxone-Konfiguration, der Thread-Schluessel das Netz, in dem die Geraete
# stehen.
#
# Haengt der Name am Verzeichnis, aendert ihn jeder Umzug des Checkouts, jedes
# Umbenennen und jedes Klonen unter anderem Namen - und Compose legt
# stillschweigend LEERE Volumes an, statt einen Fehler zu melden. Genau das
# passierte beim Umzug dieses Stacks von ~/loxmatter-testhost in einen
# Git-Checkout; dort war es nur deshalb harmlos, weil der alte Name von Hand
# in der .env festgehalten wurde. Wer die .env spaeter neu aus
# .env.example erzeugt, haette den Schutz wieder verloren. Hier steht er
# fest.
#
# COMPOSE_PROJECT_NAME in der Umgebung sticht diesen Eintrag weiterhin; wer
# mehrere Instanzen nebeneinander betreibt, kann ihn also weiter benutzen.
name: loxmatter-testhost

services:
  otbr:
    image: openthread/otbr:latest
    container_name: otbr
    # Nur mit aktivem Profil "thread" (2026-09-05). Dieser Dienst reicht mit
    # `devices:` unten ein echtes Geraet durch - fehlt das Funkmodul, scheitert
    # `docker compose up` fuer den GESAMTEN Stack, auch fuer jemanden, der nur
    # WLAN-Matter-Geraete anbinden will. Hinter einem Profil bleibt der Rest
    # startbar; eingeschaltet wird es ueber COMPOSE_PROFILES in der .env, das
    # Compose von sich aus liest - deshalb braucht kein spaeterer Aufruf und
    # kein Skript ein `--profile` mitzuschleppen.
    profiles: ["thread"]
    network_mode: host
    privileged: true
    restart: unless-stopped
    devices:
      - ${RADIO_DEVICE}:${RADIO_DEVICE}
    environment:
      RADIO_URL: spinel+hdlc+uart://${RADIO_DEVICE}?uart-baudrate=${RADIO_BAUDRATE}
      # Weder auf der urspruenglichen Test-VM noch auf diesem Pi sind die legacy
      # iptables-Tabellen (mangle/nat/filter) geladen, und das Image hat kein
      # modprobe, um sie nachzuladen - NAT64/NAT44 und die legacy-Firewall-Regeln
      # (fuer beide ist iptables noetig) wuerden deshalb fehlschlagen und den
      # Container abstuerzen lassen (siehe README, Abweichung 2 in der VM-Historie).
      # Fuer die Testumgebung unkritisch (siehe README): kein globales IPv6,
      # kein Bedarf, aus dem Thread-Netz heraus IPv4-Hosts zu erreichen.
      NAT64: "0"
      FIREWALL: "0"
    command: --backbone-interface ${BACKBONE_IF}
    # Ohne diese Grenze startet OTBR nicht (2026-09-03, an einem Pi 4
    # gemessen). Der Docker-Daemon reicht hier ein `nofile` von
    # 1_073_741_816 in den Container; `start-stop-daemon`, mit dem das
    # init-Skript des Images `otbr-agent` startet, schliesst vor dem `exec`
    # JEDEN Deskriptor von 3 bis zu dieser Grenze einzeln. Das sind ueber
    # eine Milliarde Systemaufrufe: der Prozess dreht mit 100 % CPU und
    # kommt praktisch nie zum eigentlichen Agenten. Sichtbar wird das als
    # "ot-ctl: connect session failed" und einem Container, der laeuft, ohne
    # dass ein Thread-Netz entsteht.
    #
    # Der Fehler traf dieses Projekt schon einmal nach einem Neustart des
    # Pi und wurde damals von Hand umgangen, ohne die Ursache zu kennen.
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    volumes:
      # Der Thread-Zustand ueberlebt sonst KEINEN Neubau des Containers
      # (2026-09-03). Das Image sieht dafuer kein Volume vor, und OTBR legt
      # seine Netzdaten - Netzwerkschluessel, PAN-ID, Kanal - unter
      # /var/lib/thread in der Schreibschicht ab. Ein `docker compose down`,
      # ein Image-Update oder ein Umzug des Projektverzeichnisses bildet
      # damit ein NEUES Thread-Netz, und jedes bereits eingelernte Geraet
      # muesste zurueckgesetzt und neu gepaart werden - bei einem
      # Sensor hinter einer Schranktuer keine Kleinigkeit.
      #
      # Wer einen laufenden Stack ohne dieses Volume nachruestet, muss den
      # Zustand zuerst herausholen und in das leere Volume legen, sonst
      # startet OTBR mit leerem Zustand und das Netz ist trotzdem weg:
      #
      #   docker cp otbr:/var/lib/thread /tmp/thread-state
      #   docker volume create <projekt>_otbr-state
      #   docker run --rm -v <projekt>_otbr-state:/d -v /tmp/thread-state:/s:ro \
      #       alpine sh -c 'cp -a /s/. /d/'
      #
      # Rueckfallweg, falls doch etwas schiefgeht: der aktive Datensatz als
      # Hex (`docker exec otbr ot-ctl dataset active -x`) laesst sich mit
      # `ot-ctl dataset set active <hex>` in einen frischen Container
      # zuruecksetzen. Diese Zeichenkette ist ein Credential und gehoert
      # weder ins Repository noch in ein Log.
      - otbr-state:/var/lib/thread

  matter-server:
    # matterjs-server statt python-matter-server (8. September 2026,
    # UNGEPRUEFT - siehe README, Abschnitt "Umzug auf matterjs-server
    # (UNGEPRUEFT)").
    # python-matter-server ist mit 8.1.2 archiviert; der Nachfolger spricht
    # dieselbe WebSocket-API und benutzt dasselbe Datenverzeichnis, migriert
    # es aber beim ERSTEN Start in sein eigenes Format. Diese Migration ist
    # einseitig: geht sie schief, ist die Fabric weg und jedes eingelernte
    # Geraet muss zurueckgesetzt und neu gepaart werden. Vorher
    # `GET /api/diagnostics/fabric-backup` ziehen und das Archiv vom Pi
    # herunterholen - genau dafuer gibt es die Route.
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    network_mode: host
    restart: unless-stopped
    # UNVERAENDERT UEBERNOMMEN vom alten Image, und das ist eine offene Frage,
    # keine Entscheidung (8. September 2026). Dieser Eintrag stand hier fuer den
    # rohen HCI-Zugriff von python-matter-server: das AppArmor-Profil `docker-
    # default` verbietet die dafuer noetigen Bluetooth-Rohsockets. Der neue
    # Container geht BLE ueber den D-Bus-Weg an (NOBLE_BINDINGS=dbus, siehe
    # unten) und braucht ihn moeglicherweise nicht mehr.
    #
    # Er bleibt trotzdem stehen, weil das an dieser Maschine nicht zu klaeren
    # ist: ihn versuchsweise zu entfernen hiesse, das BLE-Commissioning zu
    # riskieren, das ohnehin schon als UNGEPRUEFT gilt - und ein Fehlschlag dort
    # sieht in den Logs aus wie kein Fehlschlag (siehe README, "BLE aktivieren").
    # Zu pruefen ist deshalb am Pi, und zwar erst, nachdem BLE ueber D-Bus
    # nachweislich einmal funktioniert hat: Zeile entfernen, Container neu
    # anlegen, ein Geraet einlernen. Geht das, kann sie weg.
    #
    # Der Widerspruch zum Block weiter unten, der `user: 0:0` ausdruecklich aus
    # Isolationsgruenden ablehnt, ist gesehen: eine aufgehobene AppArmor-
    # Beschraenkung ist ebenfalls weniger Isolierung. Der Unterschied ist nur,
    # dass fuer `user: 0:0` eine belegte Alternative vorliegt (der D-Bus-Weg)
    # und hier bislang keine Messung.
    security_opt:
      - apparmor=unconfined
    volumes:
      # Dasselbe Verzeichnis wie zuvor. WICHTIG: der neue Container laeuft
      # unprivilegiert als UID 1000, das alte Image lief als root. Vor dem
      # ersten Start deshalb einmalig auf dem Pi:
      #     sudo chown -R 1000:1000 deploy/testhost/data
      #     sudo chmod -R u+rwX,go+rX deploy/testhost/data
      # Ohne das startet der Container nicht - er kommt in sein eigenes
      # Datenverzeichnis nicht hinein.
      - ./data:/data
      - /run/dbus:/run/dbus:ro
    environment:
      # BLE ueber den BlueZ-Daemon des Hosts statt ueber einen rohen
      # HCI-Socket. Der Standard waere `hci`, und der verlangt Rechte, die
      # der unprivilegierte Container-Nutzer nicht hat - BLE-Commissioning
      # bliebe damit still aus. Der dafuer noetige /run/dbus-Mount steht
      # oben schon.
      #
      # Die von der Doku genannte Alternative - Container als root fahren
      # (`user: 0:0`) - wird hier BEWUSST NICHT gewaehlt: sie hebt die
      # Container-Isolierung auf, und dieser Dienst laeuft mit
      # `network_mode: host` ohnehin schon offen im Netz.
      NOBLE_BINDINGS: dbus
    # ACHTUNG: `command` ueberschreibt das Image-Default-CMD VOLLSTAENDIG -
    # Compose ergaenzt es nicht, es ersetzt es. Fuer das alte Image war dessen
    # CMD bekannt (`--storage-path /data --paa-root-cert-dir /data/credentials`,
    # per `docker inspect --format '{{.Config.Cmd}}'` geprueft, siehe README,
    # "BLE aktivieren"), und die Liste hier war bewusst dessen Nachbau plus
    # `--bluetooth-adapter`.
    #
    # Fuer dieses Image ist das Default-CMD UNGEPRUEFT. Traegt es etwas, worauf
    # loxmatter baut - etwa einen abweichenden `--port`, waehrend loxmatter fest
    # `ws://127.0.0.1:5580/ws` anspricht -, faellt es hier still weg. Deshalb vor
    # dem ersten `up` nachsehen und mit dieser Liste vergleichen (README, "Was
    # danach zu pruefen ist", Punkt 3):
    #     docker inspect --format '{{.Config.Cmd}}' \
    #         ghcr.io/matter-js/matterjs-server:stable
    command:
      - --storage-path
      - /data
      # `--paa-root-cert-dir` ist ERSATZLOS ENTFALLEN (nicht vergessen):
      # die CLI-Doku des Nachfolgers fuehrt die Option unter "Deprecated
      # Options (were used in Python Matter Server) - not supported", weil
      # matter.js die PAA-Wurzelzertifikate ueber seinen eigenen
      # DCL-Client bezieht.
      - --bluetooth-adapter
      - "${BLUETOOTH_ADAPTER:-0}"
    # Kein `depends_on: otbr` mehr (2026-09-05): Compose bricht ab, wenn ein
    # aktiver Dienst von einem profil-deaktivierten abhaengt. Inhaltlich
    # folgenlos - `depends_on` steuert die Startreihenfolge, nicht die
    # Bereitschaft, und matter-server braucht den Border Router beim Start
    # nicht: Thread-Kommissionierung laeuft spaeter ueber das Host-Netz, in
    # dem otbr mit `network_mode: host` ohnehin steht.

  loxmatter:
    # Seit 0.2.0 aus einem veroeffentlichten Image statt auf dem Pi gebaut
    # (Entwurf "Updates ueber die Oberflaeche einspielen", 2026-09-08,
    # Abschnitt 5). Der Bau brauchte auf dem Test-Pi fuenf bis zehn Minuten
    # und konnte an einem PyPI-Ausfall oder am Speicher scheitern - mitten
    # in einem Update, das jemand ueber den Browser angestossen hat, ist
    # das die falsche Sorte Ueberraschung.
    #
    # Der Tag darunter steht in der .env und ist die EINZIGE Stelle, an der
    # die laufende Version festgelegt wird. Genau deshalb: der Updater
    # (Stufe 2) faellt zurueck, indem er diese eine Zeile zurueckschreibt.
    # Eine zweite Erwaehnung des Tags waere eine, die dabei stehen bliebe.
    #
    # `build:` bleibt darunter stehen. Ein Compose-Profil kaeme dafuer
    # nicht in Frage (Profile gelten fuer Dienste, nicht fuer einzelne
    # Schluessel), und es wird auch keines gebraucht: `compose pull` zieht,
    # `compose build` baut ausdruecklich, und `up` baut nur, wenn lokal
    # gar kein Image liegt. Auf einem Host ohne GHCR-Zugang ist genau das
    # die gewuenschte Rueckfallebene.
    image: ghcr.io/lucienkerl/loxmatter:${LOXMATTER_IMAGE_TAG:-stable}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: loxmatter
    restart: unless-stopped
    # Wie otbr/matter-server: network_mode host statt einer expliziten
    # `ports:`-Liste, aus zwei Gruenden, nicht nur Konsistenz. Erstens
    # erreicht `--url` (Default ws://localhost:5580/ws) matter-server nur
    # ueber 127.0.0.1 - matter-server laeuft selbst mit network_mode: host
    # und ist deshalb im Compose-eigenen Bridge-Netz kein aufloesbarer
    # Servicename. Zweitens macht das den HTTP-Port fuer die Loxone-
    # Ausgangsbefehle (--listen, Default 8080) ohne weitere Portfreigabe vom
    # Miniserver aus erreichbar - das ist der hier geforderte
    # "veroeffentlichte" HTTP-Port.
    #
    # Seit Phase 5 traegt genau dieser Port zusaetzlich die Bedienoberflaeche
    # (`/api/*`, `/`) - derselbe FastAPI-Dienst, dasselbe `--listen`. Wer
    # `http://<Host>:8080/` im Browser oeffnet, sieht beim allerersten Mal
    # eine Ersteinrichtung (Passwort vergeben) und danach eine Anmeldung -
    # seit dem WebUI-Login (Task 9/10, Phase 6) ist `/api/*` durch diese
    # Anmeldung geschuetzt, nicht mehr durch `LOXMATTER_API_TOKEN` unten.
    # Das Token bleibt als zusaetzlicher Weg fuer Skripte und `curl`
    # bestehen (siehe dort). `/cmd` und `/resync` fuer den Miniserver
    # bleiben bewusst offen (siehe dort).
    network_mode: host
    volumes:
      - loxmatter-store:/data
      # Aktiv seit Task 8 (Phase 5): der Read-only-Einblick in matter-
      # server's eigenes Datenverzeichnis - Grundlage fuer `GET
      # /api/diagnostics/fabric-backup` (Spec 4.1, Task 6, Phase 5) - war
      # bis hierher BEWUSST AUSKOMMENTIERT (Review-Fix Critical,
      # 2026-09-02), weil dieser Dienst mit `network_mode: host` laeuft
      # (siehe oben, Begruendung) und das Netz ihn deshalb genauso erreicht
      # wie den Miniserver: ohne Absicherung waere `/api/diagnostics/fabric-
      # backup` vollkommen ungeschuetzt gewesen, mit dieser Zeile eingehaengt
      # also der Download der kompletten, unersetzlichen Fabric-Credentials
      # (Spec 4.1) fuer jeden im selben Netz erreichbar, nicht nur
      # theoretisch moeglich.
      #
      # Diese Begruendung galt zunaechst dem Token: Task 8 lieferte
      # `build_api_guard` (siehe `src/loxmatter/loxone/server.py`) UND
      # setzte unten `LOXMATTER_API_TOKEN` voraus - beides zusammen machte
      # die Einhaengung vertretbar, und ein vergessenes Token liess
      # `/api/diagnostics/fabric-backup` folgerichtig mit 403 gar nichts
      # mehr ausliefern (Nachbesserung vom 2026-09-03).
      #
      # Seit dem WebUI-Login (Task 9/10, Phase 6, selbes Datum) traegt diese
      # Rolle stattdessen das Passwort: ohne gueltige Sitzung oder gueltiges
      # Token liefert JEDE `/api`-Route 401, die Fabric-Sicherung
      # eingeschlossen - der eigene 403-Zweig dafuer ist ersatzlos
      # entfallen, weil es die Regel, von der er eine Ausnahme war ("/api
      # bleibt ohne Token offen"), selbst nicht mehr gibt. `LOXMATTER_API_TOKEN`
      # unten ist dadurch fuer die Absicherung dieser Einhaengung nicht mehr
      # Voraussetzung, sondern optional (siehe dort): wer es leer laesst,
      # verliert nur den Skript-Zugang, nicht den Schutz der Fabric-Daten -
      # denn ohne ein am Host vergebenes Passwort antwortet keine
      # `/api`-Route, unabhaengig vom Token.
      - ./data:/matter-data:ro
    environment:
      # Eigener, fester Ort statt des Nutzer-Home-Defaults (siehe
      # `_resolve_store_path` in src/loxmatter/cli.py) - das eingehaengte
      # Volume ueberlebt ein `docker compose down`/`up`, ein Nutzer-Home im
      # Container tut das nicht.
      LOXMATTER_STORE: /data/loxmatter.sqlite
      # Zusaetzlicher Zugang zu saemtlichen `/api`-Routen (Einlernen,
      # Entfernen, Fabric-Sicherung) ueber `Authorization: Bearer <Token>` -
      # siehe `build_api_guard` in src/loxmatter/loxone/server.py und
      # README.md. `/cmd`/`/resync` bleiben davon unberuehrt, der
      # Miniserver braucht kein Token (siehe dort).
      #
      # OPTIONAL seit dem WebUI-Login (Task 9/10, Phase 6): der Zugang zur
      # Oberflaeche selbst laeuft ueber ein Passwort, das beim ersten
      # Aufruf von `http://<Host>:8080/` vergeben wird, nicht mehr ueber
      # dieses Token. Dieses Token bleibt trotzdem sinnvoll gesetzt fuer
      # Skripte und `curl`, die sich nicht per Browser anmelden koennen -
      # setzen Sie `LOXMATTER_API_TOKEN` in `.env` dafuer auf einen
      # zufaelligen, langen Wert (z. B. `openssl rand -hex 32`). Fehlt die
      # Variable in `.env`, interpoliert Docker Compose hier einen leeren
      # String - `typer`s `envvar`-Aufloesung behandelt eine leere
      # Umgebungsvariable wie eine fehlende (verifiziert: `api_token` wird
      # dann `None`, nicht `""`), `loxmatter run` startet also unveraendert
      # ohne den Token-Weg. Anders als vor dem WebUI-Login bedeutet das
      # KEINE Luecke: ohne gesetztes Passwort antwortet ohnehin keine
      # `/api`-Route (401, siehe README) - die Fabric-Sicherung eingeschlossen,
      # deren fruehere eigene 403-Sperre bei fehlendem Token deshalb entfallen
      # ist. Die Startwarnung gilt seither dem fehlenden Passwort
      # (`cli._warn_if_no_password`), nicht mehr dem fehlenden Token.
      LOXMATTER_API_TOKEN: ${LOXMATTER_API_TOKEN}
    command:
      - run
      - --url
      - ws://127.0.0.1:5580/ws
      - --miniserver
      - ${MINISERVER_IP}
      - --listen
      - "8080"
      # Aktiv seit Task 8 - siehe Kommentar bei der Volume-Zeile oben:
      # beide gehoeren zusammen. Ohne die Volume-Zeile bliebe dieses
      # Argument wirkungslos (die Route saehe kein Verzeichnis und
      # antwortete mit 503), ohne dieses Argument bliebe die
      # Volume-Zeile ungenutzt (matter_data_dir waere weiterhin `None`).
      - --matter-data-dir
      - /matter-data
    depends_on:
      - matter-server

volumes:
  # Der Thread-Zustand von OTBR (siehe dort, ausfuehrliche Begruendung).
  otbr-state:
  # Named Volume statt Bind-Mount (anders als matter-server oben): die
  # Signalschluessel-Datenbank gehoert nicht in den Projekt-Checkout auf dem
  # Host, sondern lebt unabhaengig davon (siehe LOXMATTER_STORE oben).
  loxmatter-store:
