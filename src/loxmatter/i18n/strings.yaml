  de: "Projektdatei-Sync"
web.export.projectsync_intro:
  en: |
    Upload an existing Loxone project file – existing virtual inputs/outputs are updated, new signals are added. Nothing is downloaded before you have seen the plan.
  de: |
    Bestehende Loxone-Projektdatei hochladen – vorhandene virtuelle Ein-/Ausgänge werden aktualisiert, neue Signale ergänzt. Nichts wird heruntergeladen, bevor du den Plan gesehen hast.
