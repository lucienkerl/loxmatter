<!--
  loxmatter - Inbetriebnahme- und Diagnosewerkzeug fuer die Matter-Loxone-
  Bruecke (Spec 8). Vier Ansichten, umgeschaltet ueber Alpine.js, ohne
  Seitenwechsel und ohne Build-Schritt.

  Enthaelt eine vendorte Kopie von Alpine.js, Version 3.17.1 (MIT-Lizenz,
  (c) Caleb Porzio), bezogen als eigenstaendige, sich selbst startende
  Distribution (kein Modul, kein Bundler noetig) des npm-Pakets "alpinejs"
  ueber jsDelivr (das oeffentliche Auslieferungsnetz fuer npm-Pakete) am
  2026-09-02, unveraendert unter web/vendor/alpine.min.js abgelegt - SHA-256
  b30997fc126d808b1a9b20ab3f504ded88df957818c02d6249bba3ec114eb0ec.

  Bewusst KEIN Netzwerkverweis in dieser Datei: die Bruecke laeuft in
  Installationen ohne Internetzugang, und eine Oberflaeche, die dort auf
  ein entferntes Skript wartet, bleibt weiss.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loxmatter</title>
    <!-- Eine einzige SVG-Datei statt der ueblichen PNG-Reihe: der Browser
         skaliert sie selbst, und die Bruecke laeuft in Installationen ohne
         Internetzugang - eine Datei weniger, die fehlen kann. Die grosse
         Fassung liegt daneben als icon.svg (siehe die Kommentare dort). -->
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <!--
    Hier steht mit Absicht KEIN `x-init="init()"` (Review-Fix Fix 2,
    2026-09-03). Alpine 3 ruft die Methode `init()` eines mit `x-data`
    erzeugten Datenobjekts von sich aus genau einmal auf. Ein zusaetzliches
    `x-init="init()"` ruft sie ein zweites Mal - und `init()` startet nach
    einer angemeldeten Sitzung den Live-WebSocket. Jeder offene Tab hielt
    dadurch ZWEI Verbindungen, von denen nur die zuletzt geoeffnete in
    `this.socket` steht. Die andere bekommt trotzdem jeden Wert, belegt im
    Backend eine Queue samt zwei asyncio-Tasks und einen Beobachter und
    bleibt fuer die Oberflaeche unsichtbar - sie stirbt erst mit dem Tab.
    Wer hier ein `x-init` ergaenzen moechte: dafuer gibt es keinen Grund,
    `init()` laeuft bereits.
  -->
  <body x-data="app()">
    <!-- Icon-Symbole (Geraete-Dashboard-Entwurf, Abschnitt 3) - inline SVG
         statt einer Icon-Bibliothek: kein Netzwerkverweis, dieselbe
         Begruendung wie beim vendorten Alpine.js oben im Kopfkommentar. -->
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-device" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <circle cx="12" cy="12" r="2.2" />
      </symbol>
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M12 3.7 21 19.3H3L12 3.7z" />
        <path d="M12 9.6v4.3M12 16.9v.1" />
      </symbol>
      <symbol id="i-offline" viewBox="0 0 24 24">
        <path d="M2 8.3a15 15 0 0 1 6-3M16.2 5.4a15 15 0 0 1 5.8 2.9" />
        <path d="M5.5 12a10 10 0 0 1 5-2.6M13.7 9.4a10 10 0 0 1 4.8 2.6" />
        <path d="M9 15.6a5 5 0 0 1 3.5-1.4" />
        <circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </symbol>
      <!-- Aufklapp-Pfeil fuer die Projektdatei-Sync-Geraetekarten
           (`.projectsync-device`, ein natives <details>) - ersetzt dessen
           browserabhaengigen Standard-Marker durch dasselbe Strich-Icon wie
           die uebrigen Symbole hier. -->
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" />
      </symbol>
    </svg>
    <!-- Bis `/auth-info` geantwortet hat, zeigt die Seite bewusst nichts -
         sonst blitzte je nach Antwort der falsche Bildschirm auf. -->
    <template x-if="stringsReady && authReady && !authenticated && !passwordSet">
      <main class="auth-screen">
        <h1 x-text="t('web.auth.setup_heading')"></h1>
        <p class="banner warn" x-html="t('web.auth.setup_warning')"></p>
        <label>
          <span x-text="t('web.auth.password_label')"></span>
          <input type="password" autocomplete="new-password" x-model="passwordDraft"
                 @keydown.enter="submitSetup()" />
        </label>
        <label>
          <span x-text="t('web.auth.password_repeat_label')"></span>
          <input type="password" autocomplete="new-password" x-model="passwordRepeatDraft"
                 @keydown.enter="submitSetup()" />
        </label>
        <p class="hint" x-text="t('web.auth.password_hint')"></p>
        <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>
        <button class="primary" :disabled="authBusy" @click="submitSetup()"
                x-text="t('web.auth.setup_submit')"></button>
      </main>
    </template>

    <template x-if="stringsReady && authReady && !authenticated && passwordSet">
      <main class="auth-screen">
        <h1>loxmatter</h1>
        <label>
          <span x-text="t('web.auth.password_label')"></span>
          <input type="password" autocomplete="current-password" x-model="passwordDraft"
                 @keydown.enter="submitLogin()" />
        </label>
        <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>
        <button class="primary" :disabled="authBusy" @click="submitLogin()"
                x-text="t('web.auth.login_submit')"></button>
      </main>
    </template>

    <!-- `x-if` haengt an genau EIN Kindelement - deshalb dieser leere `<div>`
         um Kopfzeile, Banner, Reiter und Hauptbereich, statt vier Geschwister
         direkt ins `<template>` zu haengen (das liesse Alpine nur das erste
         davon beachten). -->
    <template x-if="stringsReady && authenticated">
    <div>
    <header class="app-header">
      <h1>loxmatter</h1>
      <div class="header-right">
        <!--
          Zugang: seit dem WebUI-Login gibt es hier kein Token-Feld mehr,
          sondern nur den Weg hinaus. Der Weg hinein sind die beiden
          Bildschirme unter dieser Kopfzeile.
        -->
        <button class="logout" x-show="authenticated" x-cloak @click="logout()"
                x-text="t('web.header.logout')"></button>
        <div class="connection-status">
          <span class="dot" :class="socketConnected ? 'online' : 'offline'"></span>
          <span x-text="connectionStatusText()"></span>
          <!--
            Das Lebenszeichen (2026-09-03). Die Bruecke schickt alle 30 s
            einen Heartbeat, auch wenn sich an keinem Geraet etwas aendert.
            Ohne diese Anzeige war eine ruhige Anlage - eine Steckdose ohne
            Last meldet weder Strom noch Leistung - von einer abgestuerzten
            nicht zu unterscheiden.
          -->
          <span class="heartbeat" x-show="lastHeartbeatAt" x-cloak>
            <span x-text="t('web.header.heartbeat_prefix')"></span> <span x-text="heartbeatText()"></span>
          </span>
        </div>
      </div>
    </header>

    <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>

    <div class="banner danger" x-show="!socketConnected && socketEverConnected" x-cloak
         x-text="t('web.connection.lost_banner')">
    </div>

    <nav class="tabs">
      <button :class="{ active: view === 'devices' }" @click="selectView('devices')" x-text="t('web.nav.devices')"></button>
      <button :class="{ active: view === 'signals' }" @click="selectView('signals')" x-text="t('web.nav.signals')"></button>
      <button :class="{ active: view === 'export' }" @click="selectView('export')" x-text="t('web.nav.export')"></button>
      <button :class="{ active: view === 'system' }" @click="selectView('system')" x-text="t('web.nav.system')"></button>
      <button :class="{ active: view === 'settings' }" @click="selectView('settings')" x-text="t('web.nav.settings')"></button>
    </nav>

    <main>
      <!-- ================================================================
           Ansicht 1: Geräte
           ================================================================ -->
      <section x-show="view === 'devices'">
        <div class="card">
          <h2 x-text="t('web.devices.commission_heading')"></h2>
          <div class="row">
            <input
              type="text"
              x-model="commissionCode"
              :placeholder="t('web.devices.code_placeholder')"
            />
            <input
              type="text"
              x-model="commissionThreadDataset"
              :placeholder="t('web.devices.thread_dataset_placeholder')"
            />
            <button
              class="primary"
              @click="commissionDevice()"
              :disabled="commissionBusy"
              x-text="t('web.devices.commission_submit')"
            ></button>
          </div>
          <p class="hint" x-text="t('web.devices.commission_hint')"></p>
          <p
            x-show="commissionMessage"
            x-cloak
            :class="commissionMessageIsError ? 'banner danger' : 'banner ok'"
            x-text="commissionMessage"
          ></p>
        </div>

        <p x-show="devicesError" x-cloak class="banner danger" x-text="devicesError"></p>
        <p x-show="deviceActionError" x-cloak class="banner danger" x-text="deviceActionError"></p>

        <p
          x-show="devices.length === 0 && !devicesError"
          class="hint"
          x-text="t('web.devices.empty')"
        ></p>

        <template x-for="device in devices" :key="device.id">
          <div class="card device-card" :class="deviceCardClass(device)">
            <div class="row">
              <span class="type-badge">
                <svg class="icon"><use href="#i-device"></use></svg>
              </span>
              <input
                type="text"
                :value="device.label"
                @input="labelDrafts[device.id] = $event.target.value"
                @change="saveLabel(device)"
              />
              <span class="status-pill warn" x-show="isOnline(device) && changedSinceExport(device.id)">
                <svg class="icon"><use href="#i-warn"></use></svg>
                <span x-text="t('web.devices.changed_since_export')"></span>
              </span>
              <span class="status-pill off" x-show="!isOnline(device)">
                <svg class="icon"><use href="#i-offline"></use></svg>
                <span x-text="t('web.devices.offline')"></span>
              </span>
              <button
                class="danger"
                @click="removeDevice(device)"
                x-text="t('web.devices.remove')"
              ></button>
            </div>

            <div class="device-controls">
              <h3 x-text="t('web.devices.values_heading')"></h3>
              <p
                class="hint"
                x-show="!signalsByDevice[device.id]"
                x-text="t('web.devices.signals_loading')"
              ></p>
              <p
                class="hint"
                x-show="signalsByDevice[device.id] && firstSignalsFor(device.id).length === 0"
                x-text="t('web.devices.no_functional_signals')"
              ></p>
              <div class="value-chips" x-show="signalsByDevice[device.id]">
                <template x-for="signal in firstSignalsFor(device.id)" :key="signal.key">
                  <span class="value-chip">
                    <span x-text="signal.title"></span>
                    <!--
                      Die Altersangabe steht im `title`, nicht daneben
                      (2026-09-03): ein "vor 7 s", das jede Sekunde seine
                      Breite aendert, schiebt die Zeile hin und her und zieht
                      den Blick auf die Bewegung statt auf die Aenderung. Die
                      Aenderung selbst zeigt jetzt `value-fresh`.
                    -->
                    <span
                      class="value"
                      :class="{ 'value-fresh': signalIsFresh(signal) }"
                      :title="signalAgeTitle(signal)"
                      x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                    ></span>
                  </span>
                </template>
              </div>
              <p class="hint" x-show="remainingSignalCount(device.id) > 0">
                <span x-text="remainingSignalCount(device.id)"></span>
                <span x-text="t('web.devices.more_in_signals_view')"></span>
              </p>
            </div>

            <div class="device-controls">
              <h3 x-text="t('web.devices.controls_heading')"></h3>
              <p
                class="hint"
                x-show="!controlsLoaded(device.id)"
                x-text="t('web.devices.controls_loading')"
              ></p>
              <p
                class="hint"
                x-show="controlsLoaded(device.id) && commandsFor(device.id).length === 0"
                x-text="t('web.devices.no_known_commands')"
              ></p>
              <div class="row">
                <template x-for="command in commandsFor(device.id)" :key="command.key">
                  <span class="row">
                    <button
                      x-show="!command.takes_value"
                      @click="executeCommand(device, command)"
                      :disabled="commandBusyKey === command.key || !isOnline(device)"
                      x-text="command.slug"
                    ></button>
                    <span x-show="command.takes_value" class="row">
                      <span x-text="command.slug"></span>
                      <input
                        type="number"
                        style="width: 5.5rem"
                        :placeholder="t('web.devices.value_placeholder')"
                        @input="commandValueDrafts[command.key] = $event.target.value"
                      />
                      <button
                        @click="executeCommand(device, command)"
                        :disabled="commandBusyKey === command.key || !isOnline(device)"
                        x-text="t('web.devices.send')"
                      ></button>
                    </span>
                  </span>
                </template>
              </div>
              <p class="hint" x-show="hiddenRawCommandsFor(device.id) > 0">
                <span x-text="hiddenRawCommandsFor(device.id)"></span>
                <span x-text="t('web.devices.more_commands_unnamed')"></span>
              </p>
            </div>

            <div class="device-controls">
              <div class="row">
                <span class="hint" x-text="exportHintFor(device.id)"></span>
                <span style="flex: 1 1 auto"></span>
                <button
                  class="primary"
                  @click="exportDevice(device)"
                  :disabled="!bridgeSettings.bridge_ip"
                  x-text="t('web.devices.export')"
                ></button>
              </div>
              <p class="hint" x-show="!bridgeSettings.bridge_ip" x-cloak>
                <span x-text="t('web.devices.export_hint_prefix')"></span>
                <a
                  href="#"
                  @click.prevent="selectView('settings')"
                  x-text="t('web.settings.miniserver_link')"
                ></a>
                <span x-text="t('web.devices.export_hint_suffix')"></span>
              </p>
            </div>
          </div>
        </template>
      </section>

      <!-- ================================================================
           Ansicht 2: Signale
           ================================================================ -->
      <section x-show="view === 'signals'" x-cloak>
        <p x-show="signalsError" x-cloak class="banner danger" x-text="signalsError"></p>
        <p class="hint" x-text="t('web.signals.key_hint')"></p>
        <p class="hint" x-text="t('web.signals.functional_vs_expert_explanation')"></p>
        <label class="row signal-group-toggle">
          <input type="checkbox" x-model="showExpertSignals" />
          <span x-text="t('web.signals.show_expert')"></span>
        </label>

        <template x-for="device in devices" :key="'signals-' + device.id">
          <div class="card">
            <h2 x-text="device.label"></h2>
            <button
              x-show="!signalsByDevice[device.id]"
              @click="loadSignals(device.id)"
              x-text="t('web.signals.load_button')"
            ></button>

            <!--
              Beide Bloecke (Funktional, Experte) teilen sich seit Review-
              Fix 6 (Nachbesserung Phase 6) diese eine Signalzeilen-Vorlage
              statt zweier byte-identischer Kopien, die nur gegen
              `functionalSignalsFor` bzw. `expertSignalsFor` liefen -
              `signalGroupsFor` (app.js) liefert dafuer beide Gruppen mit
              ihren Metadaten (Titel, Anzahl, ob zuklappbar).
            -->
            <template x-if="signalsByDevice[device.id]">
              <div>
                <template x-for="group in signalGroupsFor(device.id)" :key="group.key">
                  <div>
                    <h3>
                      <span x-text="group.title"></span>
                      <span
                        class="muted"
                        x-show="group.collapsible"
                        x-text="'(' + group.signals.length + ')'"
                      ></span>
                    </h3>
                    <p
                      class="hint"
                      x-show="!group.collapsible && group.signals.length === 0"
                      x-text="t('web.signals.none_functional')"
                    ></p>
                    <p
                      class="hint"
                      x-show="group.collapsible && !showExpertSignals"
                      x-text="t('web.signals.expert_collapsed_hint', { count: group.signals.length })"
                    ></p>
                    <div x-show="!group.collapsible || showExpertSignals" x-cloak>
                      <template x-for="signal in group.signals" :key="signal.key">
                        <div class="device-controls">
                          <div class="row">
                            <span
                              class="key"
                              :title="t('web.signals.key_tooltip')"
                              x-text="signal.key"
                            ></span>
                            <input
                              type="text"
                              :value="signal.title"
                              @input="titleDrafts[signal.key] = $event.target.value"
                              @change="saveTitle(signal)"
                            />
                            <span class="hint" x-text="signal.path"></span>
                            <!--
                              Wann der Wert zuletzt kam, steht im `title` -
                              nicht daneben im Textfluss (2026-09-03). Eine
                              Angabe wie "vor 7 s" aendert jede Sekunde ihre
                              Breite und schiebt damit die ganze Zeile; der
                              Blick folgt dann der Bewegung statt der
                              Aenderung. Die zeigt jetzt `value-fresh`: der
                              Wert leuchtet kurz auf und verblasst wieder,
                              ohne dass sich am Aufbau etwas bewegt.
                            -->
                            <span
                              class="value"
                              :class="{ 'value-fresh': signalIsFresh(signal) }"
                              :title="signalAgeTitle(signal)"
                              x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                            ></span>
                            <label x-show="signal.exportable">
                              <input
                                type="checkbox"
                                :checked="signal.exported"
                                @change="toggleExported(signal)"
                              />
                              <span x-text="t('web.signals.export_checkbox')"></span>
                            </label>
                            <label x-show="signal.exportable">
                              <input
                                type="checkbox"
                                :checked="signal.resend"
                                @change="toggleResend(signal)"
                              />
                              periodisch erneut senden
                            </label>
                            <span
                              class="badge warn"
                              x-show="!signal.exportable"
                              x-text="signal.reason"
                            ></span>
                          </div>
                          <div class="row" x-show="signal.kind === 'attribute'">
                            <input
                              type="text"
                              :placeholder="t('web.signals.raw_write_placeholder')"
                              @input="rawWriteDrafts[signal.key] = $event.target.value"
                            />
                            <button
                              @click="writeRaw(signal)"
                              :disabled="rawWriteBusyKey === signal.key"
                              x-text="t('web.signals.raw_write_submit')"
                            ></button>
                            <span
                              x-show="rawWriteMessages[signal.key]"
                              :class="rawWriteMessageClass(signal)"
                              x-text="rawWriteMessages[signal.key] ? rawWriteMessages[signal.key].text : ''"
                            ></span>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </section>

      <!-- ================================================================
           Ansicht 3: Export
           ================================================================ -->
      <section x-show="view === 'export'" x-cloak>
        <!--
          Projektdatei-Sync (Aufgabe 12, urspruenglich unten in "System" -
          auf Nutzerwunsch als oberster Punkt hierher verschoben, weil das
          der kuenftig primaere Weg werden soll statt der Vorlagen-ZIPs
          darunter): bestehende Loxone-Projektdatei hochladen, Plan
          ansehen, gepatchte Datei herunterladen - erst NACHDEM der Plan
          zu sehen war (Entwurf: kein Download vor dem Plan). Beide
          gepatchten Fassungen kommen bereits in der Upload-Antwort mit
          (siehe `downloadPatchedProject` in app.js), der Haken unten
          waehlt nur zwischen ihnen, ohne einen zweiten Aufruf an die
          Bruecke.
        -->
        <div class="card">
          <h2>Projektdatei-Sync</h2>
          <p class="hint">
            Bestehende Loxone-Projektdatei hochladen – vorhandene virtuelle Ein-/Ausgänge werden
            aktualisiert, neue Signale ergänzt. Nichts wird heruntergeladen, bevor du den Plan
            gesehen hast.
          </p>
          <p class="hint" x-show="!bridgeSettings.bridge_ip" x-cloak>
            Bitte zuerst in
            <a href="#" @click.prevent="selectView('settings')">Einstellungen → Verbindung zum Miniserver</a>
            die Brücken-IP hinterlegen.
          </p>
          <div class="row">
            <label
              >Projektdatei (.Loxone)
              <input
                type="file"
                accept=".Loxone,.xml"
                @change="uploadProjectFile($event)"
                :disabled="projectSync.busy"
            /></label>
          </div>
          <p x-show="projectSync.busy" x-cloak class="hint">Wird verarbeitet …</p>
          <p x-show="projectSync.error" x-cloak class="banner danger" x-text="projectSync.error"></p>

          <!--
            Nutzerwunsch nach dem Review: bei mehreren Miniservern in der
            Datei ein Auswahlfeld statt eines Textfelds fuer die IP. Die
            Datei liegt bereits im Speicher des Browsers (`projectSync.file`,
            gesetzt in `uploadProjectFile`) - die Auswahl loest `confirm
            ProjectSyncMiniserver` aus, das dieselbe Datei ein zweites Mal
            mit der gewaehlten IP hochlaedt, ganz ohne erneuten Datei-Dialog.
          -->
          <div class="row" x-show="projectSync.needsMiniserverSelection" x-cloak>
            <label
              >Miniserver
              <select
                x-model="projectSync.selectedMiniserverIp"
                @change="confirmProjectSyncMiniserver()"
                :disabled="projectSync.busy"
              >
                <option value="" disabled>Bitte wählen …</option>
                <template
                  x-for="ms in projectSync.availableMiniservers"
                  :key="ms.int_addr"
                >
                  <option :value="ms.int_addr" x-text="`${ms.title} (${ms.int_addr})`"></option>
                </template>
              </select>
            </label>
          </div>
          <p class="hint" x-show="projectSync.needsMiniserverSelection" x-cloak>
            Diese Projektdatei enthält mehrere Miniserver – bitte den gewünschten auswählen.
          </p>

          <template x-if="projectSync.plan">
            <div>
              <!--
                Review-Fix Important #5: die Tabelle haengt jetzt an
                `has_changes || projectSyncHasInformationalEntries(...)`,
                nicht mehr nur an `has_changes` - sonst blieben
                `orphaned`/`conflict`-Eintraege unsichtbar, obwohl
                `has_changes` sie absichtlich nicht mitzaehlt (siehe
                `SyncPlan.has_changes` in `diff.py`). Die Bedingung ist
                bewusst das logische Gegenteil der "Alles aktuell"-Meldung
                darunter, damit genau eine der beiden sichtbar ist: die
                Meldung zeigt sich nur noch, wenn wirklich gar nichts zu
                berichten ist: keine Aenderung UND keine informativen
                Eintraege.
              -->
              <p
                x-show="!projectSync.plan.has_changes && !projectSyncHasInformationalEntries(projectSync.plan.entries)"
                class="hint"
              >
                Alles aktuell – keine Änderungen nötig.
              </p>
              <!--
                Ueberarbeitet nach Nutzerwunsch ("schneller und sauberer
                Ueberblick"): eine Gesamt-Uebersicht ganz oben, darunter je
                Geraet eine aufklappbare Karte (`<details>`, nativ zugaenglich
                per Tastatur/Screenreader, ganz ohne eigenes JS fuer aus-/
                einklappen) statt einer langen flachen Tabelle. Karten mit
                Aenderungen stehen von Anfang an offen, laengst unveraenderte
                Geraete bleiben zu - bei einer echten, gewachsenen Datei mit
                Dutzenden Signalen sonst zu viel auf einmal.

                `projectSyncGroupedEntries` (app.js) gruppiert den vom
                Backend gelieferten flachen Plan rein clientseitig nach
                Geraet und dort nach Eingaengen/Ausgaengen, kein
                Backend-Vertrag geaendert.
              -->
              <div
                class="projectsync-plan"
                x-show="projectSync.plan.has_changes || projectSyncHasInformationalEntries(projectSync.plan.entries)"
              >
                <div class="projectsync-summary" x-data="{ counts: projectSyncOverallCounts(projectSync.plan.entries) }">
                  <span class="projectsync-tally-item is-new" x-show="counts.new > 0">
                    <span class="dot is-new"></span>
                    <strong x-text="counts.new"></strong>&nbsp;neu
                  </span>
                  <span class="projectsync-tally-item is-updated" x-show="counts.updated > 0">
                    <span class="dot is-updated"></span>
                    <strong x-text="counts.updated"></strong>&nbsp;aktualisiert
                  </span>
                  <span class="projectsync-tally-item is-orphaned" x-show="counts.orphaned > 0">
                    <span class="dot is-orphaned"></span>
                    <strong x-text="counts.orphaned"></strong>&nbsp;verwaist
                  </span>
                  <span class="projectsync-tally-item is-conflict" x-show="counts.conflict > 0">
                    <span class="dot is-conflict"></span>
                    <strong x-text="counts.conflict"></strong>&nbsp;Konflikt
                  </span>
                  <span class="projectsync-tally-item is-unchanged" x-show="counts.unchanged > 0">
                    <span class="dot is-unchanged"></span>
                    <strong x-text="counts.unchanged"></strong>&nbsp;unverändert
                  </span>
                </div>

                <template
                  x-for="group in projectSyncGroupedEntries(projectSync.plan.entries)"
                  :key="group.deviceId"
                >
                  <details class="projectsync-device" :open="group.needsAttention">
                    <summary>
                      <span x-text="group.deviceLabel"></span>
                      <span class="projectsync-tally">
                        <span class="projectsync-tally-item is-new" x-show="group.counts.new > 0">
                          <span class="dot is-new"></span>
                          <span x-text="group.counts.new"></span>
                        </span>
                        <span class="projectsync-tally-item is-updated" x-show="group.counts.updated > 0">
                          <span class="dot is-updated"></span>
                          <span x-text="group.counts.updated"></span>
                        </span>
                        <span class="projectsync-tally-item is-orphaned" x-show="group.counts.orphaned > 0">
                          <span class="dot is-orphaned"></span>
                          <span x-text="group.counts.orphaned"></span>
                        </span>
                        <span class="projectsync-tally-item is-conflict" x-show="group.counts.conflict > 0">
                          <span class="dot is-conflict"></span>
                          <span x-text="group.counts.conflict"></span>
                        </span>
                        <span class="projectsync-tally-item is-unchanged" x-show="!group.needsAttention">
                          alles aktuell
                        </span>
                      </span>
                      <svg class="icon chevron"><use href="#i-chevron"></use></svg>
                    </summary>
                    <div class="projectsync-device-body">
                      <template x-for="section in group.sections" :key="section.label">
                        <div
                          class="projectsync-io-group"
                          x-show="section.attention.length + section.unchanged.length > 0"
                        >
                          <div class="projectsync-io-label" x-text="section.label"></div>

                          <template x-for="entry in section.attention" :key="entry.kind + entry.key">
                            <div class="projectsync-entry" :class="'is-' + projectSyncStatusBucket(entry.status)">
                              <div class="projectsync-entry-head">
                                <span class="projectsync-entry-title" x-text="entry.title"></span>
                                <span
                                  class="badge"
                                  :class="projectSyncStatusBadgeClass(entry.status)"
                                  x-text="projectSyncStatusLabel(entry.status)"
                                ></span>
                              </div>
                              <p
                                class="hint projectsync-entry-note"
                                x-show="projectSyncEntryNote(entry)"
                                x-text="projectSyncEntryNote(entry)"
                              ></p>
                              <!-- Review-Fix Important #6: die vom Backend mitgelieferte
                                   Attribut-Differenz (`entry.changes`, nur bei
                                   `status === "updated"` befuellt) - jetzt als Liste mit
                                   getrennt gestyltem Alt-/Neu-Wert statt Fliesstext. -->
                              <ul class="projectsync-diff" x-show="entry.status === 'updated'">
                                <template x-for="change in projectSyncChangeList(entry)" :key="change.label">
                                  <li>
                                    <span class="projectsync-diff-label" x-text="change.label"></span>
                                    <span class="projectsync-diff-old" x-text="change.oldValue"></span>
                                    <span class="projectsync-diff-arrow">→</span>
                                    <span class="projectsync-diff-new" x-text="change.newValue"></span>
                                  </li>
                                </template>
                              </ul>
                            </div>
                          </template>

                          <!-- Unveraenderte Signale: bewusst eingeklappt und ohne
                               Status-Badge je Zeile - sie stimmen bereits, sollen den
                               Blick auf das Neue/Geaenderte oben nicht verstellen
                               (Nutzerwunsch: "schneller und sauberer Ueberblick"). -->
                          <details class="projectsync-unchanged-disclosure" x-show="section.unchanged.length > 0">
                            <summary>
                              <span x-text="section.unchanged.length"></span>
                              unveränderte Signale anzeigen
                            </summary>
                            <div class="projectsync-unchanged-chips">
                              <template x-for="entry in section.unchanged" :key="entry.kind + entry.key">
                                <span class="value-chip" x-text="entry.title"></span>
                              </template>
                            </div>
                          </details>
                        </div>
                      </template>
                    </div>
                  </details>
                </template>
              </div>
              <!--
                Review-Fix Important #4: `patched_with_new_devices_base64`
                ist jetzt `null`, wenn die hochgeladene Datei keinen
                `VirtualInCaption`/`VirtualOutCaption`-Abschnitt fuer einen
                neuen Geraete-Container hat - der Haken wird dann deaktiviert,
                statt einen stillen/leeren Download zuzulassen.
              -->
              <p
                x-show="projectSync.plan.new_devices_unavailable_reason"
                x-cloak
                class="banner warn"
                x-text="projectSync.plan.new_devices_unavailable_reason"
              ></p>
              <div class="row">
                <label>
                  <input
                    type="checkbox"
                    x-model="projectSync.includeNewDevices"
                    :disabled="!!projectSync.plan.new_devices_unavailable_reason"
                  />
                  Neue Geräte-Container ebenfalls anlegen (experimentell, noch nicht gegen Loxone
                  Config validiert)
                </label>
              </div>
              <button class="primary" @click="downloadPatchedProject()">
                Gepatchte Datei herunterladen
              </button>
            </div>
          </template>
        </div>

        <div class="card">
          <h2 x-text="t('web.export.heading')"></h2>
          <div class="row">
            <label
              ><span x-text="t('web.bridge_ip_label')"></span>
              <input type="text" :value="bridgeSettings.bridge_ip || ''" readonly
            /></label>
            <label
              ><span x-text="t('web.export.udp_port_label')"></span>
              <input type="number" :value="bridgeSettings.udp_port" readonly
            /></label>
            <label>
              <span x-text="t('web.export.http_port_label')"></span>
              <input type="number" :value="bridgeSettings.listen_port" readonly />
            </label>
          </div>
          <p class="hint">
            <span x-text="t('web.export.settings_hint_prefix')"></span>
            <a
              href="#"
              @click.prevent="selectView('settings')"
              x-text="t('web.settings.miniserver_link')"
            ></a>
            <span x-text="t('web.export.settings_hint_suffix')"></span>
          </p>
          <div class="row">
            <label
              ><input type="checkbox" x-model="exportIncludeSystem" />
              <span x-text="t('web.export.include_system')"></span
            ></label>
            <label
              ><input type="checkbox" x-model="exportOnlyPending" />
              <span x-text="t('web.export.only_pending')"></span
            ></label>
          </div>
          <p class="hint" x-html="t('web.export.filter_explanation')"></p>
          <div class="row">
            <button
              class="primary"
              @click="previewExport()"
              :disabled="exportBusy"
              x-text="t('web.export.preview_button')"
            ></button>
            <!--
              Ein `<a href>` wuerde eine Fehlerantwort (401 nach abgelaufener
              Sitzung, 422 bei leerem Pflichtfeld) als rohen Text anzeigen
              statt in der Oberflaeche - deshalb ein Knopf, der die Datei
              ueber `fetch()` holt (siehe `downloadExport` in app.js).
            -->
            <button
              class="primary"
              @click="downloadExport()"
              x-text="t('web.export.download_button')"
            ></button>
          </div>
          <p x-show="exportError" x-cloak class="banner danger" x-text="exportError"></p>
        </div>

        <div class="card" x-show="exportPreview" x-cloak>
          <h2 x-text="t('web.export.preview_heading')"></h2>
          <div style="overflow-x: auto">
            <table>
              <thead>
                <tr>
                  <th x-text="t('web.export.col_device')"></th>
                  <th x-text="t('web.export.col_viu')"></th>
                  <th x-text="t('web.export.col_vo')"></th>
                  <th x-text="t('web.export.col_inputs')"></th>
                  <th x-text="t('web.export.col_commands')"></th>
                  <th x-text="t('web.export.col_skipped')"></th>
                  <th x-text="t('web.export.col_expert_withheld')"></th>
                  <th x-text="t('web.export.col_last_exported')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="device in previewDevices()" :key="device.device_id">
                  <tr>
                    <td x-text="device.label"></td>
                    <td class="key" x-text="device.viu_filename"></td>
                    <td class="key" x-text="device.vo_filename"></td>
                    <td x-text="device.inputs"></td>
                    <td x-text="device.commands"></td>
                    <td x-text="device.skipped"></td>
                    <td x-text="device.hidden_count"></td>
                    <td x-text="formatTimestamp(exportedAtFor(device.device_id))"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p class="hint" x-text="t('web.export.expert_withheld_explanation')"></p>
          <p class="hint" x-show="exportPreview && exportPreview.system_files.length > 0">
            <span x-text="t('web.export.system_files_prefix')"></span><span x-text="exportPreview ? exportPreview.system_files.join(', ') : ''"></span>
          </p>
        </div>
      </section>

      <!-- ================================================================
           Ansicht 4: System
           ================================================================ -->
      <section x-show="view === 'system'" x-cloak>
        <div class="card">
          <div class="row">
            <h2 style="margin: 0" x-text="t('web.system.checks_heading')"></h2>
            <button @click="loadSystem()" :disabled="diagnosticsBusy" x-text="t('web.system.refresh')"></button>
          </div>
          <p x-show="systemError" x-cloak class="banner danger" x-text="systemError"></p>
          <ul class="system-check-list">
            <template x-for="check in systemChecks" :key="check.name">
              <li>
                <span
                  class="badge"
                  :class="check.ok ? 'ok' : 'danger'"
                  x-text="check.ok ? t('web.system.check_ok') : t('web.system.check_error')"
                ></span>
                <strong x-text="check.name"></strong>
                <span x-text="check.detail"></span>
              </li>
            </template>
          </ul>
        </div>

        <!--
          Live-Diagnose (Aufgabe 6, Spec 10.5): EIN WebSocket
          (`/api/diagnostics/live`, geoeffnet/geschlossen in `selectView`,
          app.js) fuellt die drei Straeme darunter laufend statt wie bisher
          einmalig per GET. Diese eine Karte traegt die vier Bedienelemente
          fuer alle drei Bereiche - kein eigenes Set je Bereich, es gibt nur
          eine Verbindung und einen Pausenzustand fuer alle drei.
        -->
        <div class="card">
          <div class="row">
            <h2 style="margin: 0" x-text="t('web.system.live_heading')"></h2>
            <span class="connection-status">
              <span class="dot" :class="diagnosticsConnected ? 'online' : 'offline'"></span>
              <span
                x-text="diagnosticsConnected ? t('web.connection.live') : t('web.system.diag_disconnected')"
              ></span>
            </span>
          </div>
          <div class="row">
            <button
              @click="diagnosticsPaused = !diagnosticsPaused"
              x-text="diagnosticsPaused ? t('web.system.resume') : t('web.system.pause')"
            ></button>
            <label>
              <input type="checkbox" x-model="hideNoise" />
              <span x-text="t('web.system.hide_noise')"></span>
            </label>
            <label>
              <!--
                Kein "Debug" hier (Nachbesserung Task 7, Fix 3f): der Ring
                haengt serverseitig auf INFO (`install_log_buffer()` setzt
                sowohl Handler- als auch Loggerstufe, siehe cli.py), DEBUG-
                Zeilen kommen also nie an. Eine Option, die nie etwas
                anderes zeigt als "Info", waere ein leeres Versprechen -
                siehe Entwurf, Abschnitt 7, Punkt 2, fuer den (bislang
                fehlenden) DEBUG-Schalter, der das aendern wuerde.
              -->
              <span x-text="t('web.system.log_level_label')"></span>
              <select x-model="logLevel">
                <option value="INFO" x-text="t('web.system.log_level_info')"></option>
                <option value="WARNING" x-text="t('web.system.log_level_warn')"></option>
                <option value="ERROR" x-text="t('web.system.check_error')"></option>
                <option value="CRITICAL" x-text="t('web.system.log_level_critical')"></option>
              </select>
            </label>
            <button @click="clearDiagnosticsBuffers()" x-text="t('web.system.clear')"></button>
          </div>
          <p class="hint" x-html="t('web.system.pause_clear_explanation')"></p>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.logs_heading')"></h2>
          <p class="hint" x-text="t('web.system.logs_hint')"></p>
          <div class="log-list" x-ref="diagnosticsLogsList">
            <template x-for="(entry, index) in visibleDiagnosticsLogs()" :key="index">
              <div
                class="entry"
                x-text="entry.timestamp + '  [' + entry.level + '] ' + entry.logger + ': ' + entry.message"
              ></div>
            </template>
          </div>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.udp_heading')"></h2>
          <p class="hint" x-text="t('web.system.udp_hint')"></p>
          <div class="log-list" x-ref="datagramsList">
            <template x-for="(entry, index) in visibleDatagrams()" :key="index">
              <div
                class="entry"
                x-text="entry.timestamp + '  ' + entry.key + ' = ' + entry.value"
              ></div>
            </template>
          </div>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.command_log_heading')"></h2>
          <p class="hint" x-text="t('web.system.command_log_hint')"></p>
          <div class="log-list">
            <template x-for="(entry, index) in commandLog" :key="index">
              <div
                class="entry"
                x-text="entry.timestamp + '  ' + entry.method + ' ' + entry.path + ' -> ' + entry.status"
              ></div>
            </template>
          </div>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.backup_heading')"></h2>
          <p class="hint" x-text="t('web.system.backup_explanation')"></p>
          <p class="hint" x-text="t('web.system.backup_access_note')"></p>
          <button @click="downloadFabricBackup()" x-text="t('web.system.backup_download')"></button>
          <p x-show="backupError" x-cloak class="banner danger" x-text="backupError"></p>
        </div>
      </section>

      <!-- ================================================================
           Ansicht 5: Einstellungen
           ================================================================ -->
      <section x-show="view === 'settings'" x-cloak>
        <div class="card">
          <h2 x-text="t('web.settings.connection_heading')"></h2>
          <p class="hint" x-html="t('web.settings.connection_explanation')"></p>
          <div class="row">
            <label
              ><span x-text="t('web.bridge_ip_label')"></span>
              <input
                type="text"
                x-model="settingsDraft.bridge_ip"
                :placeholder="t('web.settings.bridge_ip_placeholder')"
            /></label>
            <label
              ><span x-text="t('web.settings.udp_port_label')"></span>
              <input type="number" x-model.number="settingsDraft.udp_port" />
            </label>
            <label>
              <span x-text="t('web.settings.http_port_label')"></span>
              <input type="number" x-model.number="settingsDraft.listen_port" />
            </label>
          </div>
          <div class="row">
            <button
              class="primary"
              @click="saveSettings()"
              :disabled="settingsBusy"
              x-text="t('web.settings.save')"
            ></button>
            <span class="hint" x-show="bridgeSettings.saved_at" x-cloak
              ><span x-text="t('web.settings.last_saved_prefix')"></span
              ><span x-text="formatTimestamp(bridgeSettings.saved_at)"></span
            ></span>
            <span
              class="hint"
              x-show="!bridgeSettings.saved_at"
              x-cloak
              x-text="t('web.settings.never_saved')"
            ></span>
          </div>
          <p x-show="settingsError" x-cloak class="banner danger" x-text="settingsError"></p>
        </div>

        <div class="card">
          <h2 x-text="t('web.settings.language_heading')"></h2>
          <nav class="tabs">
            <button
              :class="{ active: language === 'en' }"
              @click="setLanguage('en')"
              :disabled="settingsBusy"
              x-text="t('web.settings.language_en')"
            ></button>
            <button
              :class="{ active: language === 'de' }"
              @click="setLanguage('de')"
              :disabled="settingsBusy"
              x-text="t('web.settings.language_de')"
            ></button>
          </nav>
          <p x-show="settingsError" x-cloak class="banner danger" x-text="settingsError"></p>
        </div>

        <div class="card">
          <h2>Periodischer Resend</h2>
          <p class="hint">
            Markierte Signale (Haken „periodisch erneut senden" in der Signalliste) werden in
            diesem Takt zwangsweise erneut gesendet, auch ohne Änderung - unabhängig davon
            läuft ein voller Restore weiterhin einmalig beim Bridge-Start und über
            „Erneut synchronisieren" im Bereich Diagnose.
          </p>
          <div class="row">
            <label
              >Intervall in Sekunden
              <input type="number" min="10" x-model.number="resendIntervalDraft" />
            </label>
            <button class="primary" @click="saveResendInterval()" :disabled="resendIntervalBusy">
              Speichern
            </button>
          </div>
          <p x-show="resendIntervalError" x-cloak class="banner danger" x-text="resendIntervalError"></p>
        </div>
      </section>
    </main>
    </div>
    </template>

    <!--
      Kurzmeldungen als Overlay. `position: fixed` heisst: sie stehen
      ausserhalb des Textflusses und verschieben nichts. Die vorherige
      Fassung blendete eine Zeile ueber der Geraeteliste ein, wodurch beim
      Schalten die ganze Seite sprang und der naechste Klick daneben ging.
    -->
    <div class="toasts" aria-live="polite">
      <template x-for="toast in toasts" :key="toast.id">
        <div
          class="toast"
          :class="toast.isError ? 'toast-error' : 'toast-ok'"
          @click="dismissToast(toast.id)"
          :title="t('web.header.toast_dismiss_tooltip')"
          x-text="toast.text"
        ></div>
      </template>
    </div>

    <script defer src="/static/app.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </body>
</html>
