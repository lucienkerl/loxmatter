name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh is run via `curl | sh` on other people's machines - a
      # quoting mistake in it is more expensive than in any other script here.
      - run: shellcheck -s sh install.sh
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The project is English-only. Without this step the rule holds only
      # until the next feature branch - see
      # docs/superpowers/specs/2026-09-07-english-only-translation-design.md
      - run: uv run python scripts/check_language.py
      - run: uv run pytest -v

  # Release gate (design "Thread setup that needs no handwork",
  # 2026-09-14, section 3.3): a version tag must never point
  # deploy/testhost/docker-compose.yml at an otbr image nobody built - that
  # image is built by its own workflow (otbr-image.yml), on its own
  # schedule, not by this one. `needs: test` before this job is unnecessary
  # (it does nothing on a plain push to main, and the image jobs below
  # already depend on `test` themselves) but the check itself must run
  # before ANY image is pushed under a tag - see `image` and
  # `updater-image`'s own `needs`/`if` below, which is how they wait on it
  # without being skipped when it doesn't apply.
  otbr-image-check:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The otbr image compose defaults to must already exist
        run: |
          set -eu
          # Read straight out of the compose file rather than
          # deploy/otbr/source.env, deliberately: this checks what a
          # release actually deploys, which is only correct if the two
          # agree - a test already pins that agreement
          # (tests/test_otbr_image.py) but this step must survive the
          # rare case where they drift anyway. Kept as shell, not Python -
          # a release must not depend on `uv sync` having already run.
          image="$(sed -n -E 's/.*image: \$\{OTBR_IMAGE:-([^}]+)\}.*/\1/p' deploy/testhost/docker-compose.yml)"
          [ -n "$image" ] || { echo "No otbr image default found in deploy/testhost/docker-compose.yml"; exit 1; }
          docker buildx imagetools inspect "$image" >/dev/null

  # Builds and publishes the image (draft "Deploy updates via the UI",
  # 2026-09-08, section 5). `needs: test` is
  # not cosmetic: an image that failed the test suite must not
  # be put under a tag that someone can deploy.
  image:
    needs: [test, otbr-image-check]
    # otbr-image-check only runs on a tag push (see its own `if:` above);
    # on a plain push to main it is skipped, and a skipped job is neither
    # success() nor failure() - accepting "skipped" here as well as
    # "success" is what lets this job still run on main instead of being
    # skipped right along with it.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.otbr-image-check.result == 'success' || needs.otbr-image-check.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -eu
          # The schema version has exactly one source: store.py. If the
          # grep fails, the build aborts instead of publishing an image with empty
          # LOXMATTER_SCHEMA_VERSION - the updater from
          # stage 2 couldn't do its pre-check and
          # would have to guess. tests/test_build_arguments.py checks the same
          # pattern so a refactoring in store.py doesn't only show up in CI
          # later.
          schema="$(sed -n -E 's/^_SCHEMA_VERSION = ([0-9]+)$/\1/p' src/loxmatter/model/store.py)"
          [ -n "$schema" ] || { echo "No _SCHEMA_VERSION found in store.py"; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            *)            version="dev" ;;
          esac
          {
            echo "schema=$schema"
            echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - id: tags
        # version comes from a Git tag (refs/tags/v...), and
        # `git check-ref-format` allows backticks, $(...) and
        # quotes in it. If the value were directly in the
        # run script via ${{ }}, a tag like "v1.0.0$(...)" would be executed as shell code
        # - in a job with packages: write. Via env:
        # it only arrives as a variable value, never as source code.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -eu
          image="ghcr.io/lucienkerl/loxmatter"
          if [ "$VERSION" = "dev" ]; then
            echo "list=$image:dev,$image:sha-$COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "list=$image:$VERSION,$image:stable" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            LOXMATTER_VERSION=${{ steps.meta.outputs.version }}
            LOXMATTER_COMMIT=${{ steps.meta.outputs.commit }}
            LOXMATTER_BUILT_AT=${{ steps.meta.outputs.built_at }}
            LOXMATTER_SCHEMA_VERSION=${{ steps.meta.outputs.schema }}

  # The sidecar. Its own job and its own image, because it must NOT be the
  # same image as the one it replaces: otherwise an update would replace
  # the process that is running it. It changes rarely - hence no :dev tag,
  # only on releases.
  updater-image:
    needs: [test, otbr-image-check]
    # otbr-image-check runs under the same tag condition this job already
    # has, so it is never actually skipped here the way it can be for
    # `image` above - the "skipped" branch is kept anyway, for the same
    # reason: a skipped `needs` job is neither success() nor failure(),
    # and this job's default `if` would otherwise be skipped right along
    # with it.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      (needs.otbr-image-check.result == 'success' || needs.otbr-image-check.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        # The version baked into THIS image (LOXMATTER_UPDATER_VERSION -
        # see deploy/updater/Dockerfile and update-once.sh). Review fix
        # ("the comparison and the path"): the web UI no longer DECIDES
        # whether to warn about a stale updater from this value - that
        # decision moved to an image-DIGEST comparison (see
        # update_check.resolve_updater_digest and update-once.sh's own
        # updater_digest()), because every release stamps a version number
        # here whether or not deploy/updater/ actually changed, which made
        # the old version-based comparison warn on every single release.
        # The stamp itself stays, deliberately: `updater_version` is still
        # what the warning's own TEXT says ("the updater is still on X,
        # this bridge on Y") once the digest comparison decides to show it
        # at all - dropping this step would leave that sentence with
        # nothing to say. It must still read the same way the bridge's own
        # does, or every comparison would first have to normalise one
        # side. The `image` job above strips the
        # leading "v" off the tag for exactly this value (its own `version`
        # output, `steps.meta.outputs.version` there); this job's `if:`
        # above already guarantees `github.ref` is `refs/tags/v...` (never
        # the "dev" fallback the other job also has to handle on a plain
        # push to main), so the strip alone is enough here.
        #
        # The image TAG itself (`ghcr.io/.../loxmatter-updater:${{
        # github.ref_name }}` below, i.e. "v0.3.3") is left as-is,
        # deliberately: it is a separate question from the version baked
        # INTO the image, nothing in this repository parses or compares
        # that tag (deploy/testhost/docker-compose.yml pins this service to
        # `:stable`, never to a version tag), and changing a published tag
        # scheme is a larger, riskier move than this fix calls for.
        run: |
          set -eu
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lucienkerl/loxmatter-updater:${{ github.ref_name }}
            ghcr.io/lucienkerl/loxmatter-updater:stable
          build-args: |
            LOXMATTER_UPDATER_VERSION=${{ steps.meta.outputs.version }}
