<!--
  loxmatter - commissioning and diagnostics tool for the Matter-Loxone
  bridge (Spec 8). Four views, switched via Alpine.js, with no page
  changes and no build step.

  Contains a vendored copy of Alpine.js, version 3.17.1 (MIT licence,
  (c) Caleb Porzio), obtained as the standalone, self-starting
  distribution (no module, no bundler needed) of the npm package "alpinejs"
  via jsDelivr (the public delivery network for npm packages) on
  2026-09-02, stored unchanged under web/vendor/alpine.min.js - SHA-256
  b30997fc126d808b1a9b20ab3f504ded88df957818c02d6249bba3ec114eb0ec.

  Deliberately NO network reference in this file: the bridge runs in
  installations without internet access, and a UI that waits there for
  a remote script stays blank.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loxmatter</title>
    <!-- A single SVG file instead of the usual set of PNGs: the browser
         scales it itself, and the bridge runs in installations without
         internet access - one fewer file that can go missing. The large
         version sits alongside as icon.svg (see the comments there). -->
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <!--
    There is deliberately NO `x-init="init()"` here (Review-Fix Fix 2,
    2026-09-03). Alpine 3 calls the `init()` method of a data object
    created with `x-data` exactly once on its own. An additional
    `x-init="init()"` calls it a second time - and `init()` starts the
    live WebSocket once a session is logged in. Every open tab then held
    TWO connections, of which only the most recently opened one is
    stored in `this.socket`. The other one still receives every value,
    occupies a queue plus two asyncio tasks and an observer in the
    backend, and stays invisible to the UI - it dies only when the tab
    does. Anyone tempted to add an `x-init` here: there is no reason to,
    `init()` already runs.
  -->
  <body x-data="app()">
    <!-- Icon symbols (device dashboard design, Section 3) - inline SVG
         instead of an icon library: no network reference, the same
         reasoning as for the vendored Alpine.js above in the header comment. -->
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M12 3.7 21 19.3H3L12 3.7z" />
        <path d="M12 9.6v4.3M12 16.9v.1" />
      </symbol>
      <symbol id="i-offline" viewBox="0 0 24 24">
        <path d="M2 8.3a15 15 0 0 1 6-3M16.2 5.4a15 15 0 0 1 5.8 2.9" />
        <path d="M5.5 12a10 10 0 0 1 5-2.6M13.7 9.4a10 10 0 0 1 4.8 2.6" />
        <path d="M9 15.6a5 5 0 0 1 3.5-1.4" />
        <circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </symbol>
      <!-- Disclosure arrow for the project-file-sync device cards
           (`.projectsync-device`, a native <details>) - replaces its
           browser-dependent default marker with the same stroke icon as
           the other symbols here. -->
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" />
      </symbol>
      <!-- Category icons (devices tab design, 2026-09-05, Section 6.5).
           One symbol per category, "Other" included - that is also where
           every device whose type has not yet been added ends up.
           Still inline and without an icon library, for the same
           reason as the checked-in vendor/alpine.min.js: the UI
           runs offline. -->
      <symbol id="i-cat-light" viewBox="0 0 24 24">
        <path d="M9 17.5a5.5 5.5 0 1 1 6 0V19H9v-1.5z" />
        <path d="M10 21.5h4" />
      </symbol>
      <symbol id="i-cat-socket" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M9.5 10v2.2M14.5 10v2.2" />
        <path d="M8.4 13.6a4 4 0 0 0 7.2 0" />
      </symbol>
      <symbol id="i-cat-switch" viewBox="0 0 24 24">
        <rect x="6" y="3.5" width="12" height="17" rx="3" />
        <circle cx="12" cy="9" r="1.8" />
      </symbol>
      <symbol id="i-cat-covering" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" />
        <path d="M4 9h16M4 13h16M4 17h16" />
      </symbol>
      <symbol id="i-cat-climate" viewBox="0 0 24 24">
        <path d="M10 13.2V5.5a2 2 0 1 1 4 0v7.7" />
        <circle cx="12" cy="16.5" r="3.2" />
      </symbol>
      <symbol id="i-cat-sensor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2.4" />
        <path d="M7.4 7.4a6.5 6.5 0 0 0 0 9.2M16.6 16.6a6.5 6.5 0 0 0 0-9.2" />
      </symbol>
      <symbol id="i-cat-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
        <path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7" />
      </symbol>
      <!-- EIGHT symbols, not seven: the tile maps the identifier straight
           onto `#i-cat-<identifier>`, and `other` is an identifier like any
           other. A `<use>` pointing at a nonexistent ID SILENTLY draws
           nothing - no error in the console, just a tile without an
           icon. That is why "Other" gets its own symbol, instead of
           relying on a special case in JavaScript that someone would
           overlook at the next rework. The shape is the same as the old,
           generic `#i-device` (Task 9 removed its definition, since
           `#i-cat-other` took over its role). -->
      <symbol id="i-cat-other" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <circle cx="12" cy="12" r="2.2" />
      </symbol>
      <!-- Finding 6 (review from 2026-09-05): the rename, export and
           remove buttons on the tile showed the raw characters
           "✎", "↓" and "🗑" instead of a symbol from this block - "🗑"
           renders as a coloured emoji on macOS/Windows, as a box
           elsewhere, and both deviations break the tiles' otherwise
           uniform copper/muted icon language. Same stroke technique
           as the category icons above: only paths, no fill except
           for the circle dots, `currentColor` picks up colour and
           state automatically from outside.

           Export and remove each had their own symbol here
           (`#i-export`, `#i-remove`); Task 2 (kebab menu, 2026-09-05) moved
           both actions from the footer into the menu and turned them into
           spelled-out text buttons - there is room there for a label
           instead of an icon. The two symbols have been dead ever since
           (no `<use>` refers to them any more) and were removed with the
           closing review from 2026-09-05; only rename remains
           an icon button. -->
      <symbol id="i-rename" viewBox="0 0 24 24">
        <path d="M14.5 5.5 18.5 9.5 8 20H4v-4L14.5 5.5z" />
        <path d="M12.7 7.3l4 4" />
      </symbol>
      <!-- Magnifying glass for the room bar's search field (search-field
           look design, 2026-09-06). Same stroke technique as the category icons:
           only paths, no fill, `currentColor` picks up colour and
           state from outside. -->
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M15.8 15.8 20.5 20.5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12" />
        <path d="M18 6L6 18" />
      </symbol>
      <!-- Three filled dots instead of strokes: `.icon` sets
           `fill: none; stroke: currentColor`, which is correct for line icons,
           but would make a dot invisible. `#i-offline` already makes
           the same exception for its dot. -->
      <symbol id="i-kebab" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1.7" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none" />
        <circle cx="12" cy="19" r="1.7" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-battery" viewBox="0 0 24 24">
        <rect x="2" y="8" width="16" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/>
        <path d="M21 11v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M5 12.5h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </symbol>
    </svg>
    <!-- Until `/auth-info` has answered, the page deliberately shows nothing -
         otherwise the wrong screen would flash up depending on the response. -->
    <template x-if="stringsReady && authReady && !authenticated && !passwordSet">
      <main class="auth-screen">
        <!-- The large version of the mark: per its own header comment,
             `icon.svg` applies from about 32px up, `favicon.svg` below that. Here
             it is 64, in the header further down 24 - hence the other
             file there. `alt=""` is deliberate: "loxmatter" appears in the
             heading directly below (in en as in de), an alt text would have the
             name read out twice. The dimensions are given in the markup, otherwise
             the form would jump downward once the image loads. -->
        <img class="auth-mark" src="/static/icon.svg" alt="" width="64" height="64" />
        <h1 x-text="t('web.auth.setup_heading')"></h1>
        <p class="banner warn" x-html="t('web.auth.setup_warning')"></p>
        <label>
          <span x-text="t('web.auth.password_label')"></span>
          <input type="password" autocomplete="new-password" x-model="passwordDraft"
                 @keydown.enter="submitSetup()" />
        </label>
        <label>
          <span x-text="t('web.auth.password_repeat_label')"></span>
          <input type="password" autocomplete="new-password" x-model="passwordRepeatDraft"
                 @keydown.enter="submitSetup()" />
        </label>
        <p class="hint" x-text="t('web.auth.password_hint')"></p>
        <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>
        <button class="primary" :disabled="authBusy" @click="submitSetup()"
                x-text="t('web.auth.setup_submit')"></button>
      </main>
    </template>

    <template x-if="stringsReady && authReady && !authenticated && passwordSet">
      <main class="auth-screen">
        <img class="auth-mark" src="/static/icon.svg" alt="" width="64" height="64" />
        <h1>loxmatter</h1>
        <label>
          <span x-text="t('web.auth.password_label')"></span>
          <input type="password" autocomplete="current-password" x-model="passwordDraft"
                 @keydown.enter="submitLogin()" />
        </label>
        <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>
        <button class="primary" :disabled="authBusy" @click="submitLogin()"
                x-text="t('web.auth.login_submit')"></button>
      </main>
    </template>

    <!-- `x-if` attaches to exactly ONE child element - hence this empty `<div>`
         around the header, banner, tabs and main area, instead of hanging four
         siblings directly inside the `<template>` (which would make Alpine consider
         only the first of them). -->
    <template x-if="stringsReady && authenticated">
    <div>
    <header class="app-header">
      <!-- The mark and the wordmark sit together in `.brand`, so that the
           header's `justify-content: space-between` continues to see exactly two
           blocks - as siblings, the wordmark would otherwise drift into the
           middle. Here it is the small version `favicon.svg`: at 24px, `icon.svg`'s
           six outer dots merge into a single blob, see the comments in
           both files. -->
      <div class="brand">
        <img class="brand-mark" src="/static/favicon.svg" alt="" width="24" height="24" />
        <h1>loxmatter</h1>
      </div>
      <div class="header-right">
        <!--
          Access: since the WebUI login there is no longer a token field here,
          only the way out. The way in is the two screens below
          this header.
        -->
        <button class="logout" x-show="authenticated" x-cloak @click="logout()"
                x-text="t('web.header.logout')"></button>
        <div class="connection-status">
          <span class="dot" :class="socketConnected ? 'online' : 'offline'"></span>
          <span x-text="connectionStatusText()"></span>
          <!--
            The sign of life (2026-09-03). The bridge sends a heartbeat
            every 30s, even when nothing changes on any device.
            Without this indicator, a quiet installation - a plug with no
            load reports neither current nor power - was indistinguishable
            from a crashed one.
          -->
          <span class="heartbeat" x-show="lastHeartbeatAt" x-cloak>
            <span x-text="t('web.header.heartbeat_prefix')"></span> <span x-text="heartbeatText()"></span>
          </span>
        </div>
      </div>
    </header>

    <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>

    <div class="banner danger" x-show="!socketConnected && socketEverConnected && !updateRunning()" x-cloak
         x-text="t('web.connection.lost_banner')">
    </div>

    <!--
      A planned restart must not read as an outage (design "Applying
      updates through the web UI", 2026-09-08, section 9, state 3). The
      bridge really is unreachable for this window - the same condition
      the banner above already reports on - but here the socket dropping
      is expected, driven by state.json rather than a fault, so it gets
      its own text instead of the alarming one above.
    -->
    <div class="banner warn" x-show="!socketConnected && updateRunning()" x-cloak
         x-text="t('web.system.update_restarting')"></div>

    <!--
      Real links to the fragments of the four views (`VIEWS` in app.js),
      deliberately no more buttons with `@click`: only this way does the
      selected tab survive a page reload, can be bookmarked and opened
      in a new tab. Switching views is still done by `selectView`
      - triggered via `hashchange` (see `applyHash` in app.js), not
      via a click handler at this point. An additional `@click`
      here would even be harmful: it would run BEFORE the fragment change and
      leave `applyHash` nothing left to do afterward - the back button
      would stay unaffected by that, but the two paths into the same view
      would drift apart.
    -->
    <nav class="tabs">
      <a href="#/devices" :class="{ active: view === 'devices' }" :aria-current="view === 'devices' ? 'page' : null" x-text="t('web.nav.devices')"></a>
      <a href="#/export" :class="{ active: view === 'export' }" :aria-current="view === 'export' ? 'page' : null" x-text="t('web.nav.export')"></a>
      <a href="#/system" :class="{ active: view === 'system' }" :aria-current="view === 'system' ? 'page' : null" x-text="t('web.nav.system')"></a>
      <a href="#/settings" :class="{ active: view === 'settings' }" :aria-current="view === 'settings' ? 'page' : null" x-text="t('web.nav.settings')"></a>
    </nav>

    <main>
      <!-- ================================================================
           View 1: Devices
           ================================================================ -->
      <section x-show="view === 'devices'">
        <div class="card">
          <h2 x-text="t('web.devices.commission_heading')"></h2>
          <div x-show="commissionStep === null">
            <!--
              Layout since the "Code first" design (2026-09-07): the
              pairing code stands alone on the first line, everything else
              below it in a quieter second one. Before this, four
              equally wide fields sat side by side here with three paragraphs
              of help text below - 78 words, permanently visible, detached from
              the fields they explain, and the longest of them belonged to the
              rarest field (the Thread dataset).

              Not a single sentence of it was lost: the two long
              notes now sit in the `<details>` disclosures below, each
              next to the field it concerns. The third one (the room note) became
              a one-liner next to the selection field, because the
              selection field with "No room" already gives half the information
              itself.
            -->
            <div class="code-with-sticker">
              <div class="code-col">
                <label class="field-label" for="commission-code"
                       x-text="t('web.devices.code_label')"></label>
                <!--
                  The code gets its own border around field AND button, instead
                  of hanging both as siblings in a `.row`: it is the
                  only required field on this card, and Enter in the field does
                  the same as the button next to it. The monospace font is
                  not decoration - that is exactly how the code appears on the
                  device's sticker, and in a proportional font an O cannot be
                  told apart from a 0 when copying it out.
                -->
                <div class="code-field">
                  <input
                    type="text"
                    id="commission-code"
                    class="code-input"
                    spellcheck="false"
                    autocomplete="off"
                    x-ref="commissionCode"
                    x-model="commissionCode"
                    :placeholder="t('web.devices.code_placeholder')"
                    aria-describedby="code-examples code-where-hint"
                    @input="formatCommissionCode($event.target)"
                    @keydown="commissionCodeKeydown($event)"
                    @keydown.enter="commissionDevice()"
                  />
                  <!--
                    No `inputmode="numeric"`: on the phone that would bring up
                    the numeric keyboard, and there is no dash key there. But
                    it would lock typing a QR text behind a shift key, and
                    this card has exactly one field for both forms.

                    The chip stays visible-but-empty when the field is empty
                    (`visibility: hidden` in style.css) instead of removed, so
                    the field does not change its width on the first keystroke.
                  -->
                  <span
                    class="code-detect"
                    :class="'tone-' + commissionCodeBadge().tone"
                    x-text="commissionCodeBadge().text"
                    aria-live="polite"
                  ></span>
                  <button
                    class="primary"
                    @click="commissionDevice()"
                    :disabled="commissionBusy"
                    x-text="t('web.devices.commission_submit')"
                  ></button>
                </div>
                <p class="code-examples" id="code-examples">
                  <span><b x-text="t('web.devices.code_detect_manual')"></b>
                    <code x-text="t('web.devices.code_example_manual')"></code></span>
                  <span><b x-text="t('web.devices.code_detect_qr')"></b>
                    <code x-text="t('web.devices.code_example_qr')"></code></span>
                </p>
                <p class="hint" id="code-where-hint" x-text="t('web.devices.code_where_hint')"></p>
              </div>
              <!--
                The QR square is a suggestion made of rectangles - three
                finder patterns plus noise -, not a readable code. A real QR
                code in the image would be an invitation to scan it, and it
                would lead nowhere.

                All colors come from the existing variables, so the sketch
                works in both themes; --warn highlights the number and
                thereby carries the same meaning as everywhere else
                ("look here"), instead of introducing a new one.
              -->
              <svg class="code-sticker" width="188" height="112"
                   viewBox="0 0 188 112" role="img"
                   :aria-label="t('web.devices.sticker_alt')">
                <rect x="1" y="1" width="186" height="110" rx="6"
                      fill="var(--bg)" stroke="var(--border)" stroke-width="1" />
                <g fill="var(--text)">
                  <rect x="16" y="16" width="22" height="22" rx="1" />
                  <rect x="20" y="20" width="14" height="14" rx="1" fill="var(--bg)" />
                  <rect x="24" y="24" width="6" height="6" />
                  <rect x="62" y="16" width="22" height="22" rx="1" />
                  <rect x="66" y="20" width="14" height="14" rx="1" fill="var(--bg)" />
                  <rect x="70" y="24" width="6" height="6" />
                  <rect x="16" y="62" width="22" height="22" rx="1" />
                  <rect x="20" y="66" width="14" height="14" rx="1" fill="var(--bg)" />
                  <rect x="24" y="70" width="6" height="6" />
                  <rect x="46" y="18" width="4" height="4" /><rect x="54" y="26" width="4" height="4" />
                  <rect x="46" y="34" width="4" height="4" /><rect x="46" y="46" width="4" height="4" />
                  <rect x="62" y="46" width="4" height="4" /><rect x="70" y="54" width="4" height="4" />
                  <rect x="78" y="46" width="4" height="4" /><rect x="54" y="54" width="4" height="4" />
                  <rect x="62" y="62" width="4" height="4" /><rect x="78" y="70" width="4" height="4" />
                  <rect x="70" y="78" width="4" height="4" /><rect x="46" y="70" width="4" height="4" />
                  <rect x="16" y="46" width="4" height="4" /><rect x="30" y="46" width="4" height="4" />
                  <rect x="62" y="78" width="4" height="4" /><rect x="54" y="70" width="4" height="4" />
                </g>
                <rect x="96" y="52" width="86" height="20" rx="4"
                      fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1" />
                <!-- font-family spelled out instead of var(--mono): SVG presentation attributes
                     do not resolve CSS variables in every engine, and monospace here is
                     not a stylistic choice -- 0 and O must stay distinguishable, because that
                     is exactly how the code appears on the sticker. -->
                <text x="100" y="66"
                      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                      font-size="10" fill="var(--text)">1234-567-8901</text>
                <text x="98" y="44" font-size="8.5" letter-spacing="0.6"
                      fill="var(--text-muted)">MATTER</text>
              </svg>
            </div>

          <div class="commission-meta">
            <label class="inline-field">
              <span x-text="t('web.devices.room_label')"></span>
              <select x-model="commissionRoom">
                <option value="" x-text="t('web.devices.room_none')"></option>
                <template x-for="chip in roomChips().filter((c) => c.key !== '')" :key="chip.key">
                  <option :value="chip.key" x-text="chip.key"></option>
                </template>
                <option value="__new__" x-text="t('web.devices.room_new')"></option>
              </select>
            </label>
            <input
              x-show="commissionRoom === '__new__'"
              x-cloak
              type="text"
              class="new-room-input"
              x-model="commissionNewRoom"
              :placeholder="t('web.devices.room_new_placeholder')"
              :aria-label="t('web.devices.room_new_placeholder')"
            />
            <span class="hint" x-text="t('web.devices.commission_room_hint')"></span>
          </div>

          <div class="commission-help">
            <!--
              Two native `<details>` instead of a dedicated open/closed state
              in `app()`: the browser can already do that, and a state
              nobody has to reset can't drift out of sync with anything else
              either. The same reasoning as for the tile menu and the signal
              groups in the modal.
            -->
            <details class="commission-disclosure">
              <summary x-text="t('web.devices.code_help_summary')"></summary>
              <div class="disclosure-body">
                <p class="hint" x-text="t('web.devices.commission_hint')"></p>
              </div>
            </details>
            <details class="commission-disclosure">
              <summary x-text="t('web.devices.thread_summary')"></summary>
              <div class="disclosure-body">
                <label class="field-label" for="commission-thread"
                       x-text="t('web.devices.thread_dataset_label')"></label>
                <input
                  type="text"
                  id="commission-thread"
                  x-model="commissionThreadDataset"
                  :placeholder="t('web.devices.thread_dataset_placeholder')"
                />
                <p class="hint" x-text="t('web.devices.thread_dataset_hint')"></p>
              </div>
            </details>
          </div>
          </div>

          <!--
            The progress display (design "The process becomes visible"). It
            solves a problem that no layout can solve: commissioning
            takes anywhere from twenty to sixty seconds depending on the device, and
            until now that was just a button turning grey - indistinguishable from
            a hung page.

            TWO steps, not three: this UI cannot honestly tell apart
            more sections than that (see the reasoning at
            `web.devices.commission_step_joining` in
            strings.yaml). A third point would look nicer and would be
            a guess.
          -->
          <div x-show="commissionStep !== null" x-cloak>
            <p class="commission-subject">
              <span class="key" x-text="commissionRunCode"></span>
              <span class="hint" x-show="commissionRunRoom" x-text="commissionRunRoom"></span>
            </p>
            <ol class="commission-steps">
              <li class="commission-step" :class="commissionStepClass(0)">
                <span class="step-marker" aria-hidden="true"></span>
                <span x-text="t('web.devices.commission_step_joining')"></span>
              </li>
              <li class="commission-step" :class="commissionStepClass(1)">
                <span class="step-marker" aria-hidden="true"></span>
                <span x-text="t('web.devices.commission_step_loading')"></span>
              </li>
            </ol>
            <button
              class="commission-restart"
              x-show="commissionStep === 2 || commissionFailed"
              x-cloak
              @click="resetCommission()"
              x-text="commissionFailed ? t('web.devices.commission_retry') : t('web.devices.commission_again')"
            ></button>
          </div>

          <!--
            The message sits outside both halves, because it belongs to
            both: the check for an empty code fires BEFORE a run begins
            (i.e. at the form), success and failure report afterward
            (i.e. at the progress display). Two copies of the same banner
            would be two places where it could get stuck.
          -->
          <p
            x-show="commissionMessage"
            x-cloak
            :class="commissionMessageIsError ? 'banner danger' : 'banner ok'"
            x-text="commissionMessage"
          ></p>

        </div>

        <p x-show="devicesError" x-cloak class="banner danger" x-text="devicesError"></p>
        <p x-show="deviceActionError" x-cloak class="banner danger" x-text="deviceActionError"></p>

        <p
          x-show="devices.length === 0 && !devicesError"
          class="hint"
          x-text="t('web.devices.empty')"
        ></p>

        <!-- Room bar (design 6.3): does not show at all as long as not a
             single device carries a room - with three devices and no
             room it would be a line of noise above a list that fits in
             one glance anyway. The search field stays reachable in that case
             regardless, because it also searches by name and category
             without any rooms. -->
        <div class="room-bar" x-show="devices.length > 0" x-cloak>
          <template x-if="hasAnyRoom()">
            <span class="room-chips">
              <button
                class="room-chip"
                :class="{ active: roomFilter === null }"
                @click="roomFilter = null"
                x-text="t('web.devices.room_all') + ' ' + devices.length"
              ></button>
              <template x-for="chip in roomChips()" :key="chip.key">
                <button
                  class="room-chip"
                  :class="{ active: roomFilter === chip.key }"
                  @click="roomFilter = chip.key"
                  x-text="chip.label + ' ' + chip.count"
                ></button>
              </template>
              <!-- `x-show="roomFilter"` is exactly right here and not
                   sloppiness: both cases where there is nothing to rename are
                   falsy - `null` ("All") and `""` ("No
                   room"). "No room" is not a room but the set of
                   devices with no assignment; a name that could be changed
                   is precisely what they are missing. -->
              <button
                class="room-rename"
                x-show="roomFilter && renamingRoom !== roomFilter"
                @click="beginRenameRoom(roomFilter)"
                :title="t('web.devices.room_rename')"
              ><svg class="icon"><use href="#i-rename"></use></svg></button>
              <input
                x-show="roomFilter && renamingRoom === roomFilter"
                x-cloak
                type="text"
                class="room-rename-input"
                x-model="renameDraft"
                @keydown.enter="commitRenameRoom()"
                @keydown.escape="cancelRenameRoom()"
                @blur="commitRenameRoom()"
              />
            </span>
          </template>
          <!-- The spacer only exists together with the chips: it
               pushes the search field past them to the right. Without
               rooms there is nothing to push past - the field should
               then move to the left edge instead of standing alone on the right
               in an empty row. Hence its own `x-if` rather than an element
               that is always there. -->
          <template x-if="hasAnyRoom()"><span class="room-spacer"></span></template>
          <!-- The border sits on the container, not on the field: the magnifying glass,
               the counter and the cross sit WITHIN the border, and the focus ring
               hangs on the whole group via :focus-within instead of on the
               input field at its centre.

               A <div>, not a <label>: a <button> inside a label
               would trigger the label's forwarding to the labelled control
               - clearing should be one click, not two
               events. The price is a thin strip of padding that
               does not focus into the field; the magnifying glass carries
               `pointer-events: none` (style.css) for that, so that at least it does not
               punch a click-hole into the left edge. -->
          <div class="search-field">
            <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <input
              type="search"
              x-ref="deviceSearchInput"
              x-model="deviceSearch"
              :placeholder="t('web.devices.search_placeholder')"
              :aria-label="t('web.devices.search_placeholder')"
            />
            <!-- `aria-live="polite"` only here, not on the chips or the
                 hint text next to them: the counter answers exactly the
                 question typing raises ("how many are left now?"), and
                 should quietly supply that. The other texts do not change
                 in response to keyboard input and would otherwise have to
                 be read out again on every re-render. The element
                 stays in the DOM when the field is empty (only `display: none` via
                 `x-show`) - so the live region already exists before its
                 content changes for the first time. -->
            <span
              class="search-count"
              aria-live="polite"
              x-show="deviceSearch.trim()"
              x-cloak
              x-text="t('web.devices.search_count', { count: visibleDevices().length })"
            ></span>
            <button
              class="search-clear"
              x-show="deviceSearch.trim()"
              x-cloak
              @click="deviceSearch = ''; $refs.deviceSearchInput.focus()"
              :title="t('web.devices.search_clear')"
              :aria-label="t('web.devices.search_clear')"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>
        </div>

        <p x-show="devices.length > 0 && visibleDevices().length === 0" x-cloak class="hint">
          <span x-text="t('web.devices.search_empty')"></span>
          <template x-if="hitsOutsideRoom() > 0">
            <span>
              <span x-text="hitsOutsideRoom()"></span>
              <span x-text="t('web.devices.search_hits_elsewhere')"></span>
              <a href="#" @click.prevent="clearRoomFilter()" x-text="t('web.devices.search_show_all_rooms')"></a>
            </span>
          </template>
        </p>

        <template x-for="group in deviceGroups()" :key="group.key">
          <div>
            <!-- Renaming inline, like the device name in the tile: the
                 pencil swaps the heading for an input field.
                 `group.key` is "" for "No room" - falsy, so no
                 pencil: there is no name to change there. -->
            <h3 class="room-heading" x-show="group.title">
              <span x-show="renamingRoom !== group.key" x-text="group.title"></span>
              <button
                class="room-rename"
                x-show="group.key && renamingRoom !== group.key"
                @click="beginRenameRoom(group.key)"
                :title="t('web.devices.room_rename')"
              ><svg class="icon"><use href="#i-rename"></use></svg></button>
              <input
                x-show="group.key && renamingRoom === group.key"
                x-cloak
                type="text"
                class="room-rename-input"
                x-model="renameDraft"
                @keydown.enter="commitRenameRoom()"
                @keydown.escape="cancelRenameRoom()"
                @blur="commitRenameRoom()"
              />
            </h3>
            <div class="device-grid">
              <template x-for="device in group.devices" :key="device.id">
                <div class="card device-card" :class="deviceCardClass(device)">
                  <div class="device-head">
                    <span class="type-badge">
                      <svg class="icon"><use :href="'#i-cat-' + device.category"></use></svg>
                    </span>
                    <span class="device-ident">
                      <input
                        type="text"
                        class="device-name"
                        :value="device.label"
                        @input="labelDrafts[device.id] = $event.target.value"
                        @change="saveLabel(device)"
                      />
                    </span>
                    <!-- The offline pill sits HERE, in its place, since the
                         primary signal was dropped (design 2026-09-07), and
                         no longer in `.device-ident` under the
                         name. It thereby displaces nothing anymore: the
                         `.lead-label` it used to share the row with
                         no longer exists - and with it the rule "only the
                         offline pill displaces the primary-signal label",
                         which used to need two paragraphs of reasoning here.

                         No dedicated positioning rule needed - but not for
                         the reason that stood here until the 2026-09-07
                         follow-up: `.status-pill` does carry
                         `margin-left: auto` (style.css), but that contributes
                         nothing here. `.device-ident` next to it has `flex:
                         1 1 auto` and, when resolving the flexible lengths
                         (CSS Flexbox 9.7), already consumes the
                         entire free space BEFORE auto margins are
                         distributed (9.5) - nothing is left over for the
                         auto margin. The pill sits on the right BECAUSE
                         `.device-ident` grows, not because its own
                         auto margin kicks in. That is exactly why `flex: 1 1
                         auto` on `.device-ident` is load-bearing here and not
                         dispensable: remove it, and free space remains,
                         and only then would `margin-left: auto`
                         on the pill do anything.

                         The changed-since-export pill continues to sit in
                         the FOOTER (pill-into-the-footer rework,
                         2026-09-06) and deliberately not here: it
                         answers the same question as `exportHintFor`
                         right next to it. The header stays reserved
                         for the device's state, not the export
                         state. -->
                    <span class="status-pill off" x-show="!isOnline(device)">
                      <svg class="icon"><use href="#i-offline"></use></svg>
                      <span x-text="t('web.devices.offline')"></span>
                    </span>
                  </div>

                  <!-- Device state, not export state. `.device-foot`
                       carries the export statement (`exportHintFor`), and
                       the header's own comment above already draws that
                       line - two timestamps about different subjects on
                       adjacent lines read as one muddled sentence.

                       Deliberately NOT inside `.device-ident` either,
                       although the row under the device name came free
                       when the primary signal was dropped (design
                       2026-09-07): that span is a flex row, and its
                       `flex: 1 1 auto` is what puts the offline pill on
                       the right (see the comment up in the header). A
                       column direction there would change how the name
                       `<input>` sizes itself - a larger blast radius than
                       one line of text is worth. As a sibling it touches
                       none of that reasoning.

                       No colour, no threshold, no pill. A silent window
                       contact is normal, and so is a silent button or
                       leak detector; any staleness rule would fire first
                       on exactly the devices that prompted this. The line
                       states a fact and leaves the judgement to whoever
                       reads it. -->
                  <p class="hint device-heard" x-text="lastHeardText(device)"></p>

                  <div class="value-rows" x-show="signalsByDevice[device.id]">
                    <!-- `firstSignalsFor`, not `restSignalsFor` (design
                         2026-09-07): the grid shows the full short list.
                         `restSignalsFor` delivered it without its first
                         entry, because exactly that one used to sit above
                         in the header - with the header display dropped, it
                         would otherwise no longer be visible anywhere. -->
                    <template x-for="signal in firstSignalsFor(device.id)" :key="signal.key">
                      <span class="value-row">
                        <span class="value-key" x-text="signal.title"></span>
                        <span
                          class="value"
                          :class="{ 'value-fresh': signalIsFresh(signal) }"
                          :title="signalAgeTitle(signal)"
                          x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                        ></span>
                      </span>
                    </template>
                    <!-- The note about the remaining signals is the last
                         grid row instead of its own paragraph (design
                         6.2) - on a tile 260px wide, every row counts. -->
                    <span class="value-row" x-show="remainingSignalCount(device.id) > 0">
                      <a
                        class="value-key"
                        href="#"
                        @click.prevent="openSignalsModal(device)"
                        x-text="'+ ' + remainingSignalCount(device.id) + ' ' + t('web.devices.more_signals_short')"
                      ></a>
                      <span></span>
                    </span>
                  </div>

                  <!-- The battery level sits BELOW the preview rows and
                       below the "+ N more" link, not between them
                       (design 2026-09-07, section 6). It is not a
                       functional signal like a button press, but a
                       statement about the device itself - and with rank 90
                       it would have fallen out of the six preview rows.
                       Its own row, its own icon, a dashed separator: always
                       visible, never a primary signal.

                       `x-show` instead of `x-if`: a mains-powered device
                       has no PowerSource signal and must not grow taller by
                       an empty row - `.device-battery` therefore carries no
                       outer dimension of its own that would remain. -->
                  <div class="device-battery" x-show="batterySignalFor(device.id)" x-cloak>
                    <svg class="icon" aria-hidden="true"><use href="#i-battery"></use></svg>
                    <span class="value-key" x-text="t('web.devices.battery_label')"></span>
                    <span
                      class="value"
                      :class="{ 'value-fresh': signalIsFresh(batterySignalFor(device.id)) }"
                      :title="signalAgeTitle(batterySignalFor(device.id))"
                      x-text="formatValue(liveValueOf(batterySignalFor(device.id))) + (batterySignalFor(device.id)?.unit ? ' ' + batterySignalFor(device.id).unit : '')"
                    ></span>
                  </div>

                  <p class="hint" x-show="!signalsByDevice[device.id]" x-text="t('web.devices.signals_loading')"></p>
                  <!-- Finding 3: without this note, a gap silently
                       remained between the header and the command bar as
                       soon as a device has loaded but empty functional
                       signals (the `value-rows` then stay without content) -
                       indistinguishable from a device that is still
                       loading. The condition used to ask
                       `!leadSignalFor(device.id)`; without a primary signal
                       it asks the list directly, which is the more honest
                       question anyway.

                       And since the battery row it is also the only
                       correct one: `previewSignalsFor` removes the battery
                       level from the value grid (it sits in the footer
                       below instead), so a device with ONLY a battery
                       signal has empty `value-rows` despite one functional
                       signal. Asked via the grid rows, it would wrongly
                       show "no functional signals" there; asked via
                       `functionalSignalsFor`, the note correctly stays
                       hidden. -->
                  <p
                    class="hint"
                    x-show="signalsByDevice[device.id] && functionalSignalsFor(device.id).length === 0"
                    x-text="t('web.devices.no_functional_signals')"
                  ></p>

                  <div class="device-commands">
                    <template x-for="command in controlsByKind(device.id, 'none')" :key="command.key">
                      <button
                        @click="executeCommand(device, command)"
                        :disabled="commandBusyKey === command.key || !isOnline(device)"
                        x-text="command.slug"
                      ></button>
                    </template>
                    <!-- Value-carrying commands move into the control modal
                         (task 7): for those, the tile now shows only this
                         one button, instead of rendering a bare
                         number field per command. -->
                    <button
                      x-show="hasAdjustableControls(device.id)"
                      @click="openControlModal(device)"
                      :disabled="!isOnline(device)"
                      x-text="t('web.devices.control_button')"
                    ></button>
                    <span
                      class="hint"
                      x-show="hiddenRawCommandsFor(device.id) > 0"
                      x-text="'+' + hiddenRawCommandsFor(device.id) + ' ' + t('web.devices.more_commands_short')"
                    ></span>
                    <!-- Finding 3: `controlsLoaded()` distinguishes "not yet
                         loaded or the fetch failed" from "loaded, but genuinely
                         no commands" - without these two
                         lines the tile renders the same empty, bordered
                         strip in BOTH cases (Spec 8.1: a
                         failure must not look like a harmless state).
                         The error text itself still runs separately
                         through the `deviceActionError` banner (see
                         `loadControls`) - here it is only about the
                         tile display. -->
                    <span
                      class="hint"
                      x-show="!controlsLoaded(device.id)"
                      x-text="t('web.devices.controls_loading')"
                    ></span>
                    <span
                      class="hint"
                      x-show="controlsLoaded(device.id) && commandsFor(device.id).length === 0 && hiddenRawCommandsFor(device.id) === 0"
                      x-text="t('web.devices.no_known_commands')"
                    ></span>
                  </div>

                  <div class="device-foot">
                    <span class="hint" x-text="exportHintFor(device.id)"></span>
                    <!-- Order deliberate: the hint first names the
                         export time ("Last exported on ..." /
                         "Never exported"), the pill immediately adds
                         the associated deviation right after ("...and changed
                         since") - the same subject-predicate order as
                         in running text, not pill first and timestamp
                         afterward.

                         NO MORE `isOnline(device) &&` in the condition
                         (2026-09-06). As long as the pill sat up in the
                         header, it shared the line with the
                         offline pill, and only ever one of the two could stand
                         there - hence the coupling. Down here nothing
                         competes, and "changed since the export"
                         has nothing to do with current reachability
                         anyway: the change happened whether the
                         device is currently responding or not. An offline
                         device with a pending export otherwise said so
                         NOWHERE - not even the edge stripe, since
                         `deviceCardClass` still couples `is-changed` to
                         `isOnline`, and rightly so: a stripe can
                         only carry one colour. That is exactly the gap
                         the pill closes here. -->
                    <span class="status-pill warn" x-show="changedSinceExport(device.id)">
                      <svg class="icon"><use href="#i-warn"></use></svg>
                      <span x-text="t('web.devices.changed_since_export')"></span>
                    </span>
                    <span style="flex: 1 1 auto"></span>
                    <!-- The open/closed state lives in the DOM, not in Alpine:
                         a `<details>` needs no `open` field per tile,
                         that would have to be kept in sync with the visible
                         state. That exact obligation to stay in sync cost the
                         room selection field six rounds of review.
                         However, `<details>` does NOT close on its own
                         on Escape (unlike a `<dialog>`), nor
                         on a click elsewhere - both are handled here
                         for that reason. The fact that only ever one menu is open
                         falls out of this for free: a click on the kebab of
                         another tile lies outside this `<details>`
                         and closes it via the same guard.

                         `.window` on the Escape listener is mandatory, not
                         a style choice: without `.window` the listener hangs off
                         the `<details>` subtree and only fires when the
                         focus is inside it. Safari on macOS does NOT
                         automatically move focus there on a mouse click on `<summary>`
                         (default, "Full Keyboard
                         Access" off) - so whoever opens the menu with the
                         mouse and then presses Escape fires the
                         Escape on `document.body`, which never reaches the
                         `<details>`, and the menu stays silently open.
                         `.window` instead hangs off the `window` and
                         works independently of focus. The `if ($el.open)`
                         in front of it is nonetheless mandatory, since this listener
                         also calls `closeTileMenu` (Finding 3, below): without
                         the guard it would fire on EVERY Escape/outside click on
                         EVERY tile (there is, after all, one `<details>`
                         instance per device) and would focus the `<summary>` even
                         of menus that have long since closed - even though the
                         user just clicked completely somewhere else. With
                         the guard, only the tile that is actually open
                         reacts, and there is in any case only ever one of those (see above).

                         Finding 1 (review from 2026-09-05): `newRoomFor`
                         now only toggles the visibility of the
                         new-room field, but was otherwise exactly the kind of
                         state this rework is meant to fight
                         - it stayed unchanged across three of the four ways to close
                         (outside click, Escape, clicking a room entry),
                         because only Enter and the Escape INSIDE the
                         field reset it. On reopening,
                         the menu then showed an empty new-room field instead
                         of the "+ New room" button. `@toggle` fires on
                         EVERY opening/closing of this `<details>`, whatever
                         the reason - and is thus the one place
                         that needs to know about `newRoomFor`, instead of the four
                         handlers that previously had to.

                         Finding 3 (re-review 2026-09-05): the `!$el.open` from
                         the first version only covered closing and
                         left a gap: if the tile itself disappears
                         while its menu is open (a re-render removes
                         the node outright), no `toggle` ever fires for
                         closing - `newRoomFor` stays stuck on the device
                         ID. If the same ID later reappears in a NEW
                         `<details>`, its first `toggle` is
                         an opening, and `!$el.open` discarded exactly this
                         case - the orphaned field was back. The guard
                         now covers opening and closing alike for that reason:
                         `beginNewRoom` is reached exclusively
                         by a click INSIDE an already open menu,
                         i.e. long AFTER its own,
                         queued `toggle` (the opening) has already run
                         - so a reset on opening can never take away a
                         new-room mode that was just set. Do
                         NOT reintroduce this `!$el.open`, or the gap on
                         tile disappearance is back.

                         Finding 3 (review from 2026-09-05): a native
                         `<details>` does not return focus on
                         closing - the entry that was just activated disappears
                         along with its focus from the rendered tree (only
                         the content behind `<summary>` is hidden), and
                         the next Tab key starts back at the very top of the
                         document instead of continuing at the tile
                         where the user just was. `closeTileMenu`
                         (app.js) closes the `<details>` AND then focuses
                         its `<summary>` (which always stays
                         rendered when closing) - one function for
                         all ways of closing instead of a separate focus call at
                         each individual entry. -->
                    <details
                      class="tile-menu"
                      @toggle="if (newRoomFor === device.id) { newRoomFor = null; newRoomDraft = '' }"
                      @click.outside="if ($el.open) closeTileMenu($el)"
                      @keydown.escape.window="if ($el.open) closeTileMenu($el)"
                    >
                      <!-- `title` alone is only the last fallback value when
                           computing the accessible name
                           and is not reliably read out by screen readers
                           - `aria-label` sets the name explicitly,
                           `title` additionally stays in place as a mouse tooltip,
                           so both attributes serve
                           different purposes side by side.
                           The `<svg>` here gets `aria-hidden="true"` as the first
                           icon in this file to do so: a
                           decorative icon inside a control that already has a name
                           must not give the accessibility tree a second,
                           competing name. The other icon buttons (`.room-rename`
                           and others) do not have this yet - please adopt this
                           pattern the next time one of them is touched, not the older one without
                           `aria-hidden`. -->
                      <summary :title="t('web.devices.menu')" :aria-label="t('web.devices.menu')">
                        <svg class="icon" aria-hidden="true"><use href="#i-kebab"></use></svg>
                      </summary>
                      <div class="tile-menu-items">
                        <!-- Finding 2 (follow-up 2026-09-05): until now the
                             heading was only visually a group label -
                             tabbing through, a screen reader user reaches
                             "Kitchen" with no indication at all that this
                             is a room. `role="group"` plus `aria-labelledby`
                             establishes the connection programmatically.
                             The heading's id is deliberately derived PER DEVICE
                             (`device.id`) instead of being a fixed
                             constant: the whole page shares a single
                             `x-data` (see the argument against
                             `x-ref`/`$refs` further below in this file,
                             Finding 3), and this markup is rendered once PER
                             tile - a fixed id would be duplicated in
                             the delivered document as many times
                             as there are tiles, `aria-labelledby` would then
                             per spec only match the first occurrence and
                             miss or hit the wrong heading for
                             every other tile. -->
                        <div class="tile-menu-rooms" role="group" :aria-labelledby="'tile-menu-room-heading-' + device.id">
                          <p
                            class="tile-menu-heading"
                            :id="'tile-menu-room-heading-' + device.id"
                            x-text="t('web.devices.menu_room_heading')"
                          ></p>
                          <!-- "No room" is not a special case here, but
                               the normal state of a device that has not yet been assigned
                               - it carries the checkmark just like any
                               other entry. The empty string is the same
                               value the API expects for "remove room",
                               so it is the same encoding on both
                               sides and no conversion. -->
                          <button
                            class="tile-menu-item"
                            :class="{ 'is-current': roomKeyOf(device) === '' }"
                            :aria-current="roomKeyOf(device) === '' ? 'true' : null"
                            @click="closeTileMenu($el); saveRoom(device, '')"
                            x-text="t('web.devices.room_none')"
                          ></button>
                          <template x-for="chip in roomChips().filter((c) => c.key !== '')" :key="chip.key">
                            <!-- Finding 2 (follow-up 2026-09-05): the entry now truncates a long
                                 room name with an ellipsis (`.tile-menu-item`, style.css) - the
                                 full name must still remain accessible somewhere, hence a native
                                 `title` here. `chip.key` is user data (a room name),
                                 not a UI string to translate - `t()` would be
                                 out of place here. -->
                            <button
                              class="tile-menu-item"
                              :class="{ 'is-current': roomKeyOf(device) === chip.key }"
                              :aria-current="roomKeyOf(device) === chip.key ? 'true' : null"
                              :title="chip.key"
                              @click="closeTileMenu($el); saveRoom(device, chip.key)"
                              x-text="chip.key"
                            ></button>
                          </template>
                          <button
                            class="tile-menu-item tile-menu-new"
                            x-show="newRoomFor !== device.id"
                            @click="beginNewRoom(device); $nextTick(() => $el.parentElement.querySelector('.tile-menu-input')?.focus())"
                            x-text="t('web.devices.room_new')"
                          ></button>
                          <!-- The text field is a child of the `<details>`, so the
                               menu stays open while typing. Escape
                               only aborts the new-room mode and must not
                               bubble up to the `@keydown.escape` of the `<details>`,
                               otherwise an abort would make the
                               whole menu vanish too - hence `.stop`.

                               Finding 3 (review from 2026-09-05): the focus call
                               on the "+ New room" button above deliberately targets
                               `$el.parentElement.querySelector` on this
                               field instead of via `x-ref`/`$refs`. An `x-ref`
                               registers itself on the nearest element with
                               `x-data` - and on this page that is only
                               the `<body>` right at the top, ONE shared pot
                               for all tiles at once. With several
                               devices, the entry of the most recently rendered
                               tile overwrites every one registered before it,
                               and `$refs.whatever` would then always point at
                               the same (usually wrong) field, regardless
                               of which tile the user actually
                               opened. The search starting from the clicked
                               button is instead necessarily confined to its
                               own `.tile-menu-rooms` group
                               (previously `.tile-menu-items` directly; since the
                               `role="group"` wrapper for the room list,
                               follow-up 2026-09-05, it is that group's next
                               parent node - the field is still inside it,
                               the search finds it unchanged).

                               Finding 2 (re-review 2026-09-05): `newRoomFor =
                               null` hides this field via `x-show`
                               (`display: none`), but does NOT take its focus
                               away - measured in the browser: afterward
                               the field was still `document.activeElement`,
                               invisible and with no neighbour to keep tabbing to,
                               the menu stayed open with focus on a dead
                               end. The Escape handler therefore explicitly sends focus
                               to the "+ New room" button,
                               which reappears in its place - `x-ref`
                               is ruled out for the same reasons as above,
                               hence the same `$el.parentElement.querySelector`
                               search, only with the stable second class
                               `.tile-menu-new` as the target.

                               Finding 4 (re-review 2026-09-05): the `?.` before
                               `.focus()` on the focus call of the "+ New room"
                               button above lets a missed search
                               fizzle out harmlessly instead of throwing a `TypeError`.
                               Unreachable today, because this
                               field is unconditionally rendered in the same `.tile-menu-rooms`
                               group (only hidden via `x-show`, not removed via `x-if`)
                               - the same mistake as with `closeTileMenu` (app.js, Finding 4): the
                               focus call should stay without consequence
                               on failure, not end with an unhandled throw in
                               the `$nextTick` microtask. -->
                          <input
                            x-show="newRoomFor === device.id"
                            x-cloak
                            type="text"
                            class="tile-menu-input"
                            x-model="newRoomDraft"
                            :placeholder="t('web.devices.room_new_placeholder')"
                            @keydown.enter="closeTileMenu($el); commitNewRoom(device)"
                            @keydown.escape.stop="newRoomFor = null; newRoomDraft = ''; $nextTick(() => $el.parentElement.querySelector('.tile-menu-new')?.focus())"
                          />
                        </div>
                        <hr class="tile-menu-sep" />
                        <button
                          class="tile-menu-item"
                          @click="closeTileMenu($el); openSignalsModal(device)"
                          x-text="t('web.devices.menu_signals')"
                        ></button>
                        <button

                          x-text="t('web.devices.export')"
                        ></button>
                        <button
                          class="tile-menu-item is-danger"
                          @click="closeTileMenu($el); removeDevice(device)"
                          x-text="t('web.devices.remove')"
                        ></button>
                      </div>
                    </details>
                  </div>
                  <p class="hint" x-show="!bridgeSettings.bridge_ip" x-cloak>
                    <span x-text="t('web.devices.export_hint_prefix')"></span>
                    <a href="#/settings" x-text="t('web.settings.miniserver_link')"></a>
                    <span x-text="t('web.devices.export_hint_suffix')"></span>
