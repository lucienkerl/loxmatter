web.signals.key_hint:
  en: "The key (in the \"Loxone input\" column, greyed out) is the wiring in Loxone and cannot be changed here — doing so would silently disable a block there."
  de: "Der Schlüssel (in der Spalte „Loxone-Eingang“, grau hinterlegt) ist die Verdrahtung in Loxone und lässt sich hier nicht ändern – ein Klick würde dort einen Baustein still lahmlegen."
web.signals.functional_vs_expert_explanation:
  en: "The signals above belong to the recognized device type, grouped by endpoint (e.g. \"Button 1\", \"Device\") – \"Expert\" leads everything else (network, device, and diagnostic values, technical counters). Both areas keep the export checkbox for each individual signal; the grouping only changes what is visible by default."
  de: "Oben stehen die Signale, die zum erkannten Gerätetyp gehören, gruppiert nach Endpunkt (z. B. „Taste 1“, „Gerät“) – „Experte“ führt alles Übrige (Netzwerk-, Geräte- und Diagnosewerte, technische Zähler). Beide Bereiche behalten den Exportieren-Haken für jedes einzelne Signal; die Gliederung ändert nur, was standardmäßig zu sehen ist."
