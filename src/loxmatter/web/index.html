    <!--
      Signal-Modal (Entwurf "Signale als Modal", 2026-09-05). Genau EIN
      `<dialog>` fuer die ganze Seite, bewusst ausserhalb der `x-for`-
      Schleife der Geraetekacheln: Markup innerhalb `x-for` wird einmal PRO
      GERAET ausgeliefert - bei dreissig Geraeten laegen dreissig
      vollstaendige Signaltabellen im Dokument, und jede `id` darin
      dreissigfach (derselbe Fallstrick, den `aria-labelledby` im
      Kachel-Menue schon einmal umschiffen musste).

      Es steht zudem ausserhalb des Login-`<template>`, wie die
      Kurzmeldungen darunter: so ist `$refs.signalsModal` immer aufloesbar
      und nicht davon abhaengig, ob Alpine den angemeldeten Teilbaum gerade
      gerendert hat.

      `x-ref` ist hier zulaessig, obwohl der Kommentar am Kachel-Menue
      (Fund 3) ausdruecklich davon abraet. Der dortige Einwand trifft eine
      Registrierung, die PRO KACHEL laeuft: die Seite teilt sich ein
      einziges `x-data` am `<body>`, und der Eintrag der zuletzt
      gerenderten Kachel ueberschreibt jeden davor. Dieses `<dialog>` steht
      genau einmal im Dokument - niemand kann es ueberschreiben. Dieselbe
      Lage wie bei `x-ref="diagnosticsLogsList"` und `x-ref="datagramsList"`
      weiter oben, die aus demselben Grund unbedenklich sind.

      `@close` ist die EINZIGE Stelle, die `signalsModalDevice`
      zuruecksetzt. Das Ereignis feuert auf jedem Schliessweg - Escape,
      Schliessen-Knopf, Backdrop, `close()` aus JavaScript -, es gibt also
      keinen Pfad, auf dem der Alpine-Zustand und der sichtbare Zustand
      auseinanderlaufen koennen. Dieselbe Rolle, die `@toggle` beim
      `<details>` des Kachel-Menues spielt. KEINE weiteren Ruecksetzer an
      den einzelnen Schliesswegen ergaenzen - genau diese Verteilung auf
      mehrere Handler war beim Raum-Auswahlfeld die Ursache von sechs
      Reviewrunden.

      Aus demselben Grund setzt derselbe Handler seit Fund 3 der
      Nachpruefung (2026-09-07) zusaetzlich `expandedSignalKey` zurueck:
      ohne das stuende beim naechsten Oeffnen desselben Geraets sofort
      wieder derselbe Aufklapper offen, ohne dass der Kebab dafuer geklickt
      wurde - `@close` ist ja auch fuer dieses Feld der einzige Weg, auf dem
      ALLE Schliesspfade zusammenlaufen.

      Ein `<dialog>` schliesst bei einem Klick auf den Backdrop NICHT von
      selbst (anders als es Escape tut). `@click.self` allein reicht dafuer
      NICHT: der Klick-Ereignis-Ziel ist `<dialog>` schon dann, wenn ein
      Mousedown IM Inhalt beginnt (etwa beim Markieren eines Signaltitels)
      und der Mouseup beim Ueberziehen auf dem Backdrop landet - `.self`
      prueft nur das Klick-Ziel, nicht wo die Geste angefangen hat. Deshalb
      merkt sich `@mousedown` in `signalsModalBackdropMousedown` (app.js),
      ob der Mousedown SELBST auf dem Backdrop lag. Der Klick-Handler
      schliesst nur, wenn DREI Dinge zutreffen: `.self` (das Klick-Ziel ist
      das `<dialog>`), dieses gemerkte Feld, und `isBackdropEvent` fuer den
      Klick selbst - die Lage zaehlt also an beiden Enden der Geste, nicht
      nur am Anfang (Begruendung dafuer weiter unten). Das Feld ist reine
      Praesentations-Buchfuehrung fuer diese eine Geste, kein Modal-Zustand
      wie `signalsModalDevice` - `@close` bleibt dessen einzige
      Ruecksetzstelle, siehe oben.

      Der Mousedown-Handler traegt bewusst KEIN `.self` (Fund 1 der
      Nachpruefung): mit `.self` wird das Feld nur GESETZT, wenn der
      Mousedown auf dem Backdrop lag, und nur im `@click.self` wieder
      geleert - Alpine ueberspringt einen `.self`-Ausdruck aber vollstaendig,
      wenn das Ziel nicht passt. Ein Mousedown auf dem Backdrop, der nie in
      einem Klick auf dem `<dialog>` endet (Escape mit gedrueckter Taste,
      Loslassen ausserhalb des Fensters), liesse das Feld dauerhaft auf
      `true` stehen - und der naechste Zieh-Vorgang aus dem Inhalt heraus
      schloesse das Modal genau wieder so, wie es dieser Umbau verhindern
      soll. Ohne `.self` laeuft der Handler bei JEDEM Mousedown im Teilbaum
      und schreibt das Feld jedes Mal neu; ein veralteter Wert kann eine
      Geste nicht ueberleben.

      `isBackdropEvent` (app.js) entscheidet, ob ein Mausereignis wirklich
      auf dem Backdrop lag. Das Ziel allein reicht dafuer nicht: der eigene
      Scrollbalken des Modals gehoert ebenfalls dem `<dialog>` und liefert
      dasselbe Ziel - ohne die Unterscheidung schloesse ein Griff daran das
      Modal, ausgerechnet bei den langen Listen, fuer die es ihn ueberhaupt
      gibt (ein Geraet mit 159 Signalen). Der Helfer vergleicht deshalb die
      Lage gegen das Rechteck des Dialogs; die Begruendung samt der
      verworfenen `offsetX`-Variante steht bei ihm.

      Geprueft wird das an BEIDEN Enden der Geste - Mousedown wie Klick.
      Sonst schloesse auch ein Zug vom Backdrop IN den Inhalt hinein das
      Modal: das Klick-Ereignis feuert am naechsten gemeinsamen Vorfahren
      von Mousedown- und Mouseup-Ziel, und das ist bei dieser Richtung
      wieder das `<dialog>`.

      `aria-labelledby` verweist auf eine FESTE `id` an der Ueberschrift,
      anders als das `aria-labelledby` im Kachel-Menue weiter oben, das
      seine id aus `device.id` ableiten muss - dort gibt es die Bindung
      einmal PRO KACHEL, hier steht das `<dialog>` genau einmal im
      Dokument (siehe oben), eine feste id kann also nicht kollidieren.
    -->
    <dialog
      x-ref="signalsModal"
      class="signals-modal"
      aria-labelledby="signals-modal-heading"
      @close="signalsModalDevice = null; expandedSignalKey = null"
      @mousedown="signalsModalBackdropMousedown = isBackdropEvent($event, $el)"
      @click.self="if (signalsModalBackdropMousedown && isBackdropEvent($event, $el)) $el.close(); signalsModalBackdropMousedown = false"
    >
      <template x-if="signalsModalDeviceObject()">
        <div class="signals-modal-body">
          <div class="signals-modal-head">
            <h2
              id="signals-modal-heading"
              x-text="t('web.signals.modal_heading', { device: signalsModalDeviceObject().label })"
            ></h2>
            <span style="flex: 1 1 auto"></span>
            <button
              class="signals-modal-close"
              :title="t('web.signals.modal_close')"
              :aria-label="t('web.signals.modal_close')"
              @click="closeSignalsModal()"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>

          <!-- Die eine Zahl, wegen der man dieses Modal oeffnet. Sie stand
               bisher nirgends - man musste 17 Haekchen zaehlen. -->
          <div class="signals-summary">
            <span
              x-text="t('web.signals.export_summary', { exported: exportedSignalCount(signalsModalDevice), total: signalCount(signalsModalDevice) })"
            ></span>
            <span style="flex: 1 1 auto"></span>
            <button
              @click="deselectAllSignals(signalsModalDevice)"
              x-text="t('web.signals.deselect_all')"
            ></button>
          </div>

          <p x-show="signalsError" x-cloak class="banner danger" x-text="signalsError"></p>
          <p class="hint">
            <span x-text="t('web.signals.key_hint')"></span>
            <span x-text="t('web.signals.resend_explanation')"></span>
          </p>

          <!-- Bleibt als Wiederholung fuer den Fehlerfall: im Normalfall hat
               `startApp` die Signale jedes Geraets laengst geladen, dieser
               Knopf zeigt sich also nur, wenn genau dieser eine Abruf
               gescheitert ist (der Grund steht im Banner darueber). -->
          <button
            x-show="!signalsByDevice[signalsModalDevice]"
            @click="loadSignals(signalsModalDevice)"
            x-text="t('web.signals.load_button')"
          ></button>

          <template x-if="signalsByDevice[signalsModalDevice]">
            <div>
              <!--
                EINE Vorlage fuer alle Gruppen. Der naheliegende Entwurf -
                funktional als schlichter Block, Experte als `<details>` -
                braeuchte zwei Zweige und in jedem eine eigene Kopie der
                Signalzeile darunter. Genau diese Verdopplung hat
                `signalGroupsFor` (app.js) abgeschafft: 51 byte-identische
                Zeilen, die bei jeder Aenderung an beiden Stellen
                nachgezogen werden mussten.

                Der Auf-/Zu-Zustand lebt im DOM, nicht in Alpine - dasselbe
                Muster wie beim Kachel-Menue, und der Grund, warum der alte
                globale Auf-/Zu-Schalter (Aufgabe 8) ersatzlos entfaellt.

                `x-init` statt `:open` ist Pflicht, kein Stil: Alpine wertet
                eine BINDUNG bei jeder Aenderung ihrer Abhaengigkeiten neu
                aus, und `signalGroupsFor` haengt an `signalsByDevice` - ein
                gespeicherter Signaltitel schriebe ein `:open` neu und
                klappte die gerade geoeffnete Expertengruppe wortlos wieder
                zu. `x-init` laeuft einmal je Element; da `:key` mit
                `group.key` stabil ist, baut Alpine den Knoten bei einem
                Re-Render nicht neu auf, und der Klick des Nutzers bleibt
                stehen. NICHT zu `:open` vereinfachen.
              -->
              <!-- Ausserhalb der Gruppenschleife, seit die Gruppen nach
                   Endpunkt entstehen (Entwurf 2026-09-07, Abschnitt 7.4):
                   eine Endpunktgruppe ist nie leer, sie entsteht ja aus
                   ihren Signalen. "Keine funktionalen Signale" heisst
                   jetzt "es gibt gar keine Endpunktgruppe". -->
              <p
                class="hint"
                x-show="functionalSignalsFor(signalsModalDevice).length === 0"
                x-text="t('web.signals.none_functional')"
              ></p>
              <!-- Der Spaltenkopf klebt beim Scrollen oben: ohne ihn
                   verlieren die beiden Haekchenspalten ihre Bedeutung,
                   sobald er bei 173 Signalen aus dem Bild ist. Er traegt
                   DIESELBE `grid-template-columns` wie jede Datenzeile -
                   das ist der ganze Grund, warum die Tabelle fluchtet, und
                   der Test `test_the_signal_rows_and_the_header_share_one_
                   grid` sperrt genau diese Gleichheit. -->
              <div class="signal-grid signal-grid-head">
                <span x-text="t('web.signals.col_export')"></span>
                <span x-text="t('web.signals.col_signal')"></span>
                <span x-text="t('web.signals.col_input')"></span>
                <span class="col-right" x-text="t('web.signals.col_value')"></span>
                <span class="col-center" x-text="t('web.signals.col_resend')"></span>
                <span></span>
              </div>
              <template x-for="group in signalGroupsFor(signalsModalDevice)" :key="group.key">
                <details class="signal-group" x-init="$el.open = !group.collapsible">
                  <summary>
                    <span x-text="group.title"></span>
                    <span class="muted" x-show="group.subtitle" x-text="group.subtitle"></span>
                    <span class="muted" x-text="'(' + group.signals.length + ')'"></span>
                    <!-- `aria-hidden` wie am Kebab-Icon und am Schliessen-Knopf
                         des Modals, NICHT wie am aelteren Chevron der
                         Projektdatei-Sync-Aufklapper: ein dekoratives Icon in
                         einem bereits benannten Bedienelement (die `<summary>`
                         traegt Gruppentitel und Anzahl) darf dem
                         Accessibility-Baum keinen zweiten, konkurrierenden
                         Namen liefern. -->
                    <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
                  </summary>
                  <p
                    class="hint"
                    x-show="group.collapsible"
                    x-text="t('web.signals.functional_vs_expert_explanation')"
                  ></p>
                  <!-- `x-for` verlangt genau EIN Wurzelelement je Signal.
                       Die Rasterzeile allein waere das normalerweise (siehe
                       Entwurf 2026-09-07, Abschnitt 7.2) - der Aufklapper
                       direkt darunter braucht deshalb diese Huelle, obwohl
                       er selbst kein Rasterkind ist. -->
                  <template x-for="signal in group.signals" :key="signal.key">
                    <div class="signal-row-wrap" :class="{ 'is-expanded': expandedSignalKey === signal.key }">
                      <div class="signal-grid signal-row-cells">
                        <label class="col-center">
                          <input
                            type="checkbox"
                            :checked="signal.exported"
                            :disabled="!signal.exportable"
                            :aria-label="t('web.signals.export_checkbox')"
                            :title="t('web.signals.export_checkbox')"
                            @change="toggleExported(signal)"
                          />
                        </label>
                        <input
                          type="text"
                          class="signal-title"
                          :value="signal.title"
                          @input="titleDrafts[signal.key] = $event.target.value"
                          @change="saveTitle(signal)"
                        />
                        <span class="key" :title="t('web.signals.key_tooltip')" x-text="signal.key"></span>
                        <!--
                          Wann der Wert zuletzt kam, steht im `title` - nicht
                          daneben im Textfluss (2026-09-03). Eine Angabe wie
                          "vor 7 s" aendert jede Sekunde ihre Breite und
                          schiebt damit die ganze Zeile; der Blick folgt dann
                          der Bewegung statt der Aenderung. Die zeigt
                          `value-fresh`: der Wert leuchtet kurz auf und
                          verblasst wieder, ohne dass sich am Aufbau etwas
                          bewegt.
                        -->
                        <span
                          class="value col-right"
                          :class="{ 'value-fresh': signalIsFresh(signal) }"
                          :title="signalAgeTitle(signal)"
                          x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                        ></span>
                        <!-- Dasselbe Bedienelement wie in der Export-Spalte,
                             und das ist Absicht: beides ist ein Ja/Nein je
                             Signal in derselben Zeile. Der erste Entwurf
                             hatte hier einen Schiebeschalter - zwei
                             Bedienelemente fuer denselben Fall, genau die
                             Inkonsistenz, die dieses Modal schwer lesbar
                             machte. Die Regel: das Bedienelement folgt dem
                             BEHAELTER, nicht der Bedeutung. In einer Tabelle
                             Haekchen - sie fluchten in einer Spalte und
                             bleiben leise; eine Spalte aus 17
                             Schiebeschaltern waere eine deutlich lautere
                             Textur, und Lautstaerke ist genau das Problem
                             dieses Modals. Ein Schalter gehoert in einen
                             Detailbereich mit erklaerendem Satz daneben,
                             nicht in eine Tabellenspalte. -->
                        <label class="col-center">
                          <input
                            type="checkbox"
                            :checked="signal.resend"
                            :disabled="!signal.exportable"
                            :aria-label="t('web.signals.resend_checkbox')"
                            :title="t('web.signals.resend_checkbox')"
                            @change="toggleResend(signal)"
                          />
                        </label>
                        <!-- Die letzte Zelle traegt seit Aufgabe 8 nur noch
                             den Kebab, nichts sonst: die Warnpille mit
                             `signal.reason` sass hier zuvor in der 28-px-Spalte
                             und brach dort um, sobald der Text laenger war als
                             ein paar Zeichen (jedes Geraet mit einem TEXT- oder
                             listwertigen Signal, siehe `_UNEXPORTABLE_REASONS`
                             in `api/devices.py`) - gemessen 744px scrollWidth
                             gegen 719px clientWidth im Modal. Die Pille wohnt
                             jetzt im Aufklapper, wo Platz fuer echte Saetze
                             ist. -->
                        <button
                          class="signal-more"
                          :aria-expanded="expandedSignalKey === signal.key"
                          :aria-label="t('web.signals.row_details')"
                          :title="t('web.signals.row_details')"
                          @click="toggleSignalDetails(signal)"
                        ><svg class="icon" aria-hidden="true"><use href="#i-kebab"></use></svg></button>
                      </div>
                      <!-- Der Aufklapper haengt UNTER genau seiner Zeile,
                           nicht als zweite `.row` daneben: er gehoert zu
                           diesem einen Signal, und das soll man sehen.
                           `x-cloak` verhindert den kurzen Blitz aller
                           Aufklapper beim ersten Rendern, bevor Alpine
                           `x-show` ausgewertet hat. -->
                      <div class="signal-detail" x-show="expandedSignalKey === signal.key" x-cloak>
                        <!-- `signal.path` traegt dieselbe Auskunft als
                             "1/59/1", aber das ist ein Raetsel, solange
                             niemand sagt, welche Zahl was bedeutet - hier ist
                             endlich Platz, es auszuschreiben. Die Zerlegung
                             des Pfads (welches Segment das Element ist) steht
                             in `signalOriginText` (app.js), nicht hier im
                             Markup - Wissen ueber das Pfadformat gehoert in
                             eine benannte Funktion, nicht in einen Ausdruck
                             mitten im Markup (Fund 1 der Nachpruefung,
                             2026-09-07). -->
                        <p class="hint" x-text="signalOriginText(signal)"></p>
                        <p class="badge warn" x-show="!signal.exportable" x-text="signal.reason"></p>
                        <!-- Nur fuer Attribute sinnvoll - ein Ereignis hat
                             keinen gespeicherten Wert, den man ueberschreiben
                             koennte. Die Herkunft darueber gilt fuer beide
                             Signalarten, deshalb traegt nur DIESER Teil das
                             `x-show`. -->
                        <div class="row" x-show="isAttributeSignal(signal)">
                          <input
                            type="text"
                            :placeholder="t('web.signals.raw_write_placeholder')"
                            @input="rawWriteDrafts[signal.key] = $event.target.value"
                          />
                          <button
                            @click="writeRaw(signal)"
                            :disabled="rawWriteBusyKey === signal.key"
                            x-text="t('web.signals.raw_write_submit')"
                          ></button>
                          <span
                            x-show="rawWriteMessages[signal.key]"
                            :class="rawWriteMessageClass(signal)"
                            x-text="rawWriteMessages[signal.key] ? rawWriteMessages[signal.key].text : ''"
                          ></span>
                        </div>
                      </div>
                    </div>
                  </template>
                </details>
              </template>
            </div>
          </template>
        </div>
      </template>
    </dialog>

    <!--
      Kurzmeldungen als Overlay. `position: fixed` heisst: sie stehen
      ausserhalb des Textflusses und verschieben nichts. Die vorherige
      Fassung blendete eine Zeile ueber der Geraeteliste ein, wodurch beim
      Schalten die ganze Seite sprang und der naechste Klick daneben ging.
    -->
    <div class="toasts" aria-live="polite">
      <template x-for="toast in toasts" :key="toast.id">
        <div
          class="toast"
          :class="toast.isError ? 'toast-error' : 'toast-ok'"
          @click="dismissToast(toast.id)"
          :title="t('web.header.toast_dismiss_tooltip')"
          x-text="toast.text"
        ></div>
      </template>
    </div>

    <script defer src="/static/app.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </body>
</html>
