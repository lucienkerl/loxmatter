# loxmatter - translation table.
#
# Flat, dotted keys instead of a nested YAML structure: new namespaces
# (api.*, web.* in later phases) get added without restructuring existing
# entries. Every entry carries at least "en" - t() automatically falls
# back to "en" when "de" is missing (see i18n/__init__.py), never the
# other way round.
#
# test.* belongs to tests/test_i18n.py - deliberately with one entry
# WITHOUT "de" there, to demonstrate the fallback case with real data
# instead of maintaining a second file loaded only for tests.

test.greeting:
  en: "Hello, {name}!"
  de: "Hallo, {name}!"
test.english_only:
  en: "English only"

# web.test.smoke: a template deliberately named test-only (analogous to
# test.* above), so the WebUI translation pipeline can check itself against
# GET /api/i18n without depending on the real web.* table.
#
# DELIBERATELY WITHOUT {placeholder}: when this key was added,
# `api/language.py:_web_strings()` still called `i18n.t(key)` without
# values, and a placeholder raised `KeyError` there and took down the
# ENTIRE `GET /api/i18n` response, not just the one key - which broke four
# tests in tests/api/test_language.py at once. `_web_strings()` has since
# switched to `i18n.raw_template()`, and the browser fills placeholders in.
web.test.smoke:
  en: "smoke test"
  de: "Rauchtest"

