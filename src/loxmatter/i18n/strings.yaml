web.settings.resend_heading:
  en: "Periodic resend"
  de: "Periodischer Resend"
web.settings.resend_explanation:
  en: |
    Marked signals (the "resend periodically" checkbox in the signal list) are forcibly resent at this interval, even without a change – independently of that, a full restore still runs once at bridge startup and via "Resync" in the System section.
  de: |
    Markierte Signale (Haken „periodisch erneut senden" in der Signalliste) werden in diesem Takt zwangsweise erneut gesendet, auch ohne Änderung - unabhängig davon läuft ein voller Restore weiterhin einmalig beim Bridge-Start und über „Erneut synchronisieren" im Bereich Diagnose.
