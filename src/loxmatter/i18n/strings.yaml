web.system.resync_heading:
  en: "Resend all values"
  de: "Alle Werte erneut senden"
web.system.resync_explanation:
  en: |
    Sends every known value to the Miniserver once more. The same full resend runs by itself when the bridge starts, and when the Miniserver calls /resync from the system-start block of the Config project - this button is the third way to trigger it, for when the values in Loxone look stale.
  de: |
    Schickt jeden bekannten Wert erneut an den Miniserver. Derselbe volle Resend laeuft von allein beim Bridge-Start und wenn der Miniserver /resync aus dem Systemstart-Baustein des Config-Projekts aufruft - dieser Knopf ist der dritte Weg dorthin, fuer den Fall, dass die Werte in Loxone veraltet aussehen.
