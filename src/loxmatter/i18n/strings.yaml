# The category names for `api.errors.group_category_mismatch` below.
# Deliberately a SEPARATE table from `web.devices.category.*`
# (strings.yaml, rooms/search section) rather than the store reaching for
# that one: `Store` sits a layer below `api/` (module docstring, Store),
# which sits below the WebUI - a lookup that crossed back up to a
# WebUI-owned key would tie the store's wording to a namespace it has no
# business knowing exists. Today's words happen to match
# `web.devices.category.*` because both name the same eight `Category`
# values (`profiles/categories.py`) - that is convenience, not a
# guarantee this table leans on.
