              <input type="number" :value="bridgeSettings.listen_port" readonly />
            </label>
          </div>
          <p class="hint">
            <span x-text="t('web.export.settings_hint_prefix')"></span>
            <a href="#/settings" x-text="t('web.settings.miniserver_link')"></a>
            <span x-text="t('web.export.settings_hint_suffix')"></span>
          </p>
          <div class="row">
            <label class="checkbox-label"
              ><input type="checkbox" x-model="exportIncludeSystem" />
              <span x-text="t('web.export.include_system')"></span
            ></label>
            <label class="checkbox-label"
              ><input type="checkbox" x-model="exportOnlyPending" />
              <span x-text="t('web.export.only_pending')"></span
            ></label>
          </div>
          <p class="hint" x-html="t('web.export.filter_explanation')"></p>
          <div class="row">
            <button
              class="primary"
              @click="previewExport()"
              :disabled="exportBusy"
              x-text="t('web.export.preview_button')"
            ></button>
            <!--
              An `<a href>` would show an error response (401 after an expired

              via `fetch()` (see `downloadExport` in app.js).

            <button
              class="primary"
              @click="downloadExport()"
              x-text="t('web.export.download_button')"
            ></button>
          </div>
          <p x-show="exportError" x-cloak class="banner danger" x-text="exportError"></p>
        </div>

        <div class="card" x-show="exportPreview" x-cloak>
          <h2 x-text="t('web.export.preview_heading')"></h2>
          <div style="overflow-x: auto">
            <table>
              <thead>
                <tr>
                  <th x-text="t('web.export.col_device')"></th>
                  <th x-text="t('web.export.col_viu')"></th>
                  <th x-text="t('web.export.col_vo')"></th>
                  <th x-text="t('web.export.col_inputs')"></th>
                  <th x-text="t('web.export.col_commands')"></th>
                  <th x-text="t('web.export.col_skipped')"></th>
                  <th x-text="t('web.export.col_expert_withheld')"></th>
                  <th x-text="t('web.export.col_last_exported')"></th>

          </p>

      <!-- ================================================================
           View 3: System
           ================================================================ -->
      <section x-show="view === 'system'" x-cloak>
        <!-- An action, not a diagnostic - hence before the system checks and
             not between the log views further down. The button triggers
             the same full resend as the bridge start and as
             /resync from the config project (Spec 6.4), just via
             POST /api/diagnostics/resync, which sits behind the guard. -->
        <div class="card">
          <h2 x-text="t('web.system.resync_heading')"></h2>
          <p class="hint" x-text="t('web.system.resync_explanation')"></p>
          <button
            @click="resyncAll()"
            :disabled="resyncBusy"
            x-text="t('web.system.resync_button')"
          ></button>
          <p x-show="resyncError" x-cloak class="banner danger" x-text="resyncError"></p>
        </div>

        <div class="card">
          <div class="row">
            <h2 style="margin: 0" x-text="t('web.system.checks_heading')"></h2>
            <button @click="loadSystem()" :disabled="diagnosticsBusy" x-text="t('web.system.refresh')"></button>
          </div>
          <p x-show="systemError" x-cloak class="banner danger" x-text="systemError"></p>
          <ul class="system-check-list">
            <template x-for="check in systemChecks" :key="check.name">
              <li>
                <span
                  class="badge"
                  :class="check.ok ? 'ok' : 'danger'"
                  x-text="check.ok ? t('web.system.check_ok') : t('web.system.check_error')"
                ></span>
                <strong x-text="check.name"></strong>
                <span x-text="check.detail"></span>
              </li>
            </template>
          </ul>
        </div>

        <!--
          Live diagnostics (Task 6, Spec 10.5): ONE WebSocket
          (`/api/diagnostics/live`, opened/closed in `selectView`,
          app.js) continuously fills the three streams below instead of the previous
          one-off GET. This single card carries the four controls
          for all three areas - no separate set per area, there is only
          one connection and one paused state for all three.
        -->
        <div class="card">
          <div class="row">
            <h2 style="margin: 0" x-text="t('web.system.live_heading')"></h2>
            <span class="connection-status">
              <span class="dot" :class="diagnosticsConnected ? 'online' : 'offline'"></span>
              <span
                x-text="diagnosticsConnected ? t('web.connection.live') : t('web.system.diag_disconnected')"
              ></span>
            </span>
          </div>
          <div class="row">
            <button
              @click="diagnosticsPaused = !diagnosticsPaused"
              x-text="diagnosticsPaused ? t('web.system.resume') : t('web.system.pause')"
            ></button>
            <label class="checkbox-label">
              <input type="checkbox" x-model="hideNoise" />
              <span x-text="t('web.system.hide_noise')"></span>
            </label>
            <label>
              <!--
                No "Debug" here (follow-up Task 7, Fix 3f): the ring
                is pinned server-side to INFO (`install_log_buffer()` sets
                both the handler and the logger level, see cli.py), so DEBUG
                lines never arrive. An option that never shows
                anything other than "Info" would be an empty promise -
                see the design, Section 7, point 2, for the (so far
                missing) DEBUG switch that would change that.
              -->
              <span x-text="t('web.system.log_level_label')"></span>
              <select x-model="logLevel">
                <option value="INFO" x-text="t('web.system.log_level_info')"></option>
                <option value="WARNING" x-text="t('web.system.log_level_warn')"></option>
                <option value="ERROR" x-text="t('web.system.check_error')"></option>
                <option value="CRITICAL" x-text="t('web.system.log_level_critical')"></option>
              </select>
            </label>
            <button @click="clearDiagnosticsBuffers()" x-text="t('web.system.clear')"></button>
          </div>
          <p class="hint" x-html="t('web.system.pause_clear_explanation')"></p>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.logs_heading')"></h2>
          <p class="hint" x-text="t('web.system.logs_hint')"></p>
          <div class="log-list" x-ref="diagnosticsLogsList">
            <template x-for="(entry, index) in visibleDiagnosticsLogs()" :key="index">
              <div
                class="entry"
                x-text="entry.timestamp + '  [' + entry.level + '] ' + entry.logger + ': ' + entry.message"
              ></div>
            </template>
          </div>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.udp_heading')"></h2>
          <p class="hint" x-text="t('web.system.udp_hint')"></p>
          <div class="log-list" x-ref="datagramsList">
            <template x-for="(entry, index) in visibleDatagrams()" :key="index">
              <div
                class="entry"
                x-text="entry.timestamp + '  ' + entry.key + ' = ' + entry.value"
              ></div>
            </template>
          </div>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.command_log_heading')"></h2>
          <p class="hint" x-text="t('web.system.command_log_hint')"></p>
          <div class="log-list">
            <template x-for="(entry, index) in commandLog" :key="index">
              <div
                class="entry"
                x-text="entry.timestamp + '  ' + entry.method + ' ' + entry.path + ' -> ' + entry.status"
              ></div>
            </template>
          </div>
        </div>

        <div class="card">
          <h2 x-text="t('web.system.backup_heading')"></h2>
          <p class="hint" x-text="t('web.system.backup_explanation')"></p>
          <p class="hint" x-text="t('web.system.backup_access_note')"></p>
          <button @click="downloadFabricBackup()" x-text="t('web.system.backup_download')"></button>
          <p x-show="backupError" x-cloak class="banner danger" x-text="backupError"></p>
        </div>
      </section>

      <!-- ================================================================
           View 4: Settings
           ================================================================ -->
      <section x-show="view === 'settings'" x-cloak>
        <div class="card">
          <h2 x-text="t('web.settings.connection_heading')"></h2>
          <p class="hint" x-html="t('web.settings.connection_explanation')"></p>

              ><span x-text="t('web.bridge_ip_label')"></span>
              <input

            <label
              ><span x-text="t('web.settings.udp_port_label')"></span>
              <input type="number" x-model.number="settingsDraft.udp_port" />

            <label>
              <span x-text="t('web.settings.http_port_label')"></span>

          <div class="row">
            <button
              class="primary"
              @click="saveSettings()"
              :disabled="settingsBusy"
              x-text="t('web.settings.save')"
            ></button>
            <span class="hint" x-show="bridgeSettings.saved_at" x-cloak
              ><span x-text="t('web.settings.last_saved_prefix')"></span
              ><span x-text="formatTimestamp(bridgeSettings.saved_at)"></span
            ></span>
            <span
              class="hint"
              x-show="!bridgeSettings.saved_at"
              x-cloak
              x-text="t('web.settings.never_saved')"

          </div>
          <p x-show="settingsError" x-cloak class="banner danger" x-text="settingsError"></p>
        </div>

        <div class="card">
          <h2 x-text="t('web.settings.language_heading')"></h2>
          <nav class="tabs">
            <button
              :class="{ active: language === 'en' }"
              @click="setLanguage('en')"
              :disabled="settingsBusy"
              x-text="t('web.settings.language_en')"
            ></button>
            <button
              :class="{ active: language === 'de' }"
              @click="setLanguage('de')"
              :disabled="settingsBusy"
              x-text="t('web.settings.language_de')"

        <div class="card">
          <h2 x-text="t('web.settings.resend_heading')"></h2>

    </main>
    </div>
    </template>

    <!--
      Signal modal (design "Signals as a modal", 2026-09-05). Exactly ONE
      `<dialog>` for the whole page, deliberately outside the `x-for`
      loop over the device tiles: markup inside `x-for` is delivered once PER
      DEVICE - with thirty devices there would be thirty
      complete signal tables in the document, and every `id` inside them
      thirtyfold (the same pitfall that `aria-labelledby` in the
      tile menu already had to steer around once).

      It also sits outside the login `<template>`, like the
      toasts below: this way `$refs.signalsModal` is always
      resolvable and does not depend on whether Alpine happens to be
      rendering the logged-in subtree right now.

      `x-ref` is permitted here, even though the comment on the tile menu
      (Finding 3) explicitly advises against it. The objection there applies to a
      registration that runs PER TILE: the page shares a single
      `x-data` on the `<body>`, and the entry of the most recently
      rendered tile overwrites every one before it. This `<dialog>` sits
      exactly once in the document - nobody can overwrite it. The same
      situation as with `x-ref="diagnosticsLogsList"` and `x-ref="datagramsList"`
      further above, which are unproblematic for the same reason.

      `@close` is the ONLY place that resets
      `signalsModalDevice`. The event fires on every way of closing - Escape,
      the close button, the backdrop, `close()` from JavaScript - so there is also
      no path on which the Alpine state and the visible state
      can drift apart. The same role that `@toggle` plays for the
      `<details>` of the tile menu. Do NOT add further resets at
      the individual closing paths - exactly this spread across
      several handlers was the cause of six rounds of review for the room
      selection field.

      Aus demselben Grund setzt derselbe Handler seit Fund 3 der
      Nachpruefung (2026-09-07) zusaetzlich `expandedSignalKey` zurueck:
      ohne das stuende beim naechsten Oeffnen desselben Geraets sofort
      wieder derselbe Aufklapper offen, ohne dass der Kebab dafuer geklickt
      wurde - `@close` ist ja auch fuer dieses Feld der einzige Weg, auf dem
      ALLE Schliesspfade zusammenlaufen.

      Ein `<dialog>` schliesst bei einem Klick auf den Backdrop NICHT von
      selbst (anders als es Escape tut). `@click.self` allein reicht dafuer
      NICHT: der Klick-Ereignis-Ziel ist `<dialog>` schon dann, wenn ein
      Mousedown IM Inhalt beginnt (etwa beim Markieren eines Signaltitels)
      und der Mouseup beim Ueberziehen auf dem Backdrop landet - `.self`
      prueft nur das Klick-Ziel, nicht wo die Geste angefangen hat. Deshalb
      merkt sich `@mousedown` in `signalsModalBackdropMousedown` (app.js),
      ob der Mousedown SELBST auf dem Backdrop lag. Der Klick-Handler
      schliesst nur, wenn DREI Dinge zutreffen: `.self` (das Klick-Ziel ist
      das `<dialog>`), dieses gemerkte Feld, und `isBackdropEvent` fuer den
      Klick selbst - die Lage zaehlt also an beiden Enden der Geste, nicht
      nur am Anfang (Begruendung dafuer weiter unten). Das Feld ist reine
      Praesentations-Buchfuehrung fuer diese eine Geste, kein Modal-Zustand
      wie `signalsModalDevice` - `@close` bleibt dessen einzige
      Ruecksetzstelle, siehe oben.

      The mousedown handler deliberately carries NO `.self` (Finding 1 of
      the follow-up check): with `.self`, the field would only be SET when the
      mousedown was on the backdrop, and only cleared again inside `@click.self`
      - but Alpine skips a `.self` expression entirely
      when the target does not match. A mousedown on the backdrop that never ends in
      a click on the `<dialog>` (Escape with the button held down,
      releasing outside the window), would leave the field permanently at
      `true` - and the next drag starting from the content
      would then close the modal in exactly the way this rework is meant to
      prevent. Without `.self` the handler runs on EVERY mousedown in the subtree
      and rewrites the field every time; a stale value cannot survive one
      gesture.

      `isBackdropEvent` (app.js) decides whether a mouse event really was
      on the backdrop. The target alone is not enough for that: the modal's own
      scrollbar also belongs to the `<dialog>` and delivers
      the same target - without the distinction, a grab at it would close the
      modal, of all things for the long lists it exists for
      in the first place (a device with 159 signals). The helper therefore compares the
      position against the dialog's rectangle; the reasoning, including the
      discarded `offsetX` variant, is documented at it.

      This is checked at BOTH ends of the gesture - mousedown as well as click.
      Otherwise a drag from the backdrop INTO the content would also close the
      modal: the click event fires at the nearest common ancestor
      of the mousedown and mouseup targets, and in this direction
      that is again the `<dialog>`.

      `aria-labelledby` refers to a FIXED `id` on the heading,
      unlike the `aria-labelledby` in the tile menu further above, which
      has to derive its id from `device.id` - there, the binding
      exists once PER TILE, here the `<dialog>` sits exactly once in the
      document (see above), so a fixed id cannot collide.
    -->
    <dialog
      x-ref="signalsModal"
      class="signals-modal"
      aria-labelledby="signals-modal-heading"
      @close="signalsModalDevice = null; expandedSignalKey = null"
      @mousedown="signalsModalBackdropMousedown = isBackdropEvent($event, $el)"
      @click.self="if (signalsModalBackdropMousedown && isBackdropEvent($event, $el)) $el.close(); signalsModalBackdropMousedown = false"
    >
      <template x-if="signalsModalDeviceObject()">
        <div class="signals-modal-body">
          <div class="signals-modal-head">
            <h2
              id="signals-modal-heading"
              x-text="t('web.signals.modal_heading', { device: signalsModalDeviceObject().label })"
            ></h2>
            <span style="flex: 1 1 auto"></span>
            <button
              class="signals-modal-close"
              :title="t('web.signals.modal_close')"
              :aria-label="t('web.signals.modal_close')"
              @click="closeSignalsModal()"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>

          <!-- Die eine Zahl, wegen der man dieses Modal oeffnet. Sie stand
               bisher nirgends - man musste 17 Haekchen zaehlen. -->
          <div class="signals-summary">
            <span
              x-text="t('web.signals.export_summary', { exported: exportedSignalCount(signalsModalDevice), total: signalCount(signalsModalDevice) })"
            ></span>
            <span style="flex: 1 1 auto"></span>
            <button
              @click="deselectAllSignals(signalsModalDevice)"
              x-text="t('web.signals.deselect_all')"
            ></button>
          </div>

          <p x-show="signalsError" x-cloak class="banner danger" x-text="signalsError"></p>
          <p class="hint">
            <span x-text="t('web.signals.key_hint')"></span>
            <span x-text="t('web.signals.resend_explanation')"></span>
          </p>

          <!-- Stays as a retry for the error case: normally
               `startApp` has long since loaded every device's signals, so this
               button only shows up when this one particular fetch
               has failed (the reason is in the banner above it). -->
          <button
            x-show="!signalsByDevice[signalsModalDevice]"
            @click="loadSignals(signalsModalDevice)"
            x-text="t('web.signals.load_button')"
          ></button>

          <template x-if="signalsByDevice[signalsModalDevice]">
            <div>
              <!--
                EINE Vorlage fuer alle Gruppen. Der naheliegende Entwurf -
                funktional als schlichter Block, Experte als `<details>` -
                braeuchte zwei Zweige und in jedem eine eigene Kopie der
                Signalzeile darunter. Genau diese Verdopplung hat
                `signalGroupsFor` (app.js) abgeschafft: 51 byte-identische
                Zeilen, die bei jeder Aenderung an beiden Stellen
                nachgezogen werden mussten.

                The open/closed state lives in the DOM, not in Alpine - the same
                pattern as the tile menu, and the reason why the old
                global open/close toggle (Task 8) is removed without replacement.

                `x-init` instead of `:open` is mandatory, not a style choice: Alpine
                re-evaluates a BINDING every time its dependencies change,
                and `signalGroupsFor` depends on `signalsByDevice` - saving a
                signal title would rewrite `:open` and
                silently collapse the expert group that was just open again.
                `x-init` runs once per element; since `:key` with
                `group.key` is stable, Alpine does not rebuild the node on a
                re-render, and the user's click stays put. Do NOT simplify this to
                `:open`.
              -->
              <!-- Ausserhalb der Gruppenschleife, seit die Gruppen nach
                   Endpunkt entstehen (Entwurf 2026-09-07, Abschnitt 7.4):
                   eine Endpunktgruppe ist nie leer, sie entsteht ja aus
                   ihren Signalen. "Keine funktionalen Signale" heisst
                   jetzt "es gibt gar keine Endpunktgruppe". -->
              <p
                class="hint"
                x-show="functionalSignalsFor(signalsModalDevice).length === 0"
                x-text="t('web.signals.none_functional')"
              ></p>
              <!-- Der Spaltenkopf klebt beim Scrollen oben: ohne ihn
                   verlieren die beiden Haekchenspalten ihre Bedeutung,
                   sobald er bei 173 Signalen aus dem Bild ist. Er traegt
                   DIESELBE `grid-template-columns` wie jede Datenzeile -
                   das ist der ganze Grund, warum die Tabelle fluchtet, und
                   der Test `test_the_signal_rows_and_the_header_share_one_
                   grid` sperrt genau diese Gleichheit. -->
              <div class="signal-grid signal-grid-head">
                <span x-text="t('web.signals.col_export')"></span>
                <span x-text="t('web.signals.col_signal')"></span>
                <span x-text="t('web.signals.col_input')"></span>
                <span class="col-right" x-text="t('web.signals.col_value')"></span>
                <span class="col-center" x-text="t('web.signals.col_resend')"></span>
                <span></span>
              </div>
              <template x-for="group in signalGroupsFor(signalsModalDevice)" :key="group.key">
                <details class="signal-group" x-init="$el.open = !group.collapsible">
                  <summary>
                    <span x-text="group.title"></span>
                    <span class="muted" x-show="group.subtitle" x-text="group.subtitle"></span>
                    <span class="muted" x-text="'(' + group.signals.length + ')'"></span>
                    <!-- `aria-hidden` like on the kebab icon and the modal's close
                         button, NOT like on the older chevron of the
                         project-file-sync disclosures: a decorative icon in
                         a control that already has a name (the `<summary>`
                         carries the group title and count) must not give the
                         accessibility tree a second, competing name. -->
                    <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
                  </summary>
                  <p
                    class="hint"
                    x-show="group.collapsible"
                    x-text="t('web.signals.functional_vs_expert_explanation')"
                  ></p>
                  <!-- `x-for` verlangt genau EIN Wurzelelement je Signal.
                       Die Rasterzeile allein waere das normalerweise (siehe
                       Entwurf 2026-09-07, Abschnitt 7.2) - der Aufklapper
                       direkt darunter braucht deshalb diese Huelle, obwohl
                       er selbst kein Rasterkind ist. -->
                  <template x-for="signal in group.signals" :key="signal.key">
                    <div class="signal-row-wrap" :class="{ 'is-expanded': expandedSignalKey === signal.key }">
                      <div class="signal-grid signal-row-cells">
                        <label class="col-center">
                          <input
                            type="checkbox"
                            :checked="signal.exported"
                            :disabled="!signal.exportable"
                            :aria-label="t('web.signals.export_checkbox')"
                            :title="t('web.signals.export_checkbox')"
                            @change="toggleExported(signal)"
                          />
                          <!-- Nur unter 640px sichtbar (`.col-center-label`
                               in style.css), dort ohne Spaltenkopf die
                               einzige sichtbare Beschriftung des Kaestchens.
                               `aria-hidden`, weil das Kaestchen sein
                               `aria-label` bereits traegt - dieser Text ist
                               dieselbe Auskunft nur ein zweites Mal sichtbar,
                               keine zweite fuer Hilfstechnik. -->
                          <span
                            class="col-center-label"
                            aria-hidden="true"
                            x-text="t('web.signals.export_checkbox')"
                          ></span>
                        </label>
                        <input
                          type="text"
                          class="signal-title"
                          :value="signal.title"
                          @input="titleDrafts[signal.key] = $event.target.value"
                          @change="saveTitle(signal)"
                        />
                        <span class="key" :title="t('web.signals.key_tooltip')" x-text="signal.key"></span>
                        <!--
                          When the value last arrived is in the `title` - not
                          next to it in the running text (2026-09-03). A note like
                          "7s ago" changes its width every second and
                          thereby shifts the whole row; the eye then follows
                          the movement instead of the change. `value-fresh` shows
                          that instead: the value briefly lights up and
                          fades again, without anything in the layout
                          moving.
                        -->
                        <span
                          class="value col-right"
                          :class="{ 'value-fresh': signalIsFresh(signal) }"
                          :title="signalAgeTitle(signal)"
                          x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                        ></span>
                        <!-- Dasselbe Bedienelement wie in der Export-Spalte,
                             und das ist Absicht: beides ist ein Ja/Nein je
                             Signal in derselben Zeile. Der erste Entwurf
                             hatte hier einen Schiebeschalter - zwei
                             Bedienelemente fuer denselben Fall, genau die
                             Inkonsistenz, die dieses Modal schwer lesbar
                             machte. Die Regel: das Bedienelement folgt dem
                             BEHAELTER, nicht der Bedeutung. In einer Tabelle
                             Haekchen - sie fluchten in einer Spalte und
                             bleiben leise; eine Spalte aus 17
                             Schiebeschaltern waere eine deutlich lautere
                             Textur, und Lautstaerke ist genau das Problem
                             dieses Modals. Ein Schalter gehoert in einen
                             Detailbereich mit erklaerendem Satz daneben,
                             nicht in eine Tabellenspalte. -->
                        <label class="col-center">
                          <input
                            type="checkbox"
                            :checked="signal.resend"
                            :disabled="!signal.exportable"
                            :aria-label="t('web.signals.resend_checkbox')"
                            :title="t('web.signals.resend_checkbox')"
                            @change="toggleResend(signal)"
                          />
                          <!-- Wie bei der Export-Spalte: nur unter 640px
                               sichtbar, `aria-hidden` aus demselben Grund -
                               das Kaestchen hat mit `aria-label` schon
                               seinen Namen. -->
                          <span
                            class="col-center-label"
                            aria-hidden="true"
                            x-text="t('web.signals.resend_checkbox')"
                          ></span>
                        </label>
                        <!-- Die letzte Zelle traegt seit Aufgabe 8 nur noch
                             den Kebab, nichts sonst: die Warnpille mit
                             `signal.reason` sass hier zuvor in der 28-px-Spalte
                             und brach dort um, sobald der Text laenger war als
                             ein paar Zeichen (jedes Geraet mit einem TEXT- oder
                             listwertigen Signal, siehe `_UNEXPORTABLE_REASONS`
                             in `api/devices.py`) - gemessen 744px scrollWidth
                             gegen 719px clientWidth im Modal. Die Pille wohnt
                             jetzt im Aufklapper, wo Platz fuer echte Saetze
                             ist. -->
                        <button
                          class="signal-more"
                          :aria-expanded="expandedSignalKey === signal.key"
                          :aria-label="t('web.signals.row_details')"
                          :title="t('web.signals.row_details')"
                          @click="toggleSignalDetails(signal)"
                        ><svg class="icon" aria-hidden="true"><use href="#i-kebab"></use></svg></button>
                      </div>
                      <!-- Der Aufklapper haengt UNTER genau seiner Zeile,
                           nicht als zweite `.row` daneben: er gehoert zu
                           diesem einen Signal, und das soll man sehen.
                           `x-cloak` verhindert den kurzen Blitz aller
                           Aufklapper beim ersten Rendern, bevor Alpine
                           `x-show` ausgewertet hat. -->
                      <div class="signal-detail" x-show="expandedSignalKey === signal.key" x-cloak>
                        <!-- `signal.path` traegt dieselbe Auskunft als
                             "1/59/1", aber das ist ein Raetsel, solange
                             niemand sagt, welche Zahl was bedeutet - hier ist
                             endlich Platz, es auszuschreiben. Die Zerlegung
                             des Pfads (welches Segment das Element ist) steht
                             in `signalOriginText` (app.js), nicht hier im
                             Markup - Wissen ueber das Pfadformat gehoert in
                             eine benannte Funktion, nicht in einen Ausdruck
                             mitten im Markup (Fund 1 der Nachpruefung,
                             2026-09-07). -->
                        <p class="hint" x-text="signalOriginText(signal)"></p>
                        <p class="badge warn" x-show="!signal.exportable" x-text="signal.reason"></p>
                        <!-- Nur fuer Attribute sinnvoll - ein Ereignis hat
                             keinen gespeicherten Wert, den man ueberschreiben
                             koennte. Die Herkunft darueber gilt fuer beide
                             Signalarten, deshalb traegt nur DIESER Teil das
                             `x-show`. -->
                        <div class="row" x-show="isAttributeSignal(signal)">
                          <input
                            type="text"
                            :placeholder="t('web.signals.raw_write_placeholder')"
                            @input="rawWriteDrafts[signal.key] = $event.target.value"
                          />
                          <button
                            @click="writeRaw(signal)"
                            :disabled="rawWriteBusyKey === signal.key"
                            x-text="t('web.signals.raw_write_submit')"
                          ></button>
                          <span
                            x-show="rawWriteMessages[signal.key]"
                            :class="rawWriteMessageClass(signal)"
                            x-text="rawWriteMessages[signal.key] ? rawWriteMessages[signal.key].text : ''"
                          ></span>
                        </div>
                      </div>
                    </div>
                  </template>
                </details>
              </template>
            </div>
          </template>
        </div>
      </template>
    </dialog>

    <!--
      Bedien-Modal (Aufgabe 7): Regler statt nackter Zahlenfelder fuer
      wertbehaftete Kommandos. Aufbau, Oeffnen, Schliessen und
      Backdrop-Klick folgen exakt dem Signal-Modal oben - siehe dessen
      Kommentare fuer die vollstaendige Begruendung: `@close` bleibt die
      EINZIGE Stelle, die `controlModalDevice` zuruecksetzt; `@mousedown`
      merkt in `controlModalBackdropMousedown`, ob die Geste auf dem
      Backdrop begann, `@click.self` prueft `isBackdropEvent` an BEIDEN
      Enden; `x-ref` ist unbedenklich, weil dieses `<dialog>` genau einmal
      im Dokument steht.

      Welches Bedienelement je Kommando entsteht, entscheidet
      AUSSCHLIESSLICH `command.control` (`controlsByKind` filtert danach) -
      `command.slug` dient unten nur als Beschriftung, nie als
      Fallunterscheidung. Deshalb traegt jeder Prozent-Regler seinen
      eigenen `command.slug` statt einer festen Uebersetzung: die
      eingecheckte IKEA-Leuchte akzeptiert zwei Prozent-Kommandos (`level`
      und `level_onoff`), das Modal zeichnet also zwei Regler
      untereinander, und fuer die Diagnose zaehlt gerade, welches der
      beiden die Leuchte tatsaechlich befolgt. Der Kelvin-Regler bleibt
      fest beschriftet - davon gibt es je Geraet nur einen.

      Die Reiterleiste Weiss/Farbe erscheint nur, wenn ein Geraet BEIDE
      Wege kann (`hasColourTabs`) - eine reine Weisston-Leuchte bekommt
      ihren Kelvin-Regler ohne Reiter, ohne dass hier eine einzige Abfrage
      auf Geraetetyp oder Modell stuende.
    -->
    <!-- Zwei Klassen mit Absicht: `signals-modal` traegt allein die Rahmung
         (style.css), die sich beide Modale teilen; `control-modal`
         unterscheidet dieses hier ueberhaupt erst vom Signal-Modal. Ohne die
         zweite Klasse trifft `document.querySelector('dialog.signals-modal')`
         beide, und WELCHEN es liefert, entscheidet allein die Reihenfolge im
         Dokument - `scripts/capture_screenshots.py` haengt daran. -->
    <dialog
      x-ref="controlModal"
      class="signals-modal control-modal"
      aria-labelledby="control-modal-heading"
      @close="controlModalDevice = null"
      @mousedown="controlModalBackdropMousedown = isBackdropEvent($event, $el)"
      @click.self="if (controlModalBackdropMousedown && isBackdropEvent($event, $el)) $el.close(); controlModalBackdropMousedown = false"
    >
      <template x-if="controlModalDeviceObject()">
        <div class="signals-modal-body">
          <div class="signals-modal-head">
            <h2
              id="control-modal-heading"
              x-text="t('web.devices.control_modal_title', { label: controlModalDeviceObject().label })"
            ></h2>
            <span style="flex: 1 1 auto"></span>
            <button
              class="signals-modal-close"
              :title="t('web.signals.modal_close')"
              :aria-label="t('web.signals.modal_close')"
              @click="closeControlModal()"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>

          <template x-for="command in controlsByKind(controlModalDevice, 'none')" :key="command.key">
            <button
              @click="executeCommand(controlModalDeviceObject(), command)"
              :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
              x-text="command.slug"
            ></button>
          </template>

          <!-- Prozent-Regler: Beschriftung ist `command.slug`, NICHT eine
               feste Uebersetzung - Begruendung im Kommentar oben am
               `<dialog>`. -->
          <template x-for="command in controlsByKind(controlModalDevice, 'percent')" :key="command.key">
            <div class="control-row">
              <label x-text="command.slug"></label>
              <input
                type="range" min="0" max="100" step="1"
                :value="controlDrafts.percent ?? 50"
                :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                @change="recordControlDraft(command, Number($event.target.value)); sendControl(controlModalDeviceObject(), command, $event.target.value)"
              />
              <p
                class="hint"
                x-show="controlDrafts.percent === undefined"
                x-text="t('web.devices.control_start_value_unknown')"
              ></p>
            </div>
          </template>

          <!-- Tableiste: nur sichtbar, wenn das Geraet beide Wege kann
               (`hasColourTabs`) - eine CCT- oder eine reine Farbleuchte
               sieht keine Reiter. -->
          <div class="control-tabs" x-show="hasColourTabs(controlModalDevice)">
            <button :class="{ 'is-active': controlTab === 'white' }"
                    @click="controlTab = 'white'"
                    x-text="t('web.devices.control_tab_white')"></button>
            <button :class="{ 'is-active': controlTab === 'colour' }"
                    @click="controlTab = 'colour'"
                    x-text="t('web.devices.control_tab_colour')"></button>
          </div>

          <div x-show="!hasColourTabs(controlModalDevice) || controlTab === 'white'">
            <template x-for="command in controlsByKind(controlModalDevice, 'kelvin')" :key="command.key">
              <div class="control-row">
                <label x-text="t('web.devices.control_colortemp')"></label>
                <input
                  x-show="command.range"
                  type="range" :min="command.range?.min" :max="command.range?.max" step="10"
                  :value="controlDrafts.kelvin ?? command.range?.min"
                  :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                  @change="recordControlDraft(command, Number($event.target.value)); sendControl(controlModalDeviceObject(), command, $event.target.value)"
                />
                <!-- Hinweis fuer fehlenden Startwert, wenn der Regler sichtbar ist -->
                <p
                  class="hint"
                  x-show="command.range && controlDrafts.kelvin === undefined"
                  x-text="t('web.devices.control_start_value_unknown')"
                ></p>
                <p class="hint" x-show="!command.range" x-text="t('web.devices.control_no_range')"></p>
                <span x-show="!command.range" class="row">
                  <input
                    type="number"
                    :placeholder="t('web.devices.value_placeholder')"
                    @input="commandValueDrafts[command.key] = $event.target.value"
                  />
                  <button
                    @click="executeCommand(controlModalDeviceObject(), command)"
                    :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                    x-text="t('web.devices.send')"
                  ></button>
                </span>
              </div>
            </template>
          </div>

          <div x-show="!hasColourTabs(controlModalDevice) || controlTab === 'colour'">
            <template x-for="command in controlsByKind(controlModalDevice, 'hue_sat')" :key="command.key">
              <div class="control-row">
                <!-- Der Marker sitzt IM Feld, nicht daneben: `hue` und
                     `saturation` wurden bisher gelesen (`readStartValues`)
                     und nirgends gezeigt - ein Farbwaehler, der die
                     eingestellte Farbe verschweigt, ist keiner (Befund M-4,
                     Abschluss-Review 2026-09-08). `x-show` statt eines
                     Randfalls in der Position: fehlt der Wert, gibt es
                     keinen Punkt, und der Hinweis darunter sagt warum. -->
                <div
                  class="colour-field"
                  :class="{ 'is-busy': commandBusyKey === command.key || !isOnline(controlModalDeviceObject()) }"
                  @pointerup="pickColour($event, controlModalDeviceObject(), command)"
                >
                  <span
                    class="colour-marker"
                    x-show="controlDrafts.hue !== undefined && controlDrafts.saturation !== undefined"
                    :style="colourMarkerStyle()"
                  ></span>
                </div>
                <p class="hint" x-text="t('web.devices.control_colour_hint')"></p>
                <p class="hint" x-show="controlDrafts.hue === undefined"
                   x-text="t('web.devices.control_start_value_unknown')"></p>
              </div>
            </template>
          </div>

          <!-- Rueckfall auf das schlichte Zahlenfeld: nicht nur fuer
               `control: "unknown"`, sondern fuer JEDEN `control`-Wert, den
               diese Oberflaeche nicht kennt (`unhandledControls`, Befund
               I-2 im Abschluss-Review 2026-09-08) - sonst verschwindet ein
               kuenftig in `clusters.yaml` eingetragener, hier noch
               unbekannter Wert spurlos aus dem Modal. -->
          <template x-for="command in unhandledControls(controlModalDevice)" :key="command.key">
            <span class="row">
              <span x-text="command.slug"></span>
              <input
                type="number"
                :placeholder="t('web.devices.value_placeholder')"
                @input="commandValueDrafts[command.key] = $event.target.value"
              />
              <button
                @click="executeCommand(controlModalDeviceObject(), command)"
                :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                x-text="t('web.devices.send')"
              ></button>
            </span>
          </template>
        </div>
      </template>
    </dialog>

    <!--
      Kurzmeldungen als Overlay. `position: fixed` heisst: sie stehen
      ausserhalb des Textflusses und verschieben nichts. Die vorherige
      Fassung blendete eine Zeile ueber der Geraeteliste ein, wodurch beim
      Schalten die ganze Seite sprang und der naechste Klick daneben ging.
    -->
    <div class="toasts" aria-live="polite">
      <template x-for="toast in toasts" :key="toast.id">
        <div
          class="toast"
          :class="toast.isError ? 'toast-error' : 'toast-ok'"
          @click="dismissToast(toast.id)"
          :title="t('web.header.toast_dismiss_tooltip')"
          x-text="toast.text"
        ></div>
      </template>
    </div>

    <script defer src="/static/app.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </body>
</html>
