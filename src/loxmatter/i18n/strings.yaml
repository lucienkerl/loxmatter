# --- web.export.projectsync — project file sync card ---
web.export.projectsync_heading:
  en: "Project file sync"
  de: "Projektdatei-Sync"
web.export.projectsync_intro:
  en: |
    Upload an existing Loxone project file – existing virtual inputs/outputs are updated, new signals are added, and new devices get inputs/outputs of their own. Nothing is downloaded before you have seen the plan.
  de: |
    Bestehende Loxone-Projektdatei hochladen – vorhandene virtuelle Ein-/Ausgänge werden aktualisiert, neue Signale ergänzt, und neue Geräte bekommen eigene Ein-/Ausgänge. Nichts wird heruntergeladen, bevor du den Plan gesehen hast.
