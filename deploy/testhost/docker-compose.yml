# Test environment for Phase 1 - NOT the production stack from Spec 4.1.
#
# Runs on a Raspberry Pi (see README.md for the migration from the test VM,
# which had no Bluetooth adapter, and all deviations from the original
# design):
#   - openthread/otbr:latest       -> Digest sha256:ebebd9f6..., Entrypoint
#     /app/etc/docker/test/docker_entrypoint.sh (the "test" variant of the
#     image, not the newer s6-overlay/"border-router" variant). This
#     variant reads RADIO_URL as an environment variable and accepts
#     --backbone-interface as a command-line argument, exactly as
#     configured below.
#   - ghcr.io/matter-js/matterjs-server:stable (8 September 2026, UNTESTED -
#     see README, section "Migration to matterjs-server (UNTESTED)"; the
#     README writes the addition with umlauts, here it stands without umlauts like every
#     comment in this file) -> --bluetooth-adapter
#     ${BLUETOOTH_ADAPTER} still applies for BLE commissioning via hci0,
#     plus NOBLE_BINDINGS=dbus because the container runs unprivileged
#     (see README).
#   - loxmatter (Phase 4, Review-Fix I5, 2026-09-02) -> built from this repository
#     itself (see ../../Dockerfile, also the note there that the
#     image is still untested - no Docker/network in the environment that
#     added this service). Requires MINISERVER_IP in .env.
# The project name stands HERE, not in .env (2026-09-03).
#
# Otherwise Compose derives it from the directory name, and the names of
# the named volumes are built from that: `<project>_loxmatter-store` holds
# the signal keys, `<project>_otbr-state` the Thread network key. Both are
# irreplaceable - the keys are the wiring in the Loxone configuration, the
# Thread key the network the devices sit in.
#
# If the name hung off the directory, every move of the checkout, every
# rename and every clone under a different name would change it - and
# Compose silently creates EMPTY volumes instead of reporting an error.
# That's exactly what happened when this stack moved from
# ~/loxmatter-testhost into a git checkout; it was harmless there only
# because the old name had been recorded by hand in the .env. Anyone who
# later regenerates the .env from .env.example would have lost that
# protection again. Here it's fixed.
#
# COMPOSE_PROJECT_NAME in the environment still overrides this entry;
# anyone running several instances side by side can keep using it.
name: loxmatter-testhost

services:
  otbr:
    image: openthread/otbr:latest
    container_name: otbr
    # Only with the "thread" profile active (2026-09-05). This service
    # passes through a real device via `devices:` below - if the radio
    # module is missing, `docker compose up` fails for the ENTIRE stack,
    # even for someone who only wants to connect WiFi Matter devices.
    # Behind a profile the rest stays startable; it's switched on via
    # COMPOSE_PROFILES in the .env, which Compose reads by itself - so no
    # later call and no script needs to carry a `--profile` along.
    profiles: ["thread"]
    network_mode: host
    privileged: true
    restart: unless-stopped
    devices:
      - ${RADIO_DEVICE}:${RADIO_DEVICE}
    environment:
      RADIO_URL: spinel+hdlc+uart://${RADIO_DEVICE}?uart-baudrate=${RADIO_BAUDRATE}
      # Neither the original test VM nor this Pi has the legacy iptables
      # tables (mangle/nat/filter) loaded, and the image has no modprobe to
      # load them - NAT64/NAT44 and the legacy firewall rules (both need
      # iptables) would therefore fail and crash the container (see
      # README, deviation 2 in the VM history). Uncritical for the test
      # environment (see README): no global IPv6, no need to reach IPv4
      # hosts from inside the Thread network.
      NAT64: "0"
      FIREWALL: "0"
    command: --backbone-interface ${BACKBONE_IF}
    # Without this limit OTBR doesn't start (2026-09-03, measured on a
    # Pi 4). The Docker daemon passes a `nofile` of 1,073,741,816 into the
    # container here; `start-stop-daemon`, which the image's init script
    # uses to start `otbr-agent`, closes EVERY descriptor from 3 up to
    # this limit individually before the `exec`. That's over a billion
    # syscalls: the process spins at 100% CPU and practically never
    # reaches the actual agent. Visible as "ot-ctl: connect session
    # failed" and a container that runs without a Thread network ever
    # forming.
    #
    # This bug already hit the project once after a Pi restart and was
    # worked around by hand back then, without knowing the cause.
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    volumes:
      # The Thread state otherwise survives NO rebuild of the container
      # (2026-09-03). The image provides no volume for it, and OTBR stores
      # its network data - network key, PAN ID, channel - under
      # /var/lib/thread in the writable layer. A `docker compose down`, an
      # image update or moving the project directory therefore forms a NEW
      # Thread network, and every already-commissioned device would have
      # to be reset and re-paired - no small thing for a sensor behind a
      # cabinet door.
      #
      # Anyone retrofitting a running stack without this volume must first
      # extract the state and put it into the empty volume, otherwise OTBR
      # starts with an empty state and the network is gone anyway:
      #
      #   docker cp otbr:/var/lib/thread /tmp/thread-state
      #   docker volume create <project>_otbr-state
      #   docker run --rm -v <project>_otbr-state:/d -v /tmp/thread-state:/s:ro \
      #       alpine sh -c 'cp -a /s/. /d/'
      #
      # Fallback if something does go wrong: the active dataset as hex
      # (`docker exec otbr ot-ctl dataset active -x`) can be restored into
      # a fresh container with `ot-ctl dataset set active <hex>`. That
      # string is a credential and belongs neither in the repository nor
      # in a log.
      - otbr-state:/var/lib/thread

  matter-server:
    # matterjs-server instead of python-matter-server (8 September 2026,
    # UNTESTED - see README, section "Migration to matterjs-server
    # (UNTESTED)").
    # python-matter-server is archived at 8.1.2; the successor speaks
    # the same WebSocket API and uses the same data directory, but migrates
    # it on the FIRST start to its own format. This migration is
    # one-way: if it fails, the Fabric is gone and every commissioned
    # device must be reset and re-paired. Beforehand
    # pull `GET /api/diagnostics/fabric-backup` and download the archive from the Pi
    # - that's exactly what the route is for.
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    network_mode: host
    restart: unless-stopped
    # CARRIED OVER UNCHANGED from the old image, and this is an open question,
    # not a decision (8 September 2026). This entry stood here for the
    # raw HCI access of python-matter-server: the AppArmor profile `docker-
    # default` forbids the Bluetooth raw sockets needed for it. The new
    # container handles BLE via the D-Bus path (NOBLE_BINDINGS=dbus, see
    # below) and may not need it anymore.
    #
    # It remains anyway because that cannot be determined on this machine:
    # removing it experimentally would mean risking BLE commissioning,
    # which is already considered UNTESTED - and a failure there
    # looks like a non-failure in the logs (see README, "Enable BLE").
    # So it should be checked on the Pi, and only after BLE via D-Bus
    # has demonstrably worked once: remove the line, recreate the container,
    # commission a device. If that works, it can go.
    #
    # The contradiction to the block further below, which explicitly rejects `user: 0:0`
    # for isolation reasons, is acknowledged: lifting an AppArmor
    # restriction is also less isolation. The difference is only
    # that for `user: 0:0` a proven alternative exists (the D-Bus path)
    # and here so far no measurement.
    security_opt:
      - apparmor=unconfined
    volumes:
      # Same directory as before. IMPORTANT: the new container runs
      # unprivileged as UID 1000, the old image ran as root. Therefore, once on the Pi
      # before the first start:
      #     sudo chown -R 1000:1000 deploy/testhost/data
      #     sudo chmod -R u+rwX,go+rX deploy/testhost/data
      # Without this the container won't start - it cannot access its own
      # data directory.
      - ./data:/data
      - /run/dbus:/run/dbus:ro
    environment:
      # BLE via the host's BlueZ daemon instead of via a raw
      # HCI socket. The standard would be `hci`, and that requires permissions that
      # the unprivileged container user doesn't have - BLE commissioning
      # would then silently fail. The /run/dbus mount needed for it
      # is already above.
      #
      # The alternative mentioned in the docs - run container as root
      # (`user: 0:0`) - is DELIBERATELY NOT chosen here: it lifts the
      # container isolation, and this service runs with
      # `network_mode: host` anyway, already open on the network.
      NOBLE_BINDINGS: dbus
    # ATTENTION: `command` overrides the image default CMD COMPLETELY -
    # Compose does not supplement it, it replaces it. For the old image its
    # CMD was known (`--storage-path /data --paa-root-cert-dir /data/credentials`,
    # verified via `docker inspect --format '{{.Config.Cmd}}'`, see README,
    # "Enable BLE"), and the list here was deliberately its replica plus
    # `--bluetooth-adapter`.
    #
    # For this image the default CMD is UNTESTED. If it carries something that
    # loxmatter builds on - e.g. a different `--port`, while loxmatter firmly
    # addresses `ws://127.0.0.1:5580/ws` - it would silently be gone here. So before
    # the first `up`, check and compare with this list (README, "What
    # to check afterwards", point 3):
    #     docker inspect --format '{{.Config.Cmd}}' \
    #         ghcr.io/matter-js/matterjs-server:stable
    command:
      - --storage-path
      - /data
      # `--paa-root-cert-dir` has been DROPPED WITHOUT REPLACEMENT (don't forget):
      # the successor's CLI docs list the option under "Deprecated
      # Options (were used in Python Matter Server) - not supported" because
      # matter.js obtains PAA root certificates via its own
      # DCL client.
      - --bluetooth-adapter
      - "${BLUETOOTH_ADAPTER:-0}"
    # No more `depends_on: otbr` (2026-09-05): Compose aborts when an
    # active service depends on one disabled by a profile. No practical
    # consequence - `depends_on` controls start order, not readiness, and
    # matter-server doesn't need the Border Router at startup: Thread
    # commissioning runs later over the host network, which otbr sits on
    # anyway via `network_mode: host`.

  loxmatter:
    # Since 0.2.0 from a published image instead of built on the Pi
    # (draft "Deploy updates via the UI", 2026-09-08,
    # section 5). Building took five to ten minutes on the test Pi
    # and could fail on a PyPI outage or out of memory - in the middle
    # of an update that someone triggered via the browser, that's
    # the wrong kind of surprise.
    #
    # The tag below stands in the .env and is the ONLY place where
    # the running version is set. That's exactly why: the updater
    # (stage 2) falls back by rewriting this one line.
    # A second mention of the tag would be one that stayed behind.
    #
    # `build:` stays below. A Compose profile wouldn't work for this
    # (profiles apply to services, not to individual
    # keys), and one is not needed: `compose pull` pulls,
    # `compose build` builds explicitly, and `up` builds only if no
    # local image exists at all. On a host without GHCR access that's exactly
    # the desired fallback.
    image: ghcr.io/lucienkerl/loxmatter:${LOXMATTER_IMAGE_TAG:-stable}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: loxmatter
    restart: unless-stopped
    # Like otbr/matter-server: network_mode host instead of an explicit
    # `ports:` list, for two reasons, not just consistency. First, `--url`
    # (default ws://localhost:5580/ws) reaches matter-server only via
    # 127.0.0.1 - matter-server itself runs with network_mode: host and is
    # therefore not a resolvable service name in Compose's own bridge
    # network. Second, this makes the HTTP port for the Loxone output
    # commands (--listen, default 8080) reachable from the Miniserver
    # without publishing any further ports - that's the "published" HTTP
    # port required here.
    #
    # Since Phase 5 this exact port additionally carries the operator
    # interface (`/api/*`, `/`) - the same FastAPI service, the same
    # `--listen`. Anyone opening `http://<host>:8080/` in a browser sees
    # first-run setup (set a password) the very first time and a login
    # after that - since the WebUI login (Task 9/10, Phase 6), `/api/*`
    # is protected by this login, no longer by `LOXMATTER_API_TOKEN`
    # below. The token remains as an additional path for scripts and
    # `curl` (see there). `/cmd` and `/resync` for the Miniserver
    # deliberately stay open (see there).
    network_mode: host
    volumes:
      - loxmatter-store:/data
      # Active since Task 8 (Phase 5): the read-only view into
      # matter-server's own data directory - the basis for `GET
      # /api/diagnostics/fabric-backup` (Spec 4.1, Task 6, Phase 5) - was
      # DELIBERATELY COMMENTED OUT until here (Review-Fix Critical,
      # 2026-09-02), because this service runs with `network_mode: host`
      # (see above, rationale) and the network therefore reaches it just
      # as it reaches the Miniserver: without safeguards,
      # `/api/diagnostics/fabric-backup` would have been completely
      # unprotected, and with this line mounted, downloading the complete,
      # irreplaceable fabric credentials (Spec 4.1) would be reachable for
      # anyone on the same network, not just theoretically possible.
      #
      # This rationale initially applied to the token: Task 8 delivered
      # `build_api_guard` (see `src/loxmatter/loxone/server.py`) AND
      # required `LOXMATTER_API_TOKEN` below - together the two made
      # mounting this defensible, and a forgotten token consequently made
      # `/api/diagnostics/fabric-backup` return nothing at all, with 403
      # (follow-up fix from 2026-09-03).
      #
      # Since the WebUI login (Task 9/10, Phase 6, same date) this role is
      # instead carried by the password: without a valid session or a
      # valid token, EVERY `/api` route returns 401, the fabric backup
      # included - its own dedicated 403 branch has been dropped without
      # replacement, because the rule it was an exception to ("/api stays
      # open without a token") no longer exists itself.
      # `LOXMATTER_API_TOKEN` below is therefore no longer a prerequisite
      # for securing this mount, but optional (see there): leaving it
      # empty only loses script access, not protection of the fabric
      # data - because without a password set on the host, no `/api`
      # route responds, regardless of the token.
      - ./data:/matter-data:ro
    environment:
      # A dedicated, fixed location instead of the user-home default (see
      # `_resolve_store_path` in src/loxmatter/cli.py) - the mounted
      # volume survives a `docker compose down`/`up`, a user home inside
      # the container does not.
      LOXMATTER_STORE: /data/loxmatter.sqlite
      # Additional access to all `/api` routes (commissioning, removal,
      # fabric backup) via `Authorization: Bearer <token>` - see
      # `build_api_guard` in src/loxmatter/loxone/server.py and README.md.
      # `/cmd`/`/resync` are unaffected, the Miniserver needs no token
      # (see there).
      #
      # OPTIONAL since the WebUI login (Task 9/10, Phase 6): access to the
      # interface itself runs through a password set on the first call to
      # `http://<host>:8080/`, no longer through this token. This token
      # nonetheless remains worth setting for scripts and `curl`, which
      # cannot log in via a browser - set `LOXMATTER_API_TOKEN` in `.env`
      # to a long, random value for that (e.g. `openssl rand -hex 32`). If
      # the variable is missing from `.env`, Docker Compose interpolates
      # an empty string here - `typer`'s `envvar` resolution treats an
      # empty environment variable as a missing one (verified: `api_token`
      # then becomes `None`, not `""`), so `loxmatter run` starts
      # unchanged without the token path. Unlike before the WebUI login,
      # this is NOT a gap: without a set password, no `/api` route
      # responds anyway (401, see README) - the fabric backup included,
      # whose earlier dedicated 403 lock for a missing token has therefore
      # been dropped. The startup warning has since applied to the
      # missing password (`cli._warn_if_no_password`), no longer to the
      # missing token.
      LOXMATTER_API_TOKEN: ${LOXMATTER_API_TOKEN}
    command:
      - run
      - --url
      - ws://127.0.0.1:5580/ws
      - --miniserver
      - ${MINISERVER_IP}
      - --listen
      - "8080"
      # Active since Task 8 - see the comment at the volume line above:
      # the two belong together. Without the volume line this argument
      # would be ineffective (the route would see no directory and
      # respond with 503), without this argument the volume line would go
      # unused (matter_data_dir would remain `None`).
      - --matter-data-dir
      - /matter-data
    depends_on:
      - matter-server

volumes:
  # OTBR's Thread state (see there for the full rationale).
  otbr-state:
  # Named volume instead of a bind mount (unlike matter-server above): the
  # signal key database doesn't belong in the project checkout on the
  # host, but lives independently of it (see LOXMATTER_STORE above).
  loxmatter-store:
