web.system.clear:
  en: "Clear"
  de: "Leeren"
web.system.pause_clear_explanation:
  en: |
    "Pause" only stops new lines from being appended, not the connection itself – lines arriving during the pause are not caught up afterwards, like a paused <span class="key">tail -f</span>. "Clear" only affects this page, not the bridge's own ring buffers.
  de: |
    „Pausieren“ haelt nur das Anhaengen neuer Zeilen an, nicht die Verbindung selbst – waehrend der Pause eintreffende Zeilen werden nicht nachgeholt, wie bei einem angehaltenen <span class="key">tail -f</span>. „Leeren“ wirkt nur auf diese Seite, nicht auf die Ringe der Brücke.
web.system.logs_heading:
  en: "Logs"
  de: "Logs"
web.system.logs_hint:
  en: "The bridge's log lines, live – newest on top, auto-scrolling."
  de: "Protokollzeilen der Brücke, laufend – jüngste oben, folgt automatisch."
web.system.udp_heading:
  en: "UDP capture"
  de: "UDP-Mitschnitt"
web.system.udp_hint:
  en: "Datagrams actually sent over the wire, live – newest on top, auto-scrolling."
  de: "Tatsächlich über den Draht geschickte Datagramme, laufend – jüngste oben, folgt automatisch."
web.system.command_log_heading:
  en: "Command log"
  de: "Kommando-Log"
web.system.command_log_hint:
  en: "Incoming HTTP calls with their result, live."
  de: "Eingehende HTTP-Aufrufe mit ihrem Ergebnis, laufend."
web.system.backup_heading:
  en: "Backup"
  de: "Sicherung"
web.system.backup_explanation:
  en: "Backup of the fabric credentials (matter-server data directory) as a ZIP file – the only irreplaceable state of this installation. If it's lost, every device must be recommissioned."
  de: "Sicherung der Fabric-Zugangsdaten (matter-server-Datenverzeichnis) als ZIP-Datei – der einzige unersetzliche Zustand dieser Installation. Geht er verloren, muss jedes Gerät neu eingelernt werden."
web.system.backup_access_note:
  en: "Only accessible after logging in, like every other function on this page: whoever can download it can take over the Matter fabric."
  de: "Nur nach Anmeldung abrufbar, wie jede andere Funktion dieser Seite: wer sie herunterladen kann, kann die Matter-Fabric übernehmen."
web.system.backup_download:
  en: "Download backup"
  de: "Sicherung herunterladen"
web.system.load_error:
  en: "Could not load diagnostics: {message}"
  de: "Diagnose konnte nicht geladen werden: {message}"
web.system.backup_error:
  en: "Backup not possible: {message}"
  de: "Sicherung nicht möglich: {message}"

# --- web.settings — settings tab ---
web.settings.connection_heading:
  en: "Miniserver connection"
  de: "Verbindung zum Miniserver"
web.settings.connection_explanation:
  en: |
    This means the address of the machine loxmatter runs on – as the Miniserver sees it. <strong>Not</strong> the Miniserver's address. The virtual input only accepts datagrams from this address, and the output commands call it as <span class="key">http://&lt;this IP&gt;:HTTP-port</span>. If the Miniserver's IP is entered here, the templates look correct but stay silent – with no error message.
  de: |
    Gemeint ist die Adresse des Rechners, auf dem loxmatter läuft – so, wie der Miniserver ihn sieht. <strong>Nicht</strong> die Adresse des Miniservers. Der virtuelle Eingang nimmt Datagramme nur von dieser Adresse an, und die Ausgangsbefehle rufen sie als <span class="key">http://&lt;diese IP&gt;:HTTP-Port</span> auf. Steht hier die Miniserver-IP, sehen die Vorlagen richtig aus, bleiben aber stumm – ohne jede Fehlermeldung.
web.settings.bridge_ip_placeholder:
  en: "e.g. 192.168.1.20"
  de: "z. B. 192.168.1.20"
web.settings.udp_port_label:
  en: "UDP port (virtual input)"
  de: "UDP-Port (virtueller Eingang)"
web.settings.http_port_label:
  en: "HTTP port (receiving commands)"
  de: "HTTP-Port (Befehle empfangen)"
web.settings.save:
  en: "Save"
  de: "Speichern"
web.settings.last_saved_prefix:
  en: "Last saved: "
  de: "Zuletzt gespeichert: "
web.settings.never_saved:
  en: "Not saved yet."
  de: "Noch nicht gespeichert."
web.settings.load_error:
  en: "Could not load settings: {message}"
  de: "Einstellungen konnten nicht geladen werden: {message}"
web.settings.bridge_ip_required:
  en: "Please enter the IP of this bridge."
  de: "Bitte die IP dieser Brücke eingeben."
web.settings.saved_toast:
  en: "Settings saved."
  de: "Einstellungen gespeichert."
web.settings.save_error:
  en: "Could not save settings: {message}"
  de: "Einstellungen konnten nicht gespeichert werden: {message}"
web.settings.language_heading:
  en: "Language"
  de: "Sprache"
web.settings.language_en:
  en: "English"
  de: "Englisch"
web.settings.language_de:
  en: "German"
  de: "Deutsch"
web.settings.language_error:
  en: "Could not change language: {message}"
  de: "Sprache konnte nicht geändert werden: {message}"
web.settings.resend_heading:
  en: "Periodic resend"
  de: "Periodischer Resend"
web.settings.resend_explanation:
  en: |
    Marked signals (the "resend periodically" checkbox in the signal list) are forcibly resent at this interval, even without a change – independently of that, a full restore still runs once at bridge startup and via "Resend all values" in the System tab.
  de: |
    Markierte Signale (Haken „periodisch erneut senden" in der Signalliste) werden in diesem Takt zwangsweise erneut gesendet, auch ohne Änderung - unabhängig davon läuft ein voller Restore weiterhin einmalig beim Bridge-Start und über „Alle Werte erneut senden" im Tab System.
web.settings.resend_interval_label:
  en: "Interval in seconds"
  de: "Intervall in Sekunden"
web.settings.resend_interval_invalid:
  en: "Please enter an interval of at least 10 seconds."
  de: "Bitte ein Intervall von mindestens 10 Sekunden eingeben."
web.settings.resend_load_error:
  en: "Could not load resend interval: {message}"
  de: "Resend-Intervall konnte nicht geladen werden: {message}"
web.settings.resend_saved_toast:
  en: "Resend interval saved."
  de: "Resend-Intervall gespeichert."
web.settings.resend_save_error:
  en: "Could not save resend interval: {message}"
  de: "Resend-Intervall konnte nicht gespeichert werden: {message}"

# --- web.radios — the radios card (design "Radios in the Web UI",
# 2026-09-11, section 8): which USB stick the Thread border router uses,
# and which Bluetooth adapter commissions Matter devices, chosen from the
# detected hardware and applied by the updater sidecar through
# GET/POST /api/radios.
web.radios.heading:
  en: "Radios"
  de: "Funkgeräte"
web.radios.explanation:
  en: "Which USB stick the Thread border router uses, and which Bluetooth adapter commissions Matter devices. Changes are applied by the updater service."
  de: "Welchen USB-Stick der Thread-Border-Router nutzt und über welchen Bluetooth-Adapter Matter-Geräte angelernt werden. Änderungen setzt der Updater-Dienst um."
web.radios.thread_label:
  en: "Thread"
  de: "Thread"
web.radios.bluetooth_label:
  en: "Bluetooth"
  de: "Bluetooth"
web.radios.no_thread_stick:
  en: "No Thread stick (Thread off)"
  de: "Kein Thread-Stick (Thread aus)"
web.radios.thread_unknown:
  en: "Unknown (needs a newer or running updater service)"
  de: "Unbekannt (braucht einen neueren oder laufenden Updater-Dienst)"
web.radios.bluetooth_unknown:
  en: "Unknown (needs a newer or running updater service)"
  de: "Unbekannt (braucht einen neueren oder laufenden Updater-Dienst)"
web.radios.in_use:
  en: "in use"
  de: "in Verwendung"
web.radios.missing:
  en: "{path} (missing)"
  de: "{path} (fehlt)"
web.radios.bus_uart:
  en: "{name} · built in (UART)"
  de: "{name} · eingebaut (UART)"
web.radios.bus_usb:
  en: "{name} · USB {product}"
  de: "{name} · USB {product}"
web.radios.bus_other:
  en: "{name}"
  de: "{name}"
web.radios.rfkill_blocked:
  en: "Blocked by rfkill - unblocking needs root on the host, see docs/SETUP.md"
  de: "Durch rfkill gesperrt – Entsperren braucht Root auf dem Host, siehe docs/SETUP.md"
web.radios.option_blocked:
  en: "blocked"
  de: "gesperrt"
web.radios.thread_option_zigbee:
  # The Thread row's suffix for the stick the Zigbee row is set up with -
  # the mirror of `web.radios.zigbee_is_thread_stick`.
  en: "in use for Zigbee"
  de: "für Zigbee in Verwendung"
web.radios.thread_zigbee_took_over:
  # The suffix for a stick that is IN USE FOR THREAD and set up for Zigbee -
  # the mirror of `web.radios.zigbee_thread_took_over`. One suffix instead
  # of "in use · in use for Zigbee", which read as two contradicting claims.
  en: "taken over by Zigbee"
  de: "von Zigbee belegt"
web.radios.thread_zigbee_stick_hint:
  # The line under the Thread select whenever the list holds the Zigbee
  # stick - the mirror of `web.radios.zigbee_thread_stick_hint`. The
  # option's own suffix is cut off by a narrow native select, so the reason
  # and the way out live here, in full. {name} is the stick's name as the
  # Thread row shows it.
  en: "{name} is set up for Zigbee, so it cannot be chosen here for Thread. To use it for Thread, choose another stick for Zigbee, or turn Zigbee off (\"No Zigbee stick\"), in the Zigbee row below."
  de: "{name} ist für Zigbee eingerichtet und kann hier für Thread nicht gewählt werden. Um ihn für Thread zu nutzen, wählen Sie in der Zigbee-Zeile unten einen anderen Stick oder schalten Sie Zigbee ab („Kein Zigbee-Stick“)."
web.radios.thread_zigbee_took_over_hint:
  # The same line when that stick is also the current Thread device - the
  # mirror of `web.radios.zigbee_thread_took_over_hint`.
  en: "{name} is in use for Thread, but it is set up for Zigbee. To free it for Zigbee, choose another stick for Zigbee, or turn Zigbee off (\"No Zigbee stick\"), in the Zigbee row below."
  de: "{name} wird für Thread verwendet, ist aber für Zigbee eingerichtet. Um ihn für Zigbee freizugeben, wählen Sie in der Zigbee-Zeile unten einen anderen Stick oder schalten Sie Zigbee ab („Kein Zigbee-Stick“)."

# --- The Zigbee coordinator row ---
web.radios.zigbee_label:
  en: "Zigbee stick"
  de: "Zigbee-Stick"
web.radios.zigbee_none:
  en: "No Zigbee stick"
  de: "Kein Zigbee-Stick"
web.radios.zigbee_is_thread_stick:
  # The short suffix in the option label, beside `web.radios.in_use` and
  # `web.radios.option_blocked` - the pattern the Bluetooth row already
  # uses for an rfkill-blocked adapter. The long sentence is the API's
  # refusal (`api.errors.zigbee_is_thread_stick`), shown when a stale page
  # posts anyway.
  en: "in use for Thread"
  de: "für Thread in Verwendung"
web.radios.zigbee_thread_took_over:
  # The suffix for a stick that is set up for Zigbee AND in use for Thread -
  # Thread was moved onto it afterwards. One suffix instead of "in use · in
  # use for Thread", which read as two contradicting claims.
  en: "taken over by Thread"
  de: "von Thread belegt"
web.radios.zigbee_thread_stick_hint:
  # The line under the Zigbee select whenever the list holds the Thread
  # stick. The option's own suffix is cut off by a narrow native select
  # (measured at 375 px in German), so the reason and the way out live
  # here, in full. {name} is the stick's name as the list shows it.
  en: "{name} is in use for Thread, so it cannot be chosen here. To use it for Zigbee, turn Thread off or move Thread to another stick in the Thread row above."
  de: "{name} wird für Thread verwendet und kann hier nicht gewählt werden. Um ihn für Zigbee zu nutzen, schalten Sie Thread in der Thread-Zeile oben ab oder wählen Sie dort einen anderen Stick."
web.radios.zigbee_thread_took_over_hint:
  # The same line when that stick is the one Zigbee is set up with: the
  # bridge keeps trying to open a port the border router holds, and the
  # user has a choice to make in either row.
  en: "{name} is set up for Zigbee, but Thread is using it now. Turn Thread off or move Thread to another stick in the Thread row above, or choose another stick for Zigbee here."
  de: "{name} ist für Zigbee eingerichtet, wird aber gerade von Thread verwendet. Schalten Sie Thread in der Thread-Zeile oben ab oder wählen Sie dort einen anderen Stick – oder wählen Sie hier einen anderen Stick für Zigbee."
web.radios.fingerprint_unknown:
  en: "Not recognised - set the radio type and baud rate under Advanced"
  de: "Nicht erkannt – Funktyp und Baudrate unter Erweitert einstellen"
web.radios.advanced:
  en: "Advanced"
  de: "Erweitert"
web.radios.zigbee_applying:
  # The window between releasing the old stick and having built the new
  # one - a `shutdown(db=True)` plus an up-to-5 s border-router read, during
  # which there is no source to ask and the card used to be told `idle`,
  # the one state that means "nothing is configured here".
  en: "Applying the change - releasing the previous radio"
  de: "Änderung wird übernommen – der bisherige Funkstick wird freigegeben"
web.radios.zigbee_loading_quirks:
  # The user is looking at a 9-15 s pause on a Pi and deserves to know it
  # is expected, not a hang. Not "the first connection": the same state
  # opens the reconnect after a lost link, which is not a first anything.
  en: "Preparing device support - this can take a few seconds"
  de: "Geräteunterstützung wird vorbereitet – das kann einige Sekunden dauern"
web.radios.zigbee_opening_radio:
  en: "Opening the stick"
  de: "Stick wird geöffnet"
web.radios.zigbee_connected:
  en: "Connected"
  de: "Verbunden"
web.radios.zigbee_failed_retrying:
  # Carries the attempt count AND the error: the supervisor never gives up,
  # so the card must not imply it has.
  en: "{error} (attempt {attempts} - the bridge keeps trying)"
  de: "{error} (Versuch {attempts} – die Brücke versucht es weiter)"
web.radios.zigbee_retrying:
  # `loading_quirks` and `opening_radio` come round again on every one of
  # the supervisor's retries. From the second attempt on, "the first
  # connection takes a few seconds" would be untrue; {attempt} is the
  # number of the attempt now running.
  en: "Trying again (attempt {attempt})"
  de: "Neuer Verbindungsversuch (Versuch {attempt})"
web.radios.zigbee_retrying_after:
  # The same retry, with the reason the previous attempt failed kept on
  # screen (`ConnectionProgress.error` carries it through the retry).
  # "Previous", not "last": "Letzter Versuch" reads as "final attempt" in
  # German, and the supervisor never gives up.
  en: "Trying again (attempt {attempt}). Previous attempt: {error}"
  de: "Neuer Verbindungsversuch (Versuch {attempt}). Vorheriger Versuch: {error}"
web.radios.zigbee_failed_unknown:
  # Only if a failed attempt ever arrives without its own sentence.
  en: "The Zigbee stick could not be opened"
  de: "Der Zigbee-Stick konnte nicht geöffnet werden"
web.radios.zigbee_device_missing:
  # The progress line, not an option label: the select already shows the
  # path (`web.radios.missing`). This wins over the connection state,
  # because an unplugged stick fails exactly like one that is present and
  # refusing to open, and the two need opposite actions.
  en: "The chosen stick is not plugged in. Plug it back in, or pick another stick - the bridge keeps looking for it."
  de: "Der gewählte Stick ist nicht eingesteckt. Stecken Sie ihn wieder ein oder wählen Sie einen anderen Stick – die Brücke sucht weiter nach ihm."
web.radios.zigbee_option_unrecognised:
  # The short suffix on an option, beside `web.radios.in_use`; the full
  # sentence is `web.radios.fingerprint_unknown` below the select.
  en: "not recognised"
  de: "nicht erkannt"
web.radios.zigbee_firmware:
  # The line under the Zigbee row once the stick has connected: the firmware
  # the coordinator reported (`coordinator.firmware` from
  # `GET /api/zigbee/radio`), the one thing about a stick that decides
  # whether it works as a coordinator at all. {firmware} is the radio
  # library's own text, e.g. "7.4.4.0 build 0".
  en: "Firmware: {firmware}"
  de: "Firmware: {firmware}"
web.radios.zigbee_hint:
  # The Thread and Bluetooth rows above warn about restarts and a sidecar
  # job; this row does the opposite, and has to say so rather than leave
  # the user to assume the same warning applies.
  en: "A Zigbee stick change takes effect immediately and restarts nothing - Thread and Bluetooth are left as they are."
  de: "Ein Wechsel des Zigbee-Sticks wirkt sofort und startet nichts neu – Thread und Bluetooth bleiben, wie sie sind."
web.radios.zigbee_radio_type:
  en: "Radio type"
  de: "Funktyp"
web.radios.zigbee_baudrate:
  en: "Baud rate"
  de: "Baudrate"
web.radios.zigbee_radio_type_ezsp:
  # Protocol names with the chip maker that speaks them, so a user can
  # match the stick's packaging to an entry.
  en: "EZSP (Silicon Labs)"
  de: "EZSP (Silicon Labs)"
web.radios.zigbee_radio_type_znp:
  en: "ZNP (Texas Instruments)"
  de: "ZNP (Texas Instruments)"
web.radios.zigbee_radio_type_deconz:
  en: "deCONZ (dresden elektronik)"
  de: "deCONZ (dresden elektronik)"
web.radios.rescan:
  en: "Rescan"
  de: "Neu einlesen"
web.radios.apply:
  en: "Apply"
  de: "Übernehmen"
web.radios.confirm_title:
  en: "Change radios?"
  de: "Funkgeräte ändern?"
web.radios.confirm_thread_switch:
  en: "The Thread border router restarts with the new stick. Thread devices are unreachable for one to two minutes and rejoin on their own. The Thread network stays the same."
  de: "Der Thread-Border-Router startet mit dem neuen Stick neu. Thread-Geräte sind ein bis zwei Minuten nicht erreichbar und treten danach von selbst wieder bei. Das Thread-Netz bleibt dasselbe."
web.radios.confirm_thread_on:
  en: "The Thread border router starts with this stick."
  de: "Der Thread-Border-Router startet mit diesem Stick."
web.radios.confirm_thread_off:
  en: "The Thread border router stops. Thread devices stay unreachable until Thread is switched on again."
  de: "Der Thread-Border-Router wird beendet. Thread-Geräte bleiben unerreichbar, bis Thread wieder eingeschaltet wird."
web.radios.confirm_bluetooth:
  en: "matter-server restarts. A commissioning in progress is aborted."
  de: "matter-server startet neu. Ein laufendes Anlernen wird abgebrochen."
web.radios.confirm_thread_untouched:
  en: "Thread is not touched. The border router keeps running with the stick it uses now, and Thread devices stay reachable."
  de: "Thread wird nicht angefasst. Der Border-Router läuft mit dem Stick weiter, den er jetzt nutzt, und Thread-Geräte bleiben erreichbar."
web.radios.confirm_rollback:
  en: "If it fails, the previous setting is restored automatically."
  de: "Schlägt es fehl, wird die vorherige Einstellung automatisch wiederhergestellt."
web.radios.confirm_apply:
  en: "Change"
  de: "Ändern"
web.radios.cancel:
  en: "Cancel"
  de: "Abbrechen"
web.radios.step_validate:
  en: "Check the setting"
  de: "Einstellung prüfen"
web.radios.step_backup:
  en: "Back up the configuration"
  de: "Konfiguration sichern"
web.radios.step_write:
  en: "Write the configuration"
  de: "Konfiguration schreiben"
web.radios.step_apply_bluetooth:
  en: "Restart matter-server"
  de: "matter-server neu starten"
web.radios.step_verify_bluetooth:
  en: "Wait for matter-server"
  de: "Auf matter-server warten"
web.radios.step_apply_thread:
  en: "Restart the Thread border router"
  de: "Thread-Border-Router neu starten"
web.radios.step_verify_thread:
  en: "Check the Thread network (up to 90 s)"
  de: "Thread-Netz prüfen (bis 90 s)"
web.radios.step_unknown:
  en: "Unknown step ({step})"
  de: "Unbekannter Schritt ({step})"
web.radios.job_abandoned:
  en: "The updater service stopped answering while this job was running. It may not have finished - check the previous setting still matches what you expect, and try again once the service is back."
  de: "Der Updater-Dienst hat während dieses Auftrags aufgehört zu antworten. Er ist möglicherweise nicht fertig geworden – prüfen Sie, ob die vorherige Einstellung noch passt, und versuchen Sie es erneut, sobald der Dienst wieder läuft."
web.radios.job_not_collected:
  en: "The request was accepted, but the updater service never picked it up. Nothing was changed - try again."
  de: "Der Auftrag wurde angenommen, aber der Updater-Dienst hat ihn nie abgeholt. Es wurde nichts geändert – bitte erneut versuchen."
web.radios.rolling_back:
  en: "That did not work. The previous setting is being restored - this can take up to two and a half minutes. Please leave the Pi switched on."
  de: "Das hat nicht funktioniert. Die vorherige Einstellung wird gerade wiederhergestellt – das kann bis zu zweieinhalb Minuten dauern. Bitte lassen Sie den Pi eingeschaltet."
web.radios.result_done:
  en: "Applied."
  de: "Übernommen."
web.radios.result_unchanged:
  en: "Nothing to change."
  de: "Nichts zu ändern."
web.radios.result_rejected:
  en: "Not applied: {reason}"
  de: "Nicht übernommen: {reason}"
web.radios.result_failed_restored:
  en: "Failed ({reason}), previous setting restored."
  de: "Fehlgeschlagen ({reason}), vorherige Einstellung wiederhergestellt."
web.radios.result_failed_unhealthy:
  en: "Failed ({reason}), and the previous setting did not come back up either. See radios-log.txt in the updater's data volume."
  de: "Fehlgeschlagen ({reason}), und auch die vorherige Einstellung kam nicht wieder hoch. Siehe radios-log.txt im Datenvolume des Updaters."
web.radios.result_interrupted:
  en: "Interrupted. The updater service stopped while this change was being applied, so it was neither finished nor undone. Check the settings below and apply them again if they are not what you want."
  de: "Abgebrochen. Der Updater-Dienst wurde beendet, während diese Änderung übernommen wurde – sie wurde daher weder fertig übernommen noch rückgängig gemacht. Prüfen Sie die Einstellungen unten und übernehmen Sie sie erneut, falls sie nicht passen."
web.radios.sidecar_busy_update:
  en: "A software update is running. Radios cannot be changed until it has finished; this card comes back on its own."
  de: "Es läuft gerade ein Software-Update. Funkgeräte lassen sich erst ändern, wenn es fertig ist; diese Karte kommt von selbst zurück."
web.radios.sidecar_missing:
  en: "Changing radios needs the updater service, which is not running."
  de: "Zum Ändern der Funkgeräte braucht es den Updater-Dienst, und der läuft nicht."
web.radios.sidecar_refresh:
  en: "Changing radios needs a newer updater service. Run once on the host: cd {path} && docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
  de: "Zum Ändern der Funkgeräte braucht es einen neueren Updater-Dienst. Einmal auf dem Host ausführen: cd {path} && docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
web.radios.sidecar_refresh_unknown_path:
  en: "Changing radios needs a newer updater service. From your loxmatter checkout's deploy/testhost directory, run once: docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
  de: "Zum Ändern der Funkgeräte braucht es einen neueren Updater-Dienst. Im Verzeichnis deploy/testhost Ihres loxmatter-Checkouts einmal ausführen: docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
web.radios.reason.request_malformed:
  en: "the request was malformed"
  de: "der Auftrag war fehlerhaft"
web.radios.reason.host_dev_not_mounted:
  en: "the updater has no access to /dev"
  de: "der Updater hat keinen Zugriff auf /dev"
web.radios.reason.stack_host_path_unknown:
  en: "the updater could not find its stack directory on the host"
  de: "der Updater fand sein Stack-Verzeichnis auf dem Host nicht"
web.radios.reason.thread_device_required:
  en: "no USB stick was chosen"
  de: "kein USB-Stick gewählt"
