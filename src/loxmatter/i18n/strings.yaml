  de: "{comment} · Zähler"
export.signals.online_title:
  en: "{device_label} reachable"
  de: "{device_label} erreichbar"
api.export.readme_text:
  en: |
    IMPORT INSTRUCTIONS
    ====================

    This ZIP file contains Loxone templates generated by loxmatter.

    1. Files starting with "VIU_" belong in Loxone Config under:
         Templates\VirtualIn\

    2. Files starting with "VO_" belong under:
         Templates\VirtualOut\

    3. Import into Loxone Config: in the project tree, right-click the
       relevant folder (Virtual Inputs or Virtual Outputs) ->
       "Import Template" -> select the file.

    4. VIU_Matter_System.xml and VO_Matter_System.xml (if included in this
       ZIP file) do not belong to any single device. They are only needed
       ONCE per project — do not import them again with every further
       export.
  de: |
    IMPORT-ANLEITUNG
    =================

    Diese ZIP-Datei enthaelt Loxone-Vorlagen, erzeugt von loxmatter.

    1. Dateien, die mit "VIU_" beginnen, gehoeren in Loxone Config nach:
         Templates\VirtualIn\

    2. Dateien, die mit "VO_" beginnen, gehoeren nach:
         Templates\VirtualOut\

    3. Import in Loxone Config: im Projektbaum Rechtsklick auf den
       jeweiligen Ordner (Virtuelle Eingaenge bzw. Virtuelle Ausgaenge) ->
       "Vorlage importieren" -> die Datei auswaehlen.

    4. VIU_Matter_System.xml und VO_Matter_System.xml (falls in dieser
       ZIP-Datei enthalten) gehoeren zu keinem einzelnen Geraet. Sie werden
       nur EINMAL pro Projekt gebraucht - nicht bei jedem weiteren Export
       erneut importieren.
api.server.fail_login_required:
  en: "Sign-in required — please open the interface and log in. Scripts use `Authorization: Bearer <Token>` with the value set under LOXMATTER_API_TOKEN."
  de: "Anmeldung erforderlich – bitte die Oberfläche öffnen und anmelden. Skripte verwenden `Authorization: Bearer <Token>` mit dem unter LOXMATTER_API_TOKEN gesetzten Wert."
api.server.fail_resync:
  en: "Full resend failed: {exc}"
  de: "Full-Resend fehlgeschlagen: {exc}"
api.server.udp_sender_closed:
  # Raised by `loxone.sender.UdpSender.send` once its socket is closed -
  # `{exc}` above, wrapped into `api.server.fail_resync` at the resync
  # endpoint (`loxone/server.py`). A key rather than a finished sentence,
  # resolved at call time, for the same reason as
  # `api.devices.manual_dataset_origin`: the language is not settled at
  # import time, and a hard German chunk inside an otherwise-translated
  # sentence is half a translation.
  en: "UdpSender is closed"
  de: "UdpSender ist geschlossen"

# api.update — /api/update/* (api/update.py), design "Applying updates
# through the web UI" (2026-09-08), sections 9-10.
api.update.check_disabled:
  en: "Checking for updates is turned off in Settings."
  de: "Die Suche nach Updates ist in den Einstellungen ausgeschaltet."
api.update.fail_no_updater:
  en: "No update helper is currently reachable, so the update button cannot do anything right now. Check that the loxmatter-updater service is running."
  de: "Der Update-Helfer ist gerade nicht erreichbar, die Aktualisierung kann deshalb derzeit nichts bewirken. Prüfen Sie, ob der Dienst loxmatter-updater läuft."
api.update.fail_busy:
  en: "An update is already running — please wait for it to finish before starting another one."
  de: "Es läuft bereits eine Aktualisierung — bitte warten Sie, bis sie abgeschlossen ist, bevor Sie eine weitere starten."
api.update.fail_unwritable:
  en: "The update request could not be written to disk ({exc}). This can happen after a read-only filesystem remount or when the disk is full — check the update volume and try again."
  de: "Die Aktualisierungsanfrage konnte nicht auf die Festplatte geschrieben werden ({exc}). Das kann nach einem Nur-Lese-Remount des Dateisystems oder bei vollem Speicher passieren — prüfen Sie das Update-Volume und versuchen Sie es erneut."
api.update.fail_unknown_channel:
  en: "The stored update channel is not recognized. Open Settings and choose the update channel again."
  de: "Der gespeicherte Update-Kanal wird nicht erkannt. Öffnen Sie die Einstellungen und wählen Sie den Update-Kanal erneut aus."

# --- projectsync — ProjectFormatError/AmbiguousMiniserverError messages.
# `api.project_sync` catches these and passes `str(exc)` straight through
# as the HTTPException detail, which the WebUI displays - so these must run
# through i18n.t() like every other user-facing string (task 7). ---
projectsync.no_ip_known:
  # Falls back into `_describe`'s parenthesized IP for a `LoxLIVE` block
  # that carries no `IntAddr` at all.
  en: "no IP known"
  de: "keine IP bekannt"
projectsync.no_miniserver_configured:
  en: "This project file contains not a single configured Miniserver (no `LoxLIVE` block) - there is no place virtual inputs/outputs could be located in."
  de: "Diese Projektdatei enthaelt keinen einzigen konfigurierten Miniserver (keinen `LoxLIVE`-Block) - es gibt keinen Ort, an dem sich virtuelle Ein-/Ausgaenge verorten liessen."
projectsync.miniserver_ip_not_found:
  en: "No Miniserver with the IP {ip} found in this project file. Present: {candidates}."
  de: "Kein Miniserver mit der IP {ip} in dieser Projektdatei gefunden. Vorhanden: {candidates}."
projectsync.multiple_miniservers:
  en: "This project file contains several Miniservers: {candidates}. Please select the desired Miniserver."
  de: "Diese Projektdatei enthaelt mehrere Miniserver: {candidates}. Bitte den gewuenschten Miniserver auswaehlen."
projectsync.miniserver_without_configuration:
  en: "The Miniserver “{title}” has no configuration whatsoever in this project file yet - no place a virtual input/output could be created in."
  de: "Der Miniserver „{title}“ hat in dieser Projektdatei noch keinerlei Konfiguration - kein Ort, an dem sich ein virtueller Ein-/Ausgang anlegen liesse."
projectsync.no_uid_found:
  en: "No existing U-ID in the expected format was found in the file, from which an installation suffix could be derived."
  de: "Keine bestehende U-ID im erwarteten Format in der Datei gefunden, aus der sich ein Installations-Suffix ableiten liesse."
projectsync.unexpected_eof_attribute:
  en: "Unexpected end of file: an attribute or tag was not closed."
  de: "Unerwartetes Dateiende: ein Attribut oder Tag wurde nicht abgeschlossen."
projectsync.unexpected_eof_control:
  en: "Unexpected end of file: <C> without a closing </C>."
  de: "Unerwartetes Dateiende: <C> ohne schliessendes </C>."
projectsync.missing_control_list_open:
  en: "Not a valid Loxone project file: <ControlList> root element is missing."
  de: "Keine gueltige Loxone-Projektdatei: <ControlList>-Wurzelelement fehlt."
projectsync.missing_control_list_close:
  en: "Not a valid Loxone project file: </ControlList> is missing."
  de: "Keine gueltige Loxone-Projektdatei: </ControlList> fehlt."
api.settings.resend_interval_too_small:
  en: "resend interval must be at least {minimum}s, got: {value}"
