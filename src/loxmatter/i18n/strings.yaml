cli.run.help:
  en: "Connects Matter and Loxone permanently: values out, commands in."
  de: "Verbindet Matter und Loxone dauerhaft: Werte raus, Kommandos rein."
cli.run.help_miniserver:
  en: "IP of the Miniserver"
  de: "IP des Miniservers"
cli.run.help_listen:
  en: "Port for the HTTP commands coming from Loxone"
  de: "Port für die HTTP-Kommandos aus Loxone"
cli.run.echo_commands_backfilled:
  en: "{count} device(s) gained commands the bridge did not know when they were commissioned — their tiles now offer the matching controls."
  de: "{count} Gerät(e) haben Befehle bekommen, die die Brücke beim Einlernen noch nicht kannte — ihre Kacheln bieten jetzt die passenden Bedienelemente."
cli.run.help_host:
  en: "Address the HTTP service binds to. Default 0.0.0.0, because the Miniserver must be able to reach the service — see --api-token for the corresponding protection of the `/api` routes (Spec 9)."
  de: "Adresse, an die der HTTP-Dienst bindet. Standard 0.0.0.0, weil der Miniserver den Dienst erreichen muss — siehe --api-token für die dazugehörige Absicherung der `/api`-Routen (Spec 9)."
cli.run.help_api_token:
  en: "Protects the WebUI's `/api` routes (commissioning, removal, fabric backup) with `Authorization: Bearer <Token>` — an alternative to the signed-in session, not required in addition to it (Spec 9; Spec 11). `/cmd` and `/resync` always stay open — the Miniserver cannot send a header. Only use characters allowed in an HTTP header — no spaces, no comma, ASCII; `openssl rand -hex 32` satisfies that. Alternative via the LOXMATTER_API_TOKEN environment variable."
  de: "Schützt die `/api`-Routen der WebUI (Einlernen, Entfernen, Fabric-Sicherung) mit `Authorization: Bearer <Token>` — alternativ zur angemeldeten Sitzung, nicht zusätzlich zu ihr erforderlich (Spec 9; Spec 11). `/cmd` und `/resync` bleiben immer offen — der Miniserver kann keinen Header mitschicken. Nur Zeichen verwenden, die in einem HTTP-Header stehen dürfen — keine Leerzeichen, kein Komma, ASCII; `openssl rand -hex 32` erfüllt das. Alternative über die Umgebungsvariable LOXMATTER_API_TOKEN."
cli.run.help_matter_data_dir:
  en: "matter-server data directory (storage-path), mounted read-only into this service — basis for `GET /api/diagnostics/fabric-backup` (Spec 4.1). Without it, the route responds with 503 instead of a backup. See deploy/testhost/docker-compose.yml for the corresponding volume mount."
  de: "matter-server-Datenverzeichnis (storage-path), read-only in diesen Dienst eingehängt — Grundlage für `GET /api/diagnostics/fabric-backup` (Spec 4.1). Ohne Angabe antwortet die Route mit 503 statt einer Sicherung. Siehe deploy/testhost/docker-compose.yml für die dazugehörige Volume-Einhängung."
cli.run.help_update_dir:
  en: "Directory where this bridge and the update sidecar exchange request/state files (design \"Applying updates through the web UI\", section 7) — the same shared volume as --store-path in the reference deployment, a subdirectory of it. The default matches the sidecar's own default; change both together, or not at all. Alternative via the LOXMATTER_UPDATE_DIR environment variable."
  de: "Verzeichnis, über das diese Brücke und der Update-Beiwagen Anfrage-/Zustandsdateien austauschen (Entwurf \"Updates über die Oberfläche einspielen\", Abschnitt 7) — dasselbe gemeinsame Volume wie --store-path im Referenz-Deployment, ein Unterverzeichnis davon. Der Standard entspricht dem des Beiwagens; beide nur gemeinsam ändern. Alternative über die Umgebungsvariable LOXMATTER_UPDATE_DIR."
cli.run.help_zigbee_device:
  en: "by-id path of the Zigbee coordinator's USB serial device (e.g. /dev/serial/by-id/...), used ONLY to set up an installation that has never chosen a radio. Its type and baud rate are read from the stick itself. Once a radio has been chosen - here or in the interface - the stored setting wins and this flag is ignored with a warning; without the flag, the stored setting is used."
  de: "by-id-Pfad des USB-Seriengeräts des Zigbee-Koordinators (z. B. /dev/serial/by-id/...), nur zur Ersteinrichtung einer Installation, die noch nie einen Funkstick gewählt hat. Typ und Baudrate werden vom Stick selbst gelesen. Sobald ein Funkstick gewählt wurde – hier oder in der Oberfläche –, gilt die gespeicherte Einstellung und diese Option wird mit einer Warnung übergangen; ohne Angabe wird die gespeicherte Einstellung verwendet."
cli.run.warn_zigbee_device_ignored:
  en: "--zigbee-device names {flag}, but this bridge already has a Zigbee radio setting ({stored}) and the stored one wins. Change the radio in the interface, under Radios - or remove the flag, which no longer does anything here."
  de: "--zigbee-device nennt {flag}, aber diese Brücke hat bereits eine Zigbee-Funkeinstellung ({stored}), und die gespeicherte gilt. Ändern Sie den Funkstick in der Oberfläche unter Funk – oder entfernen Sie die Option, die hier nichts mehr bewirkt."
cli.run.warn_no_password:
  en: "No password has been set for this bridge yet. Until it is, nobody can sign in through the interface — and anyone who can reach the port can complete the initial setup and take over the bridge. Open the interface now and set a password."
  de: "Für diese Brücke ist noch kein Passwort vergeben. Bis das geschehen ist, lässt sich niemand über die Oberfläche anmelden — und jeder, der den Port erreicht, kann die Ersteinrichtung abschließen und die Brücke damit übernehmen. Öffne die Oberfläche jetzt und vergib ein Passwort."

cli.set_password.help:
  en: "Resets the interface password — the emergency exit for when it has been forgotten."
  de: "Setzt das Passwort der Oberfläche neu — der Notausgang für den Fall, dass es vergessen wurde."
cli.set_password.fail_db_not_found:
  en: "Database {path} was not found. `set-password` RESETS a password, so it deliberately does not create a new database — that would create an empty, unrelated database and report success while the actual bridge stayed locked. Check the path, pass it via --store-path, or — in the reference deployment — run the command inside the running container: `docker compose exec loxmatter loxmatter set-password`. On a fresh install from source, the database may simply not exist yet — it is created on the first `loxmatter run`."
  de: "Datenbank {path} wurde nicht gefunden. `set-password` setzt ein Passwort ZURÜCK und legt deshalb absichtlich keine neue Datenbank an — das würde eine leere Fremddatenbank erzeugen und Erfolg melden, während die eigentliche Brücke gesperrt bliebe. Prüfe den Pfad, gib ihn über --store-path an, oder führe den Befehl — im Referenz-Deployment — im laufenden Container aus: `docker compose exec loxmatter loxmatter set-password`. Bei einer frischen Installation aus dem Quellcode kann die Datenbank auch schlicht noch fehlen — sie entsteht erst beim ersten `loxmatter run`."
cli.set_password.prompt:
  en: "New password"
  de: "Neues Passwort"
cli.set_password.fail_too_short:
  en: "The password must be at least {min_length} characters long."
  de: "Das Passwort muss mindestens {min_length} Zeichen haben."
cli.set_password.echo_success:
  en: "Password set. All open sessions have been signed out."
  de: "Passwort gesetzt. Alle offenen Sitzungen wurden abgemeldet."

