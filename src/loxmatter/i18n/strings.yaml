# --- The Zigbee tab of the commissioning card (design 2026-09-12, 3.1) ---
# The two tab labels. Product names, the same in both languages - and the
# Matter one lives under `web.devices` because that half is the card the
# Devices view always had.
web.devices.commission_tab_matter:
  en: "Matter"
  de: "Matter"
web.zigbee.tab:
  en: "Zigbee"
  de: "Zigbee"
# The reset guidance the tab OPENS on, before any window is open. The two
# cases cover almost every device (design 3.1); the lead-in says why a reset
# comes first, because a device still paired elsewhere never looks for a new
# network and the search then finds nothing without saying why.
web.zigbee.reset_intro:
  en: "Reset the device first, so it looks for a new network:"
  de: "Setzen Sie das Gerät zuerst zurück, damit es ein neues Netz sucht:"
web.zigbee.reset_hint_lamp:
  en: "A lamp: switch it off and on five to ten times in a row."
  de: "Eine Lampe: fünf- bis zehnmal hintereinander aus- und wieder einschalten."
web.zigbee.reset_hint_battery:
  en: "A battery device: hold its button until the LED blinks."
  de: "Ein Batteriegerät: die Taste gedrückt halten, bis die LED blinkt."
web.zigbee.start:
  en: "Search for devices"
  de: "Nach Geräten suchen"
# "Stop searching", not "Stop": beside "Keep open longer" a bare "Beenden"
# could as well end the whole tab.
web.zigbee.stop:
  en: "Stop searching"
  de: "Suche beenden"
# Re-sends the maximum, so the window runs a full 254 s from the press.
web.zigbee.extend:
  en: "Keep open longer"
  de: "Länger offen lassen"
# Counted down in the browser to the server's own end timestamp. {time} is
# `m:ss` ("4:12"), which says at a glance whether there is time to walk to
# the lamp; "252 s" had to be divided first.
web.zigbee.countdown:
  en: "Open for new devices: {time} left"
  de: "Offen für neue Geräte: noch {time}"
web.zigbee.searching_empty:
  en: "No device has joined yet. Reset it now - it appears here within a few seconds."
  de: "Noch ist kein Gerät beigetreten. Setzen Sie es jetzt zurück – es erscheint hier nach wenigen Sekunden."
# The seven row states of design 3.1. `stuck` and `waiting_wake` are the two
# ZHA does not have, and neither may read as a failure: a stuck row is
# usually a battery device that fell asleep, and it is still waiting.
# The interviewing sentence names no device: the row's title above it already
# does - so it cannot lean on a pronoun for it either (the German one had
# nothing to refer to). While manufacturer and model are not known, the row
# says `state_joined` instead.
web.zigbee.state_joined:
  en: "Found a device - reading its details"
  de: "Gerät gefunden – seine Angaben werden gelesen"
web.zigbee.state_interviewing:
  en: "Reading the device's details …"
  de: "Geräteangaben werden gelesen …"
web.zigbee.state_configuring:
  en: "Setting it up"
  de: "Wird eingerichtet"
web.zigbee.state_ready:
  en: "Ready to use"
  de: "Einsatzbereit"
# A ready row NOT added yet. "Ready to use" in green read as finished there,
# and a user who left at that point never pressed Add, so the device never
# reached the device list or Loxone. It says what is left to do, and the
# button beside it ("Add") needs no longer label because of it.
web.zigbee.state_ready_to_add:
  en: "Ready - add it to your devices"
  de: "Bereit – jetzt hinzufügen"
web.zigbee.state_failed:
  en: "Could not read this device"
  de: "Dieses Gerät konnte nicht gelesen werden"
web.zigbee.state_stuck:
  en: "No progress for a while. Battery devices fall asleep - press the device's button every few seconds."
  de: "Seit einer Weile kein Fortschritt. Batteriegeräte schlafen ein – drücken Sie alle paar Sekunden die Taste am Gerät."
web.zigbee.state_waiting_wake:
  en: "Waiting for the device to wake up - press its button"
  de: "Wartet, bis das Gerät aufwacht – drücken Sie seine Taste"
web.zigbee.retry:
  en: "Retry"
  de: "Erneut versuchen"
web.zigbee.remove:
  en: "Remove"
  de: "Entfernen"
# The hint on a row that has finished its interview. A different thing, in a
# different place, from a failed interview: a device with no quirk works
# with the standard Zigbee functions and is not broken.
web.zigbee.quirk_applied:
  en: "Device-specific support (quirk) applied"
  de: "Gerätespezifische Anpassung (Quirk) angewendet"
web.zigbee.quirk_none:
  en: "No device-specific support (quirk): standard Zigbee functions only, so some values may be missing"
  de: "Keine gerätespezifische Anpassung (Quirk): nur Zigbee-Standardfunktionen, einzelne Werte können fehlen"
web.zigbee.name_label:
  en: "Name"
  de: "Name"
# The step that makes the device one of the bridge's own: device list,
# export, Loxone. A button and not a blur, because the prefilled name is
# often exactly right and a user who agrees with it has no field to leave.
# Short, because the row's own sentence (`state_ready_to_add`) already says
# where it adds the device to - and the longer German label wrapped onto two
# lines beside the Remove button at 375 px.
web.zigbee.adopt:
  en: "Add"
  de: "Hinzufügen"
# The name saves when its field is left, the room as soon as one is chosen
# in the select - one sentence for both would be false for one of them.
web.zigbee.adopted_hint:
  en: "In the device list. The name is saved when you leave its field, the room as soon as you choose it."
  de: "In der Geräteliste. Der Name wird gespeichert, sobald Sie das Feld verlassen, der Raum, sobald Sie ihn auswählen."
web.zigbee.saved:
  en: "Saved."
  de: "Gespeichert."
# The accessible name of the group of rows still to be dealt with. Its
# summary is hidden (the group is always open), so without this it read as
# an unnamed group beside the "already added" one.
web.zigbee.open_group_label:
  en: "New devices"
  de: "Neue Geräte"
# The title of the collapsed group of rows already in the device list. Two
# keys rather than one with a plural rule: i18n.t knows no plural forms (the
# pattern of `web.devices.code_detect_remaining_*`).
web.zigbee.added_group_one:
  en: "1 device already added"
  de: "1 Gerät bereits hinzugefügt"
web.zigbee.added_group_many:
  en: "{count} devices already added"
  de: "{count} Geräte bereits hinzugefügt"
# The honest removal copy of design 3.1: `remove()` forgets the device
# whether or not the leave request is ever delivered, and nothing stops the
# device rejoining.
web.zigbee.remove_confirm:
  en: |
    Remove "{name}"?

    The bridge asks the device to leave the network and forgets it either way. A device that is asleep right now does not hear that request: factory-reset it before pairing it anywhere else.
  de: |
    "{name}" entfernen?

    Die Brücke bittet das Gerät, das Netz zu verlassen, und vergisst es in jedem Fall. Ein Gerät, das gerade schläft, erhält diese Bitte nicht: Setzen Sie es auf Werkseinstellungen zurück, bevor Sie es anderswo koppeln.
# Appended when the device was already added to the device list: the same
# orphans `web.devices.remove_confirm` names for a tile's removal.
web.zigbee.remove_confirm_adopted:
  en: |
    It also leaves the device list. In Loxone, every virtual input/output with the key prefix "d{id}_" is left orphaned - delete those by hand in Loxone Config.
  de: |
    Es verschwindet auch aus der Geräteliste. In Loxone bleiben alle virtuellen Ein- und Ausgänge mit dem Schlüssel-Präfix "d{id}_" verwaist – diese in Loxone Config von Hand löschen.
