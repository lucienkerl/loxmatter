web.devices.remove_confirm:
  en: |
    Really remove device "{label}"? This cannot be undone.

    Orphaned afterwards in Loxone:
    • every virtual input/output with the key prefix "d{id}_"
    • the imported templates "VIU_d{id}_….xml" and "VO_d{id}_….xml"

    Delete these by hand in Loxone Config.
  de: |
    Gerät "{label}" wirklich entfernen? Das kann nicht rückgängig gemacht werden.

    In Loxone bleiben danach verwaist:
    • alle virtuellen Ein- und Ausgänge mit dem Schlüssel-Präfix "d{id}_"
    • die importierten Vorlagen "VIU_d{id}_….xml" und "VO_d{id}_….xml"

    Diese in Loxone Config von Hand löschen.
# Appended to `web.devices.remove_confirm` above (see `removeDevice` in
# app.js), never shown on its own - only when the device is a member of
# at least one group. `{groups}` is the comma-joined list of that
# device's group labels, computed client-side from `member_ids` before
# the dialog opens. Names the SAME failure `web.groups.delete_confirm`
# already names for a deleted group's own "g{id}_" keys - here the group
# survives, but loses every command only this device made available: a
# light command it was the last member to carry (design 2026-09-13, 3.1,
# `register_group_commands`), or - when it was the group's only member -
# every command the group had. Removing one of several members can only add
# a non-light command to the group, never take one away.
web.devices.remove_confirm_groups_note:
  en: |
    It also belongs to: {groups}. Any function of a group that only this device provided - colour, say, or everything when it is the group's only member - disappears, and the group's virtual output for it answers 404 in Loxone from then on.
  de: |
    Es gehört außerdem zu: {groups}. Jede Funktion einer Gruppe, die nur dieses Gerät bereitstellte – etwa Farbe, oder alles, wenn es das einzige Mitglied ist –, fällt weg, und der zugehörige virtuelle Ausgang der Gruppe antwortet in Loxone von da an mit 404.
# The second step of removing a device whose technology has no configured
# source - the 503 of `DELETE /api/devices/{id}` carrying "offer":
# "forget_only" - shown on the device's tile with the two buttons below.
# `{reason}` is the server's own sentence ("Zigbee is not set up in this
# installation"), `{label}` the device's name. Honest about what is left
# undone: the device was never asked to leave its network.
web.devices.forget_only_offer:
  # Quoted per the file's convention (see e.g. `api.devices.unknown_room`
  # above): “curly” in `en`, „low-high“ in `de` - straight quotes here were
  # a Minor finding of the 2026-09-13 verification (N-4).
  en: "{reason}, so “{label}” could not be asked to leave its network. You can remove it from loxmatter only: it leaves the device list and the export, and the bridge stops sending its values to Loxone - but the device itself is not told. Factory-reset it before pairing it anywhere else."
  de: "{reason}, daher konnte „{label}“ nicht gebeten werden, sein Netz zu verlassen. Sie können es nur aus loxmatter entfernen: Es verschwindet aus der Geräteliste und dem Export, und die Brücke sendet seine Werte nicht mehr an Loxone – das Gerät selbst erfährt davon aber nichts. Setzen Sie es auf Werkseinstellungen zurück, bevor Sie es anderswo koppeln."
web.devices.forget_only:
  en: "Remove from loxmatter only"
  de: "Nur aus loxmatter entfernen"
web.devices.forget_only_keep:
  en: "Keep it"
  de: "Behalten"
web.devices.commission_code_required:
  en: "Please enter a pairing code first."
  de: "Bitte zuerst einen Pairing-Code eingeben."
web.devices.commission_success:
  # The limitation formerly named here ("only after a restart of the
  # bridge", spec 12.3) no longer exists: the commissioning route calls
  # `follow` and seeds the new device's values immediately. What
  # remains is the other, still-correct note - the values only reach the
  # Miniserver after export and import, because until then there is no
  # virtual input for them there.
  en: |
    {label} was commissioned and delivers live values from now on – no restart of the bridge needed. They reach the Miniserver as soon as you have exported the templates and imported them into Loxone Config.
  de: |
    {label} wurde eingelernt und liefert ab sofort Live-Werte – ohne Neustart der Brücke. Im Miniserver kommen sie an, sobald Sie die Vorlagen exportiert und in Loxone Config importiert haben.
web.devices.commission_failed:
