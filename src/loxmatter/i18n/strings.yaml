# --- web.devices — device list, commissioning, operation ---
web.devices.commission_heading:
  en: "Commission a new device"
  de: "Neues Gerät einlernen"
web.devices.code_placeholder:
  # Shows the FORM instead of describing it. The earlier parenthetical
  # ("11 digits or MT:…") named the form - whoever is holding the sticker
  # in their hand first had to translate that into "the lower of the two
  # numbers". That information is now carried by the example line under
  # the field and the sticker sketch next to it. Both languages carry the
  # same value - a digit sequence does not translate.
  en: "1234-567-8901"
  de: "1234-567-8901"
web.devices.thread_dataset_placeholder:
  # Since the commissioning card was reworked, the placeholder no longer
  # says WHAT FOR the field is there, but WHAT the value looks like: what
  # it's for now sits alongside it three times over - in the disclosure
  # opened for it (web.devices.thread_summary), in the label
  # (web.devices.thread_dataset_label), and in the note underneath
  # (web.devices.thread_dataset_hint). A placeholder saying the same thing
  # a fourth time would waste the one place an example can go. Both
  # languages carry the same value - a hex dataset does not translate.
  en: "0e08000000000100000300…"
  de: "0e08000000000100000300…"
web.devices.commission_submit:
  en: "Commission"
  de: "Einlernen"
web.devices.code_label:
  en: "Pairing code"
  de: "Pairing-Code"
# The chip to the right in the input field (design of 2026-09-07,
# section 6). It names what the field has recognized - and so you learn
# the code's name at exactly the place where you type it. It only
# DESCRIBES: even "too long" does not disable the commission button.
web.devices.code_detect_manual:
  en: "numeric code"
  de: "Zahlencode"
web.devices.code_detect_manual_long:
  en: "numeric code, long"
  de: "Zahlencode, lang"
web.devices.code_detect_qr:
  en: "QR code"
  de: "QR-Code"
# Two keys instead of one with a plural rule: i18n.t knows no
# plural forms, and "1 digits to go" would be wrong in both languages.
web.devices.code_detect_remaining_one:
  en: "1 digit to go"
  de: "noch 1 Ziffer"
web.devices.code_detect_remaining_many:
  en: "{n} digits to go"
  de: "noch {n} Ziffern"
web.devices.code_detect_too_long:
  en: "too long"
  de: "zu lang"
web.devices.code_detect_invalid:
  en: "not a valid code"
  de: "kein gültiger Code"
# The example line under the field. The LABELS in it are the same
# keys as those of the chip (code_detect_manual/_qr) - it is the same
# term, and that it reads the same in both places is the whole point
# of the exercise. Only the two example values stand here, and they do
# not translate.
web.devices.code_example_manual:
  en: "1234-567-8901"
  de: "1234-567-8901"
web.devices.code_example_qr:
  en: "MT:Y.K90SO527JA0648G00"
  de: "MT:Y.K90SO527JA0648G00"
# The sticker sketch next to the field (design section 7). It is an
# illustration, not a source of information - the example line above it
# carries the same content as text. The aria-label therefore describes
# what is to be SEEN, instead of reading out the content a second time.
web.devices.sticker_alt:
  en: "Sketch of a Matter label: the QR code on the left, the numeric code highlighted below it on the right."
  de: "Skizze eines Matter-Aufklebers: links der QR-Code, rechts darunter der hervorgehobene Zahlencode."
web.devices.code_where_hint:
  en: "Printed on the device, its packaging, or in the manual. The text behind the QR code works too."
  de: "Steht auf dem Gerät, seiner Verpackung oder im Handbuch. Statt der Zahl geht auch der Text hinter dem QR-Code."
web.devices.room_label:
  en: "Room"
  de: "Raum"
web.devices.thread_dataset_label:
  en: "Thread dataset"
  de: "Thread-Datensatz"
# The two disclosures above the commissioning form. Both are phrased as a
# question, or as a case one recognises oneself in - not as the name of
# the field behind them: whoever looks here is searching for an answer
# ("my code is not accepted"), not an input field.
web.devices.code_help_summary:
  en: "Code not accepted?"
  de: "Code wird nicht angenommen?"
web.devices.thread_summary:
  en: "Different Thread network"
  de: "Anderes Thread-Netz"
# The two steps of the progress display. There are exactly two because the
# interface can distinguish exactly two phases of commissioning: the POST
# to /api/devices/commission and the subsequent loading of signals and
# commands. A third item ("device found") could be displayed nicely, but
# would be a guess - the Matter stack reports no intermediate state to
# this bridge as long as there is no dedicated channel for it.
web.devices.commission_step_joining:
  en: "Commissioning the device into the fabric"
  de: "Gerät wird ins Fabric aufgenommen"
web.devices.commission_step_loading:
  en: "Loading signals and commands"
  de: "Signale und Befehle werden geladen"
web.devices.commission_again:
  en: "Commission another device"
  de: "Noch ein Gerät einlernen"
web.devices.commission_retry:
  en: "Try again"
  de: "Erneut versuchen"
