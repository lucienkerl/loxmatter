# --- device groups (design 2026-09-10, section 6): several devices of one
# category behind ONE Loxone virtual output. The group tile reuses the
# device tile's strings wherever the sentence is the same
# (`web.devices.control_button`, `controls_loading`, `no_known_commands`,
# `menu_room_heading`, `room_none`, `room_new`, the three save errors) -
# only the sentences that are genuinely about a group live here.
#
# `web.groups.member_count` deliberately does NOT read "{count} devices":
# t() interpolates and does not choose a plural form (i18n/__init__.py),
# and a group of one would then be told it has "1 devices". The label
