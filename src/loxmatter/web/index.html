          <!--
            Channel setting - design section 9: which upstream the check
            (and any subsequent apply) compares against, persisted like
            every other setting (`store.update_settings`) instead of only
            living in this page's own state - `updateStatus.channel`
            comes straight from `GET /api/update/status`. Same
            `nav.tabs`/`button.active` markup as the language toggle
            further down (its own card, `web.settings.language_heading`):
            that is the one existing example in this interface of a
            small button-row toggle with an active state, and inventing
            a second shape for the same idea would be exactly the kind
            of drift this file's conventions are meant to avoid.

            Disabled while a job is being confirmed or is running:
            switching what the NEXT check compares against, mid-decision
            or mid-installation of THIS one, answers a question nobody
            asked yet, and `setUpdateChannel` immediately re-runs the
            check against whatever channel was just chosen.
          -->
          <!--
            HIDDEN FOR 0.3.0 - the channel switch cannot work end to end
            yet, and the maintainer chose to hide it rather than ship a
            control that fails on every click:

              * update_check.py answers the dev channel with
                target="main"; applyUpdate() in app.js posts that
                verbatim as `target`; the sidecar's own pattern for the
                dev channel (update-once.sh, Rule 1) requires
                ^[0-9a-f]{7,40}$ and rejects "main" outright.
              * Even a real commit SHA would not help: set_tag
                (update-once.sh) writes the bare SHA as the image tag,
                but CI only ever publishes dev images as :dev and
                :sha-<short> - loxmatter:<sha> is never a real tag.

            Everything BEHIND this control is intentionally left wired up
            and working: the `channel` setting, store.update_settings,
            PATCH /api/update/settings, and update_check.py's own
            dev-channel comparison logic all still work exactly as
            designed and are still covered by their own tests - so
            re-enabling this later is a UI change (uncommenting the block
            below) plus the set_tag/CI-tag fix above, not a rebuild of
            the feature. Do NOT delete this block as dead code, and do
            NOT uncomment it without first fixing both points above -
            re-enabling it as-is would reintroduce a channel switch that
            fails on every attempt.

            The commented-out markup, unchanged from before this fix:

            <div class="row">
              <span x-text="t('web.system.update_channel_label')"></span>
              <nav class="tabs">
                <button
                  :class="{ active: updateStatus?.channel === 'stable' }"
                  @click="setUpdateChannel('stable')"
                  :disabled="updateRunning() || updateConfirming"
                  x-text="t('web.system.update_channel_stable')"
                ></button>
                <button
                  :class="{ active: updateStatus?.channel === 'dev' }"
                  @click="setUpdateChannel('dev')"
                  :disabled="updateRunning() || updateConfirming"
                  x-text="t('web.system.update_channel_dev')"
                ></button>
              </nav>
            </div>
            The one thing the maintainer's own brief insists must not be
            buried: switching to Development installs whatever currently
            sits on main, untested intermediate states included. A
            "banner warn", not a "hint", and shown right under the switch
            itself - not only inside the confirmation dialog three states
            down, which someone choosing the channel today may never even
            reach in this session.
            <p class="banner warn" x-show="updateStatus?.channel === 'dev'" x-cloak
               x-text="t('web.system.update_channel_dev_warning')"></p>
          -->

          <!--
            The update flow - design "Applying updates through the web UI"
            (2026-09-08), section 9. Four states, all in this one card, no
            fifth tab and no global banner (a state that may stand for days
            does not deserve one). Nothing here disables anything else in
            the interface while a job runs (spec section 9): the connection
            banner below explains the one failure mode a mid-update click
            elsewhere would actually hit.
          -->

          <!-- No sidecar reachable: not a dead button, but the console path. -->
          <p class="hint" x-show="updateStatus && !updateStatus.updater_present && !updateRunning()" x-cloak
             x-text="t('web.system.update_no_updater')"></p>

          <!-- 1: An update is ready. -->
          <template x-if="updateStatus?.updater_present && !updateRunning() && updateAvailable?.target">
            <div>
              <p class="banner warn"
                 x-text="updateStatus.channel === 'dev'
                   ? t('web.system.update_behind', { behind: updateAvailable.behind })
                   : t('web.system.update_available', { version: updateAvailable.target })"></p>
              <pre class="notes" x-show="updateAvailable.notes" x-cloak x-text="updateAvailable.notes"></pre>
              <button @click="updateConfirming = true" x-text="t('web.system.update_apply')"></button>
            </div>
          </template>

          <!-- Up to date, or checking is off, or the check itself failed
               (no internet, GitHub unreachable) - three different reasons
               to show no button, none of them a fault of this bridge.

               Gated on `updateStatus?.updater_present` (added alongside
               the channel switch above): without a sidecar to install
               anything through, "up to date" is not information, it is
               noise sitting right next to "this installation has no
               updater" above - both true, only one of them useful. The
               error line stays ungated: an unreachable GitHub or a
               disabled check is a real, independent fact worth showing
               even without a sidecar, since it explains why the check
               itself has nothing to say. -->
          <p class="hint" x-show="!updateRunning() && updateStatus?.updater_present && updateAvailable && !updateAvailable.target && !updateAvailable.error"
             x-cloak x-text="t('web.system.update_up_to_date', { checked_at: updateAvailable.checked_at })"></p>
          <p class="hint" x-show="!updateRunning() && updateAvailable?.error" x-cloak
             x-text="updateAvailable.error"></p>

          <!-- 2: Confirmation. -->
          <template x-if="updateConfirming">
            <div class="confirm">
              <h3 x-text="t('web.system.update_confirm_title', { version: updateAvailable.target })"></h3>
              <p class="banner warn" x-text="t('web.system.update_confirm_downtime')"></p>
              <div class="row">
                <button @click="updateConfirming = false" x-text="t('web.system.update_cancel')"></button>
                <button @click="applyUpdate()" x-text="t('web.system.update_apply')"></button>
              </div>
            </div>
          </template>

          <!-- 3: Running - including the moment the bridge is gone. The
               connection banner (below the header, outside this card)
               carries the "bridge is restarting" text for that window;
               this card keeps showing the steps from state.json, which the
               sidecar - not the bridge - keeps writing throughout. -->
          <template x-if="updateRunning()">
            <div>
              <h3 x-show="updateStatus.state.phase !== 'health'" x-cloak
                  x-text="t('web.system.update_available', { version: updateStatus.state.to })"></h3>
              <h3 x-show="updateStatus.state.phase === 'health'" x-cloak
                  x-text="t('web.system.update_restarting')"></h3>
              <ul class="steps">
                <li :class="{ done: ['pull','recreate','health'].includes(updateStatus.state.phase), now: updateStatus.state.phase === 'backup' }"
                    x-text="t('web.system.update_step_backup')"></li>
                <li :class="{ done: ['recreate','health'].includes(updateStatus.state.phase), now: updateStatus.state.phase === 'pull' }"
                    x-text="t('web.system.update_step_pull')"></li>
                <li :class="{ done: updateStatus.state.phase === 'health', now: updateStatus.state.phase === 'recreate' }"
                    x-text="t('web.system.update_step_recreate')"></li>
                <li :class="{ now: updateStatus.state.phase === 'health' }"
                    x-text="t('web.system.update_step_health')"></li>
              </ul>
              <!-- A crashed sidecar (OOM, a full disk) leaves `phase`
                   frozen mid-job forever - nothing is left to write
                   `state.json` any further. `updater_present` (see
                   `update.py`'s `updater_present()`) already tells the
                   difference: no heartbeat in the last 30 seconds means
                   nobody is going to advance this job, however long the
                   same step stays highlighted above. Shown instead of the
                   "reconnects by itself" hint below, not alongside it -
                   that hint promises exactly the recovery this state says
                   is not going to happen on its own. -->
              <p class="banner danger" x-show="updateStalled()" x-cloak
                 x-text="t('web.system.update_stalled')"></p>
              <p class="hint" x-show="updateStatus.state.phase === 'health' && !updateStalled()" x-cloak
                 x-text="t('web.system.update_restarting_hint')"></p>
            </div>
          </template>

          <!-- 3b: Accepted, never collected. `updateRunning()` reads
               `false` here - `state.json` never once advanced past
               whatever it held before this request, so state 3 above
               never renders at all and has no step list to point to.
               This is a DIFFERENT fact from `updateStalled()` (a job that
               WAS running and then went quiet): the request was accepted
               (a 2xx from POST /api/update/apply) but `updateNeverCollected()`
               (app.js) says the sidecar has now had `UPDATE_APPLY_GRACE_MS`
               - several multiples of its own two-second loop - and never
               once wrote this job's id into state.json. The most likely
               cause is exactly the one `api/update.py`'s `apply()` cannot
               see for itself: a sidecar that answered the route's own
               presence check and then crashed (OOM, `docker kill`, a host
               reboot) before it ever got to read request.json. Without
               this the card would simply have gone back to looking like
               nothing had happened - a silent, misleading "back to
               normal" for a request that in fact never ran. -->
          <p class="banner danger" x-show="updateNeverCollected()" x-cloak
             x-text="t('web.system.update_not_collected')"></p>

          <!-- 4: Result. -->
          <p class="banner ok" x-show="updateStatus?.state?.phase === 'done'" x-cloak
             x-text="t('web.system.update_done', { version: updateStatus.state.to })"></p>
          <template x-if="updateStatus?.state?.phase === 'failed'">
            <div>
              <p class="banner danger" x-text="t('web.system.update_failed')"></p>
              <p x-show="updateStatus.state.rolled_back" x-cloak
                 x-text="t('web.system.update_rolled_back', { version: updateStatus.state.to, from_version: updateStatus.state.from })"></p>
              <pre class="notes" x-text="updateStatus.log.slice(-8).join('\n')"></pre>
              <button @click="downloadFabricBackup()" x-text="t('web.system.backup_download')"></button>
            </div>
          </template>
          <!-- `rejected` (update-once.sh's `reject()`): the sidecar
               already decided the request BEFORE ever touching anything
               (spec section 10 / reject()'s own "state before log"
               doctrine) - already running, a target that does not state
               a version, an older version than what is running. Until
               now this phase was rendered NOWHERE and `state.error` was
               never displayed at all, so a rejected request produced no
               feedback whatsoever - worse still combined with Critical 3
               (the poll never even armed to notice the rejection landed).
               `state.error` is exactly the human sentence reject() wrote
               for this specific refusal - shown as-is, the same
               "backend's own wording, not a rewrite of it" rule
               `updateError` below already follows for a 409/503. -->
          <p class="banner danger" x-show="updateStatus?.state?.phase === 'rejected'" x-cloak
             x-text="t('web.system.update_rejected', { message: updateStatus.state.error })"></p>

          <p class="hint" x-show="updateError" x-cloak x-text="updateError"></p>
        </div>

        <!-- Action, not diagnosis - that's why before system checks and
             not between the log views below. The button triggers
             the same full resend as the bridge start and as
             /resync from the config project (Spec 6.4), just via
             POST /api/diagnostics/resync, which is behind the guard. -->
        <div class="card">
          <h2 x-text="t('web.system.resync_heading')"></h2>
          <p class="hint" x-text="t('web.system.resync_explanation')"></p>
          <button
            @click="resyncAll()"

            x-text="t('web.system.resync_button')"

          <p x-show="resyncError" x-cloak class="banner danger" x-text="resyncError"></p>

          Live diagnostics (Task 6, Spec 10.5): ONE WebSocket

                No "Debug" here (follow-up Task 7, Fix 3f): the ring

                class="entry"
                x-text="entry.timestamp + '  ' + entry.key + ' = ' + entry.value"

        <div class="card">
          <h2 x-text="t('web.system.command_log_heading')"></h2>

        <div class="card">
          <h2 x-text="t('web.system.backup_heading')"></h2>

          <button @click="downloadFabricBackup()" x-text="t('web.system.backup_download')"></button>
          <p x-show="backupError" x-cloak class="banner danger" x-text="backupError"></p>
        </div>

      <!-- ================================================================
           View 4: Settings
           ================================================================ -->
      <section x-show="view === 'settings'" x-cloak>
        <div class="card">
          <h2 x-text="t('web.settings.connection_heading')"></h2>
          <p class="hint" x-html="t('web.settings.connection_explanation')"></p>
          <div class="row">
            <label
              ><span x-text="t('web.bridge_ip_label')"></span>

            ></span>

              class="hint"
              x-show="!bridgeSettings.saved_at"
              x-cloak

              ><span x-text="t('web.settings.resend_interval_label')"></span>

    </div>
    </template>

    <!--
      Signal modal (design "Signals as a modal", 2026-09-05). Exactly ONE
      `<dialog>` for the whole page, deliberately outside the `x-for`
      loop over the device tiles: markup inside `x-for` is delivered once PER
      DEVICE - with thirty devices there would be thirty
      complete signal tables in the document, and every `id` inside them
      thirtyfold (the same pitfall that `aria-labelledby` in the
      tile menu already had to steer around once).

      It also sits outside the login `<template>`, like the
      toasts below: this way `$refs.signalsModal` is always
      resolvable and does not depend on whether Alpine happens to be
      rendering the logged-in subtree right now.

      `x-ref` is permitted here, even though the comment on the tile menu
      (Finding 3) explicitly advises against it. The objection there applies to a
      registration that runs PER TILE: the page shares a single
      `x-data` on the `<body>`, and the entry of the most recently
      rendered tile overwrites every one before it. This `<dialog>` sits
      exactly once in the document - nobody can overwrite it. The same
      situation as with `x-ref="diagnosticsLogsList"` and `x-ref="datagramsList"`
      further above, which are unproblematic for the same reason.

      `@close` is the ONLY place that resets
      `signalsModalDevice`. The event fires on every way of closing - Escape,
      the close button, the backdrop, `close()` from JavaScript - so there is also
      no path on which the Alpine state and the visible state
      can drift apart. The same role that `@toggle` plays for the
      `<details>` of the tile menu. Do NOT add further resets at
      the individual closing paths - exactly this spread across
      several handlers was the cause of six rounds of review for the room
      selection field.

      For the same reason, since finding 3 of the follow-up review
      (2026-09-07) the same handler also resets `expandedSignalKey`:
      without that, the same disclosure would immediately be open again
      the next time the same device is opened, without the kebab menu
      having been clicked for it - `@close` is, after all, also the one
      place for this field where ALL closing paths converge.

      A `<dialog>` does NOT close on its own on a click on the backdrop
      (unlike what Escape does). `@click.self` alone is NOT enough for
      that: the click event's target is already `<dialog>` when a
      mousedown starts IN the content (e.g. while selecting a signal title)
      and the mouseup, after dragging, lands on the backdrop - `.self`
      only checks the click target, not where the gesture began. That is
      why `@mousedown` records in `signalsModalBackdropMousedown` (app.js)
      whether the mousedown ITSELF was on the backdrop. The click handler
      only closes when THREE things hold: `.self` (the click target is
      the `<dialog>`), this recorded field, and `isBackdropEvent` for the
      click itself - so position counts at both ends of the gesture, not
      only at the start (reasoning for that further below). The field is
      pure presentation bookkeeping for this one gesture, not modal state
      like `signalsModalDevice` - `@close` remains its only
      reset point, see above.

      The mousedown handler deliberately carries NO `.self` (Finding 1 of
      the follow-up check): with `.self`, the field would only be SET when the
      mousedown was on the backdrop, and only cleared again inside `@click.self`
      - but Alpine skips a `.self` expression entirely
      when the target does not match. A mousedown on the backdrop that never ends in
      a click on the `<dialog>` (Escape with the button held down,
      releasing outside the window), would leave the field permanently at
      `true` - and the next drag starting from the content
      would then close the modal in exactly the way this rework is meant to
      prevent. Without `.self` the handler runs on EVERY mousedown in the subtree
      and rewrites the field every time; a stale value cannot survive one
      gesture.

      `isBackdropEvent` (app.js) decides whether a mouse event really was
      on the backdrop. The target alone is not enough for that: the modal's own
      scrollbar also belongs to the `<dialog>` and delivers
      the same target - without the distinction, a grab at it would close the
      modal, of all things for the long lists it exists for
      in the first place (a device with 159 signals). The helper therefore compares the
      position against the dialog's rectangle; the reasoning, including the
      discarded `offsetX` variant, is documented at it.

      This is checked at BOTH ends of the gesture - mousedown as well as click.
      Otherwise a drag from the backdrop INTO the content would also close the
      modal: the click event fires at the nearest common ancestor
      of the mousedown and mouseup targets, and in this direction
      that is again the `<dialog>`.

      `aria-labelledby` refers to a FIXED `id` on the heading,
      unlike the `aria-labelledby` in the tile menu further above, which
      has to derive its id from `device.id` - there, the binding
      exists once PER TILE, here the `<dialog>` sits exactly once in the
      document (see above), so a fixed id cannot collide.
    -->
    <dialog
      x-ref="signalsModal"
      class="signals-modal"
      aria-labelledby="signals-modal-heading"
      @close="signalsModalDevice = null; expandedSignalKey = null"
      @mousedown="signalsModalBackdropMousedown = isBackdropEvent($event, $el)"
      @click.self="if (signalsModalBackdropMousedown && isBackdropEvent($event, $el)) $el.close(); signalsModalBackdropMousedown = false"
    >
      <template x-if="signalsModalDeviceObject()">
        <div class="signals-modal-body">
          <div class="signals-modal-head">
            <h2
              id="signals-modal-heading"
              x-text="t('web.signals.modal_heading', { device: signalsModalDeviceObject().label })"
            ></h2>
            <span style="flex: 1 1 auto"></span>
            <button
              class="signals-modal-close"
              :title="t('web.signals.modal_close')"
              :aria-label="t('web.signals.modal_close')"
              @click="closeSignalsModal()"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>

          <!-- The one number this modal gets opened for. Until now it
               appeared nowhere - you had to count 17 checkboxes. -->
          <div class="signals-summary">
            <span
              x-text="t('web.signals.export_summary', { exported: exportedSignalCount(signalsModalDevice), total: signalCount(signalsModalDevice) })"
            ></span>
            <span style="flex: 1 1 auto"></span>
            <button
              @click="deselectAllSignals(signalsModalDevice)"
              x-text="t('web.signals.deselect_all')"
            ></button>
          </div>

          <p x-show="signalsError" x-cloak class="banner danger" x-text="signalsError"></p>
          <p class="hint">
            <span x-text="t('web.signals.key_hint')"></span>
            <span x-text="t('web.signals.resend_explanation')"></span>
          </p>

          <!-- Stays as a retry for the error case: normally
               `startApp` has long since loaded every device's signals, so this
               button only shows up when this one particular fetch
               has failed (the reason is in the banner above it). -->
          <button
            x-show="!signalsByDevice[signalsModalDevice]"
            @click="loadSignals(signalsModalDevice)"
            x-text="t('web.signals.load_button')"
          ></button>

          <template x-if="signalsByDevice[signalsModalDevice]">
            <div>
              <!--
                ONE template for all groups. The obvious design -
                functional as a plain block, expert as a `<details>` -
                would need two branches and, in each, its own copy of the
                signal row below it. Exactly this duplication is what
                `signalGroupsFor` (app.js) abolished: 51 byte-identical
                lines that had to be updated in both places on every
                change.

                The open/closed state lives in the DOM, not in Alpine - the same
                pattern as the tile menu, and the reason why the old
                global open/close toggle (Task 8) is removed without replacement.

                `x-init` instead of `:open` is mandatory, not a style choice: Alpine
                re-evaluates a BINDING every time its dependencies change,
                and `signalGroupsFor` depends on `signalsByDevice` - saving a
                signal title would rewrite `:open` and
                silently collapse the expert group that was just open again.
                `x-init` runs once per element; since `:key` with
                `group.key` is stable, Alpine does not rebuild the node on a
                re-render, and the user's click stays put. Do NOT simplify this to
                `:open`.
              -->
              <!-- Outside the group loop, since the groups are built by
                   endpoint (design 2026-09-07, section 7.4): an endpoint
                   group is never empty, it is built from its signals
                   after all. "No functional signals" now means
                   "there is no endpoint group at all". -->
              <p
                class="hint"
                x-show="functionalSignalsFor(signalsModalDevice).length === 0"
                x-text="t('web.signals.none_functional')"
              ></p>
              <!-- The column header stays stuck at the top while
                   scrolling: without it, the two checkbox columns lose
                   their meaning as soon as it scrolls out of view with 173
                   signals. It carries THE SAME `grid-template-columns` as
                   every data row - that is the whole reason the table
                   lines up, and the test
                   `test_the_signal_rows_and_the_header_share_one_grid`
                   pins exactly this equality. -->
              <div class="signal-grid signal-grid-head">
                <span x-text="t('web.signals.col_export')"></span>
                <span x-text="t('web.signals.col_signal')"></span>
                <span x-text="t('web.signals.col_input')"></span>
                <span class="col-right" x-text="t('web.signals.col_value')"></span>
                <span class="col-center" x-text="t('web.signals.col_resend')"></span>
                <span></span>
              </div>
              <template x-for="group in signalGroupsFor(signalsModalDevice)" :key="group.key">
                <details class="signal-group" x-init="$el.open = !group.collapsible">
                  <summary>
                    <span x-text="group.title"></span>
                    <span class="muted" x-show="group.subtitle" x-text="group.subtitle"></span>
                    <span class="muted" x-text="'(' + group.signals.length + ')'"></span>
                    <!-- `aria-hidden` like on the kebab icon and the modal's close
                         button, NOT like on the older chevron of the
                         project-file-sync disclosures: a decorative icon in
                         a control that already has a name (the `<summary>`
                         carries the group title and count) must not give the
                         accessibility tree a second, competing name. -->
                    <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
                  </summary>
                  <p
                    class="hint"
                    x-show="group.collapsible"
                    x-text="t('web.signals.functional_vs_expert_explanation')"
                  ></p>
                  <!-- `x-for` requires exactly ONE root element per signal.
                       The grid row alone would normally be that (see
                       design 2026-09-07, section 7.2) - the disclosure
                       right below it therefore needs this wrapper, even
                       though it itself is not a grid child. -->
                  <template x-for="signal in group.signals" :key="signal.key">
                    <div class="signal-row-wrap" :class="{ 'is-expanded': expandedSignalKey === signal.key }">
                      <div class="signal-grid signal-row-cells">
                        <label class="col-center">
                          <input
                            type="checkbox"
                            :checked="signal.exported"
                            :disabled="!signal.exportable"
                            :aria-label="t('web.signals.export_checkbox')"
                            :title="t('web.signals.export_checkbox')"
                            @change="toggleExported(signal)"
                          />
                          <!-- Visible only below 640px (`.col-center-label`
                               in style.css), where, with no column header,
                               it is the checkbox's only visible label.
                               `aria-hidden`, because the checkbox already
                               carries its `aria-label` - this text is the
                               same information merely made visible a second
                               time, not a second one for assistive
                               technology. -->
                          <span
                            class="col-center-label"
                            aria-hidden="true"
                            x-text="t('web.signals.export_checkbox')"
                          ></span>
                        </label>
                        <input
                          type="text"
                          class="signal-title"
                          :value="signal.title"
                          @input="titleDrafts[signal.key] = $event.target.value"
                          @change="saveTitle(signal)"
                        />
                        <span class="key" :title="t('web.signals.key_tooltip')" x-text="signal.key"></span>
                        <!--
                          When the value last arrived is in the `title` - not
                          next to it in the running text (2026-09-03). A note like
                          "7s ago" changes its width every second and
                          thereby shifts the whole row; the eye then follows
                          the movement instead of the change. `value-fresh` shows
                          that instead: the value briefly lights up and
                          fades again, without anything in the layout
                          moving.
                        -->
                        <span
                          class="value col-right"
                          :class="{ 'value-fresh': signalIsFresh(signal) }"
                          :title="signalAgeTitle(signal)"
                          x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                        ></span>
                        <!-- The same control as in the export column,
                             and that is deliberate: both are a yes/no per
                             signal in the same row. The first design
                             had a toggle switch here - two
                             controls for the same case, exactly the
                             inconsistency that made this modal hard to
                             read. The rule: the control follows the
                             CONTAINER, not the meaning. In a table,
                             checkboxes - they line up in a column and
                             stay quiet; a column of 17
                             toggle switches would be a noticeably louder
                             texture, and loudness is exactly this modal's
                             problem. A switch belongs in a
                             detail area with an explanatory sentence next
                             to it, not in a table column. -->
                        <label class="col-center">
                          <input
                            type="checkbox"
                            :checked="signal.resend"
                            :disabled="!signal.exportable"
                            :aria-label="t('web.signals.resend_checkbox')"
                            :title="t('web.signals.resend_checkbox')"
                            @change="toggleResend(signal)"
                          />
                          <!-- Like the export column: only visible
                               below 640px, `aria-hidden` for the same
                               reason - the checkbox already has its
                               name via `aria-label`. -->
                          <span
                            class="col-center-label"
                            aria-hidden="true"
                            x-text="t('web.signals.resend_checkbox')"
                          ></span>
                        </label>
                        <!-- Since task 8, the last cell carries only the
                             kebab menu, nothing else: the warning pill
                             with `signal.reason` used to sit here in the
                             28px column and wrapped there as soon as the
                             text was longer than a few characters (any
                             device with a text- or list-valued signal, see
                             `_UNEXPORTABLE_REASONS` in `api/devices.py`) -
                             measured at 744px scrollWidth against 719px
                             clientWidth in the modal. The pill now lives in
                             the disclosure, where there is room for real
                             sentences. -->
                        <button
                          class="signal-more"
                          :aria-expanded="expandedSignalKey === signal.key"
                          :aria-label="t('web.signals.row_details')"
                          :title="t('web.signals.row_details')"
                          @click="toggleSignalDetails(signal)"
                        ><svg class="icon" aria-hidden="true"><use href="#i-kebab"></use></svg></button>
                      </div>
                      <!-- The disclosure hangs BELOW exactly its own row,
                           not as a second `.row` next to it: it belongs to
                           this one signal, and that should be visible.
                           `x-cloak` prevents the brief flash of all
                           disclosures on first render, before Alpine has
                           evaluated `x-show`. -->
                      <div class="signal-detail" x-show="expandedSignalKey === signal.key" x-cloak>
                        <!-- `signal.path` carries the same information as
                             "1/59/1", but that is a puzzle as long as no
                             one says which number means what - here there is
                             finally room to spell it out. The decomposition
                             of the path (which segment is the element) lives
                             in `signalOriginText` (app.js), not here in the
                             markup - knowledge about the path format
                             belongs in a named function, not in an
                             expression in the middle of the markup (finding
                             1 of the follow-up review, 2026-09-07). -->
                        <p class="hint" x-text="signalOriginText(signal)"></p>
                        <p class="badge warn" x-show="!signal.exportable" x-text="signal.reason"></p>
                        <!-- Only makes sense for attributes - an event has
                             no stored value that you could overwrite.
                             The origin note above it applies to both
                             signal kinds, which is why only THIS part
                             carries the `x-show`. -->
                        <div class="row" x-show="isAttributeSignal(signal)">
                          <input
                            type="text"
                            :placeholder="t('web.signals.raw_write_placeholder')"
                            @input="rawWriteDrafts[signal.key] = $event.target.value"
                          />
                          <button
                            @click="writeRaw(signal)"
                            :disabled="rawWriteBusyKey === signal.key"
                            x-text="t('web.signals.raw_write_submit')"
                          ></button>
                          <span
                            x-show="rawWriteMessages[signal.key]"
                            :class="rawWriteMessageClass(signal)"
                            x-text="rawWriteMessages[signal.key] ? rawWriteMessages[signal.key].text : ''"
                          ></span>
                        </div>
                      </div>
                    </div>
                  </template>
                </details>
              </template>
            </div>
          </template>
        </div>
      </template>
    </dialog>

    <!--
      Control modal (task 7): sliders instead of bare number fields for
      value-carrying commands. Structure, opening, closing, and
      backdrop click follow the signal modal above exactly - see its
      comments for the full reasoning: `@close` remains the
      ONLY place that resets `controlModalDevice`; `@mousedown`
      records in `controlModalBackdropMousedown` whether the gesture
      started on the backdrop, `@click.self` checks `isBackdropEvent` at
      BOTH ends; `x-ref` is unproblematic because this `<dialog>` sits
      exactly once in the document.

      Which control gets built per command is decided
      EXCLUSIVELY by `command.control` (`controlsByKind` filters by it) -
      `command.slug` below only serves as a label, never as a
      case distinction. That is why every percent slider carries its
      own `command.slug` instead of a fixed translation: the
      checked-in IKEA light accepts two percent commands (`level`
      and `level_onoff`), so the modal draws two sliders
      stacked, and for diagnosis what matters is exactly which of the
      two the light actually follows. The Kelvin slider stays
      fixed-labelled - there is only one of those per device.

      The white/color tab bar appears only if a device can do BOTH
      paths (`hasColourTabs`) - a pure white-tone light gets
      its Kelvin slider without tabs, without a single check here
      on device type or model.
    -->
    <!-- Two classes deliberately: `signals-modal` alone carries the
         framing (style.css) that both modals share; `control-modal`
         is what distinguishes this one from the signal modal in the
         first place. Without the second class,
         `document.querySelector('dialog.signals-modal')` matches
         both, and WHICH one it returns is decided solely by the order in
         the document - `scripts/capture_screenshots.py` depends on that. -->
    <dialog
      x-ref="controlModal"
      class="signals-modal control-modal"
      aria-labelledby="control-modal-heading"
      @close="controlModalDevice = null"
      @mousedown="controlModalBackdropMousedown = isBackdropEvent($event, $el)"
      @click.self="if (controlModalBackdropMousedown && isBackdropEvent($event, $el)) $el.close(); controlModalBackdropMousedown = false"
    >
      <template x-if="controlModalDeviceObject()">
        <div class="signals-modal-body">
          <div class="signals-modal-head">
            <h2
              id="control-modal-heading"
              x-text="t('web.devices.control_modal_title', { label: controlModalDeviceObject().label })"
            ></h2>
            <span style="flex: 1 1 auto"></span>
            <button
              class="signals-modal-close"
              :title="t('web.signals.modal_close')"
              :aria-label="t('web.signals.modal_close')"
              @click="closeControlModal()"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>

          <template x-for="command in controlsByKind(controlModalDevice, 'none')" :key="command.key">
            <button
              @click="executeCommand(controlModalDeviceObject(), command)"
              :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
              x-text="command.slug"
            ></button>
          </template>

          <!-- Percent slider: the label is `command.slug`, NOT a
               fixed translation - reasoning in the comment above on the
               `<dialog>`. -->
          <template x-for="command in controlsByKind(controlModalDevice, 'percent')" :key="command.key">
            <div class="control-row">
              <label x-text="command.slug"></label>
              <input
                type="range" min="0" max="100" step="1"
                :value="controlDrafts.percent ?? 50"
                :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                @change="recordControlDraft(command, Number($event.target.value)); sendControl(controlModalDeviceObject(), command, $event.target.value)"
              />
              <p
                class="hint"
                x-show="controlDrafts.percent === undefined"
                x-text="t('web.devices.control_start_value_unknown')"
              ></p>
            </div>
          </template>

          <!-- Tab bar: only visible if the device can do both paths
               (`hasColourTabs`) - a CCT or a pure color light
               sees no tabs. -->
          <div class="control-tabs" x-show="hasColourTabs(controlModalDevice)">
            <button :class="{ 'is-active': controlTab === 'white' }"
                    @click="controlTab = 'white'"
                    x-text="t('web.devices.control_tab_white')"></button>
            <button :class="{ 'is-active': controlTab === 'colour' }"
                    @click="controlTab = 'colour'"
                    x-text="t('web.devices.control_tab_colour')"></button>
          </div>

          <div x-show="!hasColourTabs(controlModalDevice) || controlTab === 'white'">
            <template x-for="command in controlsByKind(controlModalDevice, 'kelvin')" :key="command.key">
              <div class="control-row">
                <label x-text="t('web.devices.control_colortemp')"></label>
                <input
                  x-show="command.range"
                  type="range" :min="command.range?.min" :max="command.range?.max" step="10"
                  :value="controlDrafts.kelvin ?? command.range?.min"
                  :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                  @change="recordControlDraft(command, Number($event.target.value)); sendControl(controlModalDeviceObject(), command, $event.target.value)"
                />
                <!-- Note for a missing start value, when the slider is visible -->
                <p
                  class="hint"
                  x-show="command.range && controlDrafts.kelvin === undefined"
                  x-text="t('web.devices.control_start_value_unknown')"
                ></p>
                <p class="hint" x-show="!command.range" x-text="t('web.devices.control_no_range')"></p>
                <span x-show="!command.range" class="row">
                  <input
                    type="number"
                    :placeholder="t('web.devices.value_placeholder')"
                    @input="commandValueDrafts[command.key] = $event.target.value"
                  />
                  <button
                    @click="executeCommand(controlModalDeviceObject(), command)"
                    :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                    x-text="t('web.devices.send')"
                  ></button>
                </span>
              </div>
            </template>
          </div>

          <div x-show="!hasColourTabs(controlModalDevice) || controlTab === 'colour'">
            <template x-for="command in controlsByKind(controlModalDevice, 'hue_sat')" :key="command.key">
              <div class="control-row">
                <!-- The marker sits IN the field, not next to it: `hue`
                     and `saturation` were, until now, read
                     (`readStartValues`) and shown nowhere - a color picker
                     that hides the set color is not one (finding M-4,
                     closing review 2026-09-08). `x-show` instead of an
                     edge case in the position: if the value is missing,
                     there is no dot, and the note below says why. -->
                <div
                  class="colour-field"
                  :class="{ 'is-busy': commandBusyKey === command.key || !isOnline(controlModalDeviceObject()) }"
                  @pointerup="pickColour($event, controlModalDeviceObject(), command)"
                >
                  <span
                    class="colour-marker"
                    x-show="controlDrafts.hue !== undefined && controlDrafts.saturation !== undefined"
                    :style="colourMarkerStyle()"
                  ></span>
                </div>
                <p class="hint" x-text="t('web.devices.control_colour_hint')"></p>
                <p class="hint" x-show="controlDrafts.hue === undefined"
                   x-text="t('web.devices.control_start_value_unknown')"></p>
              </div>
            </template>
          </div>

          <!-- Fallback to the plain number field: not only for
               `control: "unknown"`, but for EVERY `control` value this
               UI does not know (`unhandledControls`, finding
               I-2 in the closing review 2026-09-08) - otherwise a
               value entered into `clusters.yaml` in the future, still
               unknown here, would vanish without a trace from the modal. -->
          <template x-for="command in unhandledControls(controlModalDevice)" :key="command.key">
            <span class="row">
              <span x-text="command.slug"></span>
              <input
                type="number"
                :placeholder="t('web.devices.value_placeholder')"
                @input="commandValueDrafts[command.key] = $event.target.value"
              />
              <button
                @click="executeCommand(controlModalDeviceObject(), command)"
                :disabled="commandBusyKey === command.key || !isOnline(controlModalDeviceObject())"
                x-text="t('web.devices.send')"
              ></button>
            </span>
          </template>
        </div>
      </template>
    </dialog>

    <!--
      Short messages as an overlay. `position: fixed` means: they sit
      outside the text flow and shift nothing. The previous
      version faded in a line above the device list, which made the
      whole page jump on toggling, and the next click missed its target.
    -->
    <div class="toasts" aria-live="polite">
      <template x-for="toast in toasts" :key="toast.id">
        <div
          class="toast"
          :class="toast.isError ? 'toast-error' : 'toast-ok'"
          @click="dismissToast(toast.id)"
          :title="t('web.header.toast_dismiss_tooltip')"
          x-text="toast.text"
        ></div>
      </template>
    </div>

    <script defer src="/static/app.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </body>
</html>
