name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh wird per `curl | sh` auf fremden Rechnern ausgefuehrt -
      # ein Quoting-Fehler darin ist teurer als in jedem anderen Skript hier.
      - run: shellcheck -s sh install.sh
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The project is English-only. Without this step the rule holds only
      # until the next feature branch - see
      # docs/superpowers/specs/2026-09-07-english-only-translation-design.md
      - run: uv run python scripts/check_language.py
      - run: uv run pytest -v
