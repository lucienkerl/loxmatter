web.system.version_heading:
  en: "Version"
  de: "Version"
web.system.version_running:
  en: "Running: {version}"
  de: "Läuft: {version}"
web.system.version_commit:
  en: "Commit {commit}"
  de: "Commit {commit}"
web.system.version_built_at:
  en: "built {built_at}"
  de: "gebaut {built_at}"
web.system.version_dev_hint:
  en: "This bridge was built from a working copy, not from a published version."
  de: "Diese Brücke wurde aus einer Arbeitskopie gebaut, nicht aus einer veröffentlichten Version."
web.system.version_dev_channel_hint:
  en: "dev is the rolling channel, built from the latest main after every merge — expect breakage. Switch to stable for a tested release."
  de: "dev ist der rollende Kanal, gebaut aus dem jeweils neuesten main nach jedem Merge — Aussetzer sind zu erwarten. Für eine getestete Version auf stable wechseln."
# Shown only when the sidecar's own image DIGEST differs from what GHCR
# currently serves under `:stable` (`updaterVersionBehind()` in app.js) -
# never for a sidecar that predates that field, one built locally, checking
# switched off, or GHCR unreachable right now: an unknown digest is not a
# stale one, and must say nothing rather than guess. `{updater_version}`/
# `{version}` still name what a version-string comparison used to decide
# on its own (see that method's own comment for why a version alone is the
# wrong trigger - CI bakes it into every release regardless of whether
# deploy/updater/ actually changed); only the DECISION to show this moved.
#
# `{path}` is the sidecar's own `$LOXMATTER_STACK`, resolved to a HOST path
# (`updater_stack_host_path` - update-once.sh's `host_path_for()`, see its
# own comment) - never a value this file guesses. The command is the one
# that actually refreshes an already-present sidecar's image -
# `./scripts/update.sh` deliberately does not (see docs/OPERATIONS.md,
# "Keeping the updater sidecar itself current"), and the sidecar can no
# longer refresh itself at all (removed - see update-once.sh's own
# comment on the incident this closed).
web.system.updater_behind:
  en: "The updater sidecar is still on {updater_version}, this bridge on {version}. Refresh it: cd {path} && docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
  de: "Der Updater-Sidecar läuft noch auf {updater_version}, diese Brücke auf {version}. Ihn aktualisieren: cd {path} && docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
# The sibling of `web.system.updater_behind` above for when the sidecar's
# own mount table did not resolve `$LOXMATTER_STACK` to a host path at all
# (the daemon unreachable, or this sidecar's mounts not shaped the way
# `host_path_for()` expects - see that function's own comment in
# update-once.sh) - a container path (e.g. `/repo/deploy/testhost`) is
# never printed here as a fallback: it does not exist on the host and the
# command would just fail at the `cd`, silently, the exact defect this
# whole feature replaces a DOCUMENTATION GUESS for. Names where to run the
# command in words instead of inventing a path nothing backs.
web.system.updater_behind_unknown_path:
  en: "The updater sidecar is still on {updater_version}, this bridge on {version}. Refresh it: from your loxmatter checkout's deploy/testhost directory (the host path could not be determined automatically), run: docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
  de: "Der Updater-Sidecar läuft noch auf {updater_version}, diese Brücke auf {version}. Ihn aktualisieren: im deploy/testhost-Verzeichnis Ihres loxmatter-Checkouts (der Host-Pfad konnte nicht automatisch ermittelt werden) ausführen: docker compose pull loxmatter-updater && docker compose up -d --no-deps loxmatter-updater"
web.system.update_leaving_dev:
  en: "You are running a development build. Version {version} is the newest published release - it may be older than what is running now, and the development channel's newer changes will not be in it until the next release."
  de: "Sie fahren einen Entwicklungsstand. Version {version} ist die neueste veröffentlichte Fassung — sie kann älter sein als das, was gerade läuft, und die neueren Änderungen des Entwicklungskanals sind erst in der übernächsten Veröffentlichung enthalten."
web.system.update_available:
  en: "Version {version} available"
  de: "Version {version} verfügbar"
web.system.update_up_to_date:
  en: "Up to date. Last checked {checked_at}."
  de: "Auf dem neuesten Stand. Zuletzt geprüft {checked_at}."
web.system.update_apply:
  en: "Install update"
  de: "Update einspielen"
web.system.update_cancel:
  en: "Cancel"
  de: "Abbrechen"
web.system.update_confirm_title:
  en: "Install version {version}?"
  de: "Update auf {version} einspielen?"
web.system.update_confirm_downtime:
  en: "About a minute without the bridge. The Miniserver receives no values during that time; afterwards the bridge sends everything again. Signal keys, rooms and the Loxone wiring stay untouched, and the database is backed up first."
  de: "Rund eine Minute ohne Brücke. Der Miniserver erhält in dieser Zeit keine Werte; danach sendet die Brücke alles erneut. Signalschlüssel, Räume und die Loxone-Verdrahtung bleiben unverändert, und die Datenbank wird vorher gesichert."
# Deliberately unwired: no API in this feature ever surfaces a target
# schema version (see `api/update.py` and `update.py` - `UpdateState`
# carries no such field, and `/api/update/check`'s response model has
# nothing like it either). Raising the database schema is entirely the
# sidecar's own internal precheck (update-once.sh), invisible to the web
# UI's HTTP surface by design - the bridge finds out the schema changed
# the same way it finds out anything else about a finished job, from
# `state.json`. Kept here anyway, with this comment, so a future reader
# does not delete it as dead weight or wire it to a value that does not
# mean what this text claims - both worse than a currently-unused key.
web.system.update_confirm_schema:
  en: "Raises the database schema from {from_version} to {to_version}. Going back to the previous version stays possible, but the new fields will not be maintained by it."
  de: "Hebt das Datenbankschema von {from_version} auf {to_version}. Ein Rückfall auf die vorherige Version bleibt möglich, die neuen Felder werden von ihr aber nicht gepflegt."
