[project]
name = "loxmatter"
version = "0.1.0"
description = "Bindet Matter-Geraete (Thread, Wi-Fi oder Ethernet) an einen Loxone Miniserver an"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/loxmatter/web/vendor/LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "python-matter-server>=8.1.2",
    # Task 11, Phase 6: FastAPIs `File`/`UploadFile` (api/project_sync.py,
    # `POST /api/export/project-sync`) brauchen "python-multipart", um
    # `multipart/form-data`-Bodies ueberhaupt zu parsen - ohne dieses Paket
    # wirft der Endpunkt schon beim Start von `build_app` ein `RuntimeError`
    # ("Form data requires python-multipart to be installed"), nicht erst
    # bei der ersten Anfrage.
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    # Task 7, Phase 5: `uvicorn` allein (ohne das "standard"-Extra) bringt
    # keine WebSocket-Implementierung mit - `GET /api/live` (Spec 8.3,
    # api/live.py) antwortet ohne dieses Paket mit 404 "Unsupported upgrade
    # request", geprueft gegen einen echten `uvicorn.run` dieses Dienstes,
    # nicht nur vermutet: die bisherige Testsuite lief ausschliesslich ueber
    # den In-Prozess-ASGI-Pfad (tests/api/conftest.py, `_InProcessWebSocket`)
    # und damit nie durch uvicorns eigene HTTP/WebSocket-Weiche. Ohne diese
    # Zeile funktioniert die Live-Aktualisierung der WebUI in keiner
    # Installation, die genau diese Abhaengigkeitsliste installiert.
    "websockets>=12",
]

[project.scripts]
loxmatter = "loxmatter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Task 7, Review-Fix Important #1: startet einen echten `uvicorn`-Prozess
    # (siehe tests/api/test_live_smoke.py) - kein Ausschluss per Default,
    # der Marker dient nur der gezielten Auswahl/Abwahl (`-m slow` /
    # `-m "not slow"`), nicht dem Vergessen dieses Tests.
    "slow: startet einen echten Server-Prozess statt des In-Prozess-Testpfads",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# `File(...)` als Vorgabewert eines `UploadFile`-Parameters (Task 11,
# api/project_sync.py) ist das von FastAPI selbst dokumentierte Muster -
# anders als bei `Query(...)`/`Path(...)` erkennt B008 es nicht automatisch
# als unveraenderlich, weil `UploadFile` selbst kein unveraenderlicher Typ
# ist (siehe B008-Erklaerung: "Parameters with immutable type annotations
# will be ignored by this rule" - `str`/`int` bei Query/Path greifen,
# `UploadFile` bei File nicht).
extend-immutable-calls = ["fastapi.File"]

[tool.mypy]
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
# chip (Teil des CHIP-SDK, das python-matter-server fuer Cluster-Kommandos
# nutzt) liefert keine py.typed-Markierung/Stubs - siehe
# BridgeMatterClient.send_command in matter/client.py.
module = "chip.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# playwright ist bewusst KEINE Projekt-Abhaengigkeit: es wird nur gebraucht,
# um die README-Screenshots neu zu erzeugen, und laeuft deshalb ad hoc ueber
# `uv run --with playwright ... scripts/capture_screenshots.py`. In CI ist es
# folglich nicht installiert, `files = ["src", "scripts"]` nimmt das Skript
# aber mit - ohne diese Ausnahme scheitert mypy dort an einem Import, den es
# gar nicht aufloesen koennen soll.
module = "playwright.*"
ignore_missing_imports = true
