<!--
  loxmatter - Inbetriebnahme- und Diagnosewerkzeug fuer die Matter-Loxone-
  Bruecke (Spec 8). Vier Ansichten, umgeschaltet ueber Alpine.js, ohne
  Seitenwechsel und ohne Build-Schritt.

  Enthaelt eine vendorte Kopie von Alpine.js, Version 3.17.1 (MIT-Lizenz,
  (c) Caleb Porzio), bezogen als eigenstaendige, sich selbst startende
  Distribution (kein Modul, kein Bundler noetig) des npm-Pakets "alpinejs"
  ueber jsDelivr (das oeffentliche Auslieferungsnetz fuer npm-Pakete) am
  2026-09-02, unveraendert unter web/vendor/alpine.min.js abgelegt - SHA-256
  b30997fc126d808b1a9b20ab3f504ded88df957818c02d6249bba3ec114eb0ec.

  Bewusst KEIN Netzwerkverweis in dieser Datei: die Bruecke laeuft in
  Installationen ohne Internetzugang, und eine Oberflaeche, die dort auf
  ein entferntes Skript wartet, bleibt weiss.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loxmatter</title>
    <!-- Eine einzige SVG-Datei statt der ueblichen PNG-Reihe: der Browser
         skaliert sie selbst, und die Bruecke laeuft in Installationen ohne
         Internetzugang - eine Datei weniger, die fehlen kann. Die grosse
         Fassung liegt daneben als icon.svg (siehe die Kommentare dort). -->
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <!--
    Hier steht mit Absicht KEIN `x-init="init()"` (Review-Fix Fix 2,
    2026-09-03). Alpine 3 ruft die Methode `init()` eines mit `x-data`
    erzeugten Datenobjekts von sich aus genau einmal auf. Ein zusaetzliches
    `x-init="init()"` ruft sie ein zweites Mal - und `init()` startet nach
    einer angemeldeten Sitzung den Live-WebSocket. Jeder offene Tab hielt
    dadurch ZWEI Verbindungen, von denen nur die zuletzt geoeffnete in
    `this.socket` steht. Die andere bekommt trotzdem jeden Wert, belegt im
    Backend eine Queue samt zwei asyncio-Tasks und einen Beobachter und
    bleibt fuer die Oberflaeche unsichtbar - sie stirbt erst mit dem Tab.
    Wer hier ein `x-init` ergaenzen moechte: dafuer gibt es keinen Grund,
    `init()` laeuft bereits.
  -->
  <body x-data="app()">
    <!-- Icon-Symbole (Geraete-Dashboard-Entwurf, Abschnitt 3) - inline SVG
         statt einer Icon-Bibliothek: kein Netzwerkverweis, dieselbe
         Begruendung wie beim vendorten Alpine.js oben im Kopfkommentar. -->
    <svg style="display: none" aria-hidden="true">
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M12 3.7 21 19.3H3L12 3.7z" />
        <path d="M12 9.6v4.3M12 16.9v.1" />
      </symbol>
      <symbol id="i-offline" viewBox="0 0 24 24">
        <path d="M2 8.3a15 15 0 0 1 6-3M16.2 5.4a15 15 0 0 1 5.8 2.9" />
        <path d="M5.5 12a10 10 0 0 1 5-2.6M13.7 9.4a10 10 0 0 1 4.8 2.6" />
        <path d="M9 15.6a5 5 0 0 1 3.5-1.4" />
        <circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </symbol>
      <!-- Aufklapp-Pfeil fuer die Projektdatei-Sync-Geraetekarten
           (`.projectsync-device`, ein natives <details>) - ersetzt dessen
           browserabhaengigen Standard-Marker durch dasselbe Strich-Icon wie
           die uebrigen Symbole hier. -->
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" />
      </symbol>
      <!-- Kategorie-Icons (Entwurf Geraete-Tab, 2026-09-05, Abschnitt 6.5).
           Ein Symbol je Kategorie, "Sonstige" eingeschlossen - dort landet
           auch jedes Geraet, dessen Typen noch nicht nachgetragen sind.
           Weiterhin inline und ohne Icon-Bibliothek, aus demselben
           Grund wie das eingecheckte vendor/alpine.min.js: die Oberflaeche
           laeuft offline. -->
      <symbol id="i-cat-light" viewBox="0 0 24 24">
        <path d="M9 17.5a5.5 5.5 0 1 1 6 0V19H9v-1.5z" />
        <path d="M10 21.5h4" />
      </symbol>
      <symbol id="i-cat-socket" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M9.5 10v2.2M14.5 10v2.2" />
        <path d="M8.4 13.6a4 4 0 0 0 7.2 0" />
      </symbol>
      <symbol id="i-cat-switch" viewBox="0 0 24 24">
        <rect x="6" y="3.5" width="12" height="17" rx="3" />
        <circle cx="12" cy="9" r="1.8" />
      </symbol>
      <symbol id="i-cat-covering" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" />
        <path d="M4 9h16M4 13h16M4 17h16" />
      </symbol>
      <symbol id="i-cat-climate" viewBox="0 0 24 24">
        <path d="M10 13.2V5.5a2 2 0 1 1 4 0v7.7" />
        <circle cx="12" cy="16.5" r="3.2" />
      </symbol>
      <symbol id="i-cat-sensor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2.4" />
        <path d="M7.4 7.4a6.5 6.5 0 0 0 0 9.2M16.6 16.6a6.5 6.5 0 0 0 0-9.2" />
      </symbol>
      <symbol id="i-cat-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
        <path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7" />
      </symbol>
      <!-- ACHT Symbole, nicht sieben: die Kachel bildet die Kennung stur auf
           `#i-cat-<kennung>` ab, und `other` ist eine Kennung wie jede
           andere. Ein `<use>` auf eine nicht vorhandene ID zeichnet
           STILLSCHWEIGEND nichts - kein Fehler in der Konsole, nur eine
           Kachel ohne Icon. Deshalb bekommt "Sonstige" ein eigenes Symbol,
           statt sich auf eine Sonderbehandlung in JavaScript zu verlassen,
           die jemand beim naechsten Umbau uebersieht. Die Form ist dieselbe
           wie beim alten, generischen `#i-device` (Task 9 hat dessen
           Definition entfernt, da `#i-cat-other` seine Rolle uebernommen
           hat). -->
      <symbol id="i-cat-other" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <circle cx="12" cy="12" r="2.2" />
      </symbol>
      <!-- Fund 6 (Review vom 2026-09-05): Umbenennen-, Export- und
           Entfernen-Schaltflaeche in der Kachel zeigten die rohen Zeichen
           "✎", "↓" und "🗑" statt eines Symbols aus diesem Block - "🗑"
           rendert unter macOS/Windows als farbiges Emoji, anderswo als
           Kaestchen, und beide Abweichungen brechen die einheitliche
           kupfer-/gedeckte Symbolsprache der uebrigen Kachel-Icons. Gleiche
           Strich-Technik wie die Kategorie-Icons oben: nur Pfade, keine
           Fuellung ausser den Kreispunkten, `currentColor` uebernimmt Farbe
           und Zustand automatisch von aussen.

           Export und Entfernen hatten hier je ein eigenes Symbol
           (`#i-export`, `#i-remove`); Task 2 (Kebab-Menue, 2026-09-05) hat
           beide Aktionen aus der Fusszeile ins Menue verlegt und dabei zu
           ausgeschriebenen Text-Schaltflaechen gemacht - dort ist Platz fuer
           Beschriftung statt Icon. Die beiden Symbole sind seither tot
           (kein `<use>` verweist mehr auf sie) und wurden mit dem
           Abschluss-Review vom 2026-09-05 entfernt; nur Umbenennen bleibt
           ein Icon-Knopf. -->
      <symbol id="i-rename" viewBox="0 0 24 24">
        <path d="M14.5 5.5 18.5 9.5 8 20H4v-4L14.5 5.5z" />
        <path d="M12.7 7.3l4 4" />
      </symbol>
      <!-- Lupe fuer das Suchfeld der Raumleiste (Entwurf Suchfeld-Optik,
           2026-09-06). Gleiche Strichtechnik wie die Kategorie-Icons: nur
           Pfade, keine Fuellung, `currentColor` uebernimmt Farbe und
           Zustand von aussen. -->
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M15.8 15.8 20.5 20.5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12" />
        <path d="M18 6L6 18" />
      </symbol>
      <!-- Drei gefuellte Punkte statt Striche: `.icon` setzt
           `fill: none; stroke: currentColor`, was fuer Linien-Icons stimmt,
           einen Punkt aber unsichtbar machen wuerde. Dieselbe Ausnahme
           macht schon `#i-offline` fuer seinen Punkt. -->
      <symbol id="i-kebab" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1.7" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none" />
        <circle cx="12" cy="19" r="1.7" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-battery" viewBox="0 0 24 24">
        <rect x="2" y="8" width="16" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/>
        <path d="M21 11v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M5 12.5h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </symbol>
    </svg>
    <!-- Bis `/auth-info` geantwortet hat, zeigt die Seite bewusst nichts -
         sonst blitzte je nach Antwort der falsche Bildschirm auf. -->
    <template x-if="stringsReady && authReady && !authenticated && !passwordSet">
      <main class="auth-screen">
        <!-- Die grosse Fassung des Zeichens: `icon.svg` gilt laut seinem
             eigenen Kopfkommentar ab etwa 32 px, `favicon.svg` darunter. Hier
             sind es 64, in der Kopfzeile weiter unten 24 - deshalb dort die
             andere Datei. `alt=""` ist Absicht: "loxmatter" steht in der
             Ueberschrift direkt darunter (en wie de), ein Alt-Text liesse den
             Namen zweimal vorlesen. Die Masse stehen im Markup, sonst springt
             das Formular beim Nachladen des Bildes nach unten. -->
        <img class="auth-mark" src="/static/icon.svg" alt="" width="64" height="64" />
        <h1 x-text="t('web.auth.setup_heading')"></h1>
        <p class="banner warn" x-html="t('web.auth.setup_warning')"></p>
        <label>
          <span x-text="t('web.auth.password_label')"></span>
          <input type="password" autocomplete="new-password" x-model="passwordDraft"
                 @keydown.enter="submitSetup()" />
        </label>
        <label>
          <span x-text="t('web.auth.password_repeat_label')"></span>
          <input type="password" autocomplete="new-password" x-model="passwordRepeatDraft"
                 @keydown.enter="submitSetup()" />
        </label>
        <p class="hint" x-text="t('web.auth.password_hint')"></p>
        <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>
        <button class="primary" :disabled="authBusy" @click="submitSetup()"
                x-text="t('web.auth.setup_submit')"></button>
      </main>
    </template>

    <template x-if="stringsReady && authReady && !authenticated && passwordSet">
      <main class="auth-screen">
        <img class="auth-mark" src="/static/icon.svg" alt="" width="64" height="64" />
        <h1>loxmatter</h1>
        <label>
          <span x-text="t('web.auth.password_label')"></span>
          <input type="password" autocomplete="current-password" x-model="passwordDraft"
                 @keydown.enter="submitLogin()" />
        </label>
        <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>
        <button class="primary" :disabled="authBusy" @click="submitLogin()"
                x-text="t('web.auth.login_submit')"></button>
      </main>
    </template>

    <!-- `x-if` haengt an genau EIN Kindelement - deshalb dieser leere `<div>`
         um Kopfzeile, Banner, Reiter und Hauptbereich, statt vier Geschwister
         direkt ins `<template>` zu haengen (das liesse Alpine nur das erste
         davon beachten). -->
    <template x-if="stringsReady && authenticated">
    <div>
    <header class="app-header">
      <!-- Zeichen und Schriftzug stehen zusammen in `.brand`, damit das
           `justify-content: space-between` der Kopfzeile weiter genau zwei
           Bloecke sieht - als Geschwister wanderte der Schriftzug sonst in die
           Mitte. Hier die Kleinfassung `favicon.svg`: bei 24 px fliessen die
           sechs Aussenpunkte von `icon.svg` zu einem Fleck zusammen, siehe die
           Kommentare in beiden Dateien. -->
      <div class="brand">
        <img class="brand-mark" src="/static/favicon.svg" alt="" width="24" height="24" />
        <h1>loxmatter</h1>
      </div>
      <div class="header-right">
        <!--
          Zugang: seit dem WebUI-Login gibt es hier kein Token-Feld mehr,
          sondern nur den Weg hinaus. Der Weg hinein sind die beiden
          Bildschirme unter dieser Kopfzeile.
        -->
        <button class="logout" x-show="authenticated" x-cloak @click="logout()"
                x-text="t('web.header.logout')"></button>
        <div class="connection-status">
          <span class="dot" :class="socketConnected ? 'online' : 'offline'"></span>
          <span x-text="connectionStatusText()"></span>
          <!--
            Das Lebenszeichen (2026-09-03). Die Bruecke schickt alle 30 s
            einen Heartbeat, auch wenn sich an keinem Geraet etwas aendert.
            Ohne diese Anzeige war eine ruhige Anlage - eine Steckdose ohne
            Last meldet weder Strom noch Leistung - von einer abgestuerzten
            nicht zu unterscheiden.
          -->
          <span class="heartbeat" x-show="lastHeartbeatAt" x-cloak>
            <span x-text="t('web.header.heartbeat_prefix')"></span> <span x-text="heartbeatText()"></span>
          </span>
        </div>
      </div>
    </header>

    <p class="banner danger" x-show="authError" x-cloak x-text="authError"></p>

    <div class="banner danger" x-show="!socketConnected && socketEverConnected" x-cloak
         x-text="t('web.connection.lost_banner')">
    </div>

    <!--
      Echte Links auf die Fragmente der vier Ansichten (`VIEWS` in app.js),
      bewusst keine Knoepfe mit `@click` mehr: nur so ueberlebt der gewaehlte
      Reiter das Neuladen der Seite, laesst sich als Lesezeichen ablegen und
      im neuen Tab oeffnen. Den Ansichtswechsel macht weiterhin `selectView`
      - angestossen ueber `hashchange` (siehe `applyHash` in app.js), nicht
      ueber einen Klick-Handler an dieser Stelle. Ein zusaetzliches `@click`
      hier waere sogar schaedlich: es liefe VOR dem Fragmentwechsel und
      liesse `applyHash` danach nichts mehr zu tun uebrig - der Zurueck-Knopf
      bliebe davon zwar unberuehrt, aber die beiden Wege in dieselbe Ansicht
      wuerden auseinanderlaufen.
    -->
    <nav class="tabs">
      <a href="#/devices" :class="{ active: view === 'devices' }" :aria-current="view === 'devices' ? 'page' : null" x-text="t('web.nav.devices')"></a>
      <a href="#/export" :class="{ active: view === 'export' }" :aria-current="view === 'export' ? 'page' : null" x-text="t('web.nav.export')"></a>
      <a href="#/system" :class="{ active: view === 'system' }" :aria-current="view === 'system' ? 'page' : null" x-text="t('web.nav.system')"></a>
      <a href="#/settings" :class="{ active: view === 'settings' }" :aria-current="view === 'settings' ? 'page' : null" x-text="t('web.nav.settings')"></a>
    </nav>

    <main>
      <!-- ================================================================
           Ansicht 1: Geräte
           ================================================================ -->
      <section x-show="view === 'devices'">
        <div class="card">
          <h2 x-text="t('web.devices.commission_heading')"></h2>
          <div x-show="commissionStep === null">
            <!--
              Aufbau seit dem Entwurf "Code zuerst" (2026-09-07): der
              Pairing-Code steht allein in der ersten Zeile, alles andere
              darunter in einer leisen zweiten. Vorher standen hier vier
              gleich breite Felder nebeneinander und darunter drei Absaetze
              Hilfe - 78 Woerter, dauerhaft sichtbar, geloest von den
              Feldern, die sie erklaeren, und der laengste davon gehoerte zum
              seltensten Feld (dem Thread-Datensatz).

              Kein Satz davon ist verlorengegangen: die beiden langen
              Hinweise stehen jetzt in den `<details>`-Klappen unten, jeder
              bei dem Feld, um das es geht. Der dritte (der Raumhinweis) ist
              zum Einzeiler neben dem Auswahlfeld geworden, weil das
              Auswahlfeld mit "Ohne Raum" die halbe Auskunft schon selbst
              gibt.
            -->
            <label class="field-label" for="commission-code"
                   x-text="t('web.devices.code_label')"></label>
            <!--
              Der Code bekommt eine eigene Umrandung um Feld UND Knopf, statt
              beide als Geschwister in eine `.row` zu haengen: er ist das
              einzige Pflichtfeld dieser Karte, und `Enter` im Feld tut
              dasselbe wie der Knopf daneben. Die Monospace-Schrift ist
              nicht Dekoration - genau so steht der Code auf dem Aufkleber
              des Geraets, und in Proportionalschrift ist ein O von einer 0
              beim Abtippen nicht zu unterscheiden.
            -->
            <div class="code-field">
              <input
                type="text"
                id="commission-code"
                class="code-input"
                spellcheck="false"
                x-ref="commissionCode"
                x-model="commissionCode"
                :placeholder="t('web.devices.code_placeholder')"
                @keydown.enter="commissionDevice()"
              />
              <button
                class="primary"
                @click="commissionDevice()"
                :disabled="commissionBusy"
                x-text="t('web.devices.commission_submit')"
              ></button>
          </div>

          <div class="commission-meta">
            <label class="inline-field">
              <span x-text="t('web.devices.room_label')"></span>
              <select x-model="commissionRoom">
                <option value="" x-text="t('web.devices.room_none')"></option>
                <template x-for="chip in roomChips().filter((c) => c.key !== '')" :key="chip.key">
                  <option :value="chip.key" x-text="chip.key"></option>
                </template>
                <option value="__new__" x-text="t('web.devices.room_new')"></option>
              </select>
            </label>
            <input
              x-show="commissionRoom === '__new__'"
              x-cloak
              type="text"
              class="new-room-input"
              x-model="commissionNewRoom"
              :placeholder="t('web.devices.room_new_placeholder')"
              :aria-label="t('web.devices.room_new_placeholder')"
            />
            <span class="hint" x-text="t('web.devices.commission_room_hint')"></span>
          </div>

          <div class="commission-help">
            <!--
              Zwei native `<details>` statt eines eigenen Auf-/Zu-Zustands
              in `app()`: der Browser kann das, und ein Zustand, den
              niemand zuruecksetzen muss, kann auch mit nichts anderem
              auseinanderlaufen. Dieselbe Ueberlegung wie beim
              Kachel-Menue und den Signalgruppen im Modal.
            -->
            <details class="commission-disclosure">
              <summary x-text="t('web.devices.code_help_summary')"></summary>
              <div class="disclosure-body">
                <p class="hint" x-text="t('web.devices.commission_hint')"></p>
              </div>
            </details>
            <details class="commission-disclosure">
              <summary x-text="t('web.devices.thread_summary')"></summary>
              <div class="disclosure-body">
                <label class="field-label" for="commission-thread"
                       x-text="t('web.devices.thread_dataset_label')"></label>
                <input
                  type="text"
                  id="commission-thread"
                  x-model="commissionThreadDataset"
                  :placeholder="t('web.devices.thread_dataset_placeholder')"
                />
                <p class="hint" x-text="t('web.devices.thread_dataset_hint')"></p>
              </div>
            </details>
          </div>
          </div>

          <!--
            Die Ablaufanzeige (Entwurf "Der Ablauf wird sichtbar"). Sie
            loest ein Problem, das kein Layout loesen kann: Einlernen
            dauert je nach Geraet zwanzig bis sechzig Sekunden, und bis
            hierher war das ein grau werdender Knopf - von einer haengenden
            Seite nicht zu unterscheiden.

            ZWEI Schritte, nicht drei: mehr Abschnitte kann diese
            Oberflaeche nicht ehrlich auseinanderhalten (siehe die
            Begruendung bei `web.devices.commission_step_joining` in
            strings.yaml). Ein dritter Punkt saehe besser aus und waere
            geraten.
          -->
          <div x-show="commissionStep !== null" x-cloak>
            <p class="commission-subject">
              <span class="key" x-text="commissionRunCode"></span>
              <span class="hint" x-show="commissionRunRoom" x-text="commissionRunRoom"></span>
            </p>
            <ol class="commission-steps">
              <li class="commission-step" :class="commissionStepClass(0)">
                <span class="step-marker" aria-hidden="true"></span>
                <span x-text="t('web.devices.commission_step_joining')"></span>
              </li>
              <li class="commission-step" :class="commissionStepClass(1)">
                <span class="step-marker" aria-hidden="true"></span>
                <span x-text="t('web.devices.commission_step_loading')"></span>
              </li>
            </ol>
            <button
              class="commission-restart"
              x-show="commissionStep === 2 || commissionFailed"
              x-cloak
              @click="resetCommission()"
              x-text="commissionFailed ? t('web.devices.commission_retry') : t('web.devices.commission_again')"
            ></button>
          </div>

          <!--
            Die Meldung steht ausserhalb der beiden Haelften, weil sie zu
            beiden gehoert: die Pruefung auf einen leeren Code schlaegt zu,
            BEVOR ein Lauf beginnt (also am Formular), Erfolg und Fehlschlag
            melden sich danach (also an der Ablaufanzeige). Zwei Kopien
            desselben Banners waeren zwei Stellen, an denen es haengenbleiben
            kann.
          -->
          <p
            x-show="commissionMessage"
            x-cloak
            :class="commissionMessageIsError ? 'banner danger' : 'banner ok'"
            x-text="commissionMessage"
          ></p>

        </div>

        <p x-show="devicesError" x-cloak class="banner danger" x-text="devicesError"></p>
        <p x-show="deviceActionError" x-cloak class="banner danger" x-text="deviceActionError"></p>

        <p
          x-show="devices.length === 0 && !devicesError"
          class="hint"
          x-text="t('web.devices.empty')"
        ></p>

        <!-- Raumleiste (Entwurf 6.3): zeigt sich gar nicht, solange kein
             einziges Geraet einen Raum traegt - bei drei Geraeten und keinem
             Raum waere sie eine Zeile Laerm ueber einer Liste, die ohnehin
             auf einen Blick passt. Das Suchfeld bleibt in dem Fall trotzdem
             erreichbar, weil es auch ohne Raeume ueber Name und Kategorie
             sucht. -->
        <div class="room-bar" x-show="devices.length > 0" x-cloak>
          <template x-if="hasAnyRoom()">
            <span class="room-chips">
              <button
                class="room-chip"
                :class="{ active: roomFilter === null }"
                @click="roomFilter = null"
                x-text="t('web.devices.room_all') + ' ' + devices.length"
              ></button>
              <template x-for="chip in roomChips()" :key="chip.key">
                <button
                  class="room-chip"
                  :class="{ active: roomFilter === chip.key }"
                  @click="roomFilter = chip.key"
                  x-text="chip.label + ' ' + chip.count"
                ></button>
              </template>
              <!-- `x-show="roomFilter"` ist hier genau richtig und kein
                   Schludern: falsy sind beide Faelle, in denen es nichts
                   umzubenennen gibt - `null` ("Alle") und `""` ("Ohne
                   Raum"). "Ohne Raum" ist kein Raum, sondern die Menge der
                   Geraete ohne Zuordnung; ein Name, den man aendern
                   koennte, ist gerade das, was ihnen fehlt. -->
              <button
                class="room-rename"
                x-show="roomFilter && renamingRoom !== roomFilter"
                @click="beginRenameRoom(roomFilter)"
                :title="t('web.devices.room_rename')"
              ><svg class="icon"><use href="#i-rename"></use></svg></button>
              <input
                x-show="roomFilter && renamingRoom === roomFilter"
                x-cloak
                type="text"
                class="room-rename-input"
                x-model="renameDraft"
                @keydown.enter="commitRenameRoom()"
                @keydown.escape="cancelRenameRoom()"
                @blur="commitRenameRoom()"
              />
            </span>
          </template>
          <!-- Der Abstandhalter existiert nur zusammen mit den Chips: er
               schiebt das Suchfeld an ihnen vorbei nach rechts. Ohne
               Raeume gibt es nichts, woran vorbeizuschieben waere - dann
               soll das Feld an die linke Kante ruecken statt allein rechts
               in einer leeren Zeile zu stehen. Deshalb ein eigenes `x-if`
               und keine Zeile, die immer da ist. -->
          <template x-if="hasAnyRoom()"><span class="room-spacer"></span></template>
          <!-- Der Rahmen sitzt am Container, nicht am Feld: Lupe, Zaehler
               und Kreuz liegen mit IM Rahmen, und der Fokusring haengt per
               :focus-within an der ganzen Gruppe statt am Eingabefeld in
               ihrer Mitte.

               Ein <div>, kein <label>: ein <button> innerhalb eines Labels
               loest dessen Weiterleitung an das gelabelte Bedienelement mit
               aus - das Loeschen soll ein Klick sein, nicht zwei
               Ereignisse. Der Preis ist ein schmaler Streifen Polster, der
               nicht ins Feld fokussiert; die Lupe traegt dafuer
               `pointer-events: none` (style.css), damit wenigstens sie kein
               Klickloch in die linke Kante schlaegt. -->
          <div class="search-field">
            <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
            <input
              type="search"
              x-ref="deviceSearchInput"
              x-model="deviceSearch"
              :placeholder="t('web.devices.search_placeholder')"
              :aria-label="t('web.devices.search_placeholder')"
            />
            <!-- `aria-live="polite"` nur hier, nicht an den Chips oder dem
                 Hinweistext daneben: der Zaehler beantwortet genau die
                 Frage, die Tippen aufwirft ("wie viele jetzt noch?"), und
                 soll das leise nachreichen. Die uebrigen Texte aendern sich
                 nicht als Reaktion auf Tastatureingabe und muessten sonst
                 bei jeder Neuzeichnung erneut vorgelesen werden. Das Element
                 bleibt bei leerem Feld im DOM (nur `display: none` per
                 `x-show`) - die Live-Region existiert also schon, bevor ihr
                 Inhalt sich das erste Mal aendert. -->
            <span
              class="search-count"
              aria-live="polite"
              x-show="deviceSearch.trim()"
              x-cloak
              x-text="t('web.devices.search_count', { count: visibleDevices().length })"
            ></span>
            <button
              class="search-clear"
              x-show="deviceSearch.trim()"
              x-cloak
              @click="deviceSearch = ''; $refs.deviceSearchInput.focus()"
              :title="t('web.devices.search_clear')"
              :aria-label="t('web.devices.search_clear')"
            ><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
          </div>
        </div>

        <p x-show="devices.length > 0 && visibleDevices().length === 0" x-cloak class="hint">
          <span x-text="t('web.devices.search_empty')"></span>
          <template x-if="hitsOutsideRoom() > 0">
            <span>
              <span x-text="hitsOutsideRoom()"></span>
              <span x-text="t('web.devices.search_hits_elsewhere')"></span>
              <a href="#" @click.prevent="clearRoomFilter()" x-text="t('web.devices.search_show_all_rooms')"></a>
            </span>
          </template>
        </p>

        <template x-for="group in deviceGroups()" :key="group.key">
          <div>
            <!-- Umbenennen inline, wie der Geraetename in der Kachel: der
                 Stift tauscht die Ueberschrift gegen ein Eingabefeld.
                 `group.key` ist "" fuer "Ohne Raum" - falsy, also kein
                 Stift: dort gibt es keinen Namen zu aendern. -->
            <h3 class="room-heading" x-show="group.title">
              <span x-show="renamingRoom !== group.key" x-text="group.title"></span>
              <button
                class="room-rename"
                x-show="group.key && renamingRoom !== group.key"
                @click="beginRenameRoom(group.key)"
                :title="t('web.devices.room_rename')"
              ><svg class="icon"><use href="#i-rename"></use></svg></button>
              <input
                x-show="group.key && renamingRoom === group.key"
                x-cloak
                type="text"
                class="room-rename-input"
                x-model="renameDraft"
                @keydown.enter="commitRenameRoom()"
                @keydown.escape="cancelRenameRoom()"
                @blur="commitRenameRoom()"
              />
            </h3>
            <div class="device-grid">
              <template x-for="device in group.devices" :key="device.id">
                <div class="card device-card" :class="deviceCardClass(device)">
                  <div class="device-head">
                    <span class="type-badge">
                      <svg class="icon"><use :href="'#i-cat-' + device.category"></use></svg>
                    </span>
                    <span class="device-ident">
                      <input
                        type="text"
                        class="device-name"
                        :value="device.label"
                        @input="labelDrafts[device.id] = $event.target.value"
                        @change="saveLabel(device)"
                      />
                      <!-- Die Geaendert-seit-Export-Pille sass hier frueher
                           (Entwurf 6.2) und verdraengte dafuer das
                           Leitwert-Label. Verlegt in die Fusszeile (Pille-
                           in-die-Fusszeile-Umbau, 2026-09-06): sie steht
                           dort neben `exportHintFor`, das ohnehin schon
                           beantwortet, WANN zuletzt exportiert wurde -
                           "seither geaendert" ist dieselbe Fragestellung,
                           keine zweite. Die Kopfzeile bleibt damit dem
                           Geraetezustand vorbehalten (nur noch "Offline"),
                           nicht dem Exportzustand. -->
                      <span class="status-pill off" x-show="!isOnline(device)">
                        <svg class="icon"><use href="#i-offline"></use></svg>
                        <span x-text="t('web.devices.offline')"></span>
                      </span>
                      <!-- Nur noch die Offline-Pille verdraengt das
                           Leitwert-Label: sie beansprucht dieselbe Zeile
                           unter dem Geraetenamen, auf der sonst das Label
                           steht. Der Geaendert-Zustand tut das seit dem
                           Umzug der Pille in die Fusszeile nicht mehr - ein
                           geaendertes, aber online Geraet zeigt sein
                           Leitwert-Label ("Zustand", "Temperatur") wie
                           jedes andere auch. -->
                      <span
                        class="lead-label"
                        x-show="isOnline(device) && leadSignalFor(device.id)"
                        x-text="leadSignalFor(device.id)?.title"
                      ></span>
                    </span>
                    <span class="lead-value" x-show="leadSignalFor(device.id)">
                      <span
                        :class="{ 'value-fresh': signalIsFresh(leadSignalFor(device.id)) }"
                        :title="signalAgeTitle(leadSignalFor(device.id))"
                        x-text="formatValue(liveValueOf(leadSignalFor(device.id)))"
                      ></span>
                      <small x-text="leadSignalFor(device.id)?.unit"></small>
                    </span>
                  </div>

                  <div class="value-rows" x-show="signalsByDevice[device.id]">
                    <template x-for="signal in restSignalsFor(device.id)" :key="signal.key">
                      <span class="value-row">
                        <span class="value-key" x-text="signal.title"></span>
                        <span
                          class="value"
                          :class="{ 'value-fresh': signalIsFresh(signal) }"
                          :title="signalAgeTitle(signal)"
                          x-text="formatValue(liveValueOf(signal)) + (signal.unit ? ' ' + signal.unit : '')"
                        ></span>
                      </span>
                    </template>
                    <!-- Der Hinweis auf die restlichen Signale ist die letzte
                         Rasterzeile statt eines eigenen Absatzes (Entwurf
                         6.2) - auf einer 260 px breiten Kachel zaehlt jede
                         Zeile. -->
                    <span class="value-row" x-show="remainingSignalCount(device.id) > 0">
                      <a
                        class="value-key"
                        href="#"
                        @click.prevent="openSignalsModal(device)"
                        x-text="'+ ' + remainingSignalCount(device.id) + ' ' + t('web.devices.more_signals_short')"
                      ></a>
                      <span></span>
                    </span>
                  </div>

                  <!-- Der Batteriestand steht UNTER den Vorschauzeilen und
                       unter dem "+ N weitere"-Link, nicht zwischen ihnen
                       (Entwurf 2026-09-07, Abschnitt 6). Er ist kein
                       Nutzsignal wie ein Tastendruck, sondern eine Angabe
                       ueber das Geraet selbst - und mit Rang 90 waere er
                       aus den sechs Vorschauzeilen gefallen. Eigene Zeile,
                       eigenes Symbol, gestrichelte Trennung: immer
                       sichtbar, nie Leitwert.

                       `x-show` statt `x-if`: ein netzbetriebenes Geraet
                       hat kein PowerSource-Signal und darf nicht um eine
                       leere Zeile hoeher werden - `.device-battery` traegt
                       deshalb kein eigenes Aussenmass, das stehen bliebe. -->
                  <div class="device-battery" x-show="batterySignalFor(device.id)" x-cloak>
                    <svg class="icon" aria-hidden="true"><use href="#i-battery"></use></svg>
                    <span class="value-key" x-text="t('web.devices.battery_label')"></span>
                    <span
                      class="value"
                      :class="{ 'value-fresh': signalIsFresh(batterySignalFor(device.id)) }"
                      :title="signalAgeTitle(batterySignalFor(device.id))"
                      x-text="formatValue(liveValueOf(batterySignalFor(device.id))) + (batterySignalFor(device.id)?.unit ? ' ' + batterySignalFor(device.id).unit : '')"
                    ></span>
                  </div>

                  <p class="hint" x-show="!signalsByDevice[device.id]" x-text="t('web.devices.signals_loading')"></p>
                  <!-- Fund 3: ohne diesen Hinweis blieb zwischen Kopfzeile
                       und Befehlsleiste stillschweigend eine Luecke, sobald
                       ein Geraet geladene, aber leere funktionale Signale
                       hat (`leadSignalFor` liefert dann `null`, die
                       `value-rows` bleiben ohne Inhalt) - nicht von einem
                       noch ladenden Geraet zu unterscheiden.

                       Seit der Batteriezeile (Entwurf 2026-09-07) reicht
                       "kein Leitwert" als Bedingung nicht mehr: ein Geraet,
                       dessen einziges funktionales Signal die Batterie ist,
                       hat keinen Leitwert - aber "keine funktionalen
                       Signale" waere dort falsch, die Fusszeile darunter
                       zeigt ja eines. -->
                  <p
                    class="hint"
                    x-show="signalsByDevice[device.id] && !leadSignalFor(device.id) && !batterySignalFor(device.id)"
                    x-text="t('web.devices.no_functional_signals')"
                  ></p>

                  <div class="device-commands">
                    <template x-for="command in commandsFor(device.id)" :key="command.key">
                      <span class="row">
                        <button
                          x-show="!command.takes_value"
                          @click="executeCommand(device, command)"
                          :disabled="commandBusyKey === command.key || !isOnline(device)"
                          x-text="command.slug"
                        ></button>
                        <span x-show="command.takes_value" class="row">
                          <span x-text="command.slug"></span>
                          <input
                            type="number"
                            style="width: 4.5rem"
                            :placeholder="t('web.devices.value_placeholder')"
                            @input="commandValueDrafts[command.key] = $event.target.value"
                          />
                          <button
                            @click="executeCommand(device, command)"
                            :disabled="commandBusyKey === command.key || !isOnline(device)"
                            x-text="t('web.devices.send')"
                          ></button>
                        </span>
                      </span>
                    </template>
                    <span
                      class="hint"
                      x-show="hiddenRawCommandsFor(device.id) > 0"
                      x-text="'+' + hiddenRawCommandsFor(device.id) + ' ' + t('web.devices.more_commands_short')"
                    ></span>
                    <!-- Fund 3: `controlsLoaded()` unterscheidet "noch nicht
                         geladen oder Abruf fehlgeschlagen" von "geladen, aber
                         tatsaechlich keine Befehle" - ohne diese beiden
                         Zeilen rendert die Kachel in BEIDEN Faellen denselben
                         leeren, umrandeten Streifen (Spec 8.1: ein
                         Fehlschlag darf nicht als harmloser Zustand
                         erscheinen). Der Fehlertext selbst laeuft weiterhin
                         separat ueber das `deviceActionError`-Banner (siehe
                         `loadControls`) - hier geht es nur um die
                         Kachel-Anzeige. -->
                    <span
                      class="hint"
                      x-show="!controlsLoaded(device.id)"
                      x-text="t('web.devices.controls_loading')"
                    ></span>
                    <span
                      class="hint"
                      x-show="controlsLoaded(device.id) && commandsFor(device.id).length === 0 && hiddenRawCommandsFor(device.id) === 0"
                      x-text="t('web.devices.no_known_commands')"
                    ></span>
                  </div>

                  <div class="device-foot">
                    <span class="hint" x-text="exportHintFor(device.id)"></span>
                    <!-- Reihenfolge bewusst: der Hinweis nennt zuerst den
                         Exportzeitpunkt ("Zuletzt exportiert am ..." /
                         "Noch nie exportiert"), die Pille ergaenzt direkt
                         danach die zugehoerige Abweichung ("...und seither
                         geaendert") - dieselbe Subjekt-Praedikat-Folge wie
                         im Fliesstext, nicht Pille zuerst und Zeitangabe
                         hinterher.

                         KEIN `isOnline(device) &&` mehr in der Bedingung
                         (2026-09-06). Solange die Pille oben in der
                         Kopfzeile stand, teilte sie sich die Zeile mit der
                         Offline-Pille, und es konnte immer nur eine von
                         beiden dort stehen - daher die Kopplung. Hier unten
                         konkurriert nichts, und "seit dem Export geaendert"
                         hat mit der momentanen Erreichbarkeit ohnehin
                         nichts zu tun: die Aenderung ist passiert, ob das
                         Geraet gerade antwortet oder nicht. Ein offline
                         stehendes Geraet mit ausstehendem Export sagte das
                         sonst NIRGENDS - auch der Randstreifen nicht, denn
                         `deviceCardClass` koppelt `is-changed` weiterhin an
                         `isOnline`, und zwar zu Recht: ein Streifen kann
                         nur eine Farbe tragen. Genau diese Luecke schliesst
                         die Pille hier. -->
                    <span class="status-pill warn" x-show="changedSinceExport(device.id)">
                      <svg class="icon"><use href="#i-warn"></use></svg>
                      <span x-text="t('web.devices.changed_since_export')"></span>
                    </span>
                    <span style="flex: 1 1 auto"></span>
                    <!-- Der Auf-/Zu-Zustand liegt im DOM, nicht in Alpine:
                         ein `<details>` braucht kein `open`-Feld je Kachel,
                         das mit dem sichtbaren Zustand in Deckung gehalten
                         werden muesste. Genau diese Deckungspflicht hat das
                         Raum-Auswahlfeld sechs Reviewrunden gekostet.
                         `<details>` schliesst allerdings NICHT von selbst
                         bei Escape (anders als ein `<dialog>`) und auch
                         nicht bei einem Klick daneben - beides steht
                         deshalb hier. Dass immer nur ein Menue offen ist,
                         faellt dabei ab: der Klick auf den Kebab einer
                         anderen Kachel liegt ausserhalb dieses `<details>`
                         und schliesst es ueber denselben Wachposten.

                         `.window` am Escape-Listener ist Pflicht, kein
                         Stil: ohne `.window` haengt der Listener am
                         `<details>`-Teilbaum und feuert nur, wenn der
                         Fokus dort drin steht. Safari auf macOS setzt den
                         Fokus bei einem Mausklick auf `<summary>` NICHT
                         automatisch dorthin (Standard, "Volle
                         Tastatursteuerung" aus) - wer das Menue also per
                         Maus oeffnet und danach Escape drueckt, feuert das
                         Escape auf `document.body`, es erreicht das
                         `<details>` nie, das Menue bleibt lautlos offen.
                         `.window` haengt stattdessen am `window` und
                         wirkt unabhaengig vom Fokus. Das `if ($el.open)`
                         davor ist trotzdem Pflicht, seit dieser Listener
                         auch `closeTileMenu` aufruft (Fund 3, s.u.): ohne
                         die Wache feuert er bei JEDEM Escape/Aussenklick an
                         JEDER Kachel (es gibt ja eine `<details>`-Instanz
                         je Geraet) und wuerde auch an laengst geschlossenen
                         Menues deren `<summary>` fokussieren - obwohl der
                         Nutzer gerade voellig woanders geklickt hat. Mit
                         der Wache reagiert nur die tatsaechlich offene
                         Kachel, und die ist ohnehin immer nur eine (s.o.).

                         Fund 1 (Review vom 2026-09-05): `newRoomFor`
                         schaltet nur noch die Sichtbarkeit des
                         Neu-Raum-Feldes, war aber sonst genau die Sorte
                         Zustand, gegen die dieser Umbau eigentlich antritt
                         - er blieb auf drei der vier Schliesswege
                         (Aussenklick, Escape, Klick auf einen Raumeintrag)
                         unveraendert stehen, weil nur Enter und das Escape
                         IM Feld ihn zuruecksetzten. Bei Wiedereroeffnen
                         zeigte das Menue dann ein leeres Neu-Raum-Feld statt
                         des "+ Neuer Raum"-Knopfes. `@toggle` feuert bei
                         JEDEM Oeffnen/Schliessen dieses `<details>`, gleich
                         aus welchem Grund - und ist damit die eine Stelle,
                         die `newRoomFor` kennen muss, statt der vier
                         Handler, die es bislang kennen MUESSTEN.

                         Fund 3 (Re-Review 2026-09-05): das `!$el.open` aus
                         der ersten Fassung deckte nur das Schliessen ab und
                         liess eine Luecke: verschwindet die Kachel selbst,
                         waehrend ihr Menue offen ist (ein Re-Render entfernt
                         den Knoten ersatzlos), feuert nie ein `toggle` fuers
                         Schliessen - `newRoomFor` bleibt auf der Geraete-ID
                         stehen. Taucht dieselbe ID spaeter in einem NEUEN
                         `<details>` wieder auf, ist dessen erstes `toggle`
                         ein Oeffnen, und `!$el.open` verwarf genau diesen
                         Fall - das verwaiste Feld war wieder da. Die Wache
                         deckt Oeffnen und Schliessen deshalb jetzt
                         gleichermassen ab: `beginNewRoom` wird ausschliesslich
                         per Klick INNERHALB eines bereits offenen Menues
                         erreicht, also lange NACHDEM dessen eigenes,
                         gequeutes `toggle` (das Oeffnen) schon gelaufen ist
                         - ein Reset beim Oeffnen kann also nie einen gerade
                         erst gesetzten Neu-Raum-Modus wieder wegnehmen.
                         Dieses `!$el.open` NICHT wieder einbauen, sonst ist
                         die Luecke beim Kachel-Verschwinden zurueck.

                         Fund 3 (Review vom 2026-09-05): ein natives
                         `<details>` gibt beim Schliessen keinen Fokus
                         zurueck - der gerade aktivierte Eintrag verschwindet
                         mitsamt seinem Fokus aus dem gerenderten Baum (nur
                         der Inhalt hinter `<summary>` wird versteckt), und
                         die naechste Tab-Taste faengt wieder ganz oben im
                         Dokument an statt an der Kachel weiterzumachen, an
                         der der Nutzer gerade stand. `closeTileMenu`
                         (app.js) schliesst das `<details>` UND fokussiert
                         danach dessen `<summary>` (die bleibt beim
                         Schliessen immer gerendert) - eine Funktion fuer
                         alle Schliesswege statt eines eigenen Fokus-Rufs an
                         jedem einzelnen Eintrag. -->
                    <details
                      class="tile-menu"
                      @toggle="if (newRoomFor === device.id) { newRoomFor = null; newRoomDraft = '' }"
                      @click.outside="if ($el.open) closeTileMenu($el)"
                      @keydown.escape.window="if ($el.open) closeTileMenu($el)"
                    >
                      <!-- `title` allein ist bei der Berechnung des
                           zugaenglichen Namens nur der letzte Rueckfallwert
                           und wird von Screenreadern nicht zuverlaessig
                           vorgelesen - `aria-label` legt den Namen explizit
                           fest, `title` bleibt zusaetzlich als Maus-Tooltip
                           stehen, beide Attribute erfuellen also
                           unterschiedliche Zwecke nebeneinander.
                           Das `<svg>` bekommt hier als erstes Icon in
                           dieser Datei `aria-hidden="true"`: ein
                           dekoratives Icon in einem bereits benannten
                           Bedienelement darf dem Accessibility-Baum keinen
                           zweiten, konkurrierenden Namen liefern. Die
                           anderen Icon-Knoepfe (`.room-rename` u.a.) haben
                           das noch nicht - beim naechsten Anfassen bitte
                           dieses Muster uebernehmen, nicht das aeltere ohne
                           `aria-hidden`. -->
                      <summary :title="t('web.devices.menu')" :aria-label="t('web.devices.menu')">
                        <svg class="icon" aria-hidden="true"><use href="#i-kebab"></use></svg>
                      </summary>
                      <div class="tile-menu-items">
                        <!-- Fund 2 (Nacharbeit 2026-09-05): die Ueberschrift
                             war bis hierher nur optisch ein Gruppenlabel -
                             per Tab erreicht ein Screenreader-Nutzer
                             "Kueche" ohne jede Auskunft, dass das ein Raum
                             ist. `role="group"` plus `aria-labelledby`
                             stellt die Verbindung programmatisch her.
                             Die id der Ueberschrift ist bewusst PRO GERAET
                             abgeleitet (`device.id`) statt eine feste
                             Konstante: die ganze Seite teilt sich ein
                             einziges `x-data` (siehe die Begruendung gegen
                             `x-ref`/`$refs` weiter unten in dieser Datei,
                             Fund 3), und dieses Markup wird einmal PRO
                             Kachel gerendert - eine feste id waere im
                             ausgelieferten Dokument so oft dupliziert wie
                             es Kacheln gibt, `aria-labelledby` traefe dann
                             per Spezifikation nur das erste Vorkommen und
                             fuer jede andere Kachel ins Leere oder auf die
                             falsche Ueberschrift. -->
                        <div class="tile-menu-rooms" role="group" :aria-labelledby="'tile-menu-room-heading-' + device.id">
                          <p
                            class="tile-menu-heading"
                            :id="'tile-menu-room-heading-' + device.id"
                            x-text="t('web.devices.menu_room_heading')"
                          ></p>
                          <!-- "Ohne Raum" ist hier kein Sonderfall, sondern
                               der Normalzustand eines noch nicht zugeordneten
                               Geraets - es traegt das Haekchen wie jeder
                               andere Eintrag auch. Der Leerstring ist derselbe
                               Wert, den die API fuer "Raum entfernen"
                               erwartet, also dieselbe Kodierung auf beiden
                               Seiten und keine Umrechnung. -->
                          <button
                            class="tile-menu-item"
                            :class="{ 'is-current': roomKeyOf(device) === '' }"
                            :aria-current="roomKeyOf(device) === '' ? 'true' : null"
                            @click="closeTileMenu($el); saveRoom(device, '')"
                            x-text="t('web.devices.room_none')"
                          ></button>
                          <template x-for="chip in roomChips().filter((c) => c.key !== '')" :key="chip.key">
                            <!-- Fund 2 (Nacharbeit 2026-09-05): der Eintrag kuerzt einen langen
                                 Raumnamen jetzt mit Ellipse (`.tile-menu-item`, style.css) - der
                                 volle Name muss trotzdem irgendwo greifbar bleiben, deshalb hier
                                 als natives `title`. `chip.key` ist Nutzerdaten (ein Raumname),
                                 keine zu uebersetzende Oberflaechen-Zeichenkette - `t()` waere
                                 hier fehl am Platz. -->
                            <button
                              class="tile-menu-item"
                              :class="{ 'is-current': roomKeyOf(device) === chip.key }"
                              :aria-current="roomKeyOf(device) === chip.key ? 'true' : null"
                              :title="chip.key"
                              @click="closeTileMenu($el); saveRoom(device, chip.key)"
                              x-text="chip.key"
                            ></button>
                          </template>
                          <button
                            class="tile-menu-item tile-menu-new"
                            x-show="newRoomFor !== device.id"
                            @click="beginNewRoom(device); $nextTick(() => $el.parentElement.querySelector('.tile-menu-input')?.focus())"
                            x-text="t('web.devices.room_new')"
                          ></button>
                          <!-- Das Textfeld ist ein Kind des `<details>`, das
                               Menue bleibt beim Tippen also offen. Escape
                               bricht NUR den Neu-Raum-Modus ab und darf nicht
                               bis zum `@keydown.escape` des `<details>`
                               hochblubbern, sonst verschwaende ein Abbruch
                               gleich das ganze Menue - daher `.stop`.

                               Fund 3 (Review vom 2026-09-05): der Fokus-Ruf
                               am "+ Neuer Raum"-Knopf oben zielt bewusst per
                               `$el.parentElement.querySelector` auf dieses
                               Feld statt per `x-ref`/`$refs`. Ein `x-ref`
                               registriert sich am naechsten Element mit
                               `x-data` - und das ist in dieser Seite einzig
                               das `<body>` ganz oben, EIN gemeinsamer Topf
                               fuer alle Kacheln zugleich. Bei mehreren
                               Geraeten ueberschreibt der Eintrag der zuletzt
                               gerenderten Kachel jeden davor registrierten,
                               und `$refs.irgendwas` zeigte dann immer auf
                               dasselbe (i. d. R. falsche) Feld, unabhaengig
                               davon, welche Kachel der Nutzer tatsaechlich
                               geoeffnet hat. Die Suche ab dem geklickten
                               Knopf ist dagegen zwangslaeufig auf dessen
                               eigene `.tile-menu-rooms`-Gruppe beschraenkt
                               (frueher `.tile-menu-items` direkt, seit dem
                               `role="group"`-Wrapper fuer die Raumliste,
                               Nacharbeit 2026-09-05, ist es dessen naechster
                               Elternknoten - das Feld liegt weiterhin darin,
                               die Suche findet es unveraendert).

                               Fund 2 (Re-Review 2026-09-05): `newRoomFor =
                               null` blendet dieses Feld per `x-show` aus
                               (`display: none`), nimmt ihm den Fokus dabei
                               aber NICHT ab - im Browser gemessen: danach war
                               das Feld weiterhin `document.activeElement`,
                               unsichtbar und ohne Nachbarn zum Weiter-Tabben,
                               das Menue blieb offen mit Fokus auf einem toten
                               Ende. Der Escape-Handler schickt den Fokus
                               deshalb explizit auf den "+ Neuer Raum"-Knopf,
                               der an seiner Stelle wieder auftaucht - `x-ref`
                               scheidet aus denselben Gruenden aus wie oben,
                               darum dieselbe `$el.parentElement.querySelector`-
                               Suche, nur mit der stabilen zweiten Klasse
                               `.tile-menu-new` als Ziel.

                               Fund 4 (Re-Review 2026-09-05): das `?.` vor
                               `.focus()` am Fokus-Ruf des "+ Neuer Raum"-
                               Knopfes oben laesst eine verfehlte Suche
                               ergebnislos verpuffen statt einen `TypeError`
                               zu werfen. Heute unerreichbar, weil dieses
                               Feld unbedingt in derselben `.tile-menu-rooms`-
                               Gruppe gerendert wird (nur per `x-show` versteckt,
                               nicht per `x-if` entfernt) - derselbe Fehlgriff
                               wie bei `closeTileMenu` (app.js, Fund 4): der
                               Fokus-Ruf soll bei einem Fehlschlag folgenlos
                               bleiben, nicht mit einem unbehandelten Wurf in
                               der `$nextTick`-Mikrotask enden. -->
                          <input
                            x-show="newRoomFor === device.id"
                            x-cloak
                            type="text"
                            class="tile-menu-input"
                            x-model="newRoomDraft"
                            :placeholder="t('web.devices.room_new_placeholder')"
                            @keydown.enter="closeTileMenu($el); commitNewRoom(device)"
                            @keydown.escape.stop="newRoomFor = null; newRoomDraft = ''; $nextTick(() => $el.parentElement.querySelector('.tile-menu-new')?.focus())"
                          />
                        </div>
                        <hr class="tile-menu-sep" />
                        <button
                          class="tile-menu-item"
                          @click="closeTileMenu($el); openSignalsModal(device)"
                          x-text="t('web.devices.menu_signals')"
                        ></button>
                        <button
                          class="tile-menu-item"
                          @click="closeTileMenu($el); exportDevice(device)"
                          :disabled="!bridgeSettings.bridge_ip"
                          x-text="t('web.devices.export')"
                        ></button>
                        <button
                          class="tile-menu-item is-danger"
                          @click="closeTileMenu($el); removeDevice(device)"
                          x-text="t('web.devices.remove')"
                        ></button>
                      </div>
                    </details>
                  </div>
                  <p class="hint" x-show="!bridgeSettings.bridge_ip" x-cloak>
                    <span x-text="t('web.devices.export_hint_prefix')"></span>
                    <a href="#/settings" x-text="t('web.settings.miniserver_link')"></a>
                    <span x-text="t('web.devices.export_hint_suffix')"></span>
                  </p>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- ================================================================
           Ansicht 2: Export
           ================================================================ -->
      <section x-show="view === 'export'" x-cloak>
        <!--
          Projektdatei-Sync (Aufgabe 12, urspruenglich unten in "System" -
          auf Nutzerwunsch als oberster Punkt hierher verschoben, weil das
          der kuenftig primaere Weg werden soll statt der Vorlagen-ZIPs
          darunter): bestehende Loxone-Projektdatei hochladen, Plan
          ansehen, gepatchte Datei herunterladen - erst NACHDEM der Plan
          zu sehen war (Entwurf: kein Download vor dem Plan). Beide
          gepatchten Fassungen kommen bereits in der Upload-Antwort mit
          (siehe `downloadPatchedProject` in app.js), der Haken unten
          waehlt nur zwischen ihnen, ohne einen zweiten Aufruf an die
          Bruecke.
        -->
        <div class="card">
          <h2 x-text="t('web.export.projectsync_heading')"></h2>
          <p class="hint" x-text="t('web.export.projectsync_intro')"></p>
          <p class="hint" x-show="!bridgeSettings.bridge_ip" x-cloak>
            <span x-text="t('web.export.projectsync_bridge_ip_hint_prefix')"></span>
            <a href="#/settings" x-text="t('web.settings.miniserver_link')"></a>
            <span x-text="t('web.export.projectsync_bridge_ip_hint_suffix')"></span>
          </p>
          <div class="row">
            <label
              ><span x-text="t('web.export.projectsync_file_label')"></span>
              <input
                type="file"
                accept=".Loxone,.xml"
                @change="uploadProjectFile($event)"
                :disabled="projectSync.busy"
            /></label>
          </div>
          <p x-show="projectSync.busy" x-cloak class="hint" x-text="t('web.export.projectsync_busy')"></p>
          <p x-show="projectSync.error" x-cloak class="banner danger" x-text="projectSync.error"></p>

          <!--
            Nutzerwunsch nach dem Review: bei mehreren Miniservern in der
            Datei ein Auswahlfeld statt eines Textfelds fuer die IP. Die
            Datei liegt bereits im Speicher des Browsers (`projectSync.file`,
            gesetzt in `uploadProjectFile`) - die Auswahl loest `confirm
            ProjectSyncMiniserver` aus, das dieselbe Datei ein zweites Mal
            mit der gewaehlten IP hochlaedt, ganz ohne erneuten Datei-Dialog.
          -->
          <div class="row" x-show="projectSync.needsMiniserverSelection" x-cloak>
            <label
              ><span x-text="t('web.export.projectsync_miniserver_select_label')"></span>
              <select
                x-model="projectSync.selectedMiniserverIp"
                @change="confirmProjectSyncMiniserver()"
                :disabled="projectSync.busy"
              >
                <option value="" disabled x-text="t('web.export.projectsync_miniserver_select_placeholder')"></option>
                <template
                  x-for="ms in projectSync.availableMiniservers"
                  :key="ms.int_addr"
                >
                  <option :value="ms.int_addr" x-text="`${ms.title} (${ms.int_addr})`"></option>
                </template>
              </select>
            </label>
          </div>
          <p
            class="hint"
            x-show="projectSync.needsMiniserverSelection"
            x-cloak
            x-text="t('web.export.projectsync_multiple_miniservers_hint')"
          ></p>

          <template x-if="projectSync.plan">
            <div>
              <!--
                Review-Fix Important #5: die Tabelle haengt jetzt an
                `has_changes || projectSyncHasInformationalEntries(...)`,
                nicht mehr nur an `has_changes` - sonst blieben
                `orphaned`/`conflict`-Eintraege unsichtbar, obwohl
                `has_changes` sie absichtlich nicht mitzaehlt (siehe
                `SyncPlan.has_changes` in `diff.py`). Die Bedingung ist
                bewusst das logische Gegenteil der "Alles aktuell"-Meldung
                darunter, damit genau eine der beiden sichtbar ist: die
                Meldung zeigt sich nur noch, wenn wirklich gar nichts zu
                berichten ist: keine Aenderung UND keine informativen
                Eintraege.
              -->
              <p
                x-show="!projectSync.plan.has_changes && !projectSyncHasInformationalEntries(projectSync.plan.entries)"
                class="hint"
                x-text="t('web.export.projectsync_all_current')"
              ></p>
              <!--
                Ueberarbeitet nach Nutzerwunsch ("schneller und sauberer
                Ueberblick"): eine Gesamt-Uebersicht ganz oben, darunter je
                Geraet eine aufklappbare Karte (`<details>`, nativ zugaenglich
                per Tastatur/Screenreader, ganz ohne eigenes JS fuer aus-/
                einklappen) statt einer langen flachen Tabelle. Karten mit
                Aenderungen stehen von Anfang an offen, laengst unveraenderte
                Geraete bleiben zu - bei einer echten, gewachsenen Datei mit
                Dutzenden Signalen sonst zu viel auf einmal.

                `projectSyncGroupedEntries` (app.js) gruppiert den vom
                Backend gelieferten flachen Plan rein clientseitig nach
                Geraet und dort nach Eingaengen/Ausgaengen, kein
                Backend-Vertrag geaendert.
              -->
              <div
                class="projectsync-plan"
                x-show="projectSync.plan.has_changes || projectSyncHasInformationalEntries(projectSync.plan.entries)"
              >
                <div class="projectsync-summary" x-data="{ counts: projectSyncOverallCounts(projectSync.plan.entries) }">
                  <span class="projectsync-tally-item is-new" x-show="counts.new > 0">
                    <span class="dot is-new"></span>
                    <strong x-text="counts.new"></strong>&nbsp;<span x-text="t('web.export.projectsync_tally_new')"></span>
                  </span>
                  <span class="projectsync-tally-item is-updated" x-show="counts.updated > 0">
                    <span class="dot is-updated"></span>
                    <strong x-text="counts.updated"></strong>&nbsp;<span x-text="t('web.export.projectsync_tally_updated')"></span>
                  </span>
                  <span class="projectsync-tally-item is-orphaned" x-show="counts.orphaned > 0">
                    <span class="dot is-orphaned"></span>
                    <strong x-text="counts.orphaned"></strong>&nbsp;<span x-text="t('web.export.projectsync_tally_orphaned')"></span>
                  </span>
                  <span class="projectsync-tally-item is-conflict" x-show="counts.conflict > 0">
                    <span class="dot is-conflict"></span>
                    <strong x-text="counts.conflict"></strong>&nbsp;<span x-text="t('web.export.projectsync_tally_conflict')"></span>
                  </span>
                  <span class="projectsync-tally-item is-unchanged" x-show="counts.unchanged > 0">
                    <span class="dot is-unchanged"></span>
                    <strong x-text="counts.unchanged"></strong>&nbsp;<span x-text="t('web.export.projectsync_tally_unchanged')"></span>
                  </span>
                </div>

                <template
                  x-for="group in projectSyncGroupedEntries(projectSync.plan.entries)"
                  :key="group.deviceId"
                >
                  <details class="projectsync-device" :open="group.needsAttention">
                    <summary>
                      <span x-text="group.deviceLabel"></span>
                      <span class="projectsync-tally">
                        <span class="projectsync-tally-item is-new" x-show="group.counts.new > 0">
                          <span class="dot is-new"></span>
                          <span x-text="group.counts.new"></span>
                        </span>
                        <span class="projectsync-tally-item is-updated" x-show="group.counts.updated > 0">
                          <span class="dot is-updated"></span>
                          <span x-text="group.counts.updated"></span>
                        </span>
                        <span class="projectsync-tally-item is-orphaned" x-show="group.counts.orphaned > 0">
                          <span class="dot is-orphaned"></span>
                          <span x-text="group.counts.orphaned"></span>
                        </span>
                        <span class="projectsync-tally-item is-conflict" x-show="group.counts.conflict > 0">
                          <span class="dot is-conflict"></span>
                          <span x-text="group.counts.conflict"></span>
                        </span>
                        <span
                          class="projectsync-tally-item is-unchanged"
                          x-show="!group.needsAttention"
                          x-text="t('web.export.projectsync_group_all_current')"
                        ></span>
                      </span>
                      <svg class="icon chevron"><use href="#i-chevron"></use></svg>
                    </summary>
                    <div class="projectsync-device-body">
                      <template x-for="section in group.sections" :key="section.label">
                        <div
                          class="projectsync-io-group"
                          x-show="section.attention.length + section.unchanged.length > 0"
                        >
                          <div class="projectsync-io-label" x-text="section.label"></div>

                          <template x-for="entry in section.attention" :key="entry.kind + entry.key">
                            <div class="projectsync-entry" :class="'is-' + projectSyncStatusBucket(entry.status)">
                              <div class="projectsync-entry-head">
                                <span class="projectsync-entry-title" x-text="entry.title"></span>
                                <span
                                  class="badge"
                                  :class="projectSyncStatusBadgeClass(entry.status)"
                                  x-text="projectSyncStatusLabel(entry.status)"
                                ></span>
                              </div>
                              <p
                                class="hint projectsync-entry-note"
                                x-show="projectSyncEntryNote(entry)"
                                x-text="projectSyncEntryNote(entry)"
                              ></p>
                              <!-- Review-Fix Important #6: die vom Backend mitgelieferte
                                   Attribut-Differenz (`entry.changes`, nur bei
                                   `status === "updated"` befuellt) - jetzt als Liste mit
                                   getrennt gestyltem Alt-/Neu-Wert statt Fliesstext. -->
                              <ul class="projectsync-diff" x-show="entry.status === 'updated'">
                                <template x-for="change in projectSyncChangeList(entry)" :key="change.label">
                                  <li>
                                    <span class="projectsync-diff-label" x-text="change.label"></span>
                                    <span class="projectsync-diff-old" x-text="change.oldValue"></span>
                                    <span class="projectsync-diff-arrow">→</span>
                                    <span class="projectsync-diff-new" x-text="change.newValue"></span>
                                  </li>
                                </template>
                              </ul>
                            </div>
                          </template>

                          <!-- Unveraenderte Signale: bewusst eingeklappt und ohne
                               Status-Badge je Zeile - sie stimmen bereits, sollen den
                               Blick auf das Neue/Geaenderte oben nicht verstellen
                               (Nutzerwunsch: "schneller und sauberer Ueberblick"). -->
                          <details class="projectsync-unchanged-disclosure" x-show="section.unchanged.length > 0">
                            <summary>
                              <span
                                x-text="t('web.export.projectsync_unchanged_disclosure', { count: section.unchanged.length })"
                              ></span>
                            </summary>
                            <div class="projectsync-unchanged-chips">
                              <template x-for="entry in section.unchanged" :key="entry.kind + entry.key">
                                <span class="value-chip" x-text="entry.title"></span>
                              </template>
                            </div>
                          </details>
                        </div>
                      </template>
                    </div>
                  </details>
                </template>
              </div>
              <!--
                Review-Fix Important #4: `patched_with_new_devices_base64`
                ist jetzt `null`, wenn die hochgeladene Datei keinen
                `VirtualInCaption`/`VirtualOutCaption`-Abschnitt fuer einen
                neuen Geraete-Container hat - der Haken wird dann deaktiviert,
                statt einen stillen/leeren Download zuzulassen.
              -->
              <p
                x-show="projectSync.plan.new_devices_unavailable_reason"
                x-cloak
                class="banner warn"
                x-text="projectSync.plan.new_devices_unavailable_reason"
              ></p>
              <div class="row">
                <label>
                  <input
                    type="checkbox"
                    x-model="projectSync.includeNewDevices"
                    :disabled="!!projectSync.plan.new_devices_unavailable_reason"
                  />
                  <span x-text="t('web.export.projectsync_new_devices_checkbox')"></span>
                </label>
              </div>
              <button
                class="primary"
                @click="downloadPatchedProject()"
                x-text="t('web.export.projectsync_download_button')"
              ></button>
            </div>
          </template>
        </div>

        <div class="card">
          <h2 x-text="t('web.export.heading')"></h2>
          <div class="row">
            <label
              ><span x-text="t('web.bridge_ip_label')"></span>
              <input type="text" :value="bridgeSettings.bridge_ip || ''" readonly
            /></label>
            <label
              ><span x-text="t('web.export.udp_port_label')"></span>
              <input type="number" :value="bridgeSettings.udp_port" readonly
            /></label>
            <label>
              <span x-text="t('web.export.http_port_label')"></span>
              <input type="number" :value="bridgeSettings.listen_port" readonly />
            </label>
          </div>
          <p class="hint">
            <span x-text="t('web.export.settings_hint_prefix')"></span>
            <a href="#/settings" x-text="t('web.settings.miniserver_link')"></a>
            <span x-text="t('web.export.settings_hint_suffix')"></span>
          </p>
          <div class="row">
            <label
              ><input type="checkbox" x-model="exportIncludeSystem" />
              <span x-text="t('web.export.include_system')"></span
            ></label>
            <label
              ><input type="checkbox" x-model="exportOnlyPending" />

          </div>
          <p class="hint" x-html="t('web.export.filter_explanation')"></p>
          <div class="row">
            <button

            <!--

        <div class="card" x-show="exportPreview" x-cloak>

      <!-- ================================================================
           Ansicht 3: System
           ================================================================ -->
      <section x-show="view === 'system'" x-cloak>
        <!-- Handlung, keine Diagnose - deshalb vor den Systemchecks und
             nicht zwischen den Log-Ansichten weiter unten. Der Knopf loest
             denselben vollen Resend aus wie der Bruecken-Start und wie
             /resync aus dem Config-Projekt (Spec 6.4), nur ueber
             POST /api/diagnostics/resync, das hinter dem Waechter liegt. -->
        <div class="card">
          <h2 x-text="t('web.system.resync_heading')"></h2>
          <p class="hint" x-text="t('web.system.resync_explanation')"></p>
          <button
            @click="resyncAll()"
            :disabled="resyncBusy"
            x-text="t('web.system.resync_button')"
          ></button>
          <p x-show="resyncError" x-cloak class="banner danger" x-text="resyncError"></p>
        </div>

        <div class="card">
          <div class="row">
            <h2 style="margin: 0" x-text="t('web.system.checks_heading')"></h2>
            <button @click="loadSystem()" :disabled="diagnosticsBusy" x-text="t('web.system.refresh')"></button>
          </div>
          <p x-show="systemError" x-cloak class="banner danger" x-text="systemError"></p>
          <ul class="system-check-list">
            <template x-for="check in systemChecks" :key="check.name">
              <li>
                <span
                  class="badge"
                  :class="check.ok ? 'ok' : 'danger'"
                  x-text="check.ok ? t('web.system.check_ok') : t('web.system.check_error')"
                ></span>
                <strong x-text="check.name"></strong>
                <span x-text="check.detail"></span>
              </li>
            </template>
          </ul>
        </div>

        <!--
          Live-Diagnose (Aufgabe 6, Spec 10.5): EIN WebSocket
          (`/api/diagnostics/live`, geoeffnet/geschlossen in `selectView`,
          app.js) fuellt die drei Straeme darunter laufend statt wie bisher
          einmalig per GET. Diese eine Karte traegt die vier Bedienelemente
          fuer alle drei Bereiche - kein eigenes Set je Bereich, es gibt nur
          eine Verbindung und einen Pausenzustand fuer alle drei.
        -->
        <div class="card">
          <div class="row">
            <h2 style="margin: 0" x-text="t('web.system.live_heading')"></h2>
            <span class="connection-status">
              <span class="dot" :class="diagnosticsConnected ? 'online' : 'offline'"></span>
              <span
                x-text="diagnosticsConnected ? t('web.connection.live') : t('web.system.diag_disconnected')"
              ></span>
            </span>
          </div>
          <div class="row">
            <button
              @click="diagnosticsPaused = !diagnosticsPaused"
              x-text="diagnosticsPaused ? t('web.system.resume') : t('web.system.pause')"
            ></button>
