# Enrichment for known clusters. The unknown is not discarded, but gets a
# generic name (Spec 3.5).
#
# The target unit is the one the Loxone function block expects, not the SI
# unit (Spec 7.3). The UDP sender in Phase 4 does the actual conversion.
clusters:
  6:
    name: onoff
    attributes:
      0: {slug: onoff, unit: ""}
    commands:
      # "off"/"on" must be quoted: otherwise YAML 1.1 reads them as
      # booleans, not as strings (PyYAML pitfall).
      0: {slug: "off", takes_value: false}
      1: {slug: "on", takes_value: false}
      2: {slug: toggle, takes_value: false}
  8:
    name: level
    attributes:
      # 0-254 to 0-100 %: 100/254
      0: {slug: level, unit: "%", scale: 0.3937007874015748}
    commands:
      0: {slug: level, takes_value: true}
      4: {slug: level_onoff, takes_value: true}
  47:
    name: powersource
    attributes:
      # BatPercentRemaining, attribute ID confirmed against
      # chip.clusters.Objects.PowerSource.Attributes.
      #
      # The factor 0.5 is NOT confirmed against a primary source (review
      # fix Important, 2026-09-03): the Matter Application Cluster
      # Specification is generally known to state the value in half
      # percent (0-200), but neither the installed chip SDK nor
      # matter_server carry units, and the specification document itself
      # was not available here. What is actually confirmed: the checked-in
      # snapshot tests/fixtures/nodes/ikea_bilresa_button.json reports the
      # value 200 under 0/47/12 for a button whose battery is full - which
      # fits half percent and not whole percent. Circumstantial evidence,
      # not proof. Whoever has the specification at hand, please replace
      # this.
      #
      # Only this one of 37 attributes is named, and that is the
      # fine-grained selection from the design (4.3): PowerSource also
      # carries charge states, battery chemistry, ANSI designations and
      # fault lists. Whoever needs one of those enables it in the expert
      # block.
      12: {slug: battery, unit: "%", scale: 0.5}
  768:
    name: colorcontrol
    attributes:
      # Attribute IDs confirmed against the installed SDK (chip.clusters.
      # Objects.ColorControl.Attributes): CurrentHue=0, CurrentSaturation=1,
      # ColorTemperatureMireds=7, ColorMode=8.
      #
      # Was missing entirely until the Phase 6 follow-up fix: the cluster
      # was only in the table with `commands:` below (Phase 4, for
      # MoveToColorTemperature). Layer 3 of `is_functional`
      # (profiles/relevance.py) therefore asked `knows_cluster(768)` (true)
      # and then `names_element`, which was ALWAYS false without this
      # section - every attribute of ColorControl thereby counted as not
      # functional, while the output command for the color temperature
      # (below, `commands:`) had long been exported: Loxone could set the
      # color but never get it reported back. `known_attribute_section` in
      # `profiles/table.py` now structurally closes this trap for every
      # future commands-only cluster, not just for this one.
      #
      # Hue (0): Matter counts 0-254 for 0-360°. Scaled to degrees instead
      # of left raw - unlike the color temperature below, 360/254 is a
      # linear factor that the existing `scale` mechanism can express
      # correctly, and degrees is the unit customary in color pickers. No
      # entry in `_UNIT_DECIMALS`: without a real Loxone template that
      # confirms a decimal-place count for degrees, the Loxone format
      # string stays empty rather than prescribing a made-up precision -
      # the WebUI shows "°" regardless (`signal.unit`, straight from this
      # table, independent of `unit_format`).
      0: {slug: hue, unit: "°", scale: 1.4173228346456692}
      # Saturation (CurrentSaturation, 1): 0-254 like `level` (cluster 8) -
      # the same numeric value as there, not recomputed.
      1: {slug: saturation, unit: "%", scale: 0.3937007874015748}
      # Color temperature (ColorTemperatureMireds, 7): Matter returns
      # mired, Loxone wants Kelvin - but Kelvin = 1e6 / mired is a
      # reciprocal, not a factor, and the `scale` mechanism can only
      # multiply. The value therefore stays in mired, with a slug that
      # makes that clear, instead of inventing a wrong Kelvin number. Open
      # point (missing reciprocal conversion):
      # docs/superpowers/specs/2026-09-03-signal-selection-design.md section 10.
      7: {slug: colortemp_mireds, unit: mired}
      # Color mode (ColorMode, 8): an enumeration, not a physical
      # quantity - no unit.
      8: {slug: colormode, unit: ""}
    commands:
      # MoveToColorTemperature - the only ColorControl command that
      # commands/translate.py serves (see its _PAYLOAD_BUILDERS there and
      # its docstring: Hue/Saturation, command 6, is deliberately left out
      # because the Loxone-side RGB number is not reliably confirmed).
      # Review fix C2, 2026-09-02: this entry was missing even though
      # _PAYLOAD_BUILDERS already served the pair (768, 10) - in the raw
      # export (`raw`), the command was thereby exported as a generic,
      # digital `c768_cmd10` (takes_value=False per command_takes_value),
      # and a button press sent the literal text "1" into
      # _payload_color_temperature, which built 1_000_000 mireds from it -
      # a made-up color temperature sent to a real device. takes_value:
      # true turns this into an analog output AND exports the command
      # immediately in normal (non-raw) mode too, which is correct anyway
      # for a served command.
      10: {slug: colortemp, takes_value: true}
  1026:
    name: temperature
    attributes:
      0: {slug: temp, unit: "°C", scale: 0.01}
  1029:
    name: humidity
    attributes:
      0: {slug: humidity, unit: "%", scale: 0.01}
  144:
    name: power
    attributes:
      4: {slug: voltage, unit: "V", scale: 0.001}
      5: {slug: current, unit: "A", scale: 0.001}
      8: {slug: power, unit: "kW", scale: 0.000001}
  145:
    name: energy
    attributes:
      # CumulativeEnergyImported/-Exported. Matter returns both as an
      # EnergyMeasurementStruct - value plus timestamp -, not as a number.
      # `field: 0` is EnergyMeasurementStruct.energy, confirmed against
      # chip.clusters.Objects; the TIMESTAMPS are deliberately left out,
      # they have no use in Loxone.
      #
      # Matter counts in mWh (Matter Application Cluster Specification),
      # Loxone wants kWh (main document 7.3): 1 kWh = 1e6 mWh.
      1: {slug: energy_imported, field: 0, unit: "kWh", scale: 0.000001}
      2: {slug: energy_exported, field: 0, unit: "kWh", scale: 0.000001}
  59:
    name: switch
    attributes:
      0: {slug: positions, unit: ""}
      1: {slug: position, unit: ""}
    events:
      1: {slug: press}
      2: {slug: longpress}
      3: {slug: shortrelease}
      4: {slug: longrelease}
      5: {slug: multipress_ongoing}
      6: {slug: multipress}
