# api.technologies - a device's source, as a person should read it
# (`loxmatter.sources.technology_display_name`, boundary design open point
# 13). An unknown value (a rolled-back row whose technology this version
# has never heard of) falls back to the raw, untranslated value rather than
# raising - see that function's docstring.
api.technologies.matter:
  en: "Matter"
  de: "Matter"
api.technologies.zigbee:
  en: "Zigbee"
  de: "Zigbee"
api.errors.group_category_mismatch:
  # `{actual}`/`{expected}` arrive PRE-TRANSLATED (`_check_members` in
  # store.py looks them up via `api.categories.*` above before calling
  # `i18n.t` here) - not as the raw `Category.value` identifiers (Review
  # finding, final fix pass): the untranslated identifiers used to stand
  # as the one English island in an otherwise fully translated sentence,
  # and disagreed with the WebUI's own pre-check
  # (`web.groups.other_category`), which already went through
  # `categoryLabel()` for the same refusal.
  #
  # The German sentence used to place `{actual}` right after a single
  # hard-coded indefinite article (final fix pass, review finding Minor
  # #3(b)). `api.categories.*` names all three grammatical genders -
  # neuter, masculine and feminine nouns are mixed across the eight
  # category values - and a placeholder that can be filled with any of
  # them can never agree with one fixed article chosen up front: whichever
  # article was hard-coded, half the categories would read wrong.
  # Restructured to name the category as an appositive instead ("device N
  # HAS THE CATEGORY {actual}"), which reads correctly for every value
  # regardless of its gender, rather than special-casing eight nouns
  # against two articles.
  en: "device {device_id} is a {actual}, the group takes {expected}"
  de: "Gerät {device_id} hat die Kategorie {actual}, die Gruppe nimmt {expected}"
api.errors.group_duplicate_member:
  en: "a group's member list cannot contain the same device twice"
  de: "die Mitgliederliste einer Gruppe darf ein Gerät nicht doppelt enthalten"
api.errors.unknown_command:
  # The placeholder is deliberately not called "key" - i18n.t()'s own
  # first parameter is named that, and "key=..." as a keyword argument
  # would collide with a "TypeError: got multiple values for argument
  # 'key'".
  en: "unknown command key {command_key!r}"
  de: "unbekannter Kommando-Schluessel {command_key!r}"
api.errors.value_not_a_number:
  en: "value {value!r} is not a number"
  de: "Wert {value!r} ist keine Zahl"
api.errors.kelvin_not_positive:
  en: "colour temperature {value!r} must be above 0 Kelvin"
  de: "Farbtemperatur {value!r} muss über 0 Kelvin liegen"
api.errors.command_unsupported:
  en: "Cluster {cluster_id} command {command_id} is not supported"
  de: "Cluster {cluster_id} Kommando {command_id} wird nicht unterstuetzt"
# The following four keys belong to `LoxoneColourError` in
# commands/color.py, translated in commands/translate.py
# (`_translate_loxone_colour_error`) - see Review-Fix 2026-09-07:
# `_payload_hue_saturation` previously passed `str(exc)` (hard German) directly
# as HTTP-400-`detail`. Three error cases plus the three channel names
# for the third case, so the channel information is translated too and
# not just the frame sentence.
api.errors.lumitech_malformed:
  en: "\"{value}\" carries the Lumitech marker but does not follow the format (marker 20, brightness 0-100, kelvin above 0)."
  de: "\"{value}\" trägt die Lumitech-Kennung, hält aber das Format nicht ein (Kennung 20, Helligkeit 0-100, Kelvin über 0)."
api.errors.loxone_colour_not_integer:
  en: "Loxone colour number must be an integer, was {value}"
  de: "Loxone-Farbzahl muss ganzzahlig sein, war {value}"
api.errors.loxone_colour_negative:
  en: "Loxone colour number must not be negative, was {packed}"
  de: "Loxone-Farbzahl darf nicht negativ sein, war {packed}"
