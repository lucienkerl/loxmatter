# loxmatter - translation table.
#
# Flat, dotted keys instead of a nested YAML structure: new namespaces
# (api.*, web.* in later phases) get added without restructuring existing
# entries. Every entry carries at least "en" - t() automatically falls
# back to "en" when "de" is missing (see i18n/__init__.py), never the
# other way round.
#
# test.* belongs to tests/test_i18n.py - deliberately with one entry
# WITHOUT "de" there, to demonstrate the fallback case with real data
# instead of maintaining a second file loaded only for tests.

test.greeting:
  en: "Hello, {name}!"
  de: "Hallo, {name}!"
test.english_only:
  en: "English only"

# web.test.smoke: a template deliberately named test-only (analogous to
# test.* above), so the WebUI translation pipeline (task 8) can check
# itself against GET /api/i18n without depending on the real web.* table
# (task 9, ~150 keys) that has not been written yet.
#
# DELIBERATELY WITHOUT {placeholder} (a deviation from the implementation
# plan's original design, which had "{value}" here - see the task 8
# report): `api/language.py:_web_strings()` calls `i18n.t(key)` for every
# web.* key WITHOUT values. `i18n.t()` interpolates server-side via
# `str.format(**values)` - a key with a placeholder throws `KeyError`
# there, and that takes down the ENTIRE `GET /api/i18n` response (a single
# dict-comprehension call), not just the one key. With "{value}" this
# already breaks FOUR long-merged tests in tests/api/test_language.py
# (test_get_i18n_works_without_a_session, among others) - not a
# hypothetical future problem but an immediate regression. The actual bug
# lives in api/language.py/i18n/__init__.py (both outside this task's file
# scope) and must be fixed before or during task 9, once real web.* keys
# with placeholders are added there - see the task 8 report.
web.test.smoke:
  en: "smoke test"
  de: "Rauchtest"

