  de: "Die Aktualisierungsanfrage konnte nicht auf die Festplatte geschrieben werden ({exc}). Das kann nach einem Nur-Lese-Remount des Dateisystems oder bei vollem Speicher passieren — prüfen Sie das Update-Volume und versuchen Sie es erneut."
api.update.fail_unknown_channel:
